<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Education For Everyone</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Every subject from Class 6 to PhD in simple language, with free video classes and guides for every major competitive exam.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martel:wght@700;800;900&family=Hind:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style id="efe-style">/* Layout: an Indian school notebook. Ink-blue on ruled paper, red margin rule down the left of each lesson, highlighter-yellow for the one thing to notice. */
:root {
  --paper: #F7F9FC;
  --page: #FFFFFF;
  --rule: #DCE4F0;
  --ink: #142554;
  --ink-2: #4A5878;
  --pen: #1F47C8;
  --pen-ink: #FFFFFF;
  --hl: #FFE45C;
  --hl-ink: #2A2300;
  --margin: #D9534F;
  --ok: #1D7A4C;
  --ok-soft: #DFF2E7;
  --yt: #C4302B;
  --chip: #EEF2FA;
  --shadow: 0 1px 0 var(--rule), 0 6px 18px rgba(20, 37, 84, .06);
  --f-display: "Martel", "Hind", Georgia, serif;
  --f-body: "Hind", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C1222; --page: #131B30; --rule: #26324F; --ink: #E6EBF7; --ink-2: #A3AECA;
    --pen: #8FA9FF; --pen-ink: #0C1222; --hl: #E8C93A; --hl-ink: #1E1900; --margin: #F07C78;
    --ok: #63CF95; --ok-soft: #143222; --yt: #FF6B63; --chip: #1B2540;
    --shadow: 0 1px 0 var(--rule), 0 6px 18px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C1222; --page: #131B30; --rule: #26324F; --ink: #E6EBF7; --ink-2: #A3AECA;
  --pen: #8FA9FF; --pen-ink: #0C1222; --hl: #E8C93A; --hl-ink: #1E1900; --margin: #F07C78;
  --ok: #63CF95; --ok-soft: #143222; --yt: #FF6B63; --chip: #1B2540;
  --shadow: 0 1px 0 var(--rule), 0 6px 18px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 17px/1.6 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 32px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
a { color: var(--pen); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
button { font: inherit; color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; }

/* Header */
header.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8;
  background: var(--page); border-bottom: 1px solid var(--rule);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.logo { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink); cursor: pointer; background: none; border: 0; padding: 0; }
.logo b { font: 900 24px/1 var(--f-display); }
.logo b span { background: linear-gradient(transparent 58%, var(--hl) 58% 92%, transparent 92%); color: var(--ink); padding: 0 2px; }
.logo small { font-size: 14px; color: var(--ink-2); font-weight: 600; }
.search { flex: 1 1 280px; position: relative; min-width: 0; }
.search input { width: 100%; font: 16px var(--f-body); color: var(--ink); background: var(--paper); border: 1.5px solid var(--rule); border-radius: 999px; padding: 10px 16px 10px 40px; min-height: 44px; }
.search input:focus { outline: none; border-color: var(--pen); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-2); }
nav.main { display: flex; gap: 4px; }
nav.main button { border: 0; background: transparent; padding: 8px 12px; border-radius: 999px; font-weight: 600; cursor: pointer; min-height: 40px; }
nav.main button[aria-current="true"] { background: var(--chip); color: var(--pen); }

main { display: flex; flex-direction: column; gap: 28px; padding-top: 24px; }
.crumbs { font-size: 14px; color: var(--ink-2); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.crumbs button { background: none; border: 0; padding: 0; color: var(--pen); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* Home hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; align-items: end; }
.hero h1 { font-size: clamp(32px, 5.4vw, 54px); font-weight: 900; }
.hero h1 mark { background: linear-gradient(transparent 55%, var(--hl) 55% 90%, transparent 90%); color: inherit; padding: 0 4px; }
.hero p { margin: 12px 0 0; font-size: 19px; color: var(--ink-2); max-width: 36em; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--page); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px 14px; }
.stat b { display: block; font: 800 28px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 14px; color: var(--ink-2); }

.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.sec-h h2 { font-size: 26px; }
.sec-h p { margin: 0; color: var(--ink-2); font-size: 15px; }

/* Level ladder */
.ladder { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.rung { text-align: left; background: var(--page); border: 1.5px solid var(--rule); border-radius: var(--r); padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-height: 88px; }
.rung:hover { border-color: var(--pen); }
.rung[aria-pressed="true"] { border-color: var(--pen); background: var(--chip); box-shadow: inset 0 -4px 0 var(--pen); }
.rung b { font: 800 18px/1.2 var(--f-display); }
.rung span { font-size: 13px; color: var(--ink-2); line-height: 1.35; }

/* Subject grid */
.groups { display: flex; flex-direction: column; gap: 18px; }
.group h3 { font: 700 13px var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); margin-bottom: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.subj { text-align: left; background: var(--page); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px 16px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: baseline; }
.subj:hover { border-color: var(--pen); box-shadow: var(--shadow); }
.subj b { font: 700 18px/1.25 var(--f-display); }
.subj .hi { font-size: 15px; color: var(--ink-2); grid-column: 1; }
.subj .count { grid-row: 1 / span 2; grid-column: 2; align-self: center; font: 500 13px var(--f-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.subj.dim { opacity: .45; }

/* Exams grid */
.exgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.exam { text-align: left; background: var(--page); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.exam:hover { border-color: var(--pen); box-shadow: var(--shadow); }
.exam b { font: 700 17px/1.25 var(--f-display); }
.exam span { font-size: 14px; color: var(--ink-2); }
.cat { font: 700 12px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--pen); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { border: 1.5px solid var(--rule); background: var(--page); border-radius: 999px; padding: 5px 12px; font-size: 15px; font-weight: 500; cursor: pointer; min-height: 36px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--page); }

/* Libraries */
.libs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.lib { display: flex; flex-direction: column; gap: 2px; background: var(--page); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px 14px; text-decoration: none; color: var(--ink); }
.lib:hover { border-color: var(--pen); }
.lib b { font-weight: 700; color: var(--pen); }
.lib span { font-size: 14px; color: var(--ink-2); }

/* Subject page */
.subhead { display: flex; flex-direction: column; gap: 6px; }
.subhead h1 { font-size: clamp(30px, 4.6vw, 44px); font-weight: 900; }
.subhead h1 small { font: 600 22px var(--f-body); color: var(--ink-2); margin-left: 8px; }
.subhead p { margin: 0; color: var(--ink-2); max-width: 40em; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--barh, 66px)); z-index: 6; background: var(--paper); padding-block: 8px; }
.tabs button { border: 1.5px solid var(--rule); background: var(--page); border-radius: 10px; padding: 7px 14px; font-weight: 600; cursor: pointer; min-height: 42px; display: flex; gap: 8px; align-items: center; }
.tabs button em { font: normal 500 12px var(--f-mono); color: var(--ink-2); }
.tabs button[aria-selected="true"] { background: var(--pen); border-color: var(--pen); color: var(--pen-ink); }
.tabs button[aria-selected="true"] em { color: var(--pen-ink); opacity: .8; }
.toolrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.vlang { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
.seg { display: inline-flex; border: 1.5px solid var(--rule); border-radius: 999px; padding: 2px; background: var(--page); }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 14px; cursor: pointer; min-height: 32px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
.progress { font: 500 14px var(--f-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
.pbar { width: 120px; height: 8px; background: var(--chip); border-radius: 999px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--ok); border-radius: 999px; }

.lessons { display: flex; flex-direction: column; gap: 10px; }
.lesson { background: var(--page); border: 1px solid var(--rule); border-radius: var(--r); position: relative; overflow: hidden; }
.lesson::before { content: ""; position: absolute; left: 44px; top: 0; bottom: 0; width: 1.5px; background: var(--margin); opacity: .55; }
.lesson summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 30px 1fr auto; gap: 14px; padding: 14px 16px 14px 8px; align-items: start; }
.lesson summary::-webkit-details-marker { display: none; }
.lesson .no { font: 500 13px/28px var(--f-mono); color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.lesson .tt { min-width: 0; }
.lesson .tt b { font: 700 19px/1.3 var(--f-display); display: block; }
.lesson .tt span { color: var(--ink-2); font-size: 16px; }
.lesson .done-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--rule); margin-top: 4px; display: grid; place-items: center; }
.lesson.done .done-dot { background: var(--ok); border-color: var(--ok); }
.lesson.done .done-dot::after { content: ""; width: 9px; height: 5px; border: 2.5px solid var(--page); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.lesson .body { padding: 0 18px 18px 60px; display: flex; flex-direction: column; gap: 14px; }
.lesson .body ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; line-height: 1.6; }
.lesson .ex { background: var(--paper); border: 1px dashed var(--rule); border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.lesson .ex b { display: block; font: 700 12px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 4px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 15px; text-decoration: none; cursor: pointer; min-height: 44px; border: 1.5px solid var(--rule); background: var(--page); color: var(--ink); }
.btn.yt { background: var(--yt); border-color: var(--yt); color: #fff; }
.btn.okb[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.btn.wa { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn svg { flex: none; }
.kw { display: flex; gap: 6px; flex-wrap: wrap; }
.kw span { font: 500 12px var(--f-mono); background: var(--chip); color: var(--ink-2); padding: 2px 8px; border-radius: 6px; }

.empty { background: var(--page); border: 1px dashed var(--rule); border-radius: var(--r); padding: 22px; color: var(--ink-2); }

/* Exam page */
.stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; counter-reset: st; }
.stage { background: var(--page); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px 14px; counter-increment: st; }
.stage::before { content: "Stage " counter(st); display: block; font: 700 12px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--pen); margin-bottom: 2px; }
.esec { display: flex; flex-direction: column; gap: 8px; }
.esec h3 { font-size: 20px; }
.etopics { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.etopic { background: var(--page); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.etopic b { font-weight: 700; }
.etopic span { font-size: 15px; color: var(--ink-2); }
.etopic a { font-size: 14px; font-weight: 600; color: var(--yt); }
.tips { background: var(--page); border: 1px solid var(--rule); border-left: 4px solid var(--hl); border-radius: var(--r); padding: 14px 18px; }
.tips ul { margin: 6px 0 0; padding-left: 20px; }
.note { font-size: 14px; color: var(--ink-2); margin: 0; }

/* Search results */
.results { display: flex; flex-direction: column; gap: 8px; }
.res { text-align: left; background: var(--page); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.res:hover { border-color: var(--pen); }
.res small { font: 500 12px var(--f-mono); color: var(--pen); text-transform: uppercase; letter-spacing: .04em; }
.res b { font-family: var(--f-display); font-size: 17px; }
.res span { color: var(--ink-2); font-size: 15px; }
.res mark { background: var(--hl); color: var(--hl-ink); border-radius: 3px; padding: 0 2px; }

/* Footer */
footer.credit { margin-top: 40px; border-top: 2px solid var(--ink); padding-top: 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 24px; align-items: center; }
footer.credit .by { font: 800 22px/1.3 var(--f-display); }
footer.credit .by span { background: linear-gradient(transparent 58%, var(--hl) 58% 92%, transparent 92%); padding: 0 3px; }
footer.credit p { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); }
.wa-box { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.wa-num { font: 500 18px var(--f-mono); user-select: all; font-variant-numeric: tabular-nums; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 10px 18px; border-radius: 10px; font-weight: 600; z-index: 20; }

@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; }
  .ladder { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  body { font-size: 16px; }
  .ladder { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bar .wrap { gap: 8px 10px; }
  .search { order: 3; flex-basis: 100%; }
  nav.main { margin-left: auto; }
  nav.main button { padding: 6px 8px; font-size: 15px; }
  .logo small { display: none; }
  .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding-inline: 4px; }
  .tabs button { flex: none; }
  .logo b { font-size: 22px; }
  .lesson::before { left: 34px; }
  .lesson summary { grid-template-columns: 22px 1fr auto; gap: 10px; }
  .lesson .body { padding: 0 14px 16px 46px; }
  footer.credit { grid-template-columns: 1fr; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .subj { grid-template-columns: 1fr; padding: 12px; }
  .subj .count { grid-row: auto; grid-column: 1; }
  .subj b { font-size: 16px; }
  .stats .stat b { font-size: 22px; }
}
@media (prefers-reduced-motion: no-preference) {
  .lesson[open] .body { animation: open .18s ease-out; }
  @keyframes open { from { opacity: .3; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
}

/* Announcement, admin and publish bar */
.announce { margin-top: 16px; background: var(--hl); color: var(--hl-ink); border-radius: var(--r); padding: 10px 16px; font-weight: 600; }
.admin-btn { color: var(--margin) !important; }
.btn.primary { background: var(--pen); border-color: var(--pen); color: var(--pen-ink); }
.btn.danger { background: var(--margin); border-color: var(--margin); color: #fff; }
.btn.sm { min-height: 36px; padding: 5px 10px; font-size: 14px; }
.pubbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; background: var(--ink); color: var(--page); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pubbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-block: 10px; }
.pubbar .btn { border-color: transparent; }
.pubbar #pub-discard { background: transparent; color: var(--page); border-color: var(--ink-2); }
body.has-pub { padding-bottom: 90px; }

.atabs { display: flex; gap: 6px; flex-wrap: wrap; }
.atabs button { border: 1.5px solid var(--rule); background: var(--page); border-radius: 10px; padding: 7px 14px; font-weight: 600; cursor: pointer; min-height: 42px; }
.atabs button[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--page); }
.panel { background: var(--page); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel h2 { font-size: 22px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--page); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px; }
.tile b { display: block; font: 800 30px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.tile span { font-size: 14px; color: var(--ink-2); }
.tile.warn b { color: var(--margin); }
.matrix-wrap { overflow-x: auto; }
table.matrix { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 15px; }
.matrix th, .matrix td { padding: 6px 8px; border-bottom: 1px solid var(--rule); text-align: center; white-space: nowrap; }
.matrix th:first-child, .matrix td:first-child { text-align: left; }
.matrix th { font: 700 12px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.matrix td.c { font-family: var(--f-mono); }
.matrix td.c0 { color: var(--ink-2); opacity: .5; }
.matrix td.lo { background: color-mix(in srgb, var(--margin) 14%, transparent); }
.matrix td.mid { background: color-mix(in srgb, var(--hl) 30%, transparent); }
.matrix td.hi { background: color-mix(in srgb, var(--ok) 16%, transparent); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.log li { display: grid; grid-template-columns: 150px 1fr; gap: 10px; font-size: 15px; }
.log time { font: 500 13px var(--f-mono); color: var(--ink-2); }
.todo { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }

.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 14px; font-weight: 600; }
.field small { color: var(--ink-2); font-size: 13px; }
.field input, .field select, .field textarea { font: 16px var(--f-body); color: var(--ink); background: var(--paper); border: 1.5px solid var(--rule); border-radius: 10px; padding: 9px 12px; min-height: 44px; width: 100%; }
.field textarea { min-height: 96px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--pen); }
.pickrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.pickrow .field { flex: 1 1 200px; }
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.row:last-child { border-bottom: 0; }
.row .no { font: 500 13px var(--f-mono); color: var(--ink-2); }
.row .rt { min-width: 0; }
.row .rt b { display: block; }
.row .rt span { font-size: 14px; color: var(--ink-2); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .ra { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.row.confirm { background: color-mix(in srgb, var(--margin) 10%, transparent); border-radius: 8px; padding-inline: 6px; }
.badge { font: 700 11px var(--f-body); letter-spacing: .06em; text-transform: uppercase; background: var(--hl); color: var(--hl-ink); border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
.msg { border-radius: 10px; padding: 10px 14px; font-weight: 600; }
.msg.err { background: color-mix(in srgb, var(--margin) 15%, transparent); color: var(--margin); }
.msg.ok { background: var(--ok-soft); color: var(--ok); }
@media (max-width: 760px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form { grid-template-columns: 1fr; }
  .log li { grid-template-columns: 1fr; gap: 0; }
  .row { grid-template-columns: 26px minmax(0, 1fr); }
  .row .ra { grid-column: 2; justify-content: flex-start; }
}

<script type="application/json" id="efe-data">{"settings":{"name":"Education For Everyone","nameHi":"सबके लिए शिक्षा","tagline":"Every subject from Class 6 to PhD in simple language, with free video classes and guides for every major competitive exam.","owner":"Neeraj Kumar","whatsapp":"919625004090","announcement":""},"subjects":[{"id":"maths","name":"Mathematics","nameHi":"गणित","group":"maths","blurb":"Mathematics is the study of numbers, shapes, patterns and logic that helps us count, measure and solve problems.","levels":{"6-8":[{"id":"number-system","t":"Numbers, Factors and Multiples","s":"Learn to read big numbers in lakhs and crores, and to find factors, multiples, HCF and LCM.","n":["Place value means a digit's value depends on its place. In 5,432 the 4 means 4 hundreds (सैकड़ा).","Indian system puts commas as 7,45,23,108 (crore, lakh, thousand). International system writes 74,523,108 (million, thousand).","A factor divides a number fully. A multiple is what you get on multiplying. 3 is a factor of 12; 12 is a multiple of 3.","A prime number has only two factors, 1 and itself, like 2, 3, 5, 7. 1 is neither prime nor composite.","HCF (महत्तम समापवर्तक) is the biggest common factor. LCM (लघुत्तम समापवर्त्य) is the smallest common multiple. For two numbers, HCF x LCM = product of the numbers."],"ex":"HCF and LCM of 12 and 18. Step 1: 12 = 2 x 2 x 3, 18 = 2 x 3 x 3. Step 2: HCF = common primes = 2 x 3 = 6. Step 3: LCM = 2 x 2 x 3 x 3 = 36. Check: 6 x 36 = 216 = 12 x 18.","q":"class 6 knowing our numbers hcf lcm ncert hindi","kw":["place value","prime number","HCF","LCM"]},{"id":"fractions-decimals","t":"Fractions and Decimals","s":"A fraction is a part of a whole, like half a roti. A decimal is another way to write parts.","n":["In 3/4, the top number 3 is the numerator (अंश) and the bottom number 4 is the denominator (हर).","Equivalent fractions have the same value: 1/2 = 2/4 = 3/6. Multiply or divide top and bottom by the same number.","To add or subtract fractions, first make the denominators the same using the LCM, then add the numerators.","To multiply fractions, multiply tops and bottoms. To divide, flip the second fraction and multiply: (1/2) / (1/4) = (1/2) x 4 = 2.","Decimals use place value after the point: 0.75 means 7 tenths and 5 hundredths, which equals 75/100 = 3/4."],"ex":"Add 3/4 + 2/3. Step 1: LCM of 4 and 3 is 12. Step 2: 3/4 = 9/12 and 2/3 = 8/12. Step 3: 9/12 + 8/12 = 17/12. Step 4: 17/12 = 1 whole and 5/12. Answer: 1 5/12.","q":"class 6 7 fractions and decimals maths ncert hindi","kw":["fraction","numerator","denominator","decimal"]},{"id":"integers","t":"Integers","s":"Integers are whole numbers with signs: positive, negative and zero, like temperatures above and below zero.","n":["Integers (पूर्णांक) are ..., -3, -2, -1, 0, 1, 2, 3, ... On a number line, numbers grow bigger as you go right.","Adding a negative number is like going left: 5 + (-8) = -3. Subtracting a negative is adding: 5 - (-2) = 7.","Multiplying signs: plus x plus = plus, minus x minus = plus, plus x minus = minus. The same rules work for division.","Zero is neither positive nor negative. Any integer plus its opposite gives zero: 6 + (-6) = 0.","Real life: bank withdrawal, height below sea level and winter temperatures in Leh are shown with negative numbers."],"ex":"Morning temperature in Shimla is -3 degrees C. By noon it rises by 8 degrees. Noon temperature = -3 + 8 = 5 degrees C. Also, (-4) x (-5) = +20 because minus x minus gives plus, and (-20) / 4 = -5.","q":"class 6 7 integers maths ncert hindi","kw":["integers","number line","negative numbers"]},{"id":"algebra-basics","t":"Algebra Basics and Simple Equations","s":"Algebra uses letters like x to stand for unknown numbers, so we can solve puzzles step by step.","n":["A variable (चर) is a letter that can take different values, like x or n. A constant has a fixed value, like 7.","An expression joins numbers and variables, like 3x + 5. Terms with the same variable, like 2x and 5x, are like terms and can be added: 7x.","An equation says two sides are equal, like 3x + 5 = 20. Whatever you do to one side, do the same to the other.","Useful identities: (a + b)^2 = a^2 + 2ab + b^2, (a - b)^2 = a^2 - 2ab + b^2, and (a + b)(a - b) = a^2 - b^2.","Always check your answer by putting it back in the original equation."],"ex":"Solve 3x + 5 = 20. Step 1: subtract 5 from both sides: 3x = 15. Step 2: divide both sides by 3: x = 5. Check: 3 x 5 + 5 = 15 + 5 = 20. Correct. Answer: x = 5.","q":"class 7 8 simple equations algebraic expressions ncert hindi","kw":["variable","expression","equation","identity"]},{"id":"ratio-percent","t":"Ratio, Percentage and Interest","s":"Ratio compares two amounts. Percent means 'out of 100'. Both help with shopping, discounts and bank interest.","n":["A ratio a : b compares two quantities of the same kind. 10 boys and 15 girls give 10 : 15 = 2 : 3.","Unitary method: find the value of one item first, then multiply. If 5 pens cost Rs 40, one costs Rs 8, so 3 cost Rs 24.","Percent (प्रतिशत) means per hundred. 25% = 25/100 = 1/4. To find 20% of 450, do 450 x 20/100 = 90.","Profit = selling price - cost price. Profit % = (profit / cost price) x 100. Loss works the same way.","Simple interest (साधारण ब्याज) SI = P x R x T / 100, where P is principal, R is rate per year and T is time in years. Amount = P + SI."],"ex":"Rani puts Rs 5,000 in a bank at 8% simple interest for 3 years. SI = 5000 x 8 x 3 / 100 = 120000 / 100 = Rs 1,200. Amount = 5000 + 1200 = Rs 6,200.","q":"class 7 8 comparing quantities percentage simple interest ncert hindi","kw":["ratio","percentage","profit and loss","simple interest"]},{"id":"geometry-basics","t":"Lines, Angles and Triangles","s":"Geometry studies shapes. Here we learn about angles, parallel lines, triangles and the Pythagoras rule.","n":["Angles: acute is less than 90 degrees, right is 90, obtuse is between 90 and 180, straight is 180.","Angles on a straight line add to 180 degrees. Vertically opposite angles are equal.","When a line cuts two parallel lines, alternate angles are equal and corresponding angles are equal.","The three angles of any triangle add to 180 degrees. An exterior angle equals the sum of the two opposite interior angles.","Pythagoras rule for a right triangle: hypotenuse^2 = base^2 + height^2. The hypotenuse (कर्ण) is the side opposite the right angle."],"ex":"A triangle has angles 50 and 60 degrees. Third angle = 180 - (50 + 60) = 70 degrees. A right triangle has sides 6 cm and 8 cm around the right angle. Hypotenuse^2 = 36 + 64 = 100, so hypotenuse = 10 cm.","q":"class 7 lines and angles triangle properties pythagoras ncert hindi","kw":["angles","parallel lines","triangle","Pythagoras"]},{"id":"mensuration","t":"Mensuration: Perimeter, Area and Volume","s":"Mensuration means measuring: the boundary of a shape, the space it covers, and how much it can hold.","n":["Perimeter is the length around a shape. Rectangle: 2 x (length + breadth). Square: 4 x side. Circle (circumference): 2 x pi x r.","Area is the surface covered. Rectangle: l x b. Square: side x side. Triangle: (1/2) x base x height. Circle: pi x r^2.","We often take pi = 22/7 or 3.14. Area is in square units like cm^2; volume is in cubic units like cm^3.","Volume of cuboid = l x b x h. Cube = side^3. Cylinder = pi x r^2 x h. Also, 1 litre = 1000 cm^3.","Total surface area of cuboid = 2(lb + bh + hl). Cube = 6 x side^2. Cylinder = 2 pi r (r + h)."],"ex":"A circular garden has radius 7 m. Area = (22/7) x 7 x 7 = 154 m^2. A water tank (cuboid) is 2 m x 1.5 m x 1 m. Volume = 3 m^3 = 3000 litres, since 1 m^3 = 1000 litres.","q":"class 7 8 mensuration area perimeter volume ncert hindi","kw":["perimeter","area","volume","surface area"]},{"id":"data-handling","t":"Data Handling","s":"Data handling means collecting numbers, arranging them, drawing graphs, and finding averages to understand them.","n":["Data (आँकड़े) is a collection of facts or numbers. A tally table helps count how often each value appears.","Bar graphs use bars of equal width; pie charts show parts of a whole as slices. A full circle is 360 degrees.","Mean (average) = sum of values / number of values. Median is the middle value after arranging in order. Mode is the most frequent value.","Range = highest value - lowest value. It tells how spread out the data is.","Chance (probability) of an event = favourable outcomes / total outcomes, when all outcomes are equally likely."],"ex":"Marks: 6, 8, 5, 8, 3. Mean = (6 + 8 + 5 + 8 + 3) / 5 = 30 / 5 = 6. Arrange: 3, 5, 6, 8, 8. Median = middle value = 6. Mode = 8 (appears twice). Range = 8 - 3 = 5.","q":"class 7 8 data handling mean median mode ncert hindi","kw":["mean","median","mode","bar graph"]}],"9-10":[{"id":"real-numbers","t":"Real Numbers","s":"Real numbers include rationals like 3/4 and irrationals like square root of 2. Every number on the number line is real.","n":["A rational number can be written as p/q with integers p, q and q not zero. Its decimal ends or repeats, like 0.25 or 0.333...","An irrational number cannot be written as p/q. Its decimal never ends and never repeats, like square root of 2 or pi.","Fundamental Theorem of Arithmetic: every composite number can be written as a product of primes in exactly one way, except for order.","For two numbers a and b, HCF(a, b) x LCM(a, b) = a x b. Use prime factorisation to find both.","Square root of 2 is irrational. We prove it by contradiction: assume it is p/q in lowest terms and show both p and q are even."],"ex":"Find HCF and LCM of 96 and 404. 96 = 2^5 x 3, 404 = 2^2 x 101. HCF = 2^2 = 4. LCM = 2^5 x 3 x 101 = 9696. Check: 4 x 9696 = 38784 = 96 x 404. Correct.","q":"class 10 real numbers fundamental theorem of arithmetic ncert hindi","kw":["rational","irrational","prime factorisation","HCF LCM"]},{"id":"polynomials-quadratics","t":"Polynomials and Quadratic Equations","s":"A polynomial is an expression like x^2 - 5x + 6. Its zeroes are the x values that make it zero.","n":["Degree is the highest power of x. Degree 1 is linear, 2 is quadratic (द्विघात), 3 is cubic.","For ax^2 + bx + c with zeroes alpha and beta: alpha + beta = -b/a and alpha x beta = c/a.","Remainder theorem: when p(x) is divided by (x - a), the remainder is p(a).","A quadratic equation ax^2 + bx + c = 0 can be solved by factorising or by the formula x = (-b +/- sqrt(b^2 - 4ac)) / 2a.","Discriminant D = b^2 - 4ac. If D > 0, two different real roots. If D = 0, two equal roots. If D \u003c 0, no real roots."],"ex":"Solve 2x^2 - 7x + 3 = 0. Here a = 2, b = -7, c = 3. D = 49 - 24 = 25. x = (7 +/- 5) / 4, so x = 12/4 = 3 or x = 2/4 = 1/2. Check x = 3: 18 - 21 + 3 = 0. Correct.","q":"class 10 polynomials quadratic equations ncert hindi","kw":["polynomial","zeroes","quadratic formula","discriminant"]},{"id":"linear-equations","t":"Pair of Linear Equations in Two Variables","s":"Two equations with two unknowns, like x + y = 10 and x - y = 4, solved together.","n":["A linear equation in two variables looks like ax + by + c = 0. Its graph is a straight line.","Two lines can cross at one point (one solution), be parallel (no solution), or be the same line (infinitely many solutions).","Substitution method: find one variable from one equation and put it into the other.","Elimination method: add or subtract the equations so one variable cancels out.","Check: for a1x + b1y + c1 = 0 and a2x + b2y + c2 = 0, if a1/a2 is not equal to b1/b2, there is exactly one solution."],"ex":"Two numbers add to 10 and differ by 4: x + y = 10, x - y = 4. Add both: 2x = 14, so x = 7. Put in first: 7 + y = 10, so y = 3. Check second: 7 - 3 = 4. Answer: x = 7, y = 3.","q":"class 10 pair of linear equations in two variables ncert hindi","kw":["linear equations","substitution","elimination","consistent"]},{"id":"arithmetic-progressions","t":"Arithmetic Progressions","s":"An AP is a list where each term goes up or down by the same amount, like 2, 5, 8, 11.","n":["The fixed difference is called the common difference d. In 2, 5, 8, 11, d = 3.","The nth term is a_n = a + (n - 1)d, where a is the first term.","Sum of first n terms is S_n = (n/2)[2a + (n - 1)d], or S_n = (n/2)(first term + last term).","Sum of first n natural numbers: 1 + 2 + ... + n = n(n + 1)/2. So 1 to 100 adds to 5050.","Real life: saving Rs 50 more each month, or seats increasing by a fixed number in each row, form an AP."],"ex":"AP: 2, 5, 8, ... Find the 10th term and sum of 10 terms. a = 2, d = 3. a_10 = 2 + 9 x 3 = 29. S_10 = (10/2)(2 + 29) = 5 x 31 = 155. Answer: 29 and 155.","q":"class 10 arithmetic progression nth term sum ncert hindi","kw":["arithmetic progression","common difference","nth term","sum of AP"]},{"id":"triangles-circles","t":"Triangles and Circles","s":"Learn when two triangles are congruent or similar, and the key facts about tangents and arcs of circles.","n":["Congruent triangles are exact copies. Tests: SSS, SAS, ASA, RHS. Similar triangles have the same shape: equal angles and sides in the same ratio (AA test).","Basic Proportionality Theorem: a line parallel to one side of a triangle divides the other two sides in the same ratio.","A tangent to a circle touches it at one point and is perpendicular to the radius at that point.","The two tangents drawn from an outside point to a circle are equal in length.","Arc length = (theta/360) x 2 pi r and sector area = (theta/360) x pi r^2, where theta is the angle at the centre in degrees."],"ex":"In triangle ABC, DE is parallel to BC with D on AB and E on AC. AD = 2 cm, DB = 3 cm, AE = 4 cm. By BPT, AD/DB = AE/EC, so 2/3 = 4/EC. EC = 4 x 3 / 2 = 6 cm.","q":"class 10 triangles similarity circles tangent ncert hindi","kw":["congruence","similar triangles","BPT","tangent"]},{"id":"coordinate-geometry","t":"Coordinate Geometry","s":"Coordinate geometry places points on a graph using (x, y) pairs, so we can measure distances using algebra.","n":["Every point has coordinates (x, y). x is distance from the y-axis, y is distance from the x-axis. The origin is (0, 0).","Distance formula: distance between (x1, y1) and (x2, y2) = sqrt((x2 - x1)^2 + (y2 - y1)^2).","Section formula: point dividing the join in ratio m : n is ((m x2 + n x1)/(m + n), (m y2 + n y1)/(m + n)).","Midpoint formula: ((x1 + x2)/2, (y1 + y2)/2). It is the section formula with m = n.","The plane is divided into four quadrants. In quadrant II, x is negative and y is positive."],"ex":"Find distance and midpoint of A(1, 2) and B(4, 6). Distance = sqrt((4 - 1)^2 + (6 - 2)^2) = sqrt(9 + 16) = sqrt(25) = 5 units. Midpoint = ((1 + 4)/2, (2 + 6)/2) = (2.5, 4).","q":"class 10 coordinate geometry distance section formula ncert hindi","kw":["coordinates","distance formula","section formula","midpoint"]},{"id":"trigonometry","t":"Trigonometry and Heights and Distances","s":"Trigonometry links the angles and sides of a right triangle. It helps find heights of towers without climbing them.","n":["In a right triangle with angle A: sin A = opposite/hypotenuse, cos A = adjacent/hypotenuse, tan A = opposite/adjacent.","cosec, sec and cot are the reciprocals: cosec A = 1/sin A, sec A = 1/cos A, cot A = 1/tan A.","Key values: sin 30 = 1/2, sin 45 = 1/sqrt(2), sin 60 = sqrt(3)/2, tan 45 = 1, tan 60 = sqrt(3). Also sin 90 = 1, cos 90 = 0.","Identities: sin^2 A + cos^2 A = 1, 1 + tan^2 A = sec^2 A, 1 + cot^2 A = cosec^2 A.","Angle of elevation is measured upward from the horizontal line of sight; angle of depression is measured downward."],"ex":"You stand 20 m from a tower. Angle of elevation to the top is 60 degrees. tan 60 = height / 20, so height = 20 x sqrt(3) = 20 x 1.732 = 34.64 m (about).","q":"class 10 trigonometry heights and distances ncert hindi","kw":["sin cos tan","trigonometric identities","angle of elevation"]},{"id":"statistics-probability","t":"Statistics and Probability","s":"Statistics summarises data with averages. Probability measures how likely something is, from 0 (impossible) to 1 (certain).","n":["Mean of grouped data = sum(f x) / sum(f), where x is the class mark (middle of the class) and f is frequency.","Mode of grouped data = l + [(f1 - f0) / (2f1 - f0 - f2)] x h, where l is the lower limit of the modal class and h is class width.","Empirical relation: 3 x Median = Mode + 2 x Mean (approximately true for many data sets).","Probability P(E) = number of favourable outcomes / total number of equally likely outcomes. It is always between 0 and 1.","P(not E) = 1 - P(E). For a coin, P(head) = 1/2. For a die, P(6) = 1/6."],"ex":"A die is thrown once. Probability of an even number: favourable = {2, 4, 6} = 3, total = 6, so P = 3/6 = 1/2. Probability of a number greater than 4: {5, 6}, so P = 2/6 = 1/3.","q":"class 10 statistics probability mean mode grouped data ncert hindi","kw":["mean","mode","median","probability"]}],"11-12":[{"id":"sets-relations-functions","t":"Sets, Relations and Functions","s":"Sets are collections of objects. Relations connect elements of sets. Functions give exactly one output for each input.","n":["A set (समुच्चय) is a well-defined collection, like {1, 2, 3}. Union A U B has elements in A or B; intersection has elements in both.","n(A U B) = n(A) + n(B) - n(A intersection B). A set with n elements has 2^n subsets.","The Cartesian product A x B is the set of all ordered pairs (a, b). A relation is any subset of A x B.","A function f: A to B gives each element of A exactly one image in B. One-one means different inputs give different outputs; onto means every element of B is used.","A relation is an equivalence relation if it is reflexive, symmetric and transitive."],"ex":"In a class, 25 students like cricket, 18 like football and 10 like both. Number liking at least one = 25 + 18 - 10 = 33. Also f(x) = 2x + 3 on real numbers is one-one: if 2a + 3 = 2b + 3 then a = b.","q":"class 11 12 sets relations functions ncert hindi","kw":["sets","relations","functions","one-one onto"]},{"id":"trigonometric-functions","t":"Trigonometric Functions","s":"Trigonometric functions extend sin and cos to any angle, measured in degrees or radians, with useful formulas.","n":["Radian measure: pi radians = 180 degrees. So 1 radian is about 57.3 degrees and 60 degrees = pi/3.","Signs by quadrant: all positive in I, only sin in II, only tan in III, only cos in IV.","sin(A + B) = sin A cos B + cos A sin B and cos(A + B) = cos A cos B - sin A sin B.","Double angle: sin 2A = 2 sin A cos A and cos 2A = cos^2 A - sin^2 A = 1 - 2 sin^2 A.","Inverse trig functions (Class 12) like sin^-1 x give an angle. Principal value of sin^-1 x lies in [-pi/2, pi/2]."],"ex":"Find sin 75 degrees. sin 75 = sin(45 + 30) = sin 45 cos 30 + cos 45 sin 30 = (1/sqrt2)(sqrt3/2) + (1/sqrt2)(1/2) = (sqrt3 + 1)/(2 sqrt2), about 0.966.","q":"class 11 trigonometric functions radian compound angle ncert hindi","kw":["radian","compound angles","inverse trigonometry"]},{"id":"complex-numbers-sequences","t":"Complex Numbers and Sequences","s":"Complex numbers let us take square roots of negative numbers. Sequences and series study patterns like AP and GP.","n":["The imaginary unit i has i^2 = -1. A complex number is z = a + ib, with real part a and imaginary part b.","Conjugate of a + ib is a - ib. Modulus |z| = sqrt(a^2 + b^2). Also z x conjugate(z) = a^2 + b^2.","A geometric progression (GP) multiplies by a fixed ratio r: a, ar, ar^2, ... The nth term is a r^(n-1).","Sum of n GP terms: S_n = a(r^n - 1)/(r - 1) when r is not 1. If |r| \u003c 1, the infinite sum is a/(1 - r).","For positive numbers a and b, arithmetic mean (a + b)/2 is always at least the geometric mean sqrt(ab)."],"ex":"Divide (3 + 4i) by (1 + 2i). Multiply top and bottom by (1 - 2i): (3 + 4i)(1 - 2i) = 3 - 6i + 4i - 8i^2 = 11 - 2i. Bottom = 1 + 4 = 5. Answer: 11/5 - (2/5)i.","q":"class 11 complex numbers sequences and series GP ncert hindi","kw":["complex numbers","modulus","geometric progression","series"]},{"id":"limits-derivatives","t":"Limits, Continuity and Derivatives","s":"A limit is the value a function approaches. A derivative measures the rate of change, like speed from distance.","n":["lim x->a f(x) is the value f(x) gets close to as x gets close to a. Key result: lim x->0 (sin x)/x = 1.","f is continuous at a if lim x->a f(x) = f(a). Informally, you can draw its graph without lifting the pen.","Derivative f'(x) = lim h->0 [f(x + h) - f(x)]/h. Rules: d/dx(x^n) = n x^(n-1), d/dx(sin x) = cos x, d/dx(e^x) = e^x.","Product rule: (uv)' = u'v + uv'. Quotient rule: (u/v)' = (u'v - uv')/v^2. Chain rule: d/dx f(g(x)) = f'(g(x)) g'(x).","Applications: f' > 0 means increasing. At a maximum or minimum, f' = 0. If f'' \u003c 0 there it is a maximum; if f'' > 0, a minimum."],"ex":"Find the maximum of f(x) = -x^2 + 4x + 1. f'(x) = -2x + 4. Set f'(x) = 0: x = 2. f''(x) = -2, which is negative, so it is a maximum. f(2) = -4 + 8 + 1 = 5. Maximum value is 5.","q":"class 11 12 limits continuity derivatives application ncert hindi","kw":["limit","continuity","derivative","maxima minima"]},{"id":"integrals-differential-equations","t":"Integrals and Differential Equations","s":"Integration is the reverse of differentiation and finds areas. Differential equations connect a function with its derivatives.","n":["Indefinite integral: integral of x^n dx = x^(n+1)/(n+1) + C (n not -1). Integral of 1/x dx = log|x| + C. Integral of e^x dx = e^x + C.","Methods: substitution, partial fractions and integration by parts: integral of u dv = uv - integral of v du.","Definite integral from a to b of f(x) dx = F(b) - F(a), where F' = f. It gives the area under the curve.","A differential equation (अवकल समीकरण) contains derivatives, like dy/dx = 2x. Order is the highest derivative present.","Variable separable method: bring all y terms to one side and x terms to the other, then integrate both sides."],"ex":"Area under y = x^2 from x = 0 to x = 3: integral = [x^3/3] from 0 to 3 = 27/3 - 0 = 9 square units. Solve dy/dx = 2x with y(0) = 1: y = x^2 + C, and C = 1, so y = x^2 + 1.","q":"class 12 integrals differential equations ncert hindi","kw":["integration","definite integral","differential equation"]},{"id":"vectors-3d","t":"Vectors and Three-Dimensional Geometry","s":"A vector has size and direction, like a force or velocity. 3D geometry uses x, y, z to locate points in space.","n":["A vector a = a1 i + a2 j + a3 k has magnitude |a| = sqrt(a1^2 + a2^2 + a3^2). A scalar has only size, like mass.","Dot product: a . b = a1b1 + a2b2 + a3b3 = |a||b| cos(theta). If a . b = 0, the vectors are perpendicular.","Cross product a x b is a vector perpendicular to both, with magnitude |a||b| sin(theta). It equals the area of the parallelogram they form.","A line through point a in direction b is r = a + t b. Direction cosines l, m, n satisfy l^2 + m^2 + n^2 = 1.","Distance between points (x1, y1, z1) and (x2, y2, z2) = sqrt((x2 - x1)^2 + (y2 - y1)^2 + (z2 - z1)^2)."],"ex":"Angle between a = i + j and b = j + k. a . b = 0 + 1 + 0 = 1. |a| = sqrt2, |b| = sqrt2. cos(theta) = 1/(sqrt2 x sqrt2) = 1/2. So theta = 60 degrees.","q":"class 12 vectors three dimensional geometry ncert hindi","kw":["vectors","dot product","cross product","3D lines"]},{"id":"matrices-determinants","t":"Matrices and Determinants","s":"A matrix is a rectangular table of numbers. Determinants and inverses help solve many equations at once.","n":["A matrix of order m x n has m rows and n columns. Matrices of the same order are added element by element.","To multiply A (m x n) by B (n x p), multiply rows of A with columns of B. In general AB is not equal to BA.","Determinant of a 2 x 2 matrix [[a, b], [c, d]] is ad - bc. If the determinant is 0, the matrix has no inverse.","Inverse A^-1 = adj(A) / |A|. For 2 x 2: swap a and d, change signs of b and c, then divide by ad - bc.","A system AX = B with |A| not zero has the unique solution X = A^-1 B."],"ex":"Solve 2x + y = 5, x + 3y = 10. A = [[2, 1], [1, 3]], |A| = 6 - 1 = 5. A^-1 = (1/5)[[3, -1], [-1, 2]]. X = A^-1 B: x = (15 - 10)/5 = 1, y = (-5 + 20)/5 = 3. Answer: x = 1, y = 3.","q":"class 12 matrices determinants inverse ncert hindi","kw":["matrix","determinant","inverse matrix","system of equations"]},{"id":"probability-12","t":"Probability","s":"Probability measures chance. In Class 11-12 we learn conditional probability, Bayes' theorem and random variables.","n":["For any events A and B: P(A or B) = P(A) + P(B) - P(A and B).","Conditional probability P(A|B) = P(A and B) / P(B), the chance of A when we know B has happened.","A and B are independent if P(A and B) = P(A) x P(B). Knowing one does not change the chance of the other.","Bayes' theorem lets us update chances using new evidence: P(E1|A) = P(E1)P(A|E1) / sum of P(Ei)P(A|Ei).","Binomial distribution: in n independent trials with success chance p, P(X = r) = nCr p^r (1 - p)^(n - r). Its mean is np."],"ex":"Bag 1 has 3 red, 2 blue balls; Bag 2 has 1 red, 4 blue. A bag is picked at random and a red ball drawn. P(Bag 1 | red) = (1/2)(3/5) / [(1/2)(3/5) + (1/2)(1/5)] = 0.3 / 0.4 = 3/4.","q":"class 12 probability conditional bayes theorem ncert hindi","kw":["conditional probability","Bayes theorem","binomial distribution"]}],"ug":[{"id":"calculus-ug","t":"Calculus (Single and Multivariable)","s":"University calculus makes school calculus rigorous and extends it to functions of many variables, series and multiple integrals.","n":["Mean Value Theorem: if f is continuous on [a, b] and differentiable inside, some c satisfies f'(c) = (f(b) - f(a))/(b - a).","Taylor series writes a function as a power series: e^x = 1 + x + x^2/2! + x^3/3! + ... This helps in approximations.","Partial derivatives (आंशिक अवकलज) measure change in one variable while holding others fixed. The gradient vector points in the direction of fastest increase.","Double and triple integrals find areas, volumes and masses. Changing to polar coordinates uses dx dy = r dr d(theta).","Vector calculus theorems of Green, Stokes and Gauss link integrals over a region with integrals over its boundary."],"ex":"Integrate x e^x from 0 to 1 by parts. Take u = x, dv = e^x dx, so du = dx, v = e^x. Integral = [x e^x] - integral of e^x = [x e^x - e^x] from 0 to 1 = (e - e) - (0 - 1) = 1.","q":"bsc calculus mean value theorem taylor series multiple integrals hindi","kw":["mean value theorem","Taylor series","partial derivatives","multiple integrals"]},{"id":"linear-algebra","t":"Linear Algebra","s":"Linear algebra studies vectors, vector spaces and linear maps. It is the language of engineering, data science and physics.","n":["A vector space is a set where you can add vectors and multiply by scalars, following fixed rules. R^n is the main example.","Vectors are linearly independent if no one is a combination of the others. A basis is an independent spanning set; its size is the dimension.","A linear map T satisfies T(au + bv) = aT(u) + bT(v). Rank-nullity theorem: rank + nullity = dimension of the domain.","Eigenvalue lambda and eigenvector v satisfy Av = lambda v with v non-zero. Find lambda from det(A - lambda I) = 0.","A real symmetric matrix can always be diagonalised by an orthogonal matrix, and all its eigenvalues are real."],"ex":"Eigenvalues of A = [[2, 1], [1, 2]]. det(A - lambda I) = (2 - lambda)^2 - 1 = 0, so 2 - lambda = +/-1, giving lambda = 1 or 3. For lambda = 3: (A - 3I)v = 0 gives -x + y = 0, so v = (1, 1).","q":"linear algebra vector space eigenvalues bsc hindi lecture","kw":["vector space","basis","linear transformation","eigenvalues"]},{"id":"real-analysis","t":"Real Analysis","s":"Real analysis proves why calculus works, using exact definitions of limits, sequences, series and continuity.","n":["Completeness axiom: every non-empty set of reals that is bounded above has a least upper bound (supremum).","A sequence a_n converges to L if for every epsilon > 0 there is N such that |a_n - L| \u003c epsilon for all n > N.","Every bounded monotone sequence converges. Every bounded sequence has a convergent subsequence (Bolzano-Weierstrass).","Series tests: the harmonic series sum 1/n diverges, but sum 1/n^2 converges. Use comparison, ratio and root tests.","A continuous function on a closed bounded interval [a, b] is bounded, attains its max and min, and is uniformly continuous."],"ex":"Prove 1/n converges to 0. Let epsilon > 0. Choose a natural number N > 1/epsilon (possible by the Archimedean property). For n > N: |1/n - 0| = 1/n \u003c 1/N \u003c epsilon. Hence 1/n tends to 0.","q":"real analysis sequences series epsilon delta bsc maths hindi","kw":["supremum","convergence","Cauchy sequence","uniform continuity"]},{"id":"abstract-algebra","t":"Abstract Algebra: Groups and Rings","s":"Abstract algebra studies structures like groups and rings, which capture the rules of addition, multiplication and symmetry.","n":["A group (समूह) is a set with an operation that is closed, associative, has an identity and has inverses. Example: integers under addition.","Lagrange's theorem: in a finite group, the order of every subgroup divides the order of the group.","A homomorphism keeps the structure: f(ab) = f(a)f(b). First isomorphism theorem: G / ker f is isomorphic to the image of f.","A ring has addition and multiplication, like the integers Z or polynomials. A field is a ring where every non-zero element has a multiplicative inverse, like Q, R or Z_p for prime p.","Cyclic groups are generated by one element. Every group of prime order is cyclic."],"ex":"Z_6 = {0, 1, 2, 3, 4, 5} under addition mod 6 is a group with identity 0. The inverse of 2 is 4, since 2 + 4 = 6 = 0 mod 6. {0, 2, 4} is a subgroup of order 3, and 3 divides 6, as Lagrange's theorem says.","q":"abstract algebra group theory lagrange theorem bsc maths hindi","kw":["group","subgroup","ring","homomorphism"]},{"id":"differential-equations-ug","t":"Ordinary and Partial Differential Equations","s":"Differential equations model change: population growth, cooling, vibrations and heat flow are all described by them.","n":["A first-order linear ODE dy/dx + P(x)y = Q(x) is solved using the integrating factor e^(integral of P dx).","For ay'' + by' + cy = 0, try y = e^(mx). Solve am^2 + bm + c = 0 (auxiliary equation) to get the general solution.","If the auxiliary roots are equal (m twice), the solution is (A + Bx)e^(mx). Complex roots p +/- iq give e^(px)(A cos qx + B sin qx).","A PDE has partial derivatives of a function of several variables. Classic examples: heat equation u_t = k u_xx, wave equation u_tt = c^2 u_xx, Laplace equation u_xx + u_yy = 0.","Separation of variables and Fourier series are standard methods to solve these PDEs with boundary conditions."],"ex":"Solve y'' - 5y' + 6y = 0. Auxiliary equation: m^2 - 5m + 6 = 0, so (m - 2)(m - 3) = 0, m = 2, 3. General solution: y = A e^(2x) + B e^(3x).","q":"ordinary differential equations partial differential equations bsc hindi","kw":["ODE","PDE","integrating factor","heat equation"]},{"id":"numerical-methods","t":"Numerical Methods","s":"Numerical methods find approximate answers with step-by-step arithmetic when exact formulas are hard or impossible.","n":["Bisection method: if f(a) and f(b) have opposite signs, a root lies between. Halve the interval again and again.","Newton-Raphson method: x_(n+1) = x_n - f(x_n)/f'(x_n). It is very fast near a simple root.","Interpolation fits a polynomial through known data points, for example using Lagrange or Newton formulas.","Numerical integration: trapezoidal rule and Simpson's 1/3 rule estimate area using sample points.","Euler's and Runge-Kutta methods solve ODEs step by step. Always think about errors and rounding."],"ex":"Find sqrt(2) with Newton-Raphson using f(x) = x^2 - 2, f'(x) = 2x, x0 = 1. x1 = 1 - (1 - 2)/2 = 1.5. x2 = 1.5 - (2.25 - 2)/3 = 1.5 - 0.0833 = 1.4167. True value is 1.4142.","q":"numerical methods newton raphson bisection simpson rule bsc hindi","kw":["Newton-Raphson","bisection","interpolation","Simpson rule"]},{"id":"probability-statistics-ug","t":"Probability and Statistics","s":"This course turns chance into precise maths and teaches how to draw reliable conclusions from data.","n":["A random variable gives a number to each outcome. Expectation E[X] is the long-run average; variance Var(X) = E[X^2] - (E[X])^2.","Important distributions: binomial (count of successes), Poisson (rare events, mean = variance = lambda), normal (bell curve).","Central Limit Theorem: averages of many independent samples are approximately normal, whatever the original distribution (with finite variance).","Hypothesis testing: assume a null hypothesis, compute a test statistic and p-value, and reject if the p-value is below the chosen level, like 0.05.","Correlation measures linear association between -1 and 1. Regression fits a line y = a + bx by least squares. Correlation does not prove causation."],"ex":"A fair coin is tossed 4 times. P(exactly 2 heads) = 4C2 x (1/2)^2 x (1/2)^2 = 6 x 1/16 = 3/8. Expected heads = np = 4 x 1/2 = 2. Variance = np(1 - p) = 1.","q":"probability and statistics random variables distributions bsc hindi","kw":["random variable","normal distribution","hypothesis testing","regression"]}],"pg":[{"id":"topology","t":"Topology","s":"Topology studies properties of spaces that stay the same when you stretch or bend them, without tearing.","n":["A topology on X is a collection of open sets containing the empty set and X, closed under any unions and finite intersections.","Continuity in topology: f is continuous if the pre-image of every open set is open.","A space is compact if every open cover has a finite subcover. In R^n, compact means closed and bounded (Heine-Borel).","Connected means the space cannot be split into two disjoint non-empty open sets. The real line is connected.","Hausdorff spaces separate distinct points by disjoint open sets. All metric spaces are Hausdorff."],"ex":"Let X = {a, b, c} and T = {empty, {a}, {a, b}, X}. Check unions: {a} U {a, b} = {a, b}, in T. Intersections: {a} and {a, b} meet in {a}, in T. Empty set and X are present. So T is a topology.","q":"msc topology open sets compactness connectedness lecture","kw":["open set","compactness","connectedness","Hausdorff"]},{"id":"functional-analysis","t":"Functional Analysis","s":"Functional analysis studies infinite-dimensional vector spaces of functions, used in quantum physics, PDEs and signal processing.","n":["A normed space has a length (norm) for each vector. A complete normed space is a Banach space.","A Hilbert space is a complete inner product space, like L^2 or l^2. It has angles and orthogonal projections.","A linear operator is bounded if and only if it is continuous. Its norm is the supremum of ||Tx|| over ||x|| = 1.","Major theorems: Hahn-Banach (extending functionals), open mapping, closed graph, and uniform boundedness.","Riesz representation: every bounded linear functional on a Hilbert space H is f(x) = \u003cx, y> for a unique y in H."],"ex":"On C[0, 1] with sup norm, define f(g) = integral from 0 to 1 of g(t) dt. It is linear, and |f(g)| \u003c= sup|g| = ||g||, so ||f|| \u003c= 1. For g = 1, f(g) = 1 = ||g||, so ||f|| = 1.","q":"functional analysis banach hilbert space msc maths lecture","kw":["Banach space","Hilbert space","bounded operator","Hahn-Banach"]},{"id":"complex-analysis","t":"Complex Analysis","s":"Complex analysis studies differentiable functions of a complex variable. It gives powerful tools to compute real integrals.","n":["f = u + iv is analytic where it is complex differentiable. Then u and v satisfy the Cauchy-Riemann equations u_x = v_y, u_y = -v_x.","Cauchy's theorem: the integral of an analytic function around a closed curve, in a simply connected region, is zero.","Cauchy integral formula: f(a) = (1/(2 pi i)) times the integral of f(z)/(z - a) dz around a curve enclosing a.","Laurent series include negative powers near a singularity. The coefficient of 1/(z - a) is the residue.","Residue theorem: the closed-curve integral equals 2 pi i times the sum of residues inside."],"ex":"Compute integral of dx/(1 + x^2) over all real x. Use the upper half-plane; the only pole inside is z = i. Residue = 1/(2i). Integral = 2 pi i x 1/(2i) = pi.","q":"complex analysis cauchy residue theorem msc maths lecture","kw":["analytic function","Cauchy-Riemann","residue theorem","Laurent series"]},{"id":"measure-theory","t":"Measure Theory and Lebesgue Integration","s":"Measure theory gives an exact idea of size for sets, leading to the Lebesgue integral, the base of modern probability.","n":["A sigma-algebra is a collection of sets closed under complements and countable unions. A measure assigns sizes that add over disjoint countable unions.","Lebesgue measure extends length on R. Every countable set, like the rationals, has measure zero.","A function is measurable if pre-images of intervals are measurable. The Lebesgue integral is built from simple functions.","Convergence theorems: Monotone Convergence, Fatou's lemma and Dominated Convergence let us swap limits and integrals.","Probability is measure theory with total measure 1: events are measurable sets and random variables are measurable functions."],"ex":"Dirichlet function: 1 on rationals, 0 on irrationals in [0, 1]. It is not Riemann integrable. But the rationals are countable, so have measure 0. Lebesgue integral = 1 x 0 + 0 x 1 = 0.","q":"measure theory lebesgue integration msc maths lecture","kw":["sigma-algebra","Lebesgue measure","dominated convergence"]},{"id":"advanced-algebra","t":"Advanced Algebra: Fields and Galois Theory","s":"Advanced algebra studies rings, modules and field extensions, and explains why some polynomial equations have no root formula.","n":["A field extension K/F has degree [K : F], its dimension as a vector space over F. Degrees multiply in towers.","The splitting field of a polynomial is the smallest extension containing all its roots.","The Galois group is the group of automorphisms of the extension that fix F. The Fundamental Theorem matches subgroups with intermediate fields.","Abel-Ruffini and Galois: the general polynomial of degree 5 or more cannot be solved by radicals, because S5 is not solvable.","Modules generalise vector spaces over rings. Finitely generated modules over a PID decompose into cyclic parts."],"ex":"x^3 - 2 over Q has roots 2^(1/3), 2^(1/3)w, 2^(1/3)w^2, where w is a cube root of unity. Splitting field Q(2^(1/3), w) has degree 3 x 2 = 6. Its Galois group has order 6 and is S3.","q":"galois theory field extensions msc algebra lecture","kw":["field extension","Galois group","splitting field","modules"]},{"id":"optimization","t":"Optimization","s":"Optimization finds the best choice under constraints, used in transport planning, machine learning and economics.","n":["Linear programming maximises a linear objective with linear constraints. The optimum, if it exists, is at a corner point; the simplex method moves between corners.","Every LP has a dual problem. Strong duality: when both have feasible solutions, their optimal values are equal.","For smooth problems with equality constraints, use Lagrange multipliers: grad f = lambda grad g at the optimum.","KKT conditions extend this to inequality constraints. In convex problems, any local minimum is a global minimum.","Gradient descent updates x_(k+1) = x_k - alpha grad f(x_k), where alpha is the step size."],"ex":"Minimise x^2 + y^2 subject to x + y = 2. Lagrange: 2x = lambda and 2y = lambda, so x = y. Then x + y = 2 gives x = y = 1. Minimum value = 1 + 1 = 2.","q":"optimization techniques linear programming lagrange KKT msc lecture","kw":["linear programming","duality","Lagrange multipliers","KKT conditions"]}],"phd":[{"id":"maths-research-methods","t":"Research Methods in Mathematics","s":"Learn how mathematicians find problems, read literature, build proofs and turn ideas into publishable research.","n":["Start with a clear question. Read survey papers and recent arXiv preprints to see what is known and what is open.","Work on small cases and examples first. Compute with software like SageMath or Python to spot patterns, then try to prove them.","A good proof is correct, complete and readable. Check each step and ask a colleague to read it critically.","Keep a research notebook with dated ideas, failed attempts and references. Failed attempts often show why a problem is hard.","Use MathSciNet or zbMATH to search reviews of published papers and find related work."],"ex":"Plan for a first-year PhD student: Month 1-3, read 2 surveys and 10 key papers; reproduce one main proof in your own words. Month 4-6, solve a special case of an open question. Discuss weekly with your guide and keep notes in LaTeX.","q":"how to do research in mathematics phd guidance","kw":["literature review","proof writing","arXiv","research problem"]},{"id":"maths-writing-publishing","t":"Writing and Publishing Mathematics","s":"Mathematical results are shared through papers, talks and theses. Clear writing and honest review are part of the work.","n":["Write in LaTeX, the standard for maths papers. Use theorem, lemma and proof environments and number equations.","A paper usually has: abstract, introduction with main results, background, proofs, and references.","Post preprints on arXiv, then submit to a peer-reviewed journal. Check the journal is genuine and not predatory, for example using the UGC-CARE list.","Give talks at seminars and conferences. Explaining results aloud improves the written version.","Credit others properly. Plagiarism and fake data or results end careers; cite all sources you use."],"ex":"Turning a result into a paper: state the main theorem in the introduction, explain why it matters, outline the proof idea in one paragraph, then give full proofs in later sections. Ask two people to read the draft before submitting.","q":"how to write a mathematics research paper latex","kw":["LaTeX","peer review","preprint","UGC-CARE"]},{"id":"number-theory-geometry-frontier","t":"Frontiers: Number Theory and Algebraic Geometry","s":"Modern pure mathematics connects primes, equations and geometry. Many famous open problems live here.","n":["Algebraic number theory studies number fields and their rings of integers, where unique factorisation can fail and is repaired by ideals.","Elliptic curves y^2 = x^3 + ax + b are central. They were key in Wiles' proof of Fermat's Last Theorem (1995).","The Riemann Hypothesis, about zeros of the zeta function, is still open and affects how primes are distributed.","Algebraic geometry studies solution sets of polynomial equations using schemes and sheaves, building on Grothendieck's work.","The Langlands program links number theory, representation theory and geometry, and is an active research area."],"ex":"Example research path: study elliptic curves over Q, learn about their rank (number of independent rational points), then compute ranks of a family of curves with software like PARI/GP or SageMath and look for patterns to prove.","q":"number theory algebraic geometry research overview lecture","kw":["elliptic curves","Riemann hypothesis","Langlands program"]},{"id":"applied-maths-frontier","t":"Frontiers: Applied and Computational Mathematics","s":"Applied research uses maths to model real systems such as climate, epidemics, finance and machine learning.","n":["Mathematical modelling turns a real problem into equations, solves them and checks predictions against data.","Stochastic processes and stochastic differential equations model randomness, used in finance and biology.","Numerical analysis of PDEs studies stability and error of computer solutions, for weather and engineering.","Mathematics of machine learning studies why optimisation and generalisation work, using probability, linear algebra and optimisation.","Epidemic models like SIR use ODEs. Basic reproduction number R0 > 1 means an infection can spread."],"ex":"SIR model: dS/dt = -beta S I, dI/dt = beta S I - gamma I, dR/dt = gamma I (with S, I, R as fractions). With beta = 0.3 and gamma = 0.1 per day, R0 = beta/gamma = 3, so the outbreak can spread.","q":"mathematical modelling stochastic processes research lecture","kw":["mathematical modelling","stochastic processes","SIR model"]},{"id":"formal-proofs","t":"Frontiers: Computer-Assisted and Formal Proofs","s":"Computers now help check and even discover proofs. This is a fast-growing research area.","n":["Proof assistants like Lean, Coq (now Rocq) and Isabelle check every logical step of a proof by computer.","The Lean mathlib library contains a large and growing body of formalised undergraduate and research mathematics.","The Four Colour Theorem (1976) was first proved with heavy computer checking, and later formally verified in Coq.","AI systems are being studied for suggesting proof steps, but every claimed proof still needs checking.","Learning a proof assistant trains very precise thinking and is useful even for pen-and-paper research."],"ex":"In Lean, a statement like 'for all natural numbers n, n + 0 = n' is written as a theorem, and the computer accepts it only after each step is justified. Start with the free 'Natural Number Game' to learn.","q":"lean theorem prover formal proof mathematics introduction","kw":["Lean","formal verification","proof assistant"]}]},"order":0},{"id":"science","name":"Science","nameHi":"विज्ञान","group":"science","blurb":"Science helps us understand food, materials, living things, forces, light and electricity around us by asking questions and testing them.","levels":{"6-8":[{"id":"components-of-food","t":"Components of Food","s":"Our food has nutrients like carbohydrates, proteins, fats, vitamins and minerals that keep the body healthy.","n":["Nutrients (पोषक तत्व) are the useful parts of food. The main ones are carbohydrates, proteins, fats, vitamins and minerals.","Carbohydrates (rice, roti, potato) and fats (ghee, oil, nuts) give us energy. Proteins (dal, milk, eggs) help the body grow and repair.","Vitamins and minerals protect us from diseases. Lack of vitamin C causes scurvy, lack of iodine can cause goitre.","Roughage (fibre) from fruits, vegetables and whole grains helps food move through the stomach. Water is also needed for digestion.","A balanced diet (संतुलित आहार) has all nutrients in the right amount. Eating too little causes deficiency diseases."],"ex":"Test for starch: Take a small piece of potato. Put 2 drops of dilute iodine solution on it. It turns blue-black. Answer: potato contains starch (a carbohydrate). If you try it on a cucumber slice, the colour barely changes, so it has very little starch.","q":"class 6 components of food ncert science hindi","kw":["nutrients","balanced diet","carbohydrates","proteins","deficiency diseases"]},{"id":"separation-of-substances","t":"Separation of Substances","s":"We use simple methods like sieving, filtration and evaporation to separate mixed substances.","n":["A mixture (मिश्रण) has two or more substances mixed together, like sand in water or stones in rice.","Handpicking, winnowing and sieving separate solid pieces by size or weight. Farmers use winnowing to blow husk away from grain.","Sedimentation lets heavy particles settle at the bottom. Decantation means slowly pouring off the clear liquid on top.","Filtration passes a liquid through filter paper or cloth to remove solid particles, like straining tea leaves.","Evaporation (वाष्पीकरण) turns water into vapour by heating, leaving dissolved solids behind. Condensation turns vapour back into liquid."],"ex":"How do we get salt from sea water? Step 1: Sea water is kept in shallow pits near the coast, as in Gujarat. Step 2: Sunlight evaporates the water slowly. Step 3: Salt crystals are left behind. Step 4: Salt is collected and cleaned. Method used: evaporation.","q":"class 6 separation of substances ncert science hindi","kw":["mixture","filtration","evaporation","sedimentation","winnowing"]},{"id":"nutrition-in-plants-animals","t":"Nutrition in Plants and Animals","s":"Plants make their own food using sunlight, while animals eat plants or other animals and digest the food.","n":["Green plants are autotrophs (स्वपोषी). They make food by photosynthesis using carbon dioxide, water, sunlight and green chlorophyll.","Photosynthesis makes glucose (a sugar) and releases oxygen. The glucose is stored as starch in leaves and other parts.","Animals and humans are heterotrophs (परपोषी). They depend on plants or other animals for food.","In humans, digestion starts in the mouth, continues in the stomach and finishes in the small intestine. Digested food is absorbed into blood.","Some plants are different: Cuscuta (amarbel) is a parasite, and pitcher plant traps insects for extra nutrients."],"ex":"Word equation of photosynthesis: carbon dioxide + water, in the presence of sunlight and chlorophyll, gives glucose + oxygen. Check it: cover part of a leaf with black paper for 2 days, then do the iodine test. The covered part does not turn blue-black, because without light no starch was made.","q":"class 7 nutrition in plants nutrition in animals ncert hindi","kw":["photosynthesis","autotroph","heterotroph","digestion","chlorophyll"]},{"id":"metals-and-nonmetals-basic","t":"Metals and Non-metals","s":"Metals are shiny, strong and conduct electricity; non-metals are usually dull, brittle and poor conductors.","n":["Metals (धातु) like iron, copper and aluminium are lustrous (shiny), malleable (can be beaten into sheets) and ductile (can be drawn into wires).","Metals conduct heat and electricity well. That is why cooking pans and electric wires are made of metals.","Non-metals (अधातु) like sulphur, carbon and oxygen are usually dull and brittle. Most do not conduct electricity. Graphite is an exception.","Metal oxides are basic, non-metal oxides are acidic. Magnesium burns to form magnesium oxide, which turns red litmus blue.","A more reactive metal can push out a less reactive metal from its salt solution. This is called a displacement reaction."],"ex":"Put an iron nail in blue copper sulphate solution for some time. The solution turns light green and a brown coating forms on the nail. Equation: Fe + CuSO4 -> FeSO4 + Cu. Answer: iron is more reactive than copper, so it displaces copper.","q":"class 8 materials metals and non metals ncert science hindi","kw":["metals","non-metals","malleable","ductile","displacement reaction"]},{"id":"motion-and-time","t":"Motion and Time","s":"Speed tells how fast something moves: distance travelled divided by the time taken.","n":["Motion (गति) means change in position with time. A moving bus, a swinging pendulum and a spinning fan all show motion.","Speed = distance / time. Its SI unit is metre per second (m/s). On roads we often use kilometre per hour (km/h).","Motion in a straight line is linear, motion around a circle is circular, and to-and-fro motion like a swing is periodic.","Time is measured with clocks. A simple pendulum takes the same time for each swing, so old clocks used pendulums.","A distance-time graph shows motion. A straight sloping line means the object moves with constant speed."],"ex":"A bus travels 120 km between two towns in 3 hours. Find its speed. Speed = distance / time = 120 km / 3 h = 40 km/h. In m/s: 40 x 1000 m / 3600 s = 11.1 m/s (approx). Answer: 40 km/h.","q":"class 7 motion and time speed ncert science hindi","kw":["speed","motion","distance","time","pendulum"]},{"id":"light-shadows-reflection","t":"Light, Shadows and Reflection","s":"Light travels in straight lines, makes shadows when blocked, and bounces back from shiny surfaces like mirrors.","n":["Light comes from luminous objects like the Sun or a bulb. The Moon is not luminous, it reflects sunlight.","Light travels in a straight line. When an opaque object blocks it, a shadow (छाया) forms behind the object.","Reflection (परावर्तन) is the bouncing back of light. Law of reflection: angle of incidence equals angle of reflection.","A plane mirror forms an image that is upright, the same size, and as far behind the mirror as the object is in front.","In a mirror, left and right appear swapped. This is called lateral inversion. That is why AMBULANCE is written in reverse on vehicles."],"ex":"You stand 2 m in front of a plane mirror. Where is your image? Image distance = object distance = 2 m behind the mirror. Distance between you and your image = 2 m + 2 m = 4 m. If you step 1 m closer, the gap becomes 1 + 1 = 2 m.","q":"class 8 light reflection plane mirror ncert science hindi","kw":["reflection","shadow","plane mirror","lateral inversion","light"]},{"id":"electricity-and-magnets","t":"Electric Circuits and Magnets","s":"A bulb glows only in a closed circuit, and a magnet attracts iron and always points north-south.","n":["An electric cell has a positive (+) and negative (-) terminal. A circuit (परिपथ) is a closed path for current to flow.","A switch opens or closes the circuit. Conductors like copper let current pass; insulators like rubber and plastic do not.","Electric current has heating and magnetic effects. A heater coil gets hot; a wire carrying current can move a compass needle.","A magnet (चुम्बक) has a north and a south pole. Like poles repel each other, unlike poles attract.","A freely hanging magnet always rests in the north-south direction. A compass uses this to show direction."],"ex":"Which will light the bulb: a circuit with an iron key, or with a plastic scale placed in the gap? Step 1: Iron is a metal, a conductor. Step 2: Plastic is an insulator. Answer: the bulb glows with the iron key and stays off with the plastic scale.","q":"class 6 electricity and circuits fun with magnets ncert hindi","kw":["electric circuit","conductor","insulator","magnet","compass"]},{"id":"environment-pollution","t":"Environment, Pollution and Conservation","s":"Clean air, water and forests keep us alive, and we must reduce pollution and protect plants and animals.","n":["Our environment (पर्यावरण) includes air, water, soil, plants and animals. All of them depend on each other.","Air pollution comes from vehicle smoke, factories and burning crop stubble. It causes breathing problems and smog.","Water pollution comes from sewage, factory waste and plastic. Drinking dirty water spreads diseases like cholera and typhoid.","Cutting forests (deforestation) causes soil erosion, floods and loss of animal homes. Sanctuaries and national parks protect wildlife.","We can help by the 3 Rs: Reduce, Reuse, Recycle, by saving water, and by planting trees."],"ex":"A family uses 4 plastic bags every day. In one year: 4 x 365 = 1460 bags. If they carry a cloth bag instead, all 1460 bags are saved from landfills and drains. That is the Reduce step of the 3 Rs in action.","q":"class 8 pollution of air and water conservation of plants and animals ncert hindi","kw":["pollution","conservation","deforestation","3 Rs","environment"]}],"9-10":[{"id":"atoms-and-molecules","t":"Atoms, Molecules and the Mole","s":"All matter is made of tiny atoms, which join to form molecules; we count them using the mole.","n":["An atom (परमाणु) is the smallest particle of an element. A molecule is two or more atoms joined, like H2O or O2.","Atomic mass is measured in atomic mass units (u). Hydrogen is about 1 u, carbon 12 u, oxygen 16 u.","Molecular mass is the sum of atomic masses. For H2O: 2 x 1 + 16 = 18 u.","One mole (मोल) of anything contains 6.022 x 10^23 particles. This number is called Avogadro's number.","Mass of 1 mole in grams equals the molecular mass. So 1 mole of water weighs 18 g. Moles = given mass / molar mass."],"ex":"How many molecules are in 36 g of water? Step 1: Molar mass of H2O = 18 g/mol. Step 2: Moles = 36 g / 18 g/mol = 2 mol. Step 3: Molecules = 2 x 6.022 x 10^23 = 1.2044 x 10^24. Answer: about 1.2 x 10^24 molecules.","q":"class 9 atoms and molecules mole concept ncert hindi","kw":["atom","molecule","mole","Avogadro number","molecular mass"]},{"id":"cells-and-tissues","t":"Cells and Tissues","s":"The cell is the basic unit of life; similar cells group together to form tissues that do one job.","n":["All living things are made of cells (कोशिका).
