थि का पता चल सकता है।"],"ex":"अभ्यास: एक श्लोक की तीन प्रतियों में 'धर्मः' / 'धर्मम्' / 'कर्म' मिले। छन्द, व्याकरण, प्रसंग और प्रतियों की आयु देखकर सही पाठ चुनें, और बाकी को पाद-टिप्पणी में पाठ-भेद के रूप में दर्ज करें।","q":"पाण्डुलिपि विज्ञान पाठ सम्पादन critical edition sanskrit","kw":["पाण्डुलिपि","पाठ-सम्पादन","पाठ-भेद","critical edition"]},{"id":"digital-sanskrit","t":"डिजिटल संस्कृत और कम्प्यूटेशनल भाषाविज्ञान","s":"कम्प्यूटर से संस्कृत ग्रंथों का विश्लेषण आज शोध का तेज़ी से बढ़ता क्षेत्र है।","n":["पाणिनि का नियम-आधारित व्याकरण कम्प्यूटर प्रोग्राम जैसा व्यवस्थित है, इसलिए यह कम्प्यूटेशनल शोध में रुचि का विषय है।","ऑनलाइन मुफ़्त संसाधन: GRETIL (ग्रंथ पाठ), Digital Corpus of Sanskrit, Sanskrit Heritage Site (संधि-विच्छेद, शब्द विश्लेषण)।","शोध विषय: स्वचालित संधि-विच्छेद, समास विश्लेषण, संस्कृत OCR, मशीन अनुवाद।","डिजिटल पाठ में गलतियाँ हो सकती हैं; हमेशा मुद्रित समालोचनात्मक संस्करण से मिलाएँ।","Python जैसी मुफ़्त भाषा सीखकर शब्द-गणना और पाठ-तुलना की जा सकती है।"],"ex":"छोटी परियोजना: मेघदूत का डिजिटल पाठ लेकर गिनें कि 'मेघ' शब्द और उसके पर्याय (जलद, अम्बुद) कितनी बार आते हैं। फिर विश्लेषण करें कि कवि ने अलग पर्याय कहाँ और क्यों चुने।","q":"computational sanskrit digital humanities panini NLP","kw":["डिजिटल संस्कृत","GRETIL","कम्प्यूटेशनल","संधि-विच्छेद"]},{"id":"antarvishayak-shodh","t":"अंतर्विषयक शोध: शास्त्र और विज्ञान","s":"संस्कृत ग्रंथों में गणित, आयुर्वेद, खगोल, वास्तु जैसे विषय हैं, जिन पर अंतर्विषयक शोध होता है।","n":["गणित और खगोल: आर्यभट (आर्यभटीय), ब्रह्मगुप्त, भास्कराचार्य (लीलावती)।","आयुर्वेद: चरकसंहिता, सुश्रुतसंहिता (शल्य चिकित्सा का वर्णन)।","ऐसे शोध में संस्कृत के साथ उस विषय का आधुनिक ज्ञान भी ज़रूरी है; विशेषज्ञ सह-निर्देशक रखें।","बढ़ा-चढ़ाकर दावे करने से बचें। ग्रंथ में जो लिखा है और आज का विज्ञान जो कहता है, दोनों को ईमानदारी से अलग रखें।","भारतीय ज्ञान परम्परा (IKS) से जुड़े शोध के नए अवसर भी बन रहे हैं।"],"ex":"लीलावती का एक प्रश्न लें: किसी समकोण त्रिभुज की दो भुजाएँ देकर कर्ण पूछा गया हो। शोध में दिखाएँ कि भास्कराचार्य की विधि क्या थी, वह आज के पाइथागोरस प्रमेय से कैसे मेल खाती है, और गणना करके उत्तर जाँचें।","q":"Indian knowledge systems sanskrit science research Lilavati Aryabhata","kw":["अंतर्विषयक","आयुर्वेद","लीलावती","IKS"]},{"id":"lekhan-prakashan-sanskrit","t":"शोध-प्रबंध लेखन और प्रकाशन","s":"अच्छा शोध-प्रबंध स्पष्ट तर्क, सही उद्धरण और ईमानदार संदर्भ पर टिका होता है।","n":["ढाँचा: भूमिका, पूर्व शोध की समीक्षा, अध्याय, उपसंहार, संदर्भ ग्रंथ सूची, परिशिष्ट।","संस्कृत उद्धरण के साथ ग्रंथ, अध्याय/सर्ग और श्लोक संख्या दें, जैसे (रघुवंशम् 1.1)।","रोमन लिप्यंतरण में IAST पद्धति प्रयोग करें, ताकि विदेशी विद्वान भी पढ़ सकें।","UGC-CARE सूची वाली पत्रिकाओं में लेख भेजें; फ़र्ज़ी पत्रिकाओं से बचें।","UGC के 2018 के साहित्यिक चोरी संबंधी नियमों का पालन करें; दूसरों के अनुवाद भी स्रोत सहित दें।"],"ex":"IAST उदाहरण: 'वाक्यं रसात्मकं काव्यम्' को रोमन में 'vākyaṃ rasātmakaṃ kāvyam' लिखते हैं। संदर्भ: साहित्यदर्पण 1.3। इससे हर पाठक मूल स्थान तक पहुँच सकता है।","q":"PhD thesis writing sanskrit IAST transliteration citation","kw":["शोध-प्रबंध","IAST","UGC-CARE","उद्धरण"]}]},"order":14},{"id":"accountancy","name":"Accountancy","nameHi":"लेखाशास्त्र","group":"commerce","blurb":"Accountancy teaches how to record, sort and report every money transaction of a business so anyone can see its true position.","levels":{"11-12":[{"id":"journal-ledger","t":"Journal and Ledger","s":"Every transaction is first written in the journal, then sorted account-wise in the ledger.","n":["A transaction is any money event, like buying goods or paying rent. Each one has two sides, so we use double entry (दोहरी प्रविष्टि).","The journal (रोज़नामचा) is the book of first entry. Transactions are written date-wise with a debit (Dr) side and a credit (Cr) side.","Golden rules: Personal account - debit the receiver, credit the giver. Real account - debit what comes in, credit what goes out. Nominal account - debit expenses and losses, credit incomes and gains.","In every entry, total debit must equal total credit. This is why the books stay balanced.","The ledger (खाता बही) collects all entries of one account in one place, for example the Cash Account, so we can find its balance."],"ex":"Ramesh starts a shop with cash Rs 50,000 and buys goods for Rs 10,000 cash. Entry 1: Cash A/c Dr 50,000; To Capital A/c 50,000. Entry 2: Purchases A/c Dr 10,000; To Cash A/c 10,000. Cash ledger balance = 50,000 - 10,000 = Rs 40,000 (debit).","q":"class 11 accountancy journal entries and ledger posting hindi","kw":["journal","ledger","double entry","golden rules","debit credit"]},{"id":"trial-balance-brs","t":"Trial Balance and Bank Reconciliation","s":"A trial balance checks that all debit balances equal all credit balances in the ledger.","n":["A trial balance (तलपट) is a list of all ledger balances on one date, debit balances in one column and credit balances in another.","If both totals match, the books are arithmetically correct. But some errors, like a fully missed entry, still hide inside a matching trial balance.","If totals do not match, the difference is put in a Suspense Account until the error is found and corrected.","A Bank Reconciliation Statement (BRS) explains why the cash book bank balance differs from the bank passbook, for example cheques issued but not yet presented."],"ex":"Ramesh's balances: Cash Rs 40,000 (Dr), Purchases Rs 10,000 (Dr), Capital Rs 50,000 (Cr). Debit total = 40,000 + 10,000 = 50,000. Credit total = 50,000. Both totals are equal, so the trial balance agrees.","q":"class 11 accountancy trial balance and bank reconciliation statement hindi","kw":["trial balance","suspense account","bank reconciliation","BRS"]},{"id":"depreciation","t":"Depreciation","s":"Depreciation is the fall in value of a fixed asset because of use, wear and passing time.","n":["Machines, vehicles and furniture lose value every year. Spreading this loss over the asset's life is called depreciation (मूल्यह्रास).","Straight Line Method (SLM): the same amount every year. Formula: (Cost - Scrap value) / Useful life.","Written Down Value Method (WDV): a fixed rate on the reduced book value, so the amount becomes smaller each year.","Depreciation is an expense in the Profit and Loss Account, though no cash goes out for it.","Provision for doubtful debts and reserves are also studied in this chapter to keep profits realistic."],"ex":"Machine cost Rs 1,00,000, scrap value Rs 10,000, life 5 years. SLM = (1,00,000 - 10,000) / 5 = Rs 18,000 per year. WDV at 10%: Year 1 = 10% of 1,00,000 = Rs 10,000; Year 2 = 10% of 90,000 = Rs 9,000.","q":"class 11 accountancy depreciation straight line and written down value method hindi","kw":["depreciation","straight line method","written down value","scrap value"]},{"id":"final-accounts","t":"Final Accounts (Financial Statements)","s":"Final accounts show a business's profit for the year and its position on the last day.","n":["The Trading Account finds gross profit: Sales minus Cost of goods sold.","Cost of goods sold = Opening stock + Purchases + Direct expenses - Closing stock.","The Profit and Loss Account subtracts indirect expenses like rent and salary from gross profit to get net profit (शुद्ध लाभ).","The Balance Sheet (तुलन पत्र) lists assets on one side and capital plus liabilities on the other. Both sides must be equal.","Adjustments like closing stock, outstanding expenses and prepaid expenses are added at year end to show a true picture."],"ex":"Sales Rs 2,00,000. Opening stock 20,000 + Purchases 1,20,000 - Closing stock 30,000 = Cost of goods sold Rs 1,10,000. Gross profit = 2,00,000 - 1,10,000 = Rs 90,000. Indirect expenses Rs 40,000. Net profit = 90,000 - 40,000 = Rs 50,000.","q":"class 11 accountancy final accounts trading profit and loss balance sheet with adjustments hindi","kw":["final accounts","trading account","profit and loss","balance sheet","gross profit"]},{"id":"partnership-accounts","t":"Partnership Accounts","s":"Partnership accounts show how partners share profits, add new partners, and settle when someone leaves.","n":["A partnership is run under the Indian Partnership Act, 1932. The written agreement is called the partnership deed.","If the deed is silent, profits are shared equally and no interest on capital is allowed.","Goodwill (ख्याति) is the value of a firm's good name. One method: Average profit x Number of years' purchase.","When a partner is admitted, retires or dies, assets are revalued and capital accounts are adjusted.","Dissolution means closing the firm. A Realisation Account is opened to sell assets and pay liabilities."],"ex":"A and B share profits 3:2. Profit is Rs 1,00,000. A gets 3/5 x 1,00,000 = Rs 60,000; B gets 2/5 x 1,00,000 = Rs 40,000. Goodwill: profits of 3 years 40,000, 50,000, 60,000. Average = 1,50,000 / 3 = 50,000. At 2 years' purchase, goodwill = Rs 1,00,000.","q":"class 12 accountancy partnership fundamentals goodwill admission retirement hindi","kw":["partnership","partnership deed","goodwill","profit sharing ratio"]},{"id":"company-accounts","t":"Company Accounts: Shares and Debentures","s":"Companies raise money by issuing shares to owners and debentures to lenders, and record these carefully.","n":["A company is a separate legal person under the Companies Act, 2013. Its owners are shareholders.","Shares can be issued at par (face value), or at a premium (above face value). Premium goes to Securities Premium account.","If a shareholder does not pay a call, the company can forfeit (ज़ब्त) the shares and later reissue them.","Debentures are loans taken from the public. Debenture holders get fixed interest, not a share in profit.","Company financial statements follow the format given in Schedule III of the Companies Act, 2013."],"ex":"A company issues 10,000 shares of Rs 10 each at Rs 2 premium, fully paid on application. Entry: Bank A/c Dr 1,20,000; To Share Capital A/c 1,00,000; To Securities Premium A/c 20,000. Debit 1,20,000 = Credit 1,00,000 + 20,000.","q":"class 12 accountancy issue of shares at premium forfeiture journal entries hindi","kw":["share capital","securities premium","forfeiture","debentures","Schedule III"]},{"id":"cash-flow-statement","t":"Cash Flow Statement","s":"A cash flow statement shows where cash came from and where it went during the year.","n":["Profit and cash are different. A business can show profit but still run short of cash.","Cash flows are split into three parts: Operating, Investing and Financing activities. This follows AS 3 / Ind AS 7.","Indirect method: start with net profit, add back non-cash expenses like depreciation, then adjust for changes in working capital.","Increase in debtors or stock reduces cash. Increase in creditors increases cash.","Buying machines is investing outflow. Issuing shares or taking loans is financing inflow."],"ex":"Net profit Rs 80,000. Depreciation Rs 20,000. Debtors increased Rs 10,000. Creditors increased Rs 5,000. Cash from operating activities = 80,000 + 20,000 - 10,000 + 5,000 = Rs 95,000.","q":"class 12 accountancy cash flow statement indirect method operating activities hindi","kw":["cash flow statement","operating activities","investing activities","financing activities"]},{"id":"ratio-analysis","t":"Ratio Analysis","s":"Ratios compare two numbers from the accounts to judge a business's health quickly.","n":["Liquidity ratios check if short-term debts can be paid. Current ratio = Current assets / Current liabilities.","Quick ratio = (Current assets - Inventory - Prepaid expenses) / Current liabilities. It is a stricter test.","Solvency ratios, like Debt-Equity ratio, check long-term safety.","Activity ratios, like Inventory turnover, show how fast stock is sold.","Profitability ratios, like Net profit ratio = Net profit / Revenue x 100, show how well the business earns."],"ex":"Current assets Rs 2,00,000 (including inventory Rs 50,000). Current liabilities Rs 1,00,000. Current ratio = 2,00,000 / 1,00,000 = 2:1. Quick ratio = (2,00,000 - 50,000) / 1,00,000 = 1.5:1.","q":"class 12 accountancy ratio analysis current ratio quick ratio debt equity hindi","kw":["ratio analysis","current ratio","quick ratio","debt equity ratio"]}],"ug":[{"id":"accounting-standards-gaap","t":"Accounting Principles and Standards","s":"Accounting standards are common rules so that all businesses prepare accounts in the same fair way.","n":["Basic concepts: business entity, going concern, accrual, consistency, prudence (conservatism) and matching of costs with revenue.","In India, the ICAI frames Accounting Standards (AS). The government notifies them for companies.","Larger companies follow Ind AS, which are based on international IFRS. Smaller entities follow AS.","Accrual means recording income when earned and expense when incurred, not when cash moves.","Following standards makes accounts comparable year to year and between companies."],"ex":"A shop sells goods worth Rs 30,000 on 28 March but gets paid on 10 April. Under the accrual concept, the Rs 30,000 sale belongs to the year ending 31 March, not the next year.","q":"bcom financial accounting concepts conventions accounting standards hindi","kw":["accounting standards","GAAP","accrual concept","going concern","ICAI"]},{"id":"corporate-accounting","t":"Corporate Accounting","s":"Corporate accounting covers special company events like buyback, redemption, amalgamation and group accounts.","n":["Redemption of preference shares and debentures means paying them back, often from profits moved to a redemption reserve.","Buyback means a company buys back its own shares under the rules of the Companies Act, 2013.","Amalgamation means two or more companies join together. The new or buying company pays a purchase consideration.","Holding company accounts combine a parent with the companies it controls into one set of statements.","Bonus shares are free shares given to existing shareholders out of reserves."],"ex":"A company issues bonus shares of Rs 1,00,000 from General Reserve. Entry: General Reserve A/c Dr 1,00,000; To Bonus to Shareholders A/c 1,00,000. Then Bonus to Shareholders A/c Dr 1,00,000; To Share Capital A/c 1,00,000. Each entry is balanced.","q":"bcom corporate accounting bonus shares buyback amalgamation hindi","kw":["corporate accounting","bonus shares","buyback","amalgamation"]},{"id":"cost-accounting","t":"Cost Accounting","s":"Cost accounting finds the exact cost of making each product or service.","n":["Elements of cost: Material, Labour and Expenses. Each can be direct (traceable to the product) or indirect (overheads).","A cost sheet builds cost step by step: Prime cost, Works cost, Cost of production, Cost of sales.","Overheads are spread over products using a fair base, like machine hours or labour hours.","Inventory methods like FIFO (first in first out) and weighted average decide which purchase price is used.","Cost accounting helps fix selling price and control waste (लागत नियंत्रण)."],"ex":"Material 50,000 + Labour 30,000 + Direct expenses 5,000 = Prime cost Rs 85,000. Add factory overhead 15,000 = Works cost Rs 1,00,000. Add office overhead 10,000 = Cost of production Rs 1,10,000.","q":"bcom cost accounting cost sheet elements of cost hindi","kw":["cost accounting","cost sheet","prime cost","overheads","FIFO"]},{"id":"management-accounting","t":"Management Accounting","s":"Management accounting gives managers numbers to plan, decide and control the business.","n":["Marginal costing separates fixed costs (rent) from variable costs (raw material per unit).","Contribution = Selling price - Variable cost. It first covers fixed cost, then becomes profit.","Break-even point (BEP) = Fixed cost / Contribution per unit. At BEP there is no profit and no loss.","Budgets are money plans for the future. Variance analysis compares actual results with the budget.","Standard costing sets a target cost and studies why the actual cost was higher or lower."],"ex":"Fixed cost Rs 60,000. Selling price Rs 50, variable cost Rs 30 per unit. Contribution = 50 - 30 = Rs 20. BEP = 60,000 / 20 = 3,000 units. BEP sales = 3,000 x 50 = Rs 1,50,000. P/V ratio = 20 / 50 = 40%.","q":"bcom management accounting marginal costing break even point hindi","kw":["management accounting","break-even point","contribution","budgeting","variance"]},{"id":"auditing","t":"Auditing","s":"Auditing is an independent check of accounts to say whether they show a true and fair view.","n":["An auditor examines books, bills and vouchers and then gives an audit report with an opinion.","Company audits are done by a Chartered Accountant, appointed under the Companies Act, 2013.","Vouching means checking each entry against its proof, like an invoice or receipt.","Internal control is the set of checks inside a business to prevent mistakes and fraud.","Opinions can be unmodified (clean), qualified, adverse, or a disclaimer when the auditor cannot get enough evidence."],"ex":"The books show Rs 25,000 paid for repairs. The auditor asks for the repair bill, checks the date, amount and approval, and confirms the payment in the bank statement. This is vouching.","q":"bcom auditing basics vouching internal control audit report hindi","kw":["auditing","vouching","internal control","audit report","true and fair view"]},{"id":"income-tax-basics","t":"Income Tax Basics","s":"Income tax is a direct tax on a person's yearly income, collected by the central government.","n":["Income is grouped under five heads: Salaries, House property, Business or profession, Capital gains, and Other sources.","The income year is called the previous year (now tax year). Tax is paid on it and a return (ITR) is filed.","A new Income-tax Act, 2025 replaces the Income-tax Act, 1961 from April 2026, so always check the current section numbers.","Taxpayers can choose between the new regime (lower rates, few deductions) and the old regime (more deductions). Slabs change through the Budget.","PAN is the tax ID. TDS means tax deducted at source by the payer."],"ex":"Asha earns salary Rs 6,00,000 and bank interest Rs 20,000. Gross total income = 6,00,000 + 20,000 = Rs 6,20,000. If she has Rs 50,000 of allowed deductions, taxable income = 6,20,000 - 50,000 = Rs 5,70,000. Tax is then worked out using that year's slabs.","q":"bcom income tax basics heads of income residential status hindi","kw":["income tax","heads of income","ITR","TDS","tax regime"]},{"id":"gst","t":"Goods and Services Tax (GST)","s":"GST is one tax on supply of goods and services in India, started on 1 July 2017.","n":["GST replaced many older indirect taxes like excise duty, service tax and VAT.","Within one state, CGST and SGST are charged. Between states, IGST is charged.","Input Tax Credit (ITC) lets a business reduce its GST payable by the GST it already paid on purchases.","Rates are decided by the GST Council. Since September 2025, most items fall in 5% or 18%, with a higher rate for some harmful or luxury goods.","Businesses above a turnover limit must register and file regular GST returns."],"ex":"A trader buys goods for Rs 1,000 + 18% GST = Rs 180 paid. He sells them for Rs 1,500 + 18% GST = Rs 270 collected. GST he pays to government = 270 - 180 = Rs 90 after input tax credit.","q":"bcom gst basics input tax credit cgst sgst igst hindi","kw":["GST","input tax credit","CGST","IGST","GST Council"]}],"pg":[{"id":"ind-as-ifrs","t":"Ind AS and IFRS Convergence","s":"Ind AS are India's accounting standards built on the global IFRS framework.","n":["IFRS are issued by the International Accounting Standards Board (IASB) and used in many countries.","India chose convergence, not direct adoption. Ind AS are notified by the Ministry of Corporate Affairs.","Ind AS became mandatory in phases from 2016-17, starting with companies having net worth of Rs 500 crore or more.","Ind AS use more fair value and focus on substance over legal form.","Some Indian carve-outs exist, where Ind AS differ from IFRS to suit local conditions."],"ex":"Under old AS, an investment in shares may stay at cost. Under Ind AS 109, a listed share bought for Rs 1,00,000 and now quoted at Rs 1,30,000 can be shown at fair value Rs 1,30,000, with the Rs 30,000 gain recognised as the standard requires.","q":"ind as vs ifrs convergence india mcom lecture","kw":["Ind AS","IFRS","convergence","fair value","carve-outs"]},{"id":"consolidation","t":"Consolidated Financial Statements","s":"A parent company combines its own accounts with those of companies it controls, as one group.","n":["Ind AS 110 says a parent controls an investee when it has power, exposure to variable returns, and ability to use power to affect returns.","Line items of parent and subsidiary are added together, and inter-company sales and balances are removed.","Non-controlling interest (NCI) is the part of the subsidiary owned by outsiders.","Goodwill = Consideration paid + NCI - Fair value of net assets acquired (Ind AS 103).","Associates (significant influence) are shown using the equity method under Ind AS 28."],"ex":"P buys 80% of S for Rs 10,00,000. S's net assets at fair value are Rs 11,00,000. NCI at proportionate share = 20% x 11,00,000 = Rs 2,20,000. Goodwill = 10,00,000 + 2,20,000 - 11,00,000 = Rs 1,20,000.","q":"consolidated financial statements ind as 110 goodwill non controlling interest lecture","kw":["consolidation","Ind AS 110","goodwill","non-controlling interest"]},{"id":"revenue-recognition","t":"Revenue Recognition (Ind AS 115)","s":"Ind AS 115 gives a five-step model for when and how much revenue to record.","n":["Step 1: identify the contract. Step 2: identify separate performance obligations (promises).","Step 3: find the transaction price. Step 4: allocate it to each obligation by standalone selling price.","Step 5: recognise revenue when or as each obligation is satisfied.","Revenue can be at a point in time (handing over a phone) or over time (a one-year service).","Ind AS 115 matches the global standard IFRS 15."],"ex":"A phone with 1-year service is sold for Rs 22,000. Standalone prices: phone Rs 20,000, service Rs 4,000, total 24,000. Phone revenue = 22,000 x 20/24 = Rs 18,333 now. Service = 22,000 x 4/24 = Rs 3,667, spread over 12 months. Total = 22,000.","q":"ind as 115 revenue from contracts with customers five step model lecture","kw":["Ind AS 115","IFRS 15","performance obligation","revenue recognition"]},{"id":"leases-financial-instruments","t":"Leases and Financial Instruments","s":"Ind AS 116 brings most leases onto the balance sheet; Ind AS 109 governs financial assets and liabilities.","n":["Under Ind AS 116, a lessee records a right-of-use asset and a lease liability for most leases.","The lease liability is the present value of future lease payments, discounted at a suitable rate.","Each year the lessee charges depreciation on the asset and interest on the liability.","Ind AS 109 classifies financial assets at amortised cost, fair value through OCI, or fair value through profit or loss.","Ind AS 109 uses an expected credit loss model, so losses are provided before a default happens."],"ex":"Lease rent Rs 1,00,000 at each year end for 3 years, rate 10%. Annuity factor = 0.9091 + 0.8264 + 0.7513 = 2.4868. Lease liability = 1,00,000 x 2.4868 = Rs 2,48,680. Year 1 interest = 10% x 2,48,680 = Rs 24,868.","q":"ind as 116 leases right of use asset lease liability calculation lecture","kw":["Ind AS 116","right-of-use asset","lease liability","Ind AS 109","expected credit loss"]},{"id":"strategic-cost-management","t":"Strategic Cost Management","s":"Modern costing tools like activity-based costing help firms price better and cut waste.","n":["Activity-Based Costing (ABC) assigns overheads by activities, like machine setups or inspections, not just labour hours.","A cost driver is what causes an activity's cost, such as number of setups.","Target costing starts from the market price, subtracts desired profit, and designs the product to meet that cost.","Life cycle costing looks at total cost from design to disposal.","Balanced Scorecard measures performance on finance, customer, internal process, and learning."],"ex":"Setup cost pool Rs 1,00,000 for 50 setups. Rate = 1,00,000 / 50 = Rs 2,000 per setup. Product A uses 30 setups: 30 x 2,000 = Rs 60,000. Product B uses 20: 20 x 2,000 = Rs 40,000. Total = Rs 1,00,000.","q":"activity based costing target costing strategic cost management mcom","kw":["activity-based costing","cost driver","target costing","balanced scorecard"]},{"id":"financial-reporting-analysis","t":"Financial Statement Analysis and Reporting Quality","s":"Analysts read financial statements deeply to judge performance, quality of earnings and hidden risks.","n":["DuPont analysis breaks Return on Equity into Profit margin x Asset turnover x Equity multiplier.","Quality of earnings is high when profit is backed by operating cash flow.","Notes to accounts, related party transactions and contingent liabilities often hold important warnings.","Segment reporting shows how each business line performs.","Comparing trends over years and with peers gives better insight than one year alone."],"ex":"Net profit Rs 10 lakh, Sales Rs 100 lakh, Assets Rs 50 lakh, Equity Rs 25 lakh. Margin = 10%. Asset turnover = 100/50 = 2. Equity multiplier = 50/25 = 2. ROE = 10% x 2 x 2 = 40%. Check: 10/25 = 40%.","q":"dupont analysis return on equity financial statement analysis mcom","kw":["DuPont analysis","return on equity","quality of earnings","financial analysis"]},{"id":"forensic-accounting","t":"Forensic Accounting and Fraud","s":"Forensic accounting uses accounting and investigation skills to find and prove financial fraud.","n":["Common frauds: fake sales, hidden liabilities, inflated cash balances, and money moved to related parties.","The fraud triangle says fraud needs pressure, opportunity, and rationalisation.","Tools include data analytics, Benford's law (expected pattern of first digits), and tracing funds.","In India, the Satyam case (2009) showed how fake cash and bank balances can mislead investors for years.","Strong internal controls, independent audit and whistle-blower systems reduce fraud."],"ex":"A forensic accountant sees sales jump 40% but cash from operations fall and debtors double. Many new customers share one address. These red flags suggest fake sales, so she confirms balances directly with customers.","q":"forensic accounting fraud triangle red flags case study lecture","kw":["forensic accounting","fraud triangle","Benford's law","red flags"]}],"phd":[{"id":"accounting-research-methods","t":"Research Methods in Accounting","s":"Accounting research uses archival data, experiments, surveys and case studies to answer questions about reporting and markets.","n":["Archival research uses large datasets like company financials and stock prices, often with regression.","Experimental research tests how managers, auditors or investors decide in controlled settings.","Survey and field or case studies give deep insight into practice inside firms.","Indian data sources include company annual reports, exchange filings and commercial databases like CMIE Prowess.","Good research states a clear question, theory, hypothesis, and identification strategy."],"ex":"Question: Do Indian firms with more independent directors report fewer restatements? A researcher collects 10 years of listed firm data, runs a regression of restatements on board independence, and controls for firm size and industry.","q":"accounting research methods archival experimental phd lecture","kw":["accounting research","archival research","regression","research design"]},{"id":"earnings-management","t":"Earnings Management Research","s":"Studies how and why managers shape reported profits using accounting choices or real decisions.","n":["Accrual-based earnings management uses estimates, like provisions, to move profit between years.","Real earnings management changes actual actions, like cutting research spending or pushing sales with discounts.","Researchers estimate discretionary accruals using models such as the Jones model and Modified Jones model.","Total accruals = Net income - Cash from operations. The unexplained part is called discretionary.","Motives include meeting targets, bonus plans, debt covenants and share issues."],"ex":"A firm reports net income Rs 50 crore and operating cash flow Rs 30 crore. Total accruals = 50 - 30 = Rs 20 crore. If the model predicts normal accruals of Rs 12 crore, discretionary accruals = 20 - 12 = Rs 8 crore.","q":"earnings management discretionary accruals jones model lecture","kw":["earnings management","discretionary accruals","Jones model","real earnings management"]},{"id":"capital-markets-accounting","t":"Capital Markets Research in Accounting","s":"This area tests how accounting information affects share prices and investor decisions.","n":["Ball and Brown (1968) showed that share prices react to earnings news, starting modern capital markets research.","Value relevance studies check whether accounting numbers explain share prices or returns.","Event studies measure abnormal returns around announcements like earnings or audit opinions.","Topics include earnings response coefficients, analyst forecasts and disclosure quality."],"ex":"Around a quarterly result, a stock rises 4% while the market model expects 1%. Abnormal return = 4% - 1% = 3%. Averaging across many firms shows how strongly investors react to earnings surprises.","q":"capital market research in accounting value relevance event study lecture","kw":["value relevance","event study","Ball and Brown","earnings response"]},{"id":"sustainability-reporting","t":"Sustainability and ESG Reporting","s":"Research on how firms report environmental, social and governance (ESG) information and whether it is reliable.","n":["SEBI requires the top 1,000 listed companies by market value to file a Business Responsibility and Sustainability Report (BRSR).","Globally, the ISSB issued IFRS S1 and S2 sustainability standards in 2023.","Research questions: does ESG disclosure lower cost of capital, or is it greenwashing?","Assurance of ESG data, carbon accounting and integrated reporting are active areas."],"ex":"A researcher compares Indian firms before and after BRSR became mandatory, testing whether analyst forecast errors fell for firms that had to newly disclose ESG data.","q":"esg sustainability reporting brsr research lecture","kw":["ESG","BRSR","sustainability reporting","ISSB","greenwashing"]},{"id":"audit-and-technology","t":"Audit Quality and Technology","s":"Research on what makes audits reliable and how data analytics and AI are changing accounting and audit.","n":["Audit quality proxies include restatements, going-concern opinions and discretionary accruals.","Studies examine auditor rotation, audit fees, and regulator inspections. In India, NFRA oversees auditors of certain large companies.","Data analytics lets auditors test full populations instead of small samples.","AI, blockchain and continuous auditing raise new questions on judgment, evidence and ethics."],"ex":"After mandatory audit firm rotation under the Companies Act, 2013, a study compares audit quality of firms that changed auditors with firms that did not, using restatements as the outcome.","q":"audit quality research auditor rotation data analytics phd","kw":["audit quality","auditor rotation","NFRA","audit analytics"]}]},"order":15},{"id":"commerce","name":"Business Studies & Commerce","nameHi":"वाणिज्य","group":"commerce","blurb":"Commerce explains how goods and services are made, bought, sold and managed, and how businesses are run fairly.","levels":{"9-10":[{"id":"sectors-of-economy","t":"Sectors of the Indian Economy","s":"All economic work falls into three sectors: primary, secondary and tertiary.","n":["Primary sector (प्राथमिक क्षेत्र) uses natural resources directly, like farming, fishing and mining.","Secondary sector turns raw materials into goods, like a factory making cloth from cotton.","Tertiary or service sector supports the others, like transport, banks, shops, schools and hospitals.","Organised sector work has fixed hours, regular pay and benefits. Unorganised sector work often has none of these.","MGNREGA 2005 promises up to 100 days of paid work a year to rural households who ask for it."],"ex":"A farmer grows cotton (primary). A mill spins it into cloth (secondary). A truck carries the cloth and a shop sells it (tertiary). One shirt touches all three sectors.","q":"class 10 economics sectors of indian economy ncert hindi","kw":["primary sector","secondary sector","tertiary sector","organised sector"]},{"id":"money-and-credit","t":"Money and Credit","s":"Money makes buying easy, and credit means borrowing money now and paying back later.","n":["Barter means exchanging goods directly. It needs double coincidence of wants, which is hard. Money solves this.","Credit (ऋण) is a loan. The terms of credit include interest rate, collateral, paperwork and repayment time.","Formal sources like banks and cooperatives are regulated by the RBI and usually charge fair interest.","Informal sources like moneylenders often charge very high interest and can trap poor families in debt.","Self Help Groups (SHGs) help rural women save together and take small loans without collateral."],"ex":"Sita borrows Rs 10,000. A bank charges 12% a year: interest = Rs 1,200. A moneylender charges 5% a month: 60% a year = Rs 6,000. The formal loan saves her Rs 4,800.","q":"class 10 economics money and credit ncert hindi","kw":["money","credit","collateral","self help group","formal credit"]},{"id":"consumer-rights","t":"Consumer Rights","s":"Every buyer has legal rights to safe goods, correct information and a fair hearing.","n":["Consumer rights include the right to safety, to be informed, to choose, to be heard, to seek redress, and to consumer education.","The Consumer Protection Act, 2019 replaced the 1986 Act and also covers online shopping.","Complaints go to District, State or National Consumer Commissions depending on the value of the claim. Online filing is possible on e-Daakhil.","The National Consumer Helpline number is 1915. National Consumers Day is on 24 December.","Always take a bill. Without a bill, proving your complaint is hard."],"ex":"Ravi buys a mixer for Rs 3,000 with a one-year warranty. It stops working in two months and the shop refuses repair. He keeps his bill, calls 1915, and if needed files a complaint in the District Commission.","q":"class 10 economics consumer rights ncert consumer protection act 2019 hindi","kw":["consumer rights","Consumer Protection Act 2019","consumer commission","1915 helpline"]},{"id":"standard-marks","t":"Quality Marks and Smart Buying","s":"Quality marks, MRP and expiry dates help consumers buy safe and fairly priced goods.","n":["ISI mark (from BIS) shows an industrial product meets Indian standards, like electrical items.","Agmark is for farm products like spices and ghee. FSSAI licence number appears on packaged food.","BIS hallmark shows the purity of gold and silver jewellery.","MRP is the maximum retail price including taxes. A shop cannot charge more than MRP.","Check the expiry date, net weight and the full address of the maker before buying."],"ex":"A cold drink bottle says MRP Rs 40. The shopkeeper asks Rs 45 because it is chilled. Charging above MRP is not allowed, so the buyer can refuse and complain to the consumer helpline.","q":"consumer awareness isi mark agmark hallmark mrp class 10","kw":["ISI mark","Agmark","hallmark","MRP","FSSAI"]},{"id":"globalisation-trade","t":"Globalisation and Trade","s":"Globalisation means countries are linked through trade, investment and technology.","n":["Multinational corporations (MNCs) own or control production in more than one country.","Foreign trade lets buyers get goods from other countries and producers sell to bigger markets.","In 1991, India began liberalisation by reducing trade barriers and opening to foreign investment.","The World Trade Organization (WTO) sets rules for international trade.","Globalisation brought more choice but also more competition for small producers."],"ex":"A phone may be designed in one country, its chips made in another, and it may be assembled in India and sold across the world. This chain is a simple picture of globalisation.","q":"class 10 economics globalisation and the indian economy ncert hindi","kw":["globalisation","MNC","liberalisation","WTO","foreign trade"]},{"id":"trade-basics","t":"Trade and Business Basics","s":"Trade is buying and selling, done locally, across the country, or with other countries.","n":["Internal trade happens inside the country. It can be wholesale (large quantity) or retail (small quantity to final buyers).","External trade is between countries: import (buying from abroad), export (selling abroad), and entrepot (import to re-export).","Middlemen like wholesalers and retailers link producers and consumers.","Profit = Selling price - Cost price. A loss happens when selling price is lower.","Honest weighing, correct bills and fair prices build long-term customers."],"ex":"A shopkeeper buys 10 kg rice at Rs 40 per kg (cost Rs 400) and sells at Rs 48 per kg (Rs 480). Profit = 480 - 400 = Rs 80. Profit percent = 80 / 400 x 100 = 20%.","q":"internal and external trade wholesale retail basics hindi class 9 10","kw":["trade","wholesale","retail","import export","profit"]}],"11-12":[{"id":"nature-of-business","t":"Nature and Purpose of Business","s":"Business means regularly producing or selling goods and services to earn profit while meeting people's needs.","n":["Economic activities are of three kinds: business, profession (doctor, lawyer), and employment (job).","Business has three parts: industry (making), commerce (trade plus aids to trade), and services.","Aids to trade include transport, banking, insurance, warehousing and advertising.","Business objectives are not only profit. They include growth, innovation, and social responsibility.","Business risk comes from uncertain events like price changes, natural disasters or new competitors."],"ex":"A dairy collects milk from farmers (industry), a truck carries packets to towns (transport), a bank gives it a loan (banking), and shops sell the milk (trade). Together this is commerce.","q":"class 11 business studies nature and purpose of business ncert hindi","kw":["business","commerce","aids to trade","business risk"]},{"id":"forms-of-business","t":"Forms of Business Organisation","s":"A business can be owned by one person, a few partners, a family, members, or shareholders.","n":["Sole proprietorship: one owner, full control, but unlimited liability (personal assets can be used to pay debts).","Partnership: two or more people under the Indian Partnership Act, 1932. An LLP gives partners limited liability.","Joint Hindu Family business is run by the Karta, with family members as co-parceners.","Cooperative society: members join to help each other, like Amul for dairy farmers. One member, one vote.","Company: separate legal entity under the Companies Act, 2013, owners have limited liability. Can be private, public or One Person Company."],"ex":"Meena runs a tailoring shop alone (sole proprietor). She and her friend open a boutique together (partnership). Later they register a private company to raise money from investors (company).","q":"class 11 business studies forms of business organisation ncert hindi","kw":["sole proprietorship","partnership","cooperative","company","limited liability"]},{"id":"business-services-ebusiness","t":"Business Services and E-Business","s":"Banking, insurance, transport, warehousing and the internet help businesses run smoothly.","n":["Banks give loans, accept deposits and handle payments like NEFT, RTGS and UPI.","Insurance works on principles like utmost good faith, insurable interest and indemnity.","Warehousing stores goods safely until they are needed.","E-business uses the internet for buying, selling and dealing with customers and suppliers. B2B, B2C and C2C are common types.","Online business needs safety: secure payments, data privacy and protection from fraud."],"ex":"A small Jaipur handicraft seller lists products online (B2C), receives payment by UPI, ships through a courier, and insures the stock in her godown against fire.","q":"class 11 business studies business services e business ncert hindi","kw":["business services","insurance principles","e-business","B2B","B2C"]},{"id":"principles-of-management","t":"Management and Its Principles","s":"Management means getting work done through people efficiently and effectively.","n":["Effective means finishing the work on time. Efficient means doing it with least cost and waste.","Henri Fayol gave 14 principles, such as division of work, unity of command, and scalar chain.","F.W. Taylor's scientific management used work study to find the one best way to do a job.","Levels of management: top (CEO), middle (department heads) and lower or supervisory (foremen).","Management is called an art, a science and a profession in different ways."],"ex":"In a factory, a worker gets orders from two bosses and gets confused. Fayol's unity of command says each worker should report to only one boss, so the problem is solved by fixing one supervisor.","q":"class 12 business studies principles of management fayol taylor ncert hindi","kw":["management","Fayol","Taylor","scientific management","unity of command"]},{"id":"functions-of-management","t":"Functions of Management","s":"Managers plan, organise, staff, direct and control to reach the goals of the business.","n":["Planning: deciding in advance what to do and how. Organising: dividing work and giving authority.","Staffing: hiring, training and keeping the right people.","Directing: guiding people through supervision, motivation, leadership and communication. Maslow's need hierarchy explains motivation.","Controlling: comparing actual work with the plan and fixing gaps.","These functions form a cycle and happen at every level of management."],"ex":"A bakery plans to sell 500 cakes a week (planning), divides baking and delivery tasks (organising), hires two bakers (staffing), motivates them with bonus (directing), and checks weekly sales against 500 (controlling).","q":"class 12 business studies planning organising staffing directing controlling hindi","kw":["planning","organising","staffing","directing","controlling"]},{"id":"business-environment","t":"Business Environment","s":"Business environment is all the outside forces, like economy, laws and technology, that affect a business.","n":["Its parts are economic, social, technological, political and legal environments.","In 1991, India launched the New Economic Policy based on Liberalisation, Privatisation and Globalisation (LPG).","In November 2016, Rs 500 and Rs 1,000 notes were demonetised to fight black money and promote digital payments.","GST started on 1 July 2017 and created one national market for goods and services.","Businesses that watch their environment can spot new chances and early warnings."],"ex":"After demonetisation, many small shops started accepting UPI payments. Shops that adapted quickly kept their customers, which shows why tracking the environment matters.","q":"class 12 business studies business environment LPG demonetisation ncert hindi","kw":["business environment","LPG reforms","liberalisation","demonetisation"]},{"id":"financial-management-markets","t":"Financial Management and Markets","s":"Financial management is about raising money, investing it wisely and sharing profits.","n":["Three key decisions: investment decision (where to use money), financing decision (how to raise it), and dividend decision (how much profit to share).","Fixed capital buys long-term assets. Working capital runs daily operations.","Money market deals in short-term funds (up to one year). Capital market deals in long-term funds like shares and bonds.","Primary market is where new shares are issued; secondary market (stock exchange) is where existing shares are traded.","SEBI, set up in 1988 and made statutory in 1992, regulates the securities market and protects investors."],"ex":"A company needs Rs 5 crore for a new plant. It can issue shares (owner's funds) or take a loan (borrowed funds). Choosing the mix is the financing decision.","q":"class 12 business studies financial management financial markets sebi ncert hindi","kw":["financial management","capital market","money market","SEBI","stock exchange"]},{"id":"marketing","t":"Marketing","s":"Marketing means understanding what customers need and delivering it at a profit.","n":["Marketing mix has 4 Ps: Product, Price, Place (distribution) and Promotion.","Branding, packaging and labelling are part of product decisions.","Promotion tools include advertising, personal selling, sales promotion and public relations.","Marketing concept focuses on customer satisfaction, not just on selling what is made.","Consumer protection (Class 12) ensures marketing is honest and safe for buyers."],"ex":"A company launches a Rs 10 shampoo sachet (product and price) for village shops (place) and runs ads on local radio (promotion). All 4 Ps are set for rural buyers.","q":"class 12 business studies marketing mix 4 ps ncert hindi","kw":["marketing","marketing mix","4 Ps","branding","promotion"]}],"ug":[{"id":"contract-law","t":"Business Law: Indian Contract Act","s":"The Indian Contract Act, 1872 decides when a promise becomes legally enforceable.","n":["A contract is an agreement enforceable by law. Section 10 lists the essentials of a valid contract.","Essentials: offer and acceptance, free consent, competent parties, lawful consideration, lawful object, and not expressly declared void.","A minor's agreement is void. People of unsound mind also cannot contract.","Consent is not free if caused by coercion, undue influence, fraud, misrepresentation or mistake.","If a contract is broken, the hurt party can claim damages (हर्जाना)."],"ex":"Raj offers to sell his bike to Amit for Rs 30,000 and Amit accepts. Both are adults, the price is consideration, and the object is lawful. It is a valid contract. If Raj refuses later, Amit can claim damages.","q":"bcom business law indian contract act 1872 essentials of valid contract hindi","kw":["Indian Contract Act","valid contract","consideration","free consent"]},{"id":"company-law","t":"Company Law and Corporate Governance","s":"The Companies Act, 2013 governs how companies are formed, run and closed in India.","n":["A company is formed by filing documents with the Registrar of Companies, including the Memorandum and Articles of Association.","Directors manage the company. Listed companies must have independent directors.","Shareholders meet at the Annual General Meeting (AGM) to approve accounts and key decisions.","Under Section 135, companies above set size limits must spend at least 2% of average net profit on CSR.","Other key business laws include the Sale of Goods Act, 1930 and the Negotiable Instruments Act, 1881."],"ex":"A company's average net profit for the last three years is Rs 20 crore. If CSR applies, it must spend at least 2% x 20 = Rs 40 lakh on approved social activities, like education or health.","q":"bcom company law companies act 2013 memorandum articles csr hindi","kw":["Companies Act 2013","memorandum of association","CSR","independent director"]},{"id":"management-ob","t":"Principles of Management and Organisational Behaviour","s":"Studies how organisations are managed and how people behave and work together inside them.","n":["Classical theories (Taylor, Fayol, Weber) focus on structure and efficiency.","Hawthorne studies by Elton Mayo showed that attention and group feelings affect productivity.","Motivation theories: Maslow's hierarchy, Herzberg's two-factor theory and McGregor's Theory X and Y.","Leadership styles include autocratic, democratic and laissez-faire.","Organisational culture is the shared values and habits that shape daily behaviour."],"ex":"A shop gives good salary, but staff still feel low. Herzberg would say salary only removes dissatisfaction; praise, growth and responsibility are motivators. So the owner adds recognition and training.","q":"bcom principles of management organisational behaviour motivation theories hindi","kw":["organisational behaviour","Maslow","Herzberg","leadership","Hawthorne"]},{"id":"marketing-management","t":"Marketing Management","s":"Marketing management plans how to find, win and keep customers profitably.","n":["STP: Segmentation (divide the market), Targeting (choose segments), Positioning (create a clear image in the buyer's mind).","Product life cycle: introduction, growth, maturity and decline.","Pricing methods: cost-plus, competition-based and value-based.","Distribution channels move goods from maker to buyer: direct, or through wholesalers and retailers.","Digital marketing uses search, social media and email, and its results can be measured."],"ex":"Cost of a product is Rs 200. Using cost-plus pricing with 25% markup, price = 200 + 25% of 200 = 200 + 50 = Rs 250.","q":"bcom marketing management stp product life cycle pricing hindi","kw":["marketing management","STP","product life cycle","pricing","digital marketing"]},{"id":"hrm","t":"Human Resource Management","s":"HRM is about getting, developing, paying and keeping the right people in an organisation.","n":["HR planning estimates how many and what kind of people will be needed.","Recruitment attracts applicants. Selection chooses the best through tests and interviews.","Training improves skills for the present job. Development prepares people for future roles.","Performance appraisal reviews work. Compensation includes salary, incentives and benefits.","India's new labour codes combine many older labour laws into four codes on wages, industrial relations, social security and safety."],"ex":"A company has 100 staff. Each year 10 leave and it plans to grow by 5. It must hire 10 + 5 = 15 people next year. Labour turnover rate = 10 / 100 x 100 = 10%.","q":"bcom human resource management recruitment selection training hindi","kw":["HRM","recruitment","selection","training","performance appraisal"]},{"id":"entrepreneurship","t":"Entrepreneurship and MSMEs","s":"Entrepreneurship is starting and growing a new business by taking risk and using new ideas.","n":["An entrepreneur (उद्यमी) spots an opportunity, arranges resources and bears the risk.","MSMEs are micro, small and medium enterprises, classified by investment and turnover limits set by the government. They register on the Udyam portal.","A business plan covers the idea, market, operations, finance and risks.","Government schemes like Startup India, Stand-Up India and MUDRA loans support new businesses.","Many startups fail, so test the idea small, control costs and keep learning from customers."],"ex":"Pooja makes pickles at home. She tests 50 jars with neighbours, gets good feedback, registers on Udyam, takes a small MUDRA loan for a sealing machine, and starts selling to local shops.","q":"bcom entrepreneurship development msme udyam startup india hindi","kw":["entrepreneurship","MSME","Udyam","business plan","Startup India"]},{"id":"business-communication-ethics","t":"Business Communication and Ethics","s":"Clear communication and honest conduct help businesses build trust with customers, staff and society.","n":["Good business messages are clear, short, correct, polite and complete.","Forms include letters, emails, reports, presentations and meetings.","Barriers to communication: language, noise, emotions and unclear words.","Business ethics means doing what is right even when no one is watching, like fair pricing and honest ads.","Stakeholders include owners, workers, customers, suppliers, government and the community."],"ex":"A customer emails about a late delivery. A good reply says sorry, explains the reason in one line, gives a new date, and offers a small discount. This is clear, polite and complete.","q":"bcom business communication barriers business ethics hindi","kw":["business communication","business ethics","stakeholders","barriers"]}],"pg":[{"id":"strategic-management","t":"Strategic Management","s":"Strategy is a long-term plan to beat competitors and reach the organisation's vision.","n":["Process: set vision and mission, analyse environment, choose strategy, implement, then evaluate.","SWOT analysis lists internal Strengths and Weaknesses and external Opportunities and Threats.","Porter's Five Forces: rivalry, threat of new entrants, threat of substitutes, buyer power and supplier power.","Porter's generic strategies: cost leadership, differentiation and focus.","The resource-based view says lasting advantage comes from rare, valuable, hard-to-copy resources."],"ex":"A regional tea brand has strong rural distribution (strength), weak online presence (weakness), rising e-commerce (opportunity) and big national rivals (threat). Strategy: use its distribution plus a focused online push in home states.","q":"strategic management swot porter five forces mba lecture","kw":["strategic management","SWOT","five forces","generic strategies"]},{"id":"consumer-behaviour","t":"Consumer Behaviour and Marketing Research","s":"Studies how and why people choose, buy and use products, using research to find out.","n":["Buying process: need recognition, information search, evaluation, purchase and post-purchase feelings.","Influences include culture, social groups, family, personal factors and psychology.","Cognitive dissonance is doubt after a big purchase. Good after-sales service reduces it.","Marketing research uses surveys, focus groups, experiments and data analytics.","Sampling, questionnaire design and avoiding bias make research reliable."],"ex":"A family buying a fridge compares brands online (search), checks energy rating and price (evaluation), buys in a festival sale (purchase), then reads reviews to feel sure (post-purchase).","q":"consumer behaviour buying decision process mba lecture hindi","kw":["consumer behaviour","buying process","marketing research","cognitive dissonance"]},{"id":"international-business","t":"International Business","s":"International business covers trade, investment and operations across national borders.","n":["Entry modes: exporting, licensing, franchising, joint ventures and wholly owned subsidiaries.","FDI is long-term investment with control. FPI is investment in shares and bonds without control.","Balance of Payments records a country's transactions with the world: current account and capital account.","Exchange rates change the value of exports and imports. A weaker rupee makes Indian exports cheaper abroad.","WTO rules, trade agreements and tariffs shape global trade."],"ex":"An Indian exporter sells goods for USD 10,000. At Rs 83 per dollar he gets Rs 8,30,000. If the rupee falls to Rs 86, he gets Rs 8,60,000, earning Rs 30,000 more for the same sale.","q":"international business entry modes fdi balance of payments mcom lecture","kw":["international business","FDI","balance of payments","exchange rate","WTO"]},{"id":"operations-supply-chain","t":"Operations and Supply Chain Management","s":"Operations management makes goods and services efficiently; supply chain connects suppliers to customers.","n":["Key decisions: capacity, location, layout, quality and inventory.","Economic Order Quantity (EOQ) = square root of (2 x Annual demand x Ordering cost / Holding cost per unit).","Just-in-Time (JIT) keeps very low stock and gets materials only when needed.","Total Quality Management (TQM) and Six Sigma aim to reduce defects continuously.","Supply chain management coordinates sourcing, production, warehousing and delivery."],"ex":"Annual demand 1,200 units, ordering cost Rs 100 per order, holding cost Rs 6 per unit per year. EOQ = sqrt(2 x 1,200 x 100 / 6) = sqrt(40,000) = 200 units. Orders per year = 1,200 / 200 = 6.","q":"operations management eoq supply chain management mba lecture","kw":["operations management","EOQ","supply chain","JIT","Six Sigma"]},{"id":"corporate-governance","t":"Corporate Governance","s":"Corporate governance is the system of rules and practices by which a company is directed and controlled.","n":["Good governance means transparency, accountability, fairness and responsibility.","The agency problem arises when managers (agents) do not act in owners' (principals') interest.","In India, the Companies Act, 2013 and SEBI's LODR Regulations, 2015 set governance rules for listed companies.","Board committees like the audit committee and nomination and remuneration committee add checks.","Whistle-blower systems and independent audit help detect wrongdoing early."],"ex":"A CEO wants to buy supplies from his relative's firm at high prices. As a related party transaction, it needs audit committee approval and disclosure. This protects minority shareholders.","q":"corporate governance agency theory sebi lodr mba lecture","kw":["corporate governance","agency problem","SEBI LODR","audit committee"]},{"id":"business-analytics-research","t":"Business Research Methods and Analytics","s":"Business research uses data and proper methods to answer management questions and support decisions.","n":["Steps: define the problem, review literature, set hypotheses, design research, collect data, analyse and report.","Primary data is collected fresh. Secondary data already exists, like government reports.","Tools include descriptive statistics, correlation, regression, t-test and chi-square test.","Dashboards and spreadsheets help managers see trends quickly.","Ethics: take consent, protect privacy and never fake data."],"ex":"A store tests if a new display increases sales. Branch A uses it, Branch B does not. Average daily sales: A Rs 52,000, B Rs 48,000. A t-test checks whether the Rs 4,000 gap is real or due to chance.","q":"business research methods hypothesis testing mba mcom lecture","kw":["business research","hypothesis","regression","analytics"]}],"phd":[{"id":"management-research-design","t":"Research Design in Management and Commerce","s":"A PhD in commerce needs a clear question, theory and method that can produce trustworthy new knowledge.","n":["Start from a research gap found through a systematic literature review.","Choose a philosophy and approach: positivist and quantitative, interpretive and qualitative, or mixed methods.","Validity and reliability make findings believable. Pilot studies test tools first.","UGC rules require PhD scholars to do coursework, including research and publication ethics.","Plagiarism checks are required; always cite sources honestly."],"ex":"Question: Does digital payment adoption raise sales of small kirana shops? Design: survey 400 shops plus 20 owner interviews (mixed methods), with a pilot on 30 shops to test the questionnaire.","q":"research methodology for phd commerce management research design","kw":["research design","literature review","mixed methods","validity"]},{"id":"quantitative-methods","t":"Advanced Quantitative Methods","s":"Statistical tools like regression, panel data and structural equation modelling test relationships in business data.","n":["Multiple regression measures the effect of several factors on one outcome.","Panel data follows the same firms over years; fixed effects control for unchanging firm traits.","Structural Equation Modelling (SEM) tests links between hidden constructs like trust and loyalty.","Difference-in-differences compares change in a treated group with change in a control group.","Software options include R, Python, Stata and SPSS."],"ex":"Firms adopting GST e-invoicing raise sales by 8%; non-adopters raise by 3% in the same period. Difference-in-differences estimate = 8% - 3% = 5% effect, if both groups were trending similarly before.","q":"structural equation modelling panel data regression phd management lecture","kw":["regression","panel data","SEM","difference-in-differences"]},{"id":"qualitative-methods","t":"Qualitative Research Methods","s":"Qualitative research explores meanings and processes through interviews, observation and case studies.","n":["Methods include in-depth interviews, focus groups, ethnography and case studies.","Thematic analysis codes text and groups codes into themes.","Grounded theory builds new theory from data step by step.","Trustworthiness comes from credibility, transferability, dependability and confirmability."],"ex":"A researcher interviews 25 women entrepreneurs in Lucknow about funding. Coding shows themes like family support, collateral problems, and SHG networks, which become the basis for a new framework.","q":"qualitative research methods thematic analysis grounded theory phd","kw":["qualitative research","thematic analysis","grounded theory","case study"]},{"id":"frontier-areas","t":"Frontier Areas in Commerce Research","s":"New research areas include digital platforms, gig work, sustainability and inclusive business in India.","n":["Digital public infrastructure like UPI, Aadhaar-based eKYC and ONDC is changing how small firms do business.","Gig and platform work raises questions about worker income, security and regulation.","Sustainability and ESG research studies how firms manage social and environmental impact.","Family business, MSME finance and informal sector studies remain important for India.","AI in marketing, HR and operations is a fast-growing research topic."],"ex":"A study could compare sales growth of kirana shops that joined ONDC with similar shops that did not, using monthly data over two years.","q":"emerging research areas commerce management digital platforms gig economy phd","kw":["digital platforms","gig economy","ONDC","ESG","MSME research"]}]},"order":16},{"id":"finance","name":"Finance & Money","nameHi":"वित्त","group":"commerce","blurb":"Finance teaches how to earn, save, borrow, invest and protect money wisely, and how to stay safe from fraud.","levels":{"6-8":[{"id":"what-is-money","t":"What Is Money?","s":"Money is anything people accept in exchange for goods and services, like coins, notes and digital money.","n":["Long ago people did barter: swapping wheat for cloth. It was hard because both had to want each other's things.","Money solved this. It is a medium of exchange, a measure of value, and a way to store value.","In India, the Reserve Bank of India (RBI) issues currency notes. The Rs 1 note and coins are issued by the Government of India.","Today money is also digital, in bank accounts, UPI and cards.","Money is earned by work. Spending it wisely is an important life skill."],"ex":"A potter wants rice, but the rice farmer does not want pots. With money, the potter sells pots to anyone for Rs 200 and uses that Rs 200 to buy rice. Money removes the problem of barter.","q":"what is money barter system class 6 7 8 hindi","kw":["money","barter","RBI","currency"]},{"id":"needs-wants-budget","t":"Needs, Wants and a Simple Budget","s":"Needs are must-haves, wants are nice-to-haves; a budget helps money last the whole month.","n":["Needs (ज़रूरतें) are things we cannot live without, like food, shelter, school fees and medicine.","Wants (इच्छाएँ) are things we like but can wait for, like a new toy or fancy shoes.","A budget is a plan that lists income and expenses before spending.","Pay for needs first, then save some money, then spend on wants.","Writing down every expense for a month shows where money really goes."],"ex":"Riya gets Rs 500 pocket money a month. Needs (bus pass, stationery) Rs 300. Savings Rs 100. Wants (snacks) Rs 100. Total = 300 + 100 + 100 = Rs 500. Her budget is balanced.","q":"needs and wants budget for kids financial literacy hindi","kw":["needs","wants","budget","saving"]},{"id":"saving-money","t":"Why and How to Save","s":"Saving means keeping part of today's money for tomorrow's needs and emergencies.","n":["Saving helps in emergencies, like illness, and for goals, like a bicycle or higher studies.","A piggy bank (गुल्लक) is a start, but money kept at home earns nothing and can be lost.","A bank savings account keeps money safe and pays a small interest.","Small regular saving grows big over time. Rs 10 a day is Rs 3,650 in a year.","Save first, then spend. This habit is called 'pay yourself first'."],"ex":"Aman saves Rs 50 every week. In one year (52 weeks) he saves 50 x 52 = Rs 2,600. In 3 years he has 2,600 x 3 = Rs 7,800, even without interest.","q":"importance of saving money for students hindi financial literacy","kw":["saving","piggy bank","savings account","emergency"]},{"id":"banks-and-interest","t":"Banks and Simple Interest","s":"Banks keep our money safe, give loans, and pay or charge interest.","n":["Banks take deposits from people and lend that money to others who need loans.","The bank pays interest (ब्याज) on deposits and charges higher interest on loans. The difference is its income.","Banks in India are regulated by the RBI. Under PM Jan Dhan Yojana (2014), anyone can open a basic account with zero balance.","Deposits are insured by DICGC up to Rs 5 lakh per depositor per bank.","Simple Interest = Principal x Rate x Time / 100."],"ex":"Meena deposits Rs 1,000 at 5% simple interest per year for 2 years. SI = 1,000 x 5 x 2 / 100 = Rs 100. Total amount = 1,000 + 100 = Rs 1,100.","q":"class 7 simple interest bank deposit loan hindi","kw":["bank","simple interest","deposit","loan","Jan Dhan"]},{"id":"upi-safety","t":"UPI and Digital Payment Safety","s":"UPI lets you pay instantly from a phone, but you must keep your PIN and OTP secret.","n":["UPI (Unified Payments Interface) was launched in 2016 by NPCI. It links your bank account to a mobile app.","You need your UPI PIN only to send money. You never need a PIN to receive money.","Never share your PIN, OTP, or card CVV with anyone, even if they say they are from the bank.","Scanning a QR code is for paying. If someone sends a QR code saying 'scan to receive money', it is a fraud.","If cheated, call the cyber crime helpline 1930 or report on cybercrime.gov.in quickly."],"ex":"A caller says, 'You won Rs 5,000, enter your UPI PIN to receive it.' This is a trick. Entering the PIN would send money out. The right action: cut the call and tell an adult.","q":"upi fraud safety tips hindi for students","kw":["UPI","UPI PIN","OTP","digital payment","cyber fraud"]},{"id":"spot-money-fraud","t":"Spotting Money Tricks and Frauds","s":"If someone promises easy, quick or guaranteed money, it is almost always a trick.","n":["Red flag 1: 'Double your money in 30 days' or 'guaranteed high returns'. Real investments never promise this.","Red flag 2: pressure to act fast, like 'offer ends in 10 minutes'.","Red flag 3: asking for an advance fee to give you a prize, loan or job.","Chain schemes that pay old members using new members' money (Ponzi schemes) always collapse.","Talk to a parent or teacher before giving money or personal details to anyone."],"ex":"A message says, 'Pay Rs 500 and earn Rs 1,000 daily by liking videos.' Earning Rs 1,000 a day for no real work is impossible. This is a known task scam. Do not pay.","q":"online fraud awareness for kids ponzi scheme hindi","kw":["fraud","Ponzi scheme","red flags","scam"]}],"9-10":[{"id":"compound-interest","t":"Simple vs Compound Interest","s":"Compound interest earns interest on interest, so money grows faster than with simple interest.","n":["Simple interest is on the original amount only: SI = P x R x T / 100.","Compound interest (चक्रवृद्धि ब्याज) adds each year's interest to the principal for the next year.","Formula: Amount = P x (1 + R/100)^n, where n is number of years.","Compounding helps savers, but it also makes unpaid loans and credit card dues grow fast.","The longer the time, the bigger the gap between simple and compound interest."],"ex":"Rs 10,000 at 10% for 2 years. Simple interest = 10,000 x 10 x 2 / 100 = Rs 2,000. Compound: Year 1 interest 1,000, Year 2 interest 10% of 11,000 = 1,100. Total CI = Rs 2,100. Amount = Rs 12,100.","q":"class 8 9 compound interest vs simple interest hindi","kw":["compound interest","simple interest","principal","compounding"]},{"id":"family-budget","t":"Family Budgeting and Emergency Fund","s":"A family budget plans income and spending each month and keeps money aside for emergencies.","n":["List all income first. Then list fixed expenses (rent, fees) and variable ones (food, travel).","One simple guide is 50-30-20: about 50% for needs, 30% for wants, 20% for savings. Adjust it to your situation.","An emergency fund of a few months of expenses protects against job loss or illness.","Keep the emergency fund safe and easy to withdraw, like a bank savings account or fixed deposit.","Avoid borrowing for wants. Loans should be for needs or things that build income."],"ex":"A family earns Rs 30,000 a month. Using 50-30-20: needs Rs 15,000, wants Rs 9,000, savings Rs 6,000. Monthly expenses are Rs 24,000, so a 3-month emergency fund = 24,000 x 3 = Rs 72,000.","q":"family budget planning 50 30 20 rule emergency fund hindi","kw":["budget","50-30-20 rule","emergency fund","expenses"]},{"id":"inflation","t":"Inflation and the Value of Money","s":"Inflation means prices rise over time, so the same money buys less.","n":["Inflation (महंगाई) is measured in India mainly by the Consumer Price Index (CPI).","The RBI tries to keep CPI inflation near 4%, within a band of 2% to 6%.","If your savings earn less than inflation, your money's real value falls.","Real return is roughly Interest rate minus Inflation rate.","Inflation is why things cost more today than they did for your grandparents."],"ex":"A school bag costs Rs 1,000 this year. With 6% inflation, next year it costs 1,000 x 1.06 = Rs 1,060. If your savings earn 4%, real return is about 4% - 6% = -2%, so you lose buying power.","q":"what is inflation simple explanation hindi cpi rbi","kw":["inflation","CPI","real return","purchasing power"]},{"id":"loans-and-emi","t":"Loans, EMI and Credit Score","s":"A loan is borrowed money repaid with interest, often through equal monthly instalments called EMI.","n":["Borrow from formal sources like banks, which the RBI regulates, instead of unregistered lenders.","EMI (Equated Monthly Instalment) includes part principal and part interest.","Collateral is an asset given as security, like gold in a gold loan.","A credit score (like CIBIL) shows how well you repay loans. Late payment lowers it.","Be careful of instant loan apps that are not linked to an RBI-regulated lender; some misuse your phone data."],"ex":"Raju borrows Rs 12,000 to be repaid in 12 months with total interest Rs 780. Total repayment = 12,000 + 780 = Rs 12,780. Monthly EMI = 12,780 / 12 = Rs 1,065.","q":"what is emi loan credit score cibil hindi explained","kw":["loan","EMI","credit score","collateral"]},{"id":"insurance-basics","t":"Insurance Basics","s":"Insurance protects a family from big money losses by sharing risk among many people.","n":["You pay a small regular amount called premium. The insurer pays a large amount if the insured event happens.","Life insurance pays the family if the insured person dies. Term insurance is pure protection with low premium.","Health insurance pays hospital bills. Ayushman Bharat PM-JAY gives health cover to eligible poor families.","Insurance in India is regulated by IRDAI. Buy only from registered insurers and agents.","Insurance is for protection, not for getting rich. Read what is covered and what is not."],"ex":"1,000 people each pay Rs 500 premium = Rs 5,00,000 pool. If 2 of them face Rs 2,00,000 hospital bills each, the pool pays Rs 4,00,000. Each person paid only Rs 500 but was protected.","q":"insurance basics premium term insurance health insurance hindi","kw":["insurance","premium","term insurance","health insurance","IRDAI"]},{"id":"regulators-and-rights","t":"Financial Regulators and Your Rights","s":"Government bodies like RBI, SEBI, IRDAI and PFRDA watch over money services to protect people.","n":["RBI regulates banks, NBFCs and payment systems. It also manages monetary policy.","SEBI regulates the securities market: stock exchanges, brokers, mutual funds and investment advisers.","IRDAI regulates insurance. PFRDA regulates pension schemes like NPS and Atal Pension Yojana.","Complaints about banks can go to the RBI Integrated Ombudsman. Stock market complaints can go to SEBI SCORES.","Always check that a company or adviser is registered with the right regulator."],"ex":"Sunil's bank does not fix a wrong charge for 30 days after his complaint. He can file a complaint with the RBI Ombudsman online at cms.rbi.org.in, for free.","q":"rbi sebi irdai pfrda regulators explained hindi","kw":["RBI","SEBI","IRDAI","PFRDA","ombudsman"]},{"id":"digital-fraud-awareness","t":"Digital Fraud and Safe Banking","s":"Fraudsters use calls, links and fake offers to steal money; knowing their tricks keeps you safe.","n":["Phishing: fake messages or websites that ask for your bank login, card or OTP.","Fake KYC update calls threaten to block your account unless you share details. Banks do not ask for OTP or PIN.","'Digital arrest' calls pretending to be police or officials are scams. No real agency arrests anyone on a video call.","Use strong passwords, do not install unknown apps, and check website addresses carefully.","Report quickly to 1930 or cybercrime.gov.in. Quick reporting improves the chance of stopping the money."],"ex":"A message says: 'Your bank KYC is expiring. Click this link today.' The link looks like the bank's but has a spelling change. The safe action: do not click, and check by calling the number printed on your passbook or card.","q":"cyber fraud awareness phishing kyc fraud digital arrest hindi","kw":["phishing","KYC fraud","digital arrest","cyber safety","1930"]}],"11-12":[{"id":"power-of-compounding","t":"Investing and the Power of Compounding","s":"Investing means putting money to work so it can grow over time, with some risk.","n":["Saving keeps money safe. Investing aims to grow money faster than inflation, but values can go up and down.","Compounding grows money on past growth. Starting early matters more than starting big.","Rule of 72: years to double money is about 72 / annual return percent.","Set clear goals with time frames, like education in 5 years or retirement in 35 years.","Keep an emergency fund and insurance before investing in risky assets."],"ex":"Rs 1,00,000 at 10% compounded yearly for 3 years: 1,00,000 x 1.1 x 1.1 x 1.1 = Rs 1,33,100. By Rule of 72, money at 8% doubles in about 72 / 8 = 9 years.","q":"power of compounding rule of 72 explained hindi","kw":["investing","compounding","rule of 72","financial goals"]},{"id":"stock-market-basics","t":"Stock Market Basics","s":"A share is a small piece of ownership in a company; the stock market is where shares are bought and sold.","n":["Companies raise money by an IPO in the primary market. Investors then trade those shares in the secondary market.","India's main stock exchanges are BSE and NSE. Indices like Sensex and Nifty 50 track big companies.","You need a PAN, a demat account (holds shares electronically) and a trading account with a SEBI-registered broker.","Depositories NSDL and CDSL keep shares in electronic form.","Share prices go up and down daily. Short-term trading and F&O carry high risk; SEBI studies show most individual F&O traders lose money."],"ex":"Priya buys 10 shares at Rs 200 each = Rs 2,000. A year later the price is Rs 230. Value = 10 x 230 = Rs 2,300. Gain = Rs 300, or 300 / 2,000 = 15%. If the price had fallen to Rs 170, she would lose Rs 300.","q":"stock market basics for beginners hindi sebi demat account","kw":["share","stock exchange","demat account","IPO","Sensex Nifty"]},{"id":"mutual-funds","t":"Mutual Funds","s":"A mutual fund pools money from many investors and a professional manager invests it in a mix of assets.","n":["Mutual funds in India are regulated by SEBI. Each fund is run by an Asset Management Company (AMC).","NAV (Net Asset Value) is the value of one unit of the fund. Units bought = Amount / NAV.","Types: equity funds (shares, higher risk), debt funds (bonds, lower risk) and hybrid funds (mix). Index funds simply copy an index.","The expense ratio is the yearly fee charged by the fund. Lower fees leave more for the investor.","Mutual funds are subject to market risk. Past returns do not guarantee future returns."],"ex":"Kiran invests Rs 5,000 when NAV is Rs 50. Units = 5,000 / 50 = 100 units. If NAV rises to Rs 55, value = 100 x 55 = Rs 5,500, a gain of Rs 500 (10%).","q":"mutual fund basics nav expense ratio hindi for beginners","kw":["mutual fund","NAV","AMC","expense ratio","index fund"]},{"id":"sip-rupee-cost-averaging","t":"SIP and Rupee Cost Averaging","s":"A SIP invests a fixed amount regularly, buying more units when prices are low and fewer when high.","n":["SIP means Systematic Investment Plan. You can start with a small amount every month.","It builds discipline: investing becomes a habit like paying a bill.","Rupee cost averaging: the same amount buys more units when NAV falls, lowering your average cost.","SIP does not remove market risk. It just spreads your buying over time.","Longer SIPs give compounding more time to work."],"ex":"SIP of Rs 1,000 a month. Month 1 NAV Rs 10: 100 units. Month 2 NAV Rs 8: 125 units. Total Rs 2,000 for 225 units. Average cost = 2,000 / 225 = Rs 8.89 per unit, lower than the simple average of Rs 9.","q":"sip kya hai rupee cost averaging explained hindi","kw":["SIP","rupee cost averaging","systematic investment plan","NAV"]},{"id":"risk-return-diversification","t":"Risk, Return and Diversification","s":"Higher possible return usually comes with higher risk; spreading money reduces risk.","n":["Fixed deposits and government bonds have low risk and lower returns. Shares have higher risk and higher possible returns.","Diversification means not putting all eggs in one basket: spread across assets, companies and sectors.","Asset allocation is the split between equity, debt, gold and cash based on goals and age.","Liquidity means how quickly you can turn an investment into cash without big loss.","Know your risk capacity: never invest money you will need soon in risky assets."],"ex":"Rs 1,00,000 split: Rs 60,000 in shares that fall 10% (loss Rs 6,000) and Rs 40,000 in FD earning 7% (gain Rs 2,800). Net = -6,000 + 2,800 = -Rs 3,200, a 3.2% fall instead of 10% if all were in shares.","q":"risk and return diversification asset allocation hindi","kw":["risk","return","diversification","asset allocation"]},{"id":"bonds-fd-govt-schemes","t":"Bonds, FDs and Government Small Savings","s":"Bonds and deposits pay fixed interest and suit safety-first goals.","n":["A bond is a loan you give to a government or company. It pays interest (coupon) and returns the face value at maturity.","Bond prices fall when interest rates rise, and rise when rates fall.","Fixed deposits pay a set rate for a set time. Breaking early may cost a penalty.","Government small savings like PPF and Sukanya Samriddhi have rates set by the government each quarter.","Credit rating (like AAA) shows how safe a bond issuer is. Lower rating means higher default risk."],"ex":"A Rs 1,000 bond pays 8% coupon yearly for 3 years. Interest each year = 8% x 1,000 = Rs 80. Total received = 80 x 3 + 1,000 = Rs 1,240.","q":"bonds kya hote hain fixed deposit ppf explained hindi","kw":["bond","coupon","fixed deposit","PPF","credit rating"]},{"id":"taxes-for-citizens","t":"Taxes Every Citizen Should Know","s":"Taxes fund roads, schools and hospitals; direct taxes are on income, indirect taxes are on spending.","n":["Direct tax: income tax, paid by the person who earns. Indirect tax: GST, included in the price we pay.","PAN is your tax ID. File an Income Tax Return (ITR) if your income is above the limit or you need a refund.","TDS is tax cut at source, for example by an employer or bank. You can see it in Form 26AS or AIS.","There are new and old tax regimes with different slabs. Slabs change through the Union Budget, so check the current year.","Gains from shares and
