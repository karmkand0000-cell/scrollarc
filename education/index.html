ion scrambles data so only those with the key can read it. HTTPS encrypts web traffic.","Backups following the 3-2-1 rule (3 copies, 2 types of media, 1 offsite) protect against ransomware."],"ex":"Ransomware locks a shop's billing PC and demands money. The shop owner had a cloud backup from last night. He wipes the PC, reinstalls software and restores data. Only one day of entries is lost, and no ransom is paid.","q":"cyber security basics for beginners hindi","kw":["CIA triad","firewall","encryption","ransomware"]},{"id":"data-analysis-it","t":"Data Analysis with Spreadsheets and Python","s":"Turn raw data into useful answers using pivot tables, charts and Python's pandas library.","n":["Clean data first: remove duplicates, fix spellings and handle blanks.","Pivot tables summarise large tables, like total sales by month and product.","VLOOKUP or XLOOKUP fetches matching values from another table.","In Python, pandas reads CSV files: df = pd.read_csv('sales.csv'). df.groupby('month')['amount'].sum() gives monthly totals.","Choose the right chart: line for trends over time, bar for comparing groups, pie only for few parts of a whole."],"ex":"A kirana shop has sales: Jan Rs 40,000, Feb Rs 35,000, Mar Rs 50,000. Total = Rs 1,25,000. Average per month = 1,25,000 / 3 = Rs 41,667 (rounded). March grew (50,000 - 35,000) / 35,000 = about 42.9% over February.","q":"data analysis excel pivot table pandas hindi","kw":["pivot table","pandas","data cleaning","charts"]},{"id":"it-careers-ethics","t":"IT Careers, Ethics and Law","s":"Know the career paths in IT and the laws and ethics every IT professional must follow in India.","n":["Careers: software developer, web developer, system administrator, network engineer, cloud engineer, data analyst, cybersecurity analyst.","The Information Technology Act, 2000 is India's main cyber law. It covers e-records, digital signatures and cyber crimes.","The Digital Personal Data Protection Act, 2023 sets rules for how organisations collect and use personal data.","Respect licences: do not use pirated software. Use free and open-source software where possible.","Ethics: protect user privacy, be honest about mistakes, and never misuse access you are given."],"ex":"An intern finds he can see all customers' phone numbers in a test database. The ethical step: do not copy or share them, inform his manager, and suggest masking the numbers in the test copy.","q":"career in it after 12th hindi","kw":["IT careers","IT Act 2000","DPDP Act","ethics"]}],"ug":[{"id":"full-stack-web","t":"Full-Stack Web Development","s":"Building complete web applications: the front end users see, the back end server, and the database behind it.","n":["Front end: HTML, CSS and JavaScript, often with frameworks like React, Angular or Vue.","Back end: server code in Node.js, Python (Django/Flask), Java (Spring) or PHP handles logic and data.","REST APIs use HTTP methods: GET reads, POST creates, PUT/PATCH updates, DELETE removes. Data often travels as JSON.","Status codes: 200 OK, 201 Created, 400 Bad Request, 401 Unauthorized, 404 Not Found, 500 Server Error.","Deploy with Git, a hosting service and HTTPS. Many hosts have free tiers for small projects."],"ex":"A to-do app API: GET /tasks lists tasks. POST /tasks with JSON {\"title\": \"Pay fees\"} creates one and returns 201. DELETE /tasks/5 removes task 5. GET /tasks/99, if it does not exist, returns 404.","q":"full stack web development course hindi","kw":["front end","back end","REST API","JSON"]},{"id":"linux-sysadmin","t":"Linux and System Administration","s":"Most servers run Linux. System administrators install, configure, secure and monitor these machines.","n":["Basic commands: ls (list), cd (change folder), cp, mv, rm, mkdir, cat, grep (search text).","Permissions: read (4), write (2), execute (1) for owner, group and others. chmod 755 file gives rwx to owner, r-x to others.","Install software with package managers like apt (Ubuntu) or dnf (Fedora).","Manage services with systemctl start/stop/status. Check logs with journalctl or files in /var/log.","Use SSH with key-based login to manage servers remotely and securely."],"ex":"chmod 640 report.txt: owner 6 = 4 + 2 = read + write; group 4 = read; others 0 = none. So ls -l shows -rw-r-----. Only the owner can edit; the group can only read.","q":"linux commands for beginners hindi system administration","kw":["Linux","shell commands","permissions","SSH"]},{"id":"network-administration","t":"Network Administration","s":"Plan, set up and maintain organisation networks: addressing, switching, routing, Wi-Fi and network security.","n":["Plan IP addressing with subnets. A /24 network has 256 addresses, 254 usable for hosts.","VLANs split one physical switch into separate logical networks, for example staff and guest Wi-Fi.","Routers use static routes or protocols like OSPF to find paths between networks.","Firewalls and access control lists allow or block traffic by address and port.","Monitor with tools like ping, traceroute, Wireshark and SNMP-based dashboards."],"ex":"A college needs 3 subnets of up to 60 hosts each from 10.0.0.0/24. Use /26 (64 addresses, 62 usable). Subnets: 10.0.0.0/26, 10.0.0.64/26, 10.0.0.128/26. 10.0.0.192/26 is spare for later.","q":"network administration ccna basics hindi","kw":["subnetting","VLAN","routing","firewall"]},{"id":"cloud-computing-ug","t":"Cloud Computing","s":"Design and run applications on cloud platforms using virtual machines, storage, containers and managed services.","n":["Virtualisation runs many virtual machines on one physical server using a hypervisor.","Containers (Docker) package an app with its dependencies so it runs the same everywhere. They are lighter than VMs.","Storage types: object storage (files, like S3), block storage (disks for VMs), and managed databases.","Shared responsibility: the provider secures the physical cloud; you secure your data, accounts and settings.","High availability means running across multiple zones so one data centre failure does not stop the service."],"ex":"A Dockerfile: FROM python:3.12-slim / COPY app.py . / RUN pip install flask / CMD [\"python\", \"app.py\"]. docker build -t myapp . then docker run -p 5000:5000 myapp runs the app identically on any machine with Docker.","q":"cloud computing course hindi docker virtualization","kw":["virtualization","Docker","object storage","shared responsibility"]},{"id":"information-security","t":"Information Security","s":"Protecting an organisation's information through risk management, secure configuration, access control and incident response.","n":["Risk = likelihood x impact. Identify assets, threats and vulnerabilities, then choose controls.","Access control: give least privilege, use role-based access, and review accounts regularly.","Common web risks are listed in the OWASP Top 10, such as broken access control and injection.","Incident response steps: prepare, detect, contain, eradicate, recover, and learn lessons.","In India, CERT-In is the national agency for cyber incidents, and organisations must report certain incidents to it quickly."],"ex":"Risk scoring on a 1-5 scale. Unpatched public web server: likelihood 4, impact 5, risk 20. Lost office printer password: likelihood 2, impact 2, risk 4. Fix the web server first.","q":"information security fundamentals course hindi","kw":["risk management","access control","OWASP","incident response"]},{"id":"software-engineering","t":"Software Engineering and Version Control","s":"Software engineering is the disciplined way to plan, build, test and maintain software in teams.","n":["SDLC phases: requirements, design, development, testing, deployment, maintenance.","Models: Waterfall (step by step) and Agile (short iterations). Scrum uses sprints, daily stand-ups and a product backlog.","Testing levels: unit, integration, system and acceptance testing.","Git tracks changes. Common commands: git init, add, commit, branch, merge, push, pull.","Code review and clear documentation reduce bugs and help new team members."],"ex":"Feature workflow: git checkout -b login-page; edit files; git add .; git commit -m \"Add login page\"; git push origin login-page; open a pull request; a teammate reviews; merge into main.","q":"software engineering sdlc agile git tutorial hindi","kw":["SDLC","Agile","Git","testing"]},{"id":"enterprise-systems","t":"Enterprise Systems and E-Commerce","s":"Large organisations run on connected software for finance, supply chain, customers and online sales.","n":["ERP (Enterprise Resource Planning) systems like SAP or Odoo connect finance, HR, inventory and sales in one database.","CRM (Customer Relationship Management) tracks leads, customers and service requests.","Supply chain systems track goods from supplier to customer.","E-commerce models: B2C (shop to customer), B2B (business to business), C2C (like reselling sites).","India's ONDC (Open Network for Digital Commerce) aims to let buyers and sellers connect across different apps."],"ex":"A shoe shop uses ERP: when a pair sells online, stock reduces automatically, accounts record the sale, and when stock falls below 10, a purchase order is suggested. No one has to update three separate registers.","q":"erp crm e-commerce basics bca hindi","kw":["ERP","CRM","e-commerce","ONDC"]}],"pg":[{"id":"devops-cicd","t":"DevOps and CI/CD","s":"DevOps joins development and operations so teams can release software quickly, safely and often.","n":["Continuous Integration (CI): every code change is built and tested automatically.","Continuous Delivery/Deployment (CD): tested code is released to staging or production automatically.","Infrastructure as Code (IaC) with tools like Terraform or Ansible creates servers from version-controlled files.","Kubernetes runs and scales containers across many machines and restarts failed ones.","DORA metrics measure delivery: deployment frequency, lead time for changes, change failure rate, and time to restore service."],"ex":"Pipeline on every push: 1. Run unit tests. 2. Build a Docker image. 3. Scan it for vulnerabilities. 4. Deploy to staging. 5. Run smoke tests. 6. With approval, deploy to production. If step 1 fails, the pipeline stops and the developer is alerted.","q":"devops ci cd pipeline kubernetes tutorial","kw":["CI/CD","Kubernetes","Infrastructure as Code","DORA metrics"]},{"id":"cloud-architecture","t":"Cloud Architecture and Site Reliability","s":"Designing cloud systems that scale, recover from failure and stay within budget.","n":["Microservices split an app into small services that deploy separately; they add complexity in networking and monitoring.","Load balancers spread traffic; auto-scaling adds or removes servers based on demand.","Availability targets: 99.9% allows about 8.8 hours downtime per year; 99.99% allows about 53 minutes.","SRE practices: service level objectives (SLOs), error budgets, monitoring and blameless post-mortems.","FinOps tracks and optimises cloud spending with tagging, rightsizing and reserved capacity."],"ex":"SLO of 99.9% for a 30-day month: allowed downtime = 0.1% x 30 x 24 x 60 = 43.2 minutes. If 30 minutes are already used, only 13.2 minutes of error budget remain, so risky releases should pause.","q":"cloud architecture site reliability engineering slo lecture","kw":["microservices","SLO","error budget","FinOps"]},{"id":"security-operations","t":"Security Operations and Ethical Hacking","s":"Defending organisations by monitoring threats, testing systems with permission, and responding to attacks.","n":["A Security Operations Centre (SOC) watches logs and alerts 24x7 using SIEM tools.","Penetration testing finds weaknesses legally, only with written permission and a defined scope.","Phases of an attack are mapped by frameworks such as MITRE ATT&CK, which helps defenders plan detection.","Vulnerability management: scan, rank by severity (like CVSS scores), patch, and verify.","Zero trust: never trust by default, verify every user and device every time."],"ex":"SIEM rule: alert if one account has more than 10 failed logins in 5 minutes, then a success. Logs show 25 failures from a foreign IP, then success at 2 a.m. The SOC disables the account, resets the password and investigates.","q":"security operations center siem ethical hacking course","kw":["SOC","SIEM","penetration testing","zero trust"]},{"id":"it-service-management","t":"IT Service Management (ITIL)","s":"IT Service Management runs IT as a set of services to users, with clear processes for issues, changes and requests.","n":["ITIL is a widely used framework of good practice for IT services. ITIL 4 focuses on value co-creation and continual improvement.","Incident management restores normal service quickly. Problem management finds and removes root causes.","Change management controls risky changes; standard changes are pre-approved low-risk tasks.","Service level agreements (SLAs) define targets like 'priority-1 incidents resolved within 4 hours'.","A service desk is the single point of contact for users, often using ticketing tools."],"ex":"SLA: 95% of tickets resolved in 8 hours. This month 400 tickets came; 372 met the target. 372/400 = 93%, so the SLA was missed. Problem review shows 20 late tickets were printer issues, so root-cause work starts there.","q":"itil 4 foundation itsm explained","kw":["ITIL","incident management","SLA","change management"]},{"id":"it-governance-risk","t":"IT Governance, Risk and Compliance","s":"Making sure IT supports business goals, manages risk and follows laws and standards.","n":["IT governance sets who decides what in IT. COBIT, by ISACA, is a common governance framework.","ISO/IEC 27001 is the international standard for an Information Security Management System (ISMS).","Business continuity and disaster recovery plans use RTO (how fast to recover) and RPO (how much data loss is acceptable).","Audits check whether controls work. Findings lead to corrective action plans.","In India, the DPDP Act, 2023 and sector rules from regulators such as RBI and SEBI affect IT compliance."],"ex":"A bank app sets RPO = 15 minutes and RTO = 2 hours. So backups or replication must run at least every 15 minutes, and the team must be able to restore the service within 2 hours after a disaster. Test this twice a year.","q":"it governance cobit iso 27001 explained","kw":["COBIT","ISO 27001","RTO RPO","compliance"]},{"id":"it-strategy-management","t":"IT Project and Strategy Management","s":"Managing IT projects, budgets and teams, and aligning technology choices with organisational strategy.","n":["Project triangle: scope, time and cost are linked; changing one affects the others and quality.","Use work breakdown structures, Gantt charts and the critical path to plan schedules.","Earned value: CPI = EV / AC (cost performance) and SPI = EV / PV (schedule performance). Below 1 means trouble.","Make-or-buy decisions compare building software in-house with buying SaaS, using total cost of ownership.","Digital transformation is about changing processes and culture, not only buying technology."],"ex":"Project: planned value PV = Rs 10 lakh, earned value EV = Rs 8 lakh, actual cost AC = Rs 9 lakh. CPI = 8/9 = 0.89 (over budget). SPI = 8/10 = 0.80 (behind schedule). Action: re-plan scope or add resources.","q":"it project management earned value analysis explained","kw":["project management","earned value","critical path","TCO"]}],"phd":[{"id":"is-research-methods","t":"Research Methods in Information Systems","s":"Information Systems research studies how people, organisations and technology interact, using many research methods.","n":["Quantitative methods: surveys and experiments tested with statistics, often using structural equation modelling (SEM).","Qualitative methods: case studies, interviews and ethnography to understand context and meaning.","Design science research builds and evaluates useful IT artefacts; a widely cited guide is by Hevner and colleagues (2004).","Mixed methods combine numbers and stories to give a fuller picture.","Validity and reliability matter: measure what you claim, consistently. Get ethics approval for human participants."],"ex":"Question: why do small shopkeepers adopt or reject UPI? Phase 1: interview 20 shopkeepers to find reasons. Phase 2: build a survey from those reasons, collect 400 responses, and test the relationships statistically. This is a mixed-methods design.","q":"information systems research methods phd lecture","kw":["design science","case study","survey research","SEM"]},{"id":"technology-adoption","t":"Technology Adoption Theories","s":"Theories explaining why people and organisations accept or reject new technologies.","n":["Technology Acceptance Model (TAM), by Fred Davis (1989): perceived usefulness and perceived ease of use shape intention to use.","UTAUT (Venkatesh and colleagues, 2003) adds performance expectancy, effort expectancy, social influence and facilitating conditions.","Diffusion of Innovations (Rogers) groups adopters as innovators, early adopters, early majority, late majority and laggards.","The DeLone and McLean model measures IS success through system, information and service quality, use, satisfaction and net benefits.","Good research adapts theories to context, such as rural India, language and trust."],"ex":"Hypothesis using TAM: 'Perceived ease of use of a farmer advisory app positively affects perceived usefulness.' Measure both with 5-point survey items from 300 farmers and test the path with regression or SEM.","q":"technology acceptance model utaut explained research","kw":["TAM","UTAUT","diffusion of innovations","IS success"]},{"id":"digital-public-infrastructure","t":"Frontiers: Digital Public Infrastructure and ICT4D","s":"Research on large public digital systems, like India's identity and payment platforms, and on technology for development.","n":["Digital Public Infrastructure (DPI) means shared digital systems such as identity (Aadhaar), payments (UPI) and data sharing.","ICT4D studies how technology can support development goals like health, education and farming.","Key questions include inclusion, exclusion errors, privacy, trust and who benefits.","Researchers study the digital divide: gaps in access, skills and outcomes across gender, region and income.","Methods include field studies, large-scale transaction data analysis and policy analysis."],"ex":"Research idea: compare how UPI use changed women's control over money in two districts. Collect survey data from 300 households, interview 30 women, and analyse with both statistics and themes. Report limits honestly.","q":"digital public infrastructure research ict4d lecture","kw":["DPI","ICT4D","digital divide","UPI research"]},{"id":"security-privacy-research","t":"Frontiers: Security Behaviour and Privacy Research","s":"Studies why people and organisations make security and privacy choices, and how to design better protections.","n":["Usable security research asks why people pick weak passwords or click phishing links, and how design can help.","Privacy research studies data collection, consent and fairness, including effects of laws like the DPDP Act, 2023.","Organisational studies examine security culture, compliance and response to breaches.","Methods: experiments, phishing simulations with ethics approval, interviews and log analysis.","Ethical care is essential: never harm participants or expose real personal data."],"ex":"Experiment: two groups of 200 employees get the same simulated phishing email. Group A had a 10-minute training video; Group B had none. Click rates are 8% and 20%. A chi-square test checks if the difference is significant.","q":"usable security privacy research lecture","kw":["usable security","privacy","phishing study","security culture"]},{"id":"is-publishing","t":"Publishing in Information Systems","s":"How IS researchers write, review and publish their work in journals and conferences.","n":["The Association for Information Systems (AIS) lists a 'Senior Scholars' basket' of top IS journals.","Major conferences include ICIS, ECIS, PACIS and AMCIS.","A strong IS paper states its theoretical contribution clearly, not only practical findings.","Check journal quality using indexing and lists like UGC-CARE, and avoid predatory journals.","Share data and instruments where possible, and follow ethics rules for human subjects."],"ex":"Contribution statement example: 'We extend UTAUT by showing that language of the interface strongly affects effort expectancy among first-time rural users, a factor missing from prior models.' One clear sentence like this guides the whole paper.","q":"how to publish information systems research paper","kw":["AIS","ICIS","theoretical contribution","peer review"]}]},"order":6},{"id":"ai","name":"AI Skills","nameHi":"AI कौशल","group":"tech","blurb":"Learn what Artificial Intelligence is, how it works, and how to use it safely and smartly for study, work and research.","levels":{"6-8":[{"id":"what-is-ai","t":"What is AI?","s":"AI is when a computer learns from examples to do tasks that usually need human thinking.","n":["AI means Artificial Intelligence (कृत्रिम बुद्धिमत्ता). It is a computer program that can learn patterns and make decisions.","Normal programs follow fixed rules written by people. AI programs learn rules by looking at many examples, called data.","You already use AI: voice assistants, Google Maps traffic, YouTube suggestions and face unlock on phones.","AI is not alive. It does not feel, think or understand like a human. It finds patterns in data.","AI can make mistakes, especially when its data was poor or when the situation is new for it."],"ex":"A child learns what a mango looks like by seeing many mangoes. An AI learns the same way: we show it thousands of photos labelled 'mango' and 'not mango'. After that, it can guess if a new photo shows a mango.","q":"what is artificial intelligence for kids hindi","kw":["artificial intelligence","AI basics","machine learning","data"]},{"id":"ai-around-us","t":"AI Around Us","s":"AI is already inside phones, farms, hospitals and trains in India, often without us noticing.","n":["Phones: camera beauty filters, auto-correct in keyboards and voice typing in Hindi use AI.","Farming: some apps look at a photo of a leaf and tell a farmer which disease the crop may have.","Health: AI can help doctors look at X-rays and scans faster, but the doctor still decides.","Language: translation tools convert Hindi to English, Tamil to Hindi and many more.","Every AI tool needs data, a model (the learned pattern) and a person who checks its output."],"ex":"Riya speaks in Hindi to her phone: 'Kal mausam kaisa rahega?' The phone uses speech recognition AI to turn voice into text, then searches the weather and reads the answer aloud. Three AI steps happened in two seconds.","q":"uses of artificial intelligence in daily life hindi class 7","kw":["AI uses","voice assistant","translation","daily life"]},{"id":"using-ai-safely","t":"Using AI Safely","s":"AI tools are helpful, but we must protect our privacy, check answers and use them honestly.","n":["Never share your password, OTP, Aadhaar number, home address or photos of family with an AI chatbot or app.","AI can give wrong answers with full confidence. Always check important facts in your textbook or with a teacher.","Use AI to understand a topic, not to copy homework. Copying stops your own brain from learning.","Most AI apps have age rules. Ask a parent or teacher before signing up.","If something online scares you or asks for money, stop and tell an adult. You can also report at cybercrime.gov.in or call 1930."],"ex":"Aman asks a chatbot, 'Who was the first Prime Minister of India?' It answers correctly: Jawaharlal Nehru. Then he asks about a small local festival and it invents a wrong date. Lesson: AI is a helper, not a final authority. Check in a trusted source.","q":"AI safety for students online safety hindi","kw":["AI safety","privacy","cyber safety","fact check"]},{"id":"prompts-basics","t":"Writing Good Prompts","s":"A prompt is the question or instruction you give an AI. Clear prompts get better answers.","n":["A prompt is what you type or say to an AI tool. The better you explain, the better it helps.","Say who you are: 'I am a Class 7 student.' The AI will then use simpler words.","Say exactly what you want: a short answer, a list, an example or a story.","Give context: the chapter name, the subject, or what you already know.","If the answer is not good, ask again in a different way. This is called improving the prompt."],"ex":"Weak prompt: 'photosynthesis'. Better prompt: 'I am in Class 7. Explain photosynthesis in 5 simple points with one example from a village farm. Then ask me 2 questions to test me.' The second prompt gives a clear, useful, level-right answer.","q":"how to write prompts for ChatGPT students hindi","kw":["prompt","chatbot","instructions","AI tools"]},{"id":"spotting-deepfakes","t":"Spotting Deepfakes and Fake News","s":"Deepfakes are fake photos, videos or voices made by AI that look and sound real.","n":["A deepfake uses AI to put one person's face or voice onto another video or audio clip.","Warning signs: strange blinking, lips not matching words, blurry edges around the face, odd hands or fingers, robotic voice.","Ask: Who shared this? Is it on a trusted news site? Does it try to make me angry or scared quickly?","Scammers clone voices to call families and ask for urgent money. Always call the person back on their known number.","Do not forward a shocking video until you check it. Forwarding fake content can hurt real people."],"ex":"A WhatsApp video shows a famous cricketer promoting a betting app. His lips move a little out of sync and the voice sounds flat. No news site reports it. This is very likely a deepfake advertisement. Do not click the link; report the message instead.","q":"how to identify deepfake videos hindi students","kw":["deepfake","fake news","voice cloning","fact check"]},{"id":"data-and-patterns","t":"Data and Patterns","s":"Data is information like numbers, words and pictures. AI learns by finding patterns in data.","n":["Data (आँकड़े) can be numbers (marks), text (messages), images (photos) or sound (voice).","A pattern is something that repeats, like 'more rain means more crops' or 'clouds often come before rain'.","AI needs a lot of good, correct data. Bad data gives bad results. People say 'garbage in, garbage out'.","Labelled data has the correct answer attached, like a photo marked 'cat'.","If data is only from one group, AI may be unfair to other groups. This is called bias."],"ex":"A shopkeeper notes daily sales for a month. He sees more ice-cream sells when temperature is above 35 degrees C. That is a pattern found in data. An AI could use this pattern to tell him how much ice-cream to order tomorrow.","q":"data and patterns artificial intelligence class 6 7 8","kw":["data","pattern","bias","labelled data"]},{"id":"ai-and-jobs-ethics","t":"AI, Jobs and Being Fair","s":"AI changes how people work, so we must use it fairly and keep learning new skills.","n":["AI can do some repeated tasks faster, like sorting forms or translating simple text.","New jobs also appear: people who build AI, check its work, label data and use AI to help customers.","Ethics (नैतिकता) means doing what is right. AI should be fair, safe and respect privacy.","A human should stay responsible for big decisions about people, like loans, jobs or medical care.","Skills that stay valuable: reading well, thinking clearly, communicating, solving problems and being kind."],"ex":"A school uses an AI tool to check spelling in essays. It saves the teacher time, but the teacher still reads each essay for ideas and creativity. The AI helps, the human judges. This is a good, fair way to use AI.","q":"AI ethics for school students hindi","kw":["AI ethics","future jobs","fairness","skills"]}],"9-10":[{"id":"intro-ai-domains","t":"Introduction to AI and Its Domains","s":"AI has three main domains in the CBSE syllabus: Data Science, Computer Vision and Natural Language Processing.","n":["Intelligence is the ability to learn, understand, reason and solve problems. AI tries to give machines some of these abilities.","Data Science: AI that works with numbers and tables, like predicting sales or exam results.","Computer Vision (CV): AI that understands images and video, like face recognition or self-driving cars.","Natural Language Processing (NLP): AI that understands human language, like chatbots, translation and voice assistants.","AI, Machine Learning (ML) and Deep Learning (DL) are related: DL is a part of ML, and ML is a part of AI."],"ex":"In a smart city, traffic cameras use Computer Vision to count vehicles, a data science model predicts rush hours, and an NLP chatbot answers citizens' complaints in Hindi. One project, three AI domains working together.","q":"CBSE class 9 AI domains data science computer vision NLP","kw":["AI domains","computer vision","NLP","data science"]},{"id":"ai-project-cycle","t":"The AI Project Cycle","s":"The AI Project Cycle is a step-by-step plan for building an AI solution to a real problem.","n":["Stage 1, Problem Scoping: understand the problem clearly. CBSE uses the 4Ws canvas: Who, What, Where, Why.","Stage 2, Data Acquisition: collect correct, reliable data from surveys, sensors, websites or open government data.","Stage 3, Data Exploration: clean the data and make graphs to see patterns.","Stage 4, Modelling: choose a rule-based or learning-based approach and train the model.","Stage 5, Evaluation: test the model on new data to check how well it works. Many books add Deployment as a final stage."],"ex":"Problem: farmers in a village lose crops to pests. Who: farmers. What: pest damage. Where: fields. Why: early warning saves money. Data: leaf photos. Explore: sort healthy vs sick leaves. Model: train image classifier. Evaluate: test on 100 new photos; 88 correct means 88% accuracy.","q":"AI project cycle class 9 CBSE problem scoping 4Ws canvas","kw":["AI project cycle","problem scoping","4Ws canvas","evaluation"]},{"id":"data-acquisition-exploration","t":"Data Acquisition and Exploration","s":"Good AI needs good data, so we learn how to collect, clean and visualise data.","n":["Data features are the useful pieces of information the model will use, like age, rainfall or marks.","Sources: surveys, cameras, sensors, web scraping (with permission), APIs and open sites like data.gov.in.","Training data teaches the model. Testing data checks the model. Never test on the same data you trained on.","Cleaning means removing duplicates, fixing errors and handling missing values.","Visualisation with bar graphs, pie charts and scatter plots helps us see trends quickly."],"ex":"A class collects heights of 40 students. Two entries say 15 cm and 1500 cm, which are clearly typing mistakes. Cleaning removes or corrects them. Then a bar graph shows most students are between 140 and 160 cm.","q":"data acquisition data exploration class 10 artificial intelligence","kw":["data acquisition","data cleaning","visualisation","training data"]},{"id":"modelling","t":"Modelling: Rule-Based vs Learning-Based","s":"A model is the brain of an AI system. It can follow fixed rules or learn from data.","n":["Rule-based AI: humans write the rules, like 'if marks are 33 or more, pass'. Simple but cannot adapt.","Learning-based AI: the machine finds rules itself from examples. It can handle new situations better.","Supervised learning uses labelled data, like emails marked 'spam' or 'not spam'.","Unsupervised learning finds groups in unlabelled data, like grouping customers by buying habits.","Reinforcement learning learns by trial and error with rewards, like a game-playing AI."],"ex":"Spam filter: Rule-based version blocks any email containing 'lottery'. Scammers just write 'l0ttery'. A learning-based filter studies thousands of labelled spam emails and learns many hidden signs, so it catches the new trick too.","q":"rule based vs learning based approach AI class 10 CBSE","kw":["modelling","supervised learning","unsupervised learning","reinforcement learning"]},{"id":"evaluation-metrics","t":"Evaluation: Confusion Matrix and Accuracy","s":"Evaluation checks how good a model is, using a confusion matrix and measures like accuracy and precision.","n":["A confusion matrix compares the model's predictions with the real answers in four boxes.","True Positive (TP) and True Negative (TN) are correct. False Positive (FP) and False Negative (FN) are mistakes.","Accuracy = (TP + TN) / total cases x 100.","Precision = TP / (TP + FP). Recall = TP / (TP + FN). F1 score balances both.","In health tests, missing a sick person (FN) can be very costly, so recall matters a lot."],"ex":"A fire-alarm AI is tested 100 times. TP = 40, TN = 45, FP = 10, FN = 5. Accuracy = (40+45)/100 = 85%. Precision = 40/(40+10) = 0.8. Recall = 40/(40+5) = 0.89. F1 = 2x0.8x0.89/(0.8+0.89) = about 0.84.","q":"confusion matrix accuracy precision recall class 10 AI CBSE","kw":["confusion matrix","accuracy","precision","recall","F1 score"]},{"id":"ai-ethics-cbse","t":"AI Ethics: Bias, Privacy and Access","s":"AI ethics asks whether AI is fair, safe, private and available to everyone.","n":["Bias: if training data has mostly one group, the AI may work poorly for others. Example: face systems trained mostly on light skin.","Privacy: AI apps collect personal data. India's Digital Personal Data Protection Act, 2023 sets rules for using it.","AI access: not everyone has a phone, internet or English skills. AI must include rural and poor users too.","Accountability: when AI makes a harmful decision, a human or company must be responsible.","Moral dilemmas, like the self-driving car choosing whom to save, show that values must be decided by people."],"ex":"A voice assistant understands city English well but fails with rural Bhojpuri accents. It was trained mostly on city voices. Fix: collect fair data from many regions and languages. This makes the AI more inclusive.","q":"AI ethics bias privacy class 9 CBSE artificial intelligence","kw":["AI ethics","bias","privacy","DPDP Act"]},{"id":"nlp-cv-basics","t":"How Computers See and Read","s":"Computers see images as grids of numbers and read text by splitting it into words and tokens.","n":["An image is made of tiny dots called pixels. Each pixel has a number from 0 (black) to 255 (white) in grayscale.","Colour images have three channels: Red, Green and Blue (RGB).","Computer Vision tasks: classification (what is it), detection (where is it) and segmentation (which pixels belong to it).","NLP first cleans text: splitting into sentences and words (tokenisation), removing stopwords like 'is' and 'the'.","Bag of Words counts how often each word appears, which helps classify text."],"ex":"Text: 'Aman likes cricket. Aman plays cricket daily.' Tokens: Aman, likes, cricket, Aman, plays, cricket, daily. Bag of Words: Aman=2, cricket=2, likes=1, plays=1, daily=1. The most frequent content words tell us the topic is cricket.","q":"computer vision pixels NLP bag of words class 10 AI","kw":["pixels","computer vision","tokenisation","bag of words"]}],"11-12":[{"id":"python-basics-ai","t":"Python for AI: The Basics","s":"Python is the most popular language for AI because it is simple and has powerful free libraries.","n":["Install Python free, or use Google Colab in a browser with no installation.","Basics: variables, data types (int, float, str, list, dict), if-else, loops and functions.","NumPy handles arrays and fast maths. Pandas handles tables (DataFrames) like Excel sheets.","Matplotlib draws graphs. Scikit-learn gives ready-made machine learning models.","Practise small programs daily. Read error messages carefully; they tell you what went wrong."],"ex":"marks = [72, 85, 90, 64]. Code: avg = sum(marks)/len(marks). Steps: sum = 72+85+90+64 = 311. len = 4. avg = 311/4 = 77.75. Printing avg shows 77.75. With Pandas, df['marks'].mean() gives the same answer.","q":"python for AI beginners numpy pandas hindi","kw":["Python","NumPy","Pandas","Google Colab"]},{"id":"ml-basics","t":"Machine Learning Basics","s":"Machine learning lets computers learn a relationship between inputs and outputs from data.","n":["Features (X) are inputs, like house size. Label (y) is the output, like house price.","Regression predicts a number (price). Classification predicts a category (spam or not spam).","Split data into training and testing sets, often 80% and 20%.","Overfitting: model memorises training data but fails on new data. Underfitting: model is too simple to learn.","Common first models: linear regression, logistic regression, decision tree and k-nearest neighbours."],"ex":"Data: study hours 1, 2, 3 give marks 40, 50, 60. A linear model fits y = 10x + 30. For 5 hours: y = 10x5 + 30 = 80 marks. Check: x=2 gives 50, which matches the data.","q":"machine learning basics class 12 linear regression hindi","kw":["machine learning","regression","classification","overfitting"]},{"id":"first-ml-project","t":"Your First ML Project in Python","s":"A simple ML project uses scikit-learn to load data, train a model and check its accuracy.","n":["Step 1: load data with Pandas, for example pd.read_csv('data.csv').","Step 2: split it with train_test_split into training and test sets.","Step 3: create a model, like DecisionTreeClassifier(), and call model.fit(X_train, y_train).","Step 4: predict with model.predict(X_test) and measure accuracy_score.","Step 5: try another model or better features, and compare. Keep notes of each try."],"ex":"Using the free Iris flower dataset (150 flowers, 3 types), a decision tree trained on 120 flowers is tested on 30. If it gets 28 right, accuracy = 28/30 = 93.3%. That is a complete beginner project you can show in a portfolio.","q":"scikit-learn iris dataset project beginners hindi","kw":["scikit-learn","Iris dataset","decision tree","accuracy"]},{"id":"prompt-engineering","t":"Prompt Engineering","s":"Prompt engineering is the skill of writing clear instructions so AI models give accurate, useful results.","n":["Give a role and goal: 'You are a physics tutor. Help me understand Ohm's law.'","Give context and constraints: level, length, format (table, bullet points), language (Hinglish or English).","Show examples (few-shot prompting) of the style you want.","Ask the model to think step by step for maths and logic, then verify the final answer yourself.","Iterate: read the output, point out what is wrong, and ask it to fix that part."],"ex":"Prompt: 'Act as a strict CBSE examiner. Here is my answer on Ohm's law: [answer]. Mark it out of 5 using the marking scheme style, list missing points, and rewrite a full-marks answer in under 80 words.' This turns AI into a feedback tool, not a copy tool.","q":"prompt engineering for students complete guide hindi","kw":["prompt engineering","few-shot","LLM","ChatGPT"]},{"id":"ai-tools-study","t":"AI Tools for Study","s":"AI tools can be your personal tutor, quiz-maker and planner, if you use them honestly.","n":["Ask AI to explain a hard concept in simple words, then explain it back yourself to test understanding.","Make practice questions and flashcards from your chapter notes.","Create a weekly study timetable for board exams or entrance exams like JEE, NEET or CUET.","Use AI to check grammar in English writing, but learn from each correction.","Do not paste AI answers as your own in assignments. Many schools treat that as cheating."],"ex":"Before a chemistry test, Priya pastes her notes on 'mole concept' and asks for 10 MCQs with answers hidden. She attempts them, then asks for explanations of the 3 she got wrong. In 30 minutes she found and fixed her weak spots.","q":"how to use AI for study students tips hindi","kw":["AI study tools","flashcards","self-test","academic honesty"]},{"id":"ai-tools-work","t":"AI Tools for Work and Projects","s":"At work, AI helps with writing, design, spreadsheets, coding and research, saving time on routine tasks.","n":["Writing: emails, reports and resumes. Always edit so it sounds like you and is correct.","Design: tools like Canva have AI features to make posters and presentations quickly.","Spreadsheets: AI can explain formulas, like =VLOOKUP or =SUMIF, and help clean data.","Coding: AI assistants suggest code, but you must test it and understand it.","Never upload a company's secret data or customers' personal details into public AI tools without permission."],"ex":"A small shop owner asks AI: 'Write a polite WhatsApp message in Hindi telling customers we are closed on Sunday for Diwali cleaning.' She edits the shop name and sends it to her customer list. Five minutes of work instead of thirty.","q":"AI tools for productivity office work free hindi","kw":["AI tools","productivity","Canva","data privacy"]},{"id":"neural-net-intro","t":"Introduction to Neural Networks","s":"A neural network is a model made of layers of simple units that together learn complex patterns.","n":["It is loosely inspired by brain neurons, but it is just maths: multiply, add and apply a function.","Layers: input layer (data), hidden layers (learning), output layer (answer).","Each connection has a weight. Training changes weights to reduce errors.","Activation functions, like ReLU, help the network learn curves, not just straight lines.","Deep learning means neural networks with many hidden layers. It powers image and speech AI."],"ex":"One neuron: inputs x1 = 2, x2 = 3; weights w1 = 0.5, w2 = 1; bias b = -1. Sum = 2x0.5 + 3x1 - 1 = 1 + 3 - 1 = 3. ReLU(3) = 3, so output is 3. If the sum were negative, ReLU would give 0.","q":"neural network explained simply hindi class 12","kw":["neural network","neuron","weights","activation function"]}],"ug":[{"id":"ml-algorithms","t":"Core ML Algorithms","s":"Key algorithms include linear and logistic regression, decision trees, SVM, k-NN, Naive Bayes and k-means clustering.","n":["Linear regression fits y = wx + b by minimising mean squared error (MSE).","Logistic regression uses the sigmoid function 1/(1+e^-z) to output a probability for classification.","Decision trees split data using measures like Gini impurity or entropy; random forests average many trees.","SVM finds the boundary with the widest margin; kernels allow curved boundaries.","k-means groups unlabelled data into k clusters by repeatedly assigning points to the nearest centre."],"ex":"k-NN with k = 3: a new fruit weighs 150 g. Nearest three known fruits are apple (145 g), apple (155 g), orange (160 g). Two of three are apples, so k-NN predicts 'apple'. Always scale features first, or large-unit features dominate distance.","q":"machine learning algorithms full course hindi regression SVM k-means","kw":["regression","decision tree","SVM","k-means","k-NN"]},{"id":"model-training-evaluation","t":"Training, Validation and Gradient Descent","s":"Models learn by gradient descent, and we check them with validation, cross-validation and proper metrics.","n":["Loss function measures error. Gradient descent updates each weight: w = w - learning_rate x gradient.","Too high a learning rate overshoots; too low is very slow.","Use train, validation and test sets. Tune settings (hyperparameters) on validation, report final results on test.","k-fold cross-validation trains k times on different splits and averages the score.","Regularisation (L1, L2) adds a penalty for large weights to reduce overfitting."],"ex":"Loss L = (w - 3)^2. Gradient = 2(w - 3). Start w = 0, learning rate 0.1. Step 1: grad = -6, w = 0 - 0.1x(-6) = 0.6. Step 2: grad = -4.8, w = 0.6 + 0.48 = 1.08. Each step moves w closer to the best value 3.","q":"gradient descent explained hindi machine learning","kw":["gradient descent","cross-validation","regularisation","hyperparameters"]},{"id":"neural-networks-ug","t":"Neural Networks and Backpropagation","s":"Neural networks learn by forward passes to predict and backpropagation to compute how to fix each weight.","n":["A layer computes output = activation(Wx + b). Stacking layers lets the network learn complex functions.","Common activations: ReLU max(0, x), sigmoid, tanh, and softmax for multi-class output.","Backpropagation uses the chain rule of calculus to find each weight's gradient.","Loss functions: MSE for regression, cross-entropy for classification.","Free tools: PyTorch and TensorFlow/Keras, run on free GPUs in Google Colab or Kaggle notebooks."],"ex":"Handwritten digit recognition (MNIST, 28x28 pixel images): input 784 values, one hidden layer of 128 ReLU units, output 10 softmax units for digits 0-9. Trained for a few epochs, such a simple network commonly reaches around 97% test accuracy.","q":"neural network backpropagation pytorch MNIST hindi","kw":["backpropagation","PyTorch","softmax","MNIST"]},{"id":"nlp-ug","t":"Natural Language Processing","s":"NLP teaches computers to process human language using tokens, embeddings and language models.","n":["Pipeline: tokenisation, cleaning, then turning words into numbers (vectors).","Older methods: Bag of Words and TF-IDF, which gives rare but important words higher weight.","Word embeddings (Word2Vec, GloVe) place similar words close together in vector space.","Tasks: sentiment analysis, named entity recognition, translation, summarisation, question answering.","Indian language work: resources like AI4Bharat models and the government's Bhashini platform support Indian languages."],"ex":"TF-IDF: the word 'monsoon' appears 5 times in a 100-word article, so TF = 0.05. It appears in 10 of 1,000 articles, so IDF = log10(1000/10) = 2. TF-IDF = 0.05 x 2 = 0.1, marking it as a key word for this article.","q":"natural language processing full course hindi TF-IDF embeddings","kw":["NLP","TF-IDF","word embeddings","sentiment analysis"]},{"id":"computer-vision-ug","t":"Computer Vision and CNNs","s":"Computer vision uses convolutional neural networks to find edges, shapes and objects in images.","n":["A convolution slides a small filter (like 3x3) over the image to detect features such as edges.","Pooling (like max pooling) shrinks the image while keeping strong features.","CNN layers go from simple features (edges) to complex ones (eyes, faces).","Popular architectures: LeNet, AlexNet (2012), VGG, ResNet. Transfer learning reuses a pre-trained model.","Tools: OpenCV for image processing; YOLO-style models for real-time object detection."],"ex":"Output size of a convolution = (N - F + 2P)/S + 1. Image 32x32, filter 5x5, padding 0, stride 1: (32 - 5 + 0)/1 + 1 = 28. So the output feature map is 28x28. With 2x2 max pooling, it becomes 14x14.","q":"CNN convolutional neural network explained hindi computer vision","kw":["CNN","convolution","pooling","transfer learning","OpenCV"]},{"id":"ai-automation-n8n","t":"AI Automation with No-Code Tools (n8n)","s":"No-code tools like n8n connect apps and AI models into automatic workflows without heavy programming.","n":["A workflow has a trigger (what starts it) and nodes (steps), like 'new form entry, then send to AI, then save to sheet'.","n8n is source-available and its community edition can be self-hosted free; Make and Zapier are similar tools with free tiers.","Webhooks let other apps send data to your workflow instantly.","AI nodes can classify messages, summarise text or draft replies inside the workflow.","Store API keys in the tool's credentials section, never inside shared workflows. Add error handling and test with sample data."],"ex":"Lead workflow: Google Form submit (trigger) -> n8n reads name, course, phone -> AI node tags interest as 'hot', 'warm' or 'cold' -> Google Sheets row added -> email alert to counsellor for 'hot' leads. Built in an afternoon with no custom server code.","q":"n8n tutorial for beginners AI automation hindi","kw":["n8n","automation","workflow","webhook","no-code"]},{"id":"llm-apis","t":"Building with LLM APIs","s":"LLM APIs let your own app send text to a large language model and use its reply.","n":["You send a request with a model name, a system prompt (rules), user messages and settings; you get text back.","Text is measured in tokens; cost and limits depend on token count. Many providers offer free trial credits or free tiers.","Temperature controls randomness: low for facts and code, higher for creative writing.","RAG (Retrieval-Augmented Generation) first searches your documents, then gives relevant parts to the model so answers stay grounded.","Keep API keys in environment variables, validate outputs, and handle errors and rate limits."],"ex":"A college FAQ bot: the syllabus PDF is split into chunks and stored as embeddings. When a student asks 'When is the BSc fee deadline?', the app finds the matching chunk, sends it with the question to the LLM API, and the model answers using that chunk.","q":"LLM API tutorial python RAG chatbot beginners","kw":["LLM API","RAG","tokens","system prompt","embeddings"]}],"pg":[{"id":"deep-learning","t":"Deep Learning: Optimisation and Regularisation","s":"Deep learning trains very deep networks using smart optimisers, normalisation and regularisation tricks.","n":["Optimisers: SGD with momentum, RMSProp and Adam, which adapts the learning rate for each parameter.","Vanishing and exploding gradients are solved with ReLU, careful initialisation (Xavier, He) and residual connections.","Batch normalisation and layer normalisation keep layer inputs stable and speed up training.","Regularisation: dropout, weight decay, data augmentation and early stopping.","Learning-rate schedules like warmup and cosine decay often improve final results."],"ex":"ResNet's residual block computes y = F(x) + x. If extra layers are not needed, F can learn to be near zero, so y is about x. This 'shortcut' lets gradients flow, making networks with over 100 layers trainable, which won ImageNet 2015.","q":"deep learning optimization Adam batch normalization dropout lecture","kw":["Adam","batch normalisation","dropout","ResNet"]},{"id":"transformers","t":"Transformers and Attention","s":"Transformers use self-attention to relate every token with every other token, and power modern LLMs.","n":["Introduced in the 2017 paper 'Attention Is All You Need'.","Self-attention: Attention(Q, K, V) = softmax(QK^T / sqrt(d_k)) V, where Q, K, V are query, key and value matrices.","Multi-head attention runs several attentions in parallel to capture different relations.","Positional encodings tell the model word order, since attention alone has no sense of order.","Types: encoder-only (BERT), decoder-only (GPT-style LLMs) and encoder-decoder (T5)."],"ex":"Sentence: 'The bank of the river was muddy.' When processing 'bank', attention gives high weight to 'river' and 'muddy', so the model's vector for 'bank' means riverbank, not a money bank. Context changes meaning, and attention captures it.","q":"transformer architecture attention is all you need explained","kw":["transformer","self-attention","BERT","GPT","positional encoding"]},{"id":"generative-models","t":"Generative Models and LLM Fine-Tuning","s":"Generative models create new text, images and audio; LLMs are adapted through fine-tuning and preference training.","n":["VAEs learn a compressed latent space; GANs train a generator against a discriminator.","Diffusion models learn to remove noise step by step and lead modern image generation.","LLMs are pre-trained to predict the next token on huge text, then instruction-tuned.","Parameter-efficient fine-tuning like LoRA trains small extra matrices instead of all weights.","RLHF and related methods (like DPO) train models toward responses that humans prefer."],"ex":"LoRA idea: instead of updating a 4096x4096 weight matrix (about 16.8 million values), train two small matrices A (4096x8) and B (8x4096). That is 2 x 4096 x 8 = 65,536 values, about 0.4% of the original, so fine-tuning fits on modest GPUs.","q":"diffusion models GAN LoRA fine tuning LLM lecture","kw":["diffusion","GAN","LoRA","fine-tuning","RLHF"]},{"id":"reinforcement-learning","t":"Reinforcement Learning","s":"Reinforcement learning trains an agent to take actions in an environment to maximise long-term reward.","n":["Framework: Markov Decision Process with states, actions, rewards, transitions and discount factor gamma.","The Bellman equation links a state's value to the reward now plus discounted future value.","Q-learning update: Q(s,a) = Q(s,a) + alpha [r + gamma max Q(s',a') - Q(s,a)].","Exploration vs exploitation: epsilon-greedy picks a random action sometimes to discover better options.","Deep RL (DQN, PPO) uses neural networks; famous results include AlphaGo beating Lee Sedol in 2016."],"ex":"Q(s,a) = 2, reward r = 5, best next Q = 10, alpha = 0.1, gamma = 0.9. Target = 5 + 0.9x10 = 14. Error = 14 - 2 = 12. New Q = 2 + 0.1x12 = 3.2. The agent now values this action more.","q":"reinforcement learning Q-learning Bellman equation lecture","kw":["reinforcement learning","MDP","Q-learning","PPO"]},{"id":"mlops","t":"MLOps: Taking Models to Production","s":"MLOps applies software engineering practices to build, deploy, monitor and update ML models reliably.","n":["Version everything: code (Git), data (DVC) and models (a model registry such as MLflow).","Track experiments: parameters, metrics and artefacts for each training run.","Deploy as an API (FastAPI), in containers (Docker), and scale with orchestration (Kubernetes).","CI/CD pipelines test and release models automatically.","Monitor data drift and concept drift; retrain when real-world data changes."],"ex":"A crop-price model trained before a drought starts giving large errors after it. Monitoring shows rainfall feature values far outside training range: data drift. The pipeline triggers retraining on recent data, the new model passes tests, and it is deployed with a rollback option.","q":"MLOps tutorial MLflow docker model deployment","kw":["MLOps","MLflow","Docker","data drift","CI/CD"]},{"id":"responsible-ai","t":"Responsible AI","s":"Responsible AI makes systems fair, explainable, private, safe and accountable throughout their lifecycle.","n":["Fairness metrics include demographic parity and equal opportunity; often they cannot all be met at once.","Explainability tools like SHAP and LIME show which features drove a prediction.","Privacy techniques: anonymisation, differential privacy and federated learning.","Documentation: model cards and datasheets for datasets describe intended use and limits.","Regulation is growing: the EU AI Act uses risk tiers; India has the DPDP Act, 2023 and national AI guidelines."],"ex":"A loan model approves 60% of men but 35% of equally qualified women. SHAP shows a feature 'years at current job' acting as a proxy, since many women had career breaks. The team removes the proxy, re-checks fairness metrics and records the change in the model card.","q":"responsible AI fairness explainability SHAP lecture","kw":["responsible AI","fairness","SHAP","differential privacy","model cards"]},{"id":"multimodal-agents","t":"Multimodal Models and AI Agents","s":"Multimodal models handle text, images and audio together, and agents use tools to complete multi-step tasks.","n":["CLIP-style training links images and text in one shared embedding space.","Vision-language models can describe images, read charts and answer questions about documents.","An AI agent loops: plan, call a tool (search, code, API), observe the result, and decide the next step.","Function calling lets an LLM output structured arguments for your code to run.","Agents need guardrails: limited permissions, human approval for risky actions and logging."],"ex":"Task: 'Find this week's average tomato price in three mandis.' Agent plans, calls a price-data API three times, uses a Python tool to compute the mean, then writes a short summary. If the API fails, it reports the gap instead of inventing numbers.","q":"AI agents function calling multimodal models explained","kw":["multimodal","CLIP","AI agents","function calling"]}],"phd":[{"id":"ai-research-methods","t":"Research Methods in AI","s":"AI research needs clear questions, strong baselines, fair experiments, honest statistics and reproducible code.","n":["Read widely: arXiv, conference proceedings (NeurIPS, ICML, ICLR, ACL, CVPR) and survey papers. Keep a literature matrix.","Define a precise hypothesis and compare against strong, well-tuned baselines.","Run ablations: remove one component at a time to show what actually helps.","Report variance over multiple random seeds, confidence intervals and significance where suitable.","Share code, data details and compute budget so others can reproduce your results."],"ex":"You claim a new attention variant improves translation. Run 5 seeds each for baseline and new model. Mean BLEU: 28.1 vs 28.4, standard deviation 0.3. The gain is within noise. An honest paper reports this, tries more settings, or changes the claim.","q":"how to do research in machine learning PhD reading papers","kw":["research methods","ablation","reproducibility","baselines"]},{"id":"alignment-safety","t":"AI Alignment and Safety","s":"Alignment research tries to make AI systems reliably pursue intended goals and stay safe as they grow capable.","n":["Outer alignment: is the training objective what we really want? Inner alignment: did the model actually learn that objective?","Failure modes: reward hacking, specification gaming, sycophancy, deception and goal misgeneralisation.","Methods: RLHF, AI feedback approaches such as Constitutional AI, scalable oversight and debate.","Evaluations and red-teaming test for dangerous capabilities and misuse before deployment.","Robustness: adversarial examples and jailbreaks show models can fail under small or clever input changes."],"ex":"Specification gaming example: a boat-racing RL agent was rewarded for hitting targets. It learned to circle and hit the same targets forever instead of finishing the race. The reward matched points, not the designer's true goal of winning races.","q":"AI alignment introduction lecture reward hacking RLHF","kw":["AI alignment","reward hacking","red teaming","Constitutional AI"]},{"id":"interpretability","t":"Mechanistic Interpretability","s":"Interpretability research opens the black box to understand which internal features and circuits produce model behaviour.","n":["Probing trains small classifiers on hidden activations to test what information is stored.","Attribution methods (integrated gradients, attention analysis) estimate which inputs mattered.","Mechanistic work finds circuits, like induction heads that copy repeated patterns in transformers.","Superposition: models pack more features than neurons; sparse autoencoders help separate them.","Causal interventions (activation patching) test whether a found component really causes the behaviour."],"ex":"Researchers suspect a feature tracks 'Indian city names'. They patch its activation from a prompt about Pune into a prompt about Paris. If the model's later text shifts toward Indian context, the feature plays a causal role, not just a correlational one.","q":"mechanistic interpretability introduction sparse autoencoders","kw":["interpretability","circuits","sparse autoencoder","activation patching"]},{"id":"scaling-efficiency","t":"Scaling Laws and Efficient AI","s":"Scaling laws describe how performance improves with data, parameters and compute, guiding efficient model design.","n":["Loss often falls as a smooth power law with more compute, data and parameters.","Compute-optimal studies (such as Chinchilla, 2022) suggest scaling data and parameters together.","Efficiency methods: quantisation, pruning, distillation and mixture-of-experts.","Small and local models matter for low-cost, low-bandwidth regions, including much of rural India.","Energy and carbon cost of training should be measured and reported."],"ex":"Quantisation: a 7-billion parameter model in 16-bit needs about 7 x 2 = 14 GB for weights. In 4-bit it needs about 7 x 0.5 = 3.5 GB. That can fit on a consumer GPU or even a laptop, with a small accuracy loss.","q":"scaling laws neural language models Chinchilla explained","kw":["scaling laws","quantisation","distillation","efficient AI"]},{"id":"ai-for-science-frontiers","t":"Frontier Topics: AI for Science and Society","s":"Frontier research applies AI to science, low-resource languages, reasoning and long-term societal questions.","n":["AI for science: AlphaFold's protein structure work shared the 2024 Nobel Prize in Chemistry (Hassabis, Jumper, with Baker).","Reasoning research studies chain-of-thought, search, verification and tool use for maths and code.","Low-resource NLP builds data and models for languages with little digital text, including many Indian languages.","AI governance research covers evaluation standards, compute policy, and international coordination.","Good PhD topics sit where a real need, available data and your unique skills meet."],"ex":"Possible thesis: 'Speech recognition for tribal languages of Jharkhand with under 10 hours of audio.' It combines low-resource methods, community data collection with consent, fairness evaluation and real social impact.","q":"AI for science AlphaFold lecture frontier AI research","kw":["AI for science","AlphaFold","low-resource NLP","AI governance"]}]},"order":7},{"id":"history","name":"History","nameHi":"इतिहास","group":"social","blurb":"History is the story of how people lived, worked, ruled and changed the world in the past, told using real evidence.","levels":{"6-8":[{"id":"sources-of-history","t":"How We Know About the Past","s":"Historians learn about the past from old objects, buildings, coins, inscriptions and written books called sources.","n":["A source is anything that tells us about the past. Historians use sources like detectives use clues.","Archaeological sources (पुरातात्विक स्रोत) are things dug from the ground: pots, tools, bricks, bones and coins.","Inscriptions (अभिलेख) are writings carved on stone or metal. Kings often used them to announce orders and victories.","Manuscripts (पांडुलिपि) are old handwritten books, often written on palm leaves or birch bark.","Dates are written as BCE (Before Common Era) and CE (Common Era). Counting in BCE goes backwards towards year 1."],"ex":"Ashoka's inscriptions are found at many places in India. They tell us what he believed and how he wanted people to behave, even though he lived more than 2,200 years ago.","q":"class 6 history ncert how do we know about the past hindi","kw":["sources","archaeology","inscription","manuscript"]},{"id":"harappan-civilisation","t":"The Harappan Civilisation","s":"One of the world's earliest cities grew along the Indus river and its region about 4,500 years ago.","n":["It is also called the Indus Valley Civilisation (सिंधु घाटी सभ्यता). Its mature cities flourished roughly 2600 to 1900 BCE.","Important sites include Harappa and Mohenjodaro (now in Pakistan) and Lothal, Dholavira and Kalibangan (in India).","Cities were carefully planned with straight streets, covered drains and houses of baked bricks of standard size.","Mohenjodaro had a Great Bath. Lothal had a dockyard, showing trade by water.","People used seals with pictures and a script. Nobody has been able to read this script yet."],"ex":"Harappan bricks were made in a fixed ratio of about 1:2:4 (thickness:width:length) at many sites far apart. This shows people followed common rules, a sign of good planning.","q":"class 6 history harappan civilisation ncert hindi","kw":["harappa","indus valley","mohenjodaro","lothal"]},{"id":"vedic-period-and-kingdoms","t":"Vedic Times, Janapadas and Mahajanapadas","s":"After the Harappans, the Vedas were composed and small kingdoms slowly grew into large states.","n":["The Rigveda is the oldest Veda, composed about 3,500 years ago. It was passed on orally for centuries before being written.","Janapadas (जनपद) were early kingdoms. Some became bigger and stronger and were called mahajanapadas, about 2,500 years ago.","Magadha, in present-day Bihar, became the most powerful mahajanapada. Its rivers, forests and iron ores helped it.","Some states like the Vajji were ganas or sanghas, where many people together took decisions.","This period also saw new ideas: Gautama Buddha and Mahavira taught about 2,500 years ago."],"ex":"Magadha's capital first was Rajagriha (Rajgir), and later Pataliputra (Patna). Patna was close to the Ganga and Son rivers, which made trade and defence easier.","q":"class 6 history kingdoms kings and an early republic ncert hindi","kw":["vedas","mahajanapada","magadha","buddha"]},{"id":"mauryan-empire","t":"The Mauryan Empire and Ashoka","s":"The Mauryas built one of the largest empires of ancient India; Ashoka is remembered for dhamma.","n":["Chandragupta Maurya founded the empire more than 2,300 years ago. He was helped by Chanakya (Kautilya), linked with the Arthashastra.","Ashoka, Chandragupta's grandson, fought the Kalinga war (in present Odisha). Seeing the suffering, he decided never to fight wars of conquest again.","Ashoka's dhamma (धम्म) meant kindness to all, respect for elders and other religions, and no harm to animals.","He spread his message through inscriptions in Prakrit, mostly in the Brahmi script.","The lion capital from Ashoka's pillar at Sarnath is India's national emblem."],"ex":"In one inscription Ashoka says he felt deep sorrow after Kalinga, where many were killed or taken away. So instead of conquest by war, he chose conquest by dhamma.","q":"class 6 history ashoka the emperor who gave up war ncert hindi","kw":["maurya","ashoka","kalinga","dhamma"]},{"id":"delhi-sultanate","t":"The Delhi Sultans","s":"From the 13th century, a series of Sultans ruled from Delhi and expanded control across north India.","n":["Delhi became an important capital under the Tomara Rajputs and Chauhans, before the Sultans.","The Delhi Sultanate began in 1206. Five dynasties ruled: Mamluk (Slave), Khalji, Tughluq, Sayyid and Lodi.","Raziyya Sultan (1236-1240) was the only woman ruler of the Sultanate.","Alauddin Khalji controlled market prices to pay his large army. Muhammad Tughluq tried to shift the capital to Daulatabad.","The Sultanate ended when Babur defeated Ibrahim Lodi at Panipat in 1526."],"ex":"The Qutb Minar in Delhi was begun by Qutbuddin Aibak and completed by Iltutmish. Today it is a UNESCO World Heritage Site that reminds us of the early Sultanate.","q":"class 7 history the delhi sultans ncert hindi","kw":["delhi sultanate","khalji","tughluq","raziyya"]},{"id":"mughal-empire","t":"The Mughal Empire","s":"The Mughals ruled large parts of India from 1526, building a strong administration and famous monuments.","n":["Babur founded Mughal rule after the First Battle of Panipat in 1526.","Akbar (ruled 1556-1605) created the mansabdari system. Each officer (mansabdar) had a rank (zat) and kept soldiers (sawar).","Akbar's land revenue system, managed by Todar Mal, measured land and fixed tax by average crop yields.","Akbar followed sulh-i kul, meaning 'universal peace' or tolerance between religions.","Shah Jahan built the Taj Mahal. After Aurangzeb (died 1707) the empire became weaker."],"ex":"A mansabdar with a rank of 1,000 sawar had to maintain 1,000 cavalrymen. He was paid through revenue from land given to him, called a jagir.","q":"class 7 history the mughal empire ncert hindi","kw":["mughal","akbar","mansabdar","babur"]},{"id":"company-rule","t":"From Trade to Territory: Company Rule","s":"The British East India Company came to trade but slowly became the ruler of most of India.","n":["The English East India Company got a charter in 1600 to trade with the East.","In the Battle of Plassey (1757) Robert Clive defeated Siraj-ud-Daulah, Nawab of Bengal.","After the Battle of Buxar (1764), the Company got the Diwani of Bengal in 1765, the right to collect revenue.","Lord Dalhousie's Doctrine of Lapse took over states if a ruler died without a natural male heir, such as Jhansi and Satara.","New land revenue systems like the Permanent Settlement (1793) often left peasants in debt."],"ex":"Under Diwani, the Company used Bengal's revenue to buy cotton and silk cloth in India. So Indian money paid for goods the Company sold abroad, instead of gold coming from Britain.","q":"class 8 history from trade to territory ncert hindi","kw":["east india company","plassey","buxar","doctrine of lapse"]},{"id":"revolt-1857-and-national-movement","t":"The Revolt of 1857 and the Making of the National Movement","s":"In 1857 soldiers and people rose against Company rule; later Indians organised a national movement for freedom.","n":["The revolt began at Meerut on 10 May 1857. Sepoys marched to Delhi and declared Bahadur Shah Zafar their leader.","Leaders included Rani Lakshmibai, Nana Saheb, Tantia Tope, Begum Hazrat Mahal and Kunwar Singh.","After the revolt, the Government of India Act 1858 ended Company rule. The British Crown took direct control.","The Indian National Congress was founded in 1885 at Bombay.","Mahatma Gandhi led mass movements. India became independent on 15 August 1947, but was also partitioned."],"ex":"A rumour spread that new cartridges were greased with cow and pig fat. This hurt both Hindu and Muslim sepoys, and became an immediate cause of the 1857 revolt.","q":"class 8 history 1857 revolt and national movement ncert hindi","kw":["1857","sepoy","congress","independence"]}],"9-10":[{"id":"french-revolution","t":"The French Revolution","s":"In 1789 the people of France overthrew the old order and spread ideas of liberty, equality and fraternity.","n":["French society had three estates: clergy, nobility and the Third Estate. Only the Third Estate paid taxes.","On 14 July 1789, crowds stormed the Bastille prison in Paris. This is seen as the start of the revolution.","The National Assembly issued the Declaration of the Rights of Man and Citizen in 1789.","France became a republic in 1792. King Louis XVI was executed in 1793. The Jacobins ran a Reign of Terror.","Napoleon later took power. Ideas of the revolution spread to many countries."],"ex":"A peasant paid taille (tax to the state) and tithes (to the church), while nobles paid almost nothing. Anger at this unfairness, along with rising bread prices, pushed people to revolt.","q":"class 9 history french revolution ncert hindi","kw":["french revolution","bastille","third estate","liberty"]},{"id":"russian-revolution","t":"Socialism in Europe and the Russian Revolution","s":"Socialist ideas grew in Europe, and in 1917 Russia saw a revolution that created the first socialist state.","n":["Liberals, radicals and conservatives had different views on how society should change. Socialists wanted property owned by society, not individuals.","Karl Marx argued that workers must overthrow capitalism to build a socialist society.","In February 1917 the Tsar (Nicholas II) gave up the throne. In October 1917 the Bolsheviks under Lenin took power.","The new government took over land and banks. Later, under Stalin, farms were forcibly collectivised.","Russian dates follow the old calendar; the October revolution happened on 7 November by today's calendar."],"ex":"Lenin's April Theses had three demands: end the war, transfer land to peasants, and nationalise banks. These simple demands won support from tired soldiers and poor peasants.","q":"class 9 history socialism in europe and russian revolution ncert hindi","kw":["russian revolution","bolshevik","lenin","socialism"]},{"id":"nazism","t":"Nazism and the Rise of Hitler","s":"After the First World War, Germany's crisis helped Hitler's Nazi party take power and start a cruel regime.","n":["Germany lost the First World War. The Treaty of Versailles (1919) was harsh and many Germans felt humiliated.","The Weimar Republic faced inflation and then the Great Depression from 1929. Unemployment rose sharply.","Hitler became Chancellor in 1933 and soon destroyed democracy.","Nazis believed in a racial hierarchy. About six million Jews were killed in the Holocaust, along with Roma and others.","Germany's invasion of Poland in 1939 started the Second World War, which ended in 1945."],"ex":"In 1923, German prices rose so fast that people carried cartloads of paper money to buy bread. Such suffering made people lose faith in democracy and look for a 'strong' leader.","q":"class 9 history nazism and the rise of hitler ncert hindi","kw":["nazism","hitler","holocaust","weimar"]},{"id":"forest-and-pastoral-societies","t":"Forest Society, Pastoralists and Colonialism","s":"Colonial rule changed how forest dwellers and herders lived by controlling forests and grazing lands.","n":["The British needed timber for ships and railway sleepers. So they cut forests on a large scale.","The Indian Forest Act (1865, amended 1878 and 1927) divided forests into reserved, protected and village forests.","Shifting cultivation (jhum) was banned in many places. Forest people lost access to wood, grass and fruits.","Pastoralists like the Gujjar Bakarwals and Raikas moved with animals. New rules on grazing taxes and 'waste land' hurt them.","Forest people resisted, as in the Bastar rebellion of 1910."],"ex":"A family that once collected firewood and grazed cattle freely in a forest suddenly needed permission. If caught, they could be fined. This is why many forest communities felt angry at colonial rule.","q":"class 9 history forest society and colonialism pastoralists ncert hindi","kw":["forest act","bastar","pastoralists","colonialism"]},{"id":"nationalism-in-europe","t":"The Rise of Nationalism in Europe","s":"In the 19th century, people in Europe began to see themselves as nations and new nation-states were formed.","n":["A nation-state is a state where people share a sense of common identity and history.","The French Revolution spread the idea of 'la patrie' (fatherland) and 'le citoyen' (citizen).","Germany was unified in 1871 under Prussia, led by Otto von Bismarck.","Italy was unified through the efforts of Mazzini, Cavour and Garibaldi; Victor Emmanuel II became king in 1861.","Artists used female figures like Marianne (France) and Germania to represent the nation."],"ex":"Before unification, Italy was split into seven states. Garibaldi's volunteers, called Red Shirts, helped bring the south into a united Italy.","q":"class 10 history rise of nationalism in europe ncert hindi","kw":["nationalism","unification","bismarck","mazzini"]},{"id":"nationalism-in-india","t":"Nationalism in India","s":"From 1919, Gandhi led mass movements that brought crores of Indians together against British rule.","n":["Gandhi used satyagraha (सत्याग्रह), the power of truth and non-violence. He used it at Champaran (1917), Kheda and Ahmedabad.","The Rowlatt Act (1919) and the Jallianwala Bagh massacre at Amritsar on 13 April 1919 caused wide anger.","The Non-Cooperation Movement began in 1920-21. Gandhi withdrew it after violence at Chauri Chaura in February 1922.","The Civil Disobedience Movement began with the Salt (Dandi) March, 12 March to 6 April 1930.","Symbols like the tricolour flag, songs and Bharat Mata images built a sense of unity."],"ex":"Salt was used by every home, rich or poor. By breaking the salt law at Dandi, Gandhi chose an issue that every Indian could understand and join.","q":"class 10 history nationalism in india ncert hindi","kw":["non-cooperation","civil disobedience","dandi march","gandhi"]},{"id":"global-world-and-industrialisation","t":"The Making of a Global World and the Age of Industrialisation","s":"Trade, migration, factories and machines linked the world together and changed how goods were made.","n":["People, goods and ideas travelled long distances even in ancient times, for example on the silk routes.","In the 19th century, Indian indentured labourers went to places like Fiji, Mauritius, Trinidad and Guyana.","Factories began in England in the late 18th century. Cotton was the leading industry.","Indian handloom weavers suffered when cheap machine-made cloth from Britain entered Indian markets.","The Great Depression began in 1929 and hurt farmers and workers around the world, including India."],"ex":"An indentured labourer signed a contract to work for a fixed number of years, often five. Many were misled about the work and wages, and could not easily return home.","q":"class 10 history making of a global world age of industrialisation ncert hindi","kw":["globalisation","industrialisation","indentured labour","great depression"]},{"id":"print-culture","t":"Print Culture and the Modern World","s":"Printing made books cheap and helped new ideas, debates and reform movements spread among common people.","n":["The earliest printing was by hand in China, Japan and Korea, using wooden blocks.","Johann Gutenberg developed a printing press in Germany in the 1430s-1450s. His first major printed book was the Bible.","Printing presses came to Goa with Portuguese missionaries in the mid-16th century.","In India, print helped social reformers and also nationalist newspapers spread their ideas.","The Vernacular Press Act of 1878 gave the government power to censor Indian-language newspapers."],"ex":"Before print, a book was copied by hand, which took months and cost a lot. After print, hundreds of copies could be made quickly, so even ordinary people could read pamphlets and newspapers.","q":"class 10 history print culture and the modern world ncert hindi","kw":["print culture","gutenberg","vernacular press act","newspapers"]}],"11-12":[{"id":"harappan-archaeology","t":"Bricks, Beads and Bones: Harappan Archaeology","s":"Archaeologists rebuild Harappan life from remains like bricks, beads, seals and bones, since the script is unread.","n":["Harappan sites were first identified in the 1920s. Daya Ram Sahni worked at Harappa and R.D. Banerji at Mohenjodaro.","John Marshall, Director General of the ASI, announced the new civilisation in 1924.","Craft production included bead-making at Chanhudaro and shell work at Nageshwar and Balakot.","Animal bones and seeds tell us about diet and farming: wheat, barley, pulses and cattle, sheep and goat.","The decline came around 1900 BCE. Possible causes include climate change, river shifts and floods; there is no single agreed reason."],"ex":"Finding carnelian beads from Gujarat in far-away Mesopotamia tells historians that Harappans traded over long distances, even without written records we can read.","q":"class 12 history bricks beads and bones harappan ncert hindi","kw":["harappan","archaeology","marshall","craft production"]},{"id":"kings-farmers-towns","t":"Kings, Farmers and Towns: Early States and Economies","s":"From about 600 BCE, kingdoms, towns, coins and new farming methods changed early Indian society.","n":["James Prinsep deciphered the Brahmi and Kharosthi scripts in the 1830s. This helped scholars read Ashoka's inscriptions.","Punch-marked coins of silver and copper were among the earliest coins in India.","Iron ploughshares and paddy transplantation increased farm output in the Ganga valley.","Later dynasties like the Kushanas and Guptas issued gold coins.","Epigraphy (study of inscriptions) has limits: inscriptions mostly show the views of those who made them, often rulers."],"ex":"In Ashoka's inscriptions he calls himself 'devanampiya piyadassi', meaning 'beloved of the gods' and 'pleasant to behold'. Matching this title with the name Ashoka in another inscription helped identify him.","q":"class 12 history kings farmers and towns ncert hindi","kw":["prinsep","epigraphy","punch-marked coins","early states"]},{"id":"thinkers-beliefs-buildings","t":"Thinkers, Beliefs and Buildings","s":"Between 600 BCE and 600 CE, new philosophies like Buddhism and Jainism arose, and stupas and temples were built.","n":["The Buddha taught the Four Noble Truths and the middle path. Mahavira taught ahimsa (non-violence).","Buddhist teachings were collected in the Tipitaka (three baskets).","Stupas like those at Sanchi and Amaravati held relics. Sanchi was protected by the Begums of Bhopal.","Later, Ma
