Robert Hooke first saw cells in cork in 1665.","Main parts: cell membrane (outer cover), cytoplasm (jelly inside) and nucleus (control centre with DNA). Plant cells also have a cell wall and chloroplasts.","Mitochondria make energy (ATP) and are called the powerhouse of the cell. Ribosomes make proteins.","A tissue (ऊतक) is a group of similar cells doing the same work. Plants have meristematic and permanent tissues.","Animals have four tissue types: epithelial (covering), connective (blood, bone), muscular (movement) and nervous (messages)."],"ex":"Onion peel experiment: Step 1: Peel a thin layer from an onion. Step 2: Put it on a glass slide with a drop of water and a drop of safranin stain. Step 3: Cover and see under a microscope. You see brick-like cells with a clear cell wall and a dark dot, the nucleus.","q":"class 9 fundamental unit of life tissues ncert biology hindi","kw":["cell","nucleus","mitochondria","tissue","cell wall"]},{"id":"motion-and-laws-of-motion","t":"Motion and Newton's Laws","s":"Velocity, acceleration and Newton's three laws explain how and why objects move.","n":["Velocity is speed in a given direction. Acceleration (त्वरण) is the change in velocity per second, unit m/s².","Equations of motion for uniform acceleration: v = u + at, s = ut + (1/2)at², and v² = u² + 2as.","First law: an object stays at rest or keeps moving straight unless a force acts. This property is inertia (जड़त्व).","Second law: Force = mass x acceleration (F = ma). Unit of force is newton (N). Momentum p = mv.","Third law: every action has an equal and opposite reaction. A rocket pushes gas down, the gas pushes the rocket up."],"ex":"A car of mass 1000 kg starts from rest and reaches 10 m/s in 5 s. Step 1: a = (v - u)/t = (10 - 0)/5 = 2 m/s². Step 2: F = ma = 1000 x 2 = 2000 N. Step 3: s = (1/2) x 2 x 5² = 25 m. Answer: 2000 N, 25 m.","q":"class 9 motion force and laws of motion ncert physics hindi","kw":["velocity","acceleration","Newton's laws","inertia","momentum"]},{"id":"chemical-reactions-equations","t":"Chemical Reactions and Equations","s":"In a chemical reaction, substances change into new substances, and we write this as a balanced equation.","n":["Signs of a chemical reaction: change in colour, gas given off, heat or light produced, or a solid (precipitate) forming.","A chemical equation shows reactants on the left and products on the right, for example 2H2 + O2 -> 2H2O.","Balancing means the number of each type of atom is the same on both sides. Mass is never created or destroyed.","Types: combination, decomposition, displacement, double displacement, and redox (oxidation-reduction) reactions.","Oxidation is gain of oxygen or loss of hydrogen. Rusting of iron and rancidity of oily food are daily-life oxidation."],"ex":"Balance: H2 + O2 -> H2O. Step 1: Left has 2 O, right has 1 O. Put 2 before H2O: H2 + O2 -> 2H2O. Step 2: Now right has 4 H, left has 2 H. Put 2 before H2: 2H2 + O2 -> 2H2O. Check: H = 4 and 4, O = 2 and 2. Balanced.","q":"class 10 chemical reactions and equations balancing ncert hindi","kw":["chemical equation","balancing","oxidation","reduction","decomposition"]},{"id":"acids-bases-salts","t":"Acids, Bases and Salts","s":"Acids taste sour, bases taste bitter and feel soapy, and they react together to make salt and water.","n":["Acids (अम्ल) like lemon juice and vinegar turn blue litmus red. Bases (क्षार) like soap and lime water turn red litmus blue.","The pH scale goes from 0 to 14. pH 7 is neutral, below 7 is acidic, above 7 is basic. Pure water has pH 7.","Acid + base -> salt + water. This is called neutralisation. Taking an antacid for acidity is an example.","Acids react with metals to give hydrogen gas. Example: Zn + H2SO4 -> ZnSO4 + H2.","Useful salts: baking soda (NaHCO3), washing soda (Na2CO3.10H2O), bleaching powder (CaOCl2), plaster of Paris (CaSO4.1/2H2O)."],"ex":"Hydrochloric acid reacts with sodium hydroxide. Equation: HCl + NaOH -> NaCl + H2O. Check balance: Na 1 = 1, Cl 1 = 1, H 2 = 2, O 1 = 1. Answer: the salt formed is sodium chloride (common salt), and the solution becomes neutral, pH about 7.","q":"class 10 acids bases and salts ph scale ncert hindi","kw":["acid","base","pH scale","neutralisation","salt"]},{"id":"carbon-compounds","t":"Carbon and its Compounds","s":"Carbon forms millions of compounds because it bonds strongly with itself and other atoms, sharing electrons.","n":["Carbon has 4 outer electrons. It shares them to make 4 covalent bonds (सहसंयोजी बंध).","Catenation means carbon can join with other carbon atoms to form long chains and rings. This is why there are so many carbon compounds.","Hydrocarbons have only C and H. Alkanes have single bonds (methane CH4), alkenes have a double bond (ethene C2H4).","Functional groups give special properties: -OH in alcohols (ethanol), -COOH in carboxylic acids (ethanoic acid, found in vinegar).","Soaps clean because one end of the molecule likes water and the other likes oil, forming micelles that trap dirt."],"ex":"Burning of methane (CNG, biogas): CH4 + 2O2 -> CO2 + 2H2O + heat. Check: C 1 = 1; H 4 = 4 (2 x 2); O 4 = 2 + 2. Balanced. Answer: methane burns with a clean blue flame giving carbon dioxide, water and lots of heat.","q":"class 10 carbon and its compounds ncert chemistry hindi","kw":["covalent bond","catenation","hydrocarbon","functional group","soap micelle"]},{"id":"life-processes","t":"Life Processes","s":"Nutrition, respiration, transport and excretion are the basic jobs every living body does to stay alive.","n":["Nutrition gives energy and raw material. Plants do photosynthesis; humans digest food with enzymes in the mouth, stomach and small intestine.","Respiration (श्वसन) breaks down glucose to release energy. With oxygen it is aerobic; without oxygen it is anaerobic, as in yeast or tired muscles.","Transport: the human heart has 4 chambers and pumps blood through arteries, veins and capillaries. Plants use xylem for water and phloem for food.","Excretion removes waste. Human kidneys filter blood in tiny units called nephrons and make urine.","All these processes need energy, which is stored in cells as ATP."],"ex":"Photosynthesis equation: 6CO2 + 6H2O -> C6H12O6 + 6O2 (with sunlight and chlorophyll). Check: C 6 = 6; H 12 = 12; O 12 + 6 = 18 on left, 6 + 12 = 18 on right. Balanced. Respiration is the reverse: glucose + oxygen gives CO2, water and energy.","q":"class 10 life processes ncert biology hindi","kw":["nutrition","respiration","transportation","excretion","nephron"]},{"id":"electricity-ohms-law","t":"Electricity and Ohm's Law","s":"Current flows due to voltage, resistance slows it down, and V = IR links all three.","n":["Electric current (I) is the flow of charge. Unit: ampere (A). Measured with an ammeter in series.","Potential difference or voltage (V) pushes the current. Unit: volt (V). Measured with a voltmeter in parallel.","Ohm's law: V = I x R, where R is resistance in ohm (Ω). Thicker and shorter wires have less resistance.","Series: R = R1 + R2. Parallel: 1/R = 1/R1 + 1/R2. Houses use parallel wiring so each appliance gets full voltage.","Power P = V x I, unit watt (W). Electricity bills use kilowatt-hour (kWh), also called one unit."],"ex":"A 6 V battery is connected to a 3 Ω bulb. Step 1: I = V/R = 6/3 = 2 A. Step 2: P = V x I = 6 x 2 = 12 W. Also: a 1 kW heater runs 3 h. Energy = 1 x 3 = 3 kWh. At Rs 7/unit, cost = Rs 21.","q":"class 10 electricity ohms law ncert physics hindi","kw":["current","voltage","resistance","Ohm's law","electric power"]}]},"order":1},{"id":"physics","name":"Physics","nameHi":"भौतिकी","group":"science","blurb":"Physics studies matter, energy, motion and forces, from falling stones to electricity, light, atoms and the universe.","levels":{"11-12":[{"id":"kinematics","t":"Kinematics: Motion in a Line and Plane","s":"Kinematics describes motion using displacement, velocity and acceleration, without asking what causes the motion.","n":["Displacement is the shortest straight distance with direction. It is a vector (सदिश), like velocity and acceleration. Distance and speed are scalars.","For constant acceleration: v = u + at, s = ut + (1/2)at², v² = u² + 2as.","The slope of a position-time graph gives velocity. The slope of a velocity-time graph gives acceleration, and the area under it gives displacement.","Projectile motion: horizontal velocity stays constant, vertical motion has acceleration g = 9.8 m/s² downward. Range R = u² sin2θ / g.","Uniform circular motion has centripetal acceleration a = v²/r, always pointing to the centre."],"ex":"A scooter starts from rest with a = 2 m/s² for 5 s. Step 1: v = u + at = 0 + 2 x 5 = 10 m/s. Step 2: s = (1/2)at² = (1/2) x 2 x 25 = 25 m. Check: v² = 2as gives 100 = 2 x 2 x 25. Answer: 10 m/s, 25 m.","q":"class 11 kinematics motion in a straight line ncert physics hindi","kw":["kinematics","equations of motion","projectile","vectors","velocity-time graph"]},{"id":"laws-of-motion-work-energy","t":"Laws of Motion, Work and Energy","s":"Forces change motion, and work done by a force changes an object's energy.","n":["Newton's second law in full form: F = dp/dt, the rate of change of momentum. For constant mass, F = ma.","Friction opposes sliding. Limiting friction f = μN, where μ is the coefficient of friction and N is the normal force.","Work W = F s cosθ, unit joule (J). Kinetic energy KE = (1/2)mv². Potential energy near Earth PE = mgh.","Work-energy theorem: net work done = change in kinetic energy. Power = work / time, unit watt (W).","Momentum is conserved when no outside force acts. This explains gun recoil and collisions."],"ex":"A 2 kg ball moves at 3 m/s. Step 1: Momentum p = mv = 2 x 3 = 6 kg m/s. Step 2: KE = (1/2) x 2 x 3² = 9 J. Step 3: Lifted 5 m (g = 9.8), PE = 2 x 9.8 x 5 = 98 J. Answer: 6 kg m/s, 9 J, 98 J.","q":"class 11 laws of motion work energy power ncert physics hindi","kw":["Newton's laws","friction","work-energy theorem","momentum conservation","power"]},{"id":"thermodynamics-11","t":"Thermal Physics and Thermodynamics","s":"Thermodynamics studies heat, work and temperature, and tells us how engines and refrigerators work.","n":["Temperature measures how hot a body is. Heat is energy that flows from a hotter body to a colder one.","Zeroth law: if A and B are each in balance with C, then A and B have the same temperature.","First law: ΔQ = ΔU + ΔW. Heat given = increase in internal energy + work done by the gas. It is energy conservation.","Second law: heat cannot flow by itself from cold to hot, and no engine can convert all heat into work.","Carnot engine efficiency η = 1 - T2/T1, using kelvin temperatures. Real engines are always less efficient."],"ex":"An engine works between 500 K and 300 K. Maximum (Carnot) efficiency? Step 1: η = 1 - T2/T1 = 1 - 300/500. Step 2: η = 1 - 0.6 = 0.4. Answer: 40%. So at most 400 J of work can come from every 1000 J of heat taken in.","q":"class 11 thermodynamics laws carnot engine ncert physics hindi","kw":["thermodynamics","first law","second law","Carnot engine","internal energy"]},{"id":"electrostatics","t":"Electric Charges, Fields and Potential","s":"Electric charges push or pull each other, creating electric fields and potential around them.","n":["Charge is quantised: any charge is a whole number multiple of e = 1.6 x 10^-19 C. Like charges repel, unlike attract.","Coulomb's law: F = k q1 q2 / r², where k = 1/(4πε0) = 9 x 10^9 N m²/C².","Electric field E = F/q tells the force per unit charge. Gauss's law: total flux through a closed surface = q/ε0.","Electric potential V = kq/r. Potential difference is work done per unit charge, measured in volts.","A capacitor stores charge: C = Q/V. For a parallel plate capacitor C = ε0 A / d. Energy stored = (1/2)CV²."],"ex":"Two charges of 1 μC each are 1 m apart. Step 1: q1 = q2 = 1 x 10^-6 C, r = 1 m. Step 2: F = 9 x 10^9 x (10^-6 x 10^-6) / 1² = 9 x 10^9 x 10^-12. Step 3: F = 9 x 10^-3 N. Answer: 0.009 N, repulsive.","q":"class 12 electric charges and fields coulomb law gauss law hindi","kw":["Coulomb's law","electric field","Gauss's law","potential","capacitor"]},{"id":"current-electricity","t":"Current Electricity","s":"Current flows through circuits, and Ohm's law and Kirchhoff's rules help us solve any circuit.","n":["Current I = charge / time. Electrons drift slowly, but the electric signal travels very fast.","Ohm's law V = IR. Resistance R = ρL/A, where ρ is resistivity, L length and A cross-section area.","Series: R = R1 + R2 + ... Parallel: 1/R = 1/R1 + 1/R2 + ...","Kirchhoff's junction rule: current in = current out. Loop rule: sum of voltage changes around a closed loop is zero.","A real cell has internal resistance r, so terminal voltage V = E - Ir. A Wheatstone bridge balances when P/Q = R/S."],"ex":"A 12 V battery is joined to 2 Ω and 4 Ω in series. Step 1: R = 2 + 4 = 6 Ω. Step 2: I = 12/6 = 2 A. Step 3: Voltage across 4 Ω = 8 V. Parallel 3 Ω and 6 Ω: 1/R = 1/3 + 1/6 = 1/2, so R = 2 Ω.","q":"class 12 current electricity kirchhoff laws ncert physics hindi","kw":["Ohm's law","resistivity","Kirchhoff's laws","internal resistance","Wheatstone bridge"]},{"id":"magnetism-emi-ac","t":"Magnetism, EMI and AC","s":"Moving charges make magnetic fields, and changing magnetic fields make electric current; this runs generators and transformers.","n":["A current-carrying wire makes a magnetic field. Force on a moving charge: F = qvB sinθ (Lorentz force).","Faraday's law: induced emf = - rate of change of magnetic flux. Lenz's law gives the minus sign: induced current opposes the change.","A rod of length L moving at speed v across field B gets motional emf = BLv.","Alternating current (AC) changes direction regularly. In India household supply is 230 V at 50 Hz.","A transformer changes AC voltage: Vs/Vp = Ns/Np. Step-up raises voltage, step-down lowers it."],"ex":"A transformer has 100 turns in the primary and 500 in the secondary. Primary voltage is 220 V. Step 1: Vs/Vp = Ns/Np = 500/100 = 5. Step 2: Vs = 5 x 220 = 1100 V. Answer: 1100 V, a step-up transformer.","q":"class 12 electromagnetic induction alternating current transformer hindi","kw":["Faraday's law","Lenz's law","Lorentz force","alternating current","transformer"]},{"id":"optics","t":"Ray and Wave Optics","s":"Optics explains how mirrors, lenses and light waves form images, colours and patterns.","n":["Refraction: light bends when it enters a new medium. Snell's law: n1 sinθ1 = n2 sinθ2.","Lens formula: 1/v - 1/u = 1/f (sign convention: distances measured from the lens). Magnification m = v/u.","Total internal reflection happens when light goes from denser to rarer medium beyond the critical angle. Optical fibres use it.","Huygens' principle treats each point on a wavefront as a new source. It explains reflection and refraction as waves.","Young's double slit shows interference. Fringe width β = λD/d. Diffraction and polarisation also show light is a wave."],"ex":"An object is 30 cm in front of a convex lens with f = +10 cm. Step 1: u = -30 cm. Step 2: 1/v = 1/f + 1/u = 1/10 - 1/30 = 2/30. Step 3: v = +15 cm. Step 4: m = v/u = 15/(-30) = -0.5. Answer: real, inverted, half-size image 15 cm behind the lens.","q":"class 12 ray optics lens formula wave optics ncert hindi","kw":["refraction","lens formula","total internal reflection","interference","Huygens principle"]},{"id":"modern-physics","t":"Dual Nature, Atoms and Nuclei","s":"Light behaves as both wave and particle, and atoms and nuclei follow surprising new rules.","n":["Light comes in packets called photons. Energy E = hν = hc/λ, where h = 6.63 x 10^-34 J s.","Photoelectric effect: KEmax = hν - φ, where φ is the work function. Einstein explained it in 1905.","Matter also has a wave nature: de Broglie wavelength λ = h/p.","Bohr model of hydrogen: energy levels En = -13.6/n² eV. Light is emitted when an electron jumps down a level.","Nucleus: protons and neutrons held by strong force. Radioactive decay N = N0 e^(-λt). Fission powers nuclear reactors; fusion powers the Sun."],"ex":"Light of 500 nm falls on a metal with work function 2.0 eV. Step 1: Use hc = 1240 eV nm. Step 2: E = 1240/500 = 2.48 eV. Step 3: KEmax = 2.48 - 2.0 = 0.48 eV. Answer: electrons come out with up to 0.48 eV of kinetic energy.","q":"class 12 dual nature of radiation atoms nuclei ncert physics hindi","kw":["photoelectric effect","photon","de Broglie","Bohr model","radioactivity"]}],"ug":[{"id":"classical-mechanics","t":"Classical Mechanics","s":"Lagrangian and Hamiltonian methods give a powerful, general way to find equations of motion.","n":["Generalised coordinates (like an angle θ) describe a system with the fewest variables. Constraints reduce degrees of freedom.","Lagrangian L = T - V (kinetic minus potential energy). Euler-Lagrange equation: d/dt(∂L/∂q̇) - ∂L/∂q = 0.","Hamiltonian H = T + V for many systems, and Hamilton's equations give first-order equations of motion.","Central forces and Kepler's laws: planets move in ellipses, and angular momentum is conserved.","Rigid body motion uses moment of inertia and torque. Small oscillations near equilibrium behave like simple harmonic motion."],"ex":"Simple pendulum: L = (1/2)m l² θ̇² + m g l cosθ. Euler-Lagrange gives θ̈ = -(g/l) sinθ. For small θ, sinθ ≈ θ, so ω = √(g/l). With l = 1 m, g = 9.8 m/s²: T = 2π√(1/9.8) = 2π x 0.319 = 2.0 s (approx).","q":"bsc physics classical mechanics lagrangian hamiltonian lecture","kw":["Lagrangian","Hamiltonian","generalised coordinates","central force","rigid body"]},{"id":"electromagnetism","t":"Electricity and Magnetism (Maxwell's Equations)","s":"Four Maxwell equations describe all electric and magnetic effects and predict light as an electromagnetic wave.","n":["Vector calculus tools: gradient, divergence and curl. Electric field E = -∇V in electrostatics.","Gauss's law ∇·E = ρ/ε0 and no magnetic monopoles ∇·B = 0.","Faraday's law ∇×E = -∂B/∂t. Ampere-Maxwell law ∇×B = μ0 J + μ0ε0 ∂E/∂t, where the last term is displacement current.","In empty space these combine into a wave equation with speed c = 1/√(μ0ε0).","Dielectrics get polarised, and magnetic materials are dia-, para- or ferromagnetic. Boundary conditions connect fields across surfaces."],"ex":"Find the speed of EM waves. Step 1: μ0 = 4π x 10^-7 H/m, ε0 = 8.85 x 10^-12 F/m. Step 2: μ0ε0 = 1.112 x 10^-17 s²/m². Step 3: √ = 3.335 x 10^-9 s/m. Step 4: c = 1/3.335 x 10^-9 ≈ 3.0 x 10^8 m/s. This matches the speed of light.","q":"bsc physics electromagnetic theory maxwell equations lecture hindi","kw":["Maxwell's equations","displacement current","divergence","curl","electromagnetic wave"]},{"id":"thermal-statistical-physics","t":"Thermal and Statistical Physics","s":"Statistical physics explains heat and temperature by counting the ways a huge number of particles can arrange themselves.","n":["Kinetic theory: gas pressure comes from molecules hitting the walls. Average kinetic energy per molecule = (3/2)kT.","Entropy S measures disorder. Boltzmann's formula: S = k ln W, where W is the number of microstates.","Thermodynamic potentials (U, H, F, G) and Maxwell relations connect measurable quantities.","Maxwell-Boltzmann statistics applies to classical particles. Bose-Einstein applies to bosons (photons) and Fermi-Dirac to fermions (electrons).","Black body radiation: Planck's law fixed the classical ultraviolet problem. Wien's law: λmax T = 2.9 x 10^-3 m K."],"ex":"Average kinetic energy of a gas molecule at 300 K. Step 1: k = 1.38 x 10^-23 J/K. Step 2: KE = (3/2)kT = 1.5 x 1.38 x 10^-23 x 300. Step 3: KE = 6.21 x 10^-21 J. Step 4: In eV, divide by 1.6 x 10^-19: about 0.039 eV.","q":"bsc physics thermal and statistical physics lecture","kw":["kinetic theory","entropy","Boltzmann","Fermi-Dirac","black body radiation"]},{"id":"quantum-mechanics-ug","t":"Quantum Mechanics","s":"Quantum mechanics uses wavefunctions and the Schrodinger equation to describe very small particles like electrons.","n":["The wavefunction ψ holds all information about a particle. |ψ|² gives the probability of finding it at a place.","Heisenberg uncertainty: Δx Δp ≥ ħ/2. We cannot know exact position and momentum together.","Time-independent Schrodinger equation: -(ħ²/2m) d²ψ/dx² + Vψ = Eψ. Solutions give allowed energies.","Particle in a box: En = n²h²/(8mL²). Energy is quantised and the lowest energy is not zero.","Harmonic oscillator En = (n + 1/2)ħω. Hydrogen atom solutions give quantum numbers n, l, m and orbitals."],"ex":"Electron in a 1 nm box, ground state. Step 1: E1 = h²/(8mL²). Step 2: h² = (6.626 x 10^-34)² = 4.39 x 10^-67. Step 3: 8mL² = 8 x 9.11 x 10^-31 x 10^-18 = 7.29 x 10^-48. Step 4: E1 = 6.02 x 10^-20 J = 0.38 eV.","q":"bsc physics quantum mechanics schrodinger equation particle in a box hindi","kw":["wavefunction","Schrodinger equation","uncertainty principle","particle in a box","quantisation"]},{"id":"waves-and-optics","t":"Waves and Optics","s":"Waves carry energy without carrying matter, and their interference and diffraction explain many optical effects.","n":["Simple harmonic motion x = A sin(ωt + φ). Damped and forced oscillations show resonance when driving frequency matches natural frequency.","A wave y = A sin(kx - ωt) has speed v = ω/k = fλ. Superposition gives beats and standing waves.","Interference needs coherent sources. Young's fringes: β = λD/d. Thin films and Newton's rings also show interference.","Diffraction is bending around edges. A grating gives sharp maxima at d sinθ = nλ.","Polarisation shows light is a transverse wave. Malus's law: I = I0 cos²θ. Lasers give coherent, monochromatic light."],"ex":"Young's double slit: λ = 600 nm, slit gap d = 0.5 mm, screen distance D = 1 m. Step 1: β = λD/d. Step 2: β = (600 x 10^-9 x 1) / (0.5 x 10^-3). Step 3: β = 1.2 x 10^-3 m. Answer: fringe width 1.2 mm.","q":"bsc physics waves and optics interference diffraction lecture hindi","kw":["SHM","interference","diffraction","polarisation","resonance"]},{"id":"electronics","t":"Analog and Digital Electronics","s":"Electronics uses semiconductor devices like diodes, transistors and op-amps to control signals in phones and computers.","n":["Semiconductors like silicon can be doped: n-type has extra electrons, p-type has holes. A p-n junction makes a diode.","A diode allows current one way. It is used in rectifiers that change AC to DC. A Zener diode keeps voltage steady.","A transistor (BJT or MOSFET) works as an amplifier or switch. Current gain β = IC/IB in a BJT.","An op-amp is a high-gain amplifier. Inverting amplifier gain = -Rf/Rin.","Digital electronics uses 0 and 1. Logic gates (AND, OR, NOT, NAND) and Boolean algebra build counters and memory."],"ex":"Inverting op-amp with Rf = 100 kΩ, Rin = 10 kΩ, input 0.2 V. Step 1: Gain = -Rf/Rin = -100/10 = -10. Step 2: Vout = -10 x 0.2 = -2 V. Answer: -2 V (10 times bigger, sign flipped).","q":"bsc physics electronics diode transistor op amp lecture hindi","kw":["semiconductor","diode","transistor","op-amp","logic gates"]},{"id":"mathematical-physics","t":"Mathematical Physics","s":"Mathematical physics gives the tools, like vectors, matrices and differential equations, needed to solve physics problems.","n":["Vector calculus: gradient, divergence, curl, and the theorems of Gauss and Stokes link volume, surface and line integrals.","Ordinary differential equations describe change. First-order equations like dN/dt = -λN give exponential decay.","Matrices, eigenvalues and eigenvectors are central to quantum mechanics and coupled oscillations.","Fourier series and transforms break any signal into sine and cosine waves.","Special functions (Legendre, Bessel, Hermite) appear when solving Laplace and Schrodinger equations in different shapes."],"ex":"Solve dN/dt = -λN and find half-life when λ = 0.1 per day. Step 1: Solution N = N0 e^(-λt). Step 2: Half-life: N0/2 = N0 e^(-λT), so T = ln2/λ. Step 3: T = 0.693/0.1 = 6.93 days. Answer: about 6.9 days.","q":"bsc physics mathematical physics differential equations fourier series lecture","kw":["vector calculus","differential equations","eigenvalues","Fourier series","special functions"]},{"id":"special-relativity","t":"Special Relativity","s":"Einstein's special relativity shows that time and length change at very high speeds, and mass is a form of energy.","n":["Two postulates: laws of physics are the same in all inertial frames, and the speed of light c is the same for every observer.","Lorentz factor γ = 1/√(1 - v²/c²). It is close to 1 at everyday speeds.","Time dilation: moving clocks run slow, Δt = γΔt0. Length contraction: moving objects are shorter, L = L0/γ.","Mass-energy equivalence: E = mc². Total energy E² = (pc)² + (mc²)².","Evidence: muons from cosmic rays reach the ground because their lifetime is stretched. GPS satellites must correct for relativity."],"ex":"A spaceship moves at v = 0.6c and its clock shows 10 years. Step 1: v²/c² = 0.36. Step 2: γ = 1/√(1 - 0.36) = 1/0.8 = 1.25. Step 3: Earth time = γ x 10 = 12.5 years. Answer: 12.5 years pass on Earth.","q":"bsc physics special theory of relativity lorentz transformation hindi","kw":["Lorentz transformation","time dilation","length contraction","E = mc²","inertial frame"]}],"pg":[{"id":"advanced-quantum-mechanics","t":"Advanced Quantum Mechanics","s":"PG quantum mechanics uses Dirac notation, angular momentum, spin and approximation methods to solve real atoms.","n":["Dirac bra-ket notation: states are vectors |ψ> in Hilbert space; observables are Hermitian operators with real eigenvalues.","Angular momentum: L² has eigenvalues l(l+1)ħ². Spin-1/2 particles like electrons are described by Pauli matrices.","Perturbation theory gives approximate energies when a small extra term is added to a solvable Hamiltonian.","Variational method gives an upper bound to ground-state energy. WKB method handles slowly varying potentials and tunnelling.","Scattering theory, identical particles (Pauli exclusion) and an introduction to relativistic Dirac equation complete the course."],"ex":"Hydrogen En = -13.6/n² eV. Transition n = 2 to n = 1. Step 1: E2 = -3.4 eV, E1 = -13.6 eV. Step 2: ΔE = 10.2 eV. Step 3: λ = 1240/10.2 = 121.6 nm. Answer: ultraviolet Lyman-alpha line, 121.6 nm.","q":"msc physics advanced quantum mechanics perturbation theory angular momentum lecture","kw":["Dirac notation","angular momentum","spin","perturbation theory","scattering"]},{"id":"statistical-mechanics","t":"Statistical Mechanics","s":"Statistical mechanics connects tiny particle behaviour to bulk properties like pressure, heat capacity and phase changes.","n":["Ensembles: microcanonical (fixed energy), canonical (fixed temperature) and grand canonical (particles can enter and leave).","Partition function Z = Σ e^(-βE), with β = 1/kT. Free energy F = -kT ln Z gives all thermodynamics.","Quantum gases: Bose-Einstein condensation at low temperature; Fermi gas explains electrons in metals and white dwarfs.","Phase transitions: first-order (latent heat) and continuous (critical points). The Ising model is the standard example.","Fluctuations and non-equilibrium ideas: Brownian motion, Langevin equation and fluctuation-dissipation theorem."],"ex":"Two-level system: energies 0 and ε, with ε = kT. Step 1: Z = 1 + e^(-1) = 1 + 0.368 = 1.368. Step 2: Probability of upper level = e^(-1)/Z = 0.368/1.368. Step 3: = 0.269. Answer: about 27% of particles are in the upper level.","q":"msc physics statistical mechanics partition function ensembles lecture","kw":["partition function","ensembles","Bose-Einstein condensation","Ising model","phase transitions"]},{"id":"electromagnetic-theory","t":"Classical Electrodynamics","s":"Classical electrodynamics studies EM waves in matter, guided waves, radiation from moving charges and relativistic fields.","n":["Potentials and gauges: E and B come from scalar potential φ and vector potential A. Lorenz and Coulomb gauges simplify equations.","Poynting vector S = (1/μ0) E x B gives energy flow. EM waves carry momentum and exert radiation pressure.","In conductors waves die out within the skin depth δ = √(2/(μσω)). Waveguides carry only certain modes above a cut-off frequency.","Accelerating charges radiate. Larmor formula gives radiated power; antennas and synchrotron light depend on this.","Covariant form: the field tensor F^μν combines E and B, showing electrodynamics fits special relativity."],"ex":"Skin depth of copper at 1 MHz (σ = 5.96 x 10^7 S/m). Step 1: ω = 2π x 10^6 = 6.28 x 10^6 rad/s. Step 2: μσω = 4π x 10^-7 x 5.96 x 10^7 x 6.28 x 10^6 = 4.70 x 10^8. Step 3: δ = √(2/4.70 x 10^8) = 6.5 x 10^-5 m. Answer: about 65 μm.","q":"msc physics classical electrodynamics jackson radiation waveguides lecture","kw":["Poynting vector","skin depth","waveguide","radiation","gauge"]},{"id":"condensed-matter","t":"Condensed Matter Physics","s":"Condensed matter physics explains why solids are metals, insulators, magnets or superconductors using crystal structure and electrons.","n":["Crystals have a lattice and basis. X-ray diffraction follows Bragg's law 2d sinθ = nλ and reveals atomic spacing.","Lattice vibrations are quantised as phonons. Debye model explains heat capacity of solids at low temperature.","Free electron and band theory: electrons in a periodic lattice form energy bands. A band gap decides metal, semiconductor or insulator.","Magnetism: diamagnetism, paramagnetism, ferromagnetism and antiferromagnetism come from electron spins and exchange interaction.","Superconductivity: zero resistance and expulsion of magnetic field (Meissner effect) below a critical temperature, explained by BCS theory."],"ex":"Bragg's law with Cu X-rays λ = 0.154 nm, plane spacing d = 0.2 nm, first order. Step 1: sinθ = nλ/2d = 0.154/0.4. Step 2: sinθ = 0.385. Step 3: θ = sin^-1(0.385) ≈ 22.6°. Answer: a bright peak appears at θ ≈ 22.6° (2θ ≈ 45.3°).","q":"msc physics solid state condensed matter band theory lecture","kw":["Bragg's law","phonons","band theory","magnetism","superconductivity"]},{"id":"nuclear-physics","t":"Nuclear Physics","s":"Nuclear physics studies the nucleus, its binding energy, radioactive decay, and reactions like fission and fusion.","n":["Nuclear radius R ≈ R0 A^(1/3), with R0 ≈ 1.2 fm. Nuclear density is nearly the same for all nuclei.","Mass defect: the nucleus weighs less than its parts. Binding energy = Δm c², using 1 u = 931.5 MeV.","Semi-empirical mass formula (liquid drop model) explains binding energy curve, peaking near iron-56.","Shell model explains magic numbers (2, 8, 20, 28, 50, 82, 126) where nuclei are extra stable.","Alpha, beta and gamma decay; nuclear reactions, Q-value, fission in reactors and fusion in stars."],"ex":"Binding energy of helium-4. Step 1: 2 H atoms + 2 neutrons = 2(1.007825) + 2(1.008665) = 4.032980 u. Step 2: He-4 atom = 4.002603 u. Step 3: Δm = 0.030377 u. Step 4: BE = 0.030377 x 931.5 = 28.3 MeV, about 7.07 MeV per nucleon.","q":"msc physics nuclear physics binding energy shell model lecture","kw":["binding energy","mass defect","liquid drop model","shell model","radioactive decay"]},{"id":"particle-physics","t":"Particle Physics","s":"Particle physics studies the smallest building blocks, quarks and leptons, and the forces between them.","n":["The Standard Model has 6 quarks, 6 leptons, force carriers (photon, gluons, W and Z bosons) and the Higgs boson.","Four forces: strong, electromagnetic, weak and gravity. Gravity is not yet part of the Standard Model.","Conservation laws: charge, baryon number and lepton number are conserved in all observed reactions.","Quarks combine into hadrons: baryons (3 quarks, like proton uud) and mesons (quark + antiquark).","Symmetries and Feynman diagrams describe interactions. The Higgs boson was discovered at CERN in 2012."],"ex":"Check neutron decay n -> p + e- + antineutrino. Charge: 0 = +1 - 1 + 0. Baryon number: 1 = 1 + 0 + 0. Lepton number: 0 = 0 + 1 - 1. Energy: neutron mass is greater than proton + electron mass, so decay is allowed. Answer: all conservation laws hold.","q":"msc physics particle physics standard model quarks leptons lecture","kw":["Standard Model","quarks","leptons","conservation laws","Higgs boson"]},{"id":"computational-physics","t":"Computational Physics","s":"Computational physics uses computer programs to solve equations that are too hard to solve by hand.","n":["Languages like Python, C or Fortran are common. Libraries like NumPy and SciPy save time.","Numerical differentiation and integration (trapezoidal, Simpson's rule) approximate calculus on a computer.","ODE solvers: Euler method is simple but rough; Runge-Kutta (RK4) is much more accurate.","Monte Carlo methods use random numbers to study systems like the Ising model or to estimate integrals.","Always check errors: compare with exact results, reduce step size, and watch for round-off error."],"ex":"Solve dy/dt = -y, y(0) = 1, with Euler step h = 0.1. Step 1: y1 = y0 + h(-y0) = 1 - 0.1 = 0.9. Step 2: y2 = 0.9 - 0.09 = 0.81. Step 3: Exact y(0.2) = e^(-0.2) = 0.8187. Error ≈ 0.009, so use smaller h or RK4.","q":"computational physics python numerical methods runge kutta lecture","kw":["numerical methods","Runge-Kutta","Monte Carlo","Python","simulation"]}],"phd":[{"id":"physics-research-methods","t":"Research Methods in Physics","s":"Physics research means asking a clear question, measuring carefully, analysing errors honestly and publishing results.","n":["Start with a literature review using arXiv, Google Scholar and journals. Find a gap that is small enough to work on.","Every measurement has uncertainty. Report results as value ± error, and propagate errors correctly.","Data analysis: curve fitting, chi-square tests and plotting with Python or Origin. Keep raw data and code safely.","Write papers with a clear structure: abstract, introduction, methods, results, discussion. Expect peer review and revisions.","Research ethics: never fabricate or copy data, cite others fairly, and follow lab safety rules."],"ex":"A student measures g five times: 9.78, 9.82, 9.80, 9.79, 9.81 m/s². Mean = 49.00/5 = 9.80. Standard deviation ≈ 0.016, standard error = 0.016/√5 ≈ 0.007. Report g = 9.800 ± 0.007 m/s².","q":"research methodology for physics phd error analysis paper writing","kw":["research methodology","error analysis","literature review","peer review","research ethics"]},{"id":"quantum-technologies","t":"Quantum Information and Technologies","s":"Quantum technologies use superposition and entanglement for new kinds of computers, secure communication and sensors.","n":["A qubit can be in a superposition of 0 and 1. Entanglement links qubits so measuring one affects the description of the other.","Quantum computers use gates on qubits. Algorithms like Shor's (factoring) and Grover's (search) can beat classical methods.","Decoherence destroys quantum states, so error correction and very cold or isolated systems are needed.","Quantum key distribution (like BB84) allows secure communication where eavesdropping can be detected.","India approved a National Quantum Mission in 2023 to support research in quantum computing, communication and sensing."],"ex":"Two qubits can hold amplitudes for 4 states (00, 01, 10, 11). In general n qubits need 2^n numbers to describe. For 50 qubits: 2^50 ≈ 1.1 x 10^15 amplitudes, too many for an ordinary computer to store easily.","q":"quantum computing quantum information lecture series for researchers","kw":["qubit","entanglement","quantum computing","decoherence","quantum cryptography"]},{"id":"quantum-materials","t":"Quantum Materials and Nanoscience","s":"New materials like graphene, topological insulators and 2D materials show unusual quantum behaviour useful for future devices.","n":["Graphene is a single layer of carbon atoms. Its electrons behave like massless particles and move very fast.","Topological insulators conduct only on their surface, protected by symmetry.","Twisted bilayer materials and strongly correlated systems can show superconductivity and unusual magnetism.","Tools include ARPES, scanning tunnelling microscopy, transport measurements and density functional theory (DFT).","Applications range from faster electronics and spintronics to sensors and energy devices."],"ex":"A typical project: grow a thin film, measure resistance from 300 K down to 2 K, and see if resistance suddenly drops to zero. If it does, test the Meissner effect with a magnetometer before claiming superconductivity. Many false claims fail this second check.","q":"quantum materials graphene topological insulators research lecture","kw":["graphene","topological insulator","2D materials","DFT","spintronics"]},{"id":"astrophysics-cosmology","t":"Astrophysics, Cosmology and Gravitational Waves","s":"Frontier research studies stars, black holes, the expanding universe, dark matter and ripples in spacetime.","n":["General relativity describes gravity as curved spacetime. Black holes and gravitational waves are its predictions.","Gravitational waves were first detected by LIGO in 2015. LIGO-India received government approval in 2023.","Cosmology: the universe is expanding (Hubble's law v = H0 d). Dark matter and dark energy make up most of it.","Indian facilities include GMRT radio telescope near Pune and the AstroSat space observatory launched by ISRO.","Research uses huge data sets, simulations and careful statistics to compare theory with observation."],"ex":"Hubble's law: a galaxy 100 Mpc away with H0 ≈ 70 km/s/Mpc. Step 1: v = H0 x d. Step 2: v = 70 x 100 = 7000 km/s. Answer: it moves away at about 7000 km/s. (H0 is still debated, roughly 67 to 73.)","q":"astrophysics cosmology gravitational waves lecture for researchers","kw":["general relativity","gravitational waves","cosmology","dark matter","Hubble's law"]},{"id":"high-energy-frontiers","t":"High Energy Physics Frontiers","s":"High energy physics looks beyond the Standard Model to explain neutrino mass, dark matter and quantum gravity.","n":["Neutrinos change type as they travel (oscillation), proving they have a small mass, not explained by the original Standard Model.","Searches for new particles happen at colliders like the LHC at CERN. Indian scientists take part in CMS and ALICE.","Open puzzles: why matter beats antimatter, what dark matter is, and how to join gravity with quantum theory.","Theory directions include supersymmetry, effective field theories, string theory and lattice QCD computations.","A PhD here needs strong quantum field theory, programming and statistics for big data analysis."],"ex":"In collider searches a discovery needs about 5 sigma significance, meaning the chance that background alone gives such a signal is about 1 in 3.5 million. The Higgs boson was announced in 2012 only after both ATLAS and CMS reached this level.","q":"beyond standard model neutrino physics high energy physics lecture","kw":["neutrino oscillation","LHC","beyond Standard Model","quantum field theory","dark matter"]}]},"order":2},{"id":"chemistry","name":"Chemistry","nameHi":"रसायन विज्ञान","group":"science","blurb":"Chemistry studies what substances are made of, how atoms bond, and how substances change into new ones.","levels":{"11-12":[{"id":"mole-concept-stoichiometry","t":"Mole Concept and Stoichiometry","s":"The mole lets chemists count atoms by weighing, and stoichiometry tells how much of each substance reacts.","n":["One mole = 6.022 x 10^23 particles (Avogadro's number). Molar mass is the mass of one mole in grams.","Moles = given mass / molar mass. At STP, one mole of an ideal gas takes about 22.4 L (older NCERT value).","Molarity (M) = moles of solute / litres of solution. Molality (m) = moles of solute / kg of solvent.","A balanced equation gives mole ratios. Use them to find how much product forms.","The limiting reagent is the reactant that finishes first and decides how much product can form."],"ex":"How many moles and molecules are in 22 g of CO2? Step 1: Molar mass = 12 + 2 x 16 = 44 g/mol. Step 2: Moles = 22/44 = 0.5 mol. Step 3: Molecules = 0.5 x 6.022 x 10^23 = 3.011 x 10^23. Step 4: Volume at STP = 0.5 x 22.4 = 11.2 L.","q":"class 11 some basic concepts of chemistry mole concept hindi","kw":["mole concept","molar mass","molarity","limiting reagent","stoichiometry"]},{"id":"atomic-structure","t":"Structure of Atom","s":"Atoms have a tiny nucleus with electrons arranged in shells and orbitals described by quantum numbers.","n":["Thomson found the electron, Rutherford found the nucleus, and Bohr gave fixed energy levels for hydrogen.","The quantum mechanical model describes electrons in orbitals (s, p, d, f) where they are most likely to be found.","Four quantum numbers: n (shell), l (shape), ml (orientation) and ms (spin, +1/2 or -1/2).","Aufbau principle: fill lower energy orbitals first. Pauli: no two electrons have all four quantum numbers same. Hund: fill singly first.","Order of filling: 1s 2s 2p 3s 3p 4s 3d 4p ... Exceptions include Cr and Cu."],"ex":"Write the electronic configuration of iron (Z = 26). Step 1: 1s² 2s² 2p⁶ = 10. Step 2: 3s² 3p⁶ = 8, total 18. Step 3: 4s² 3d⁶ = 8, total 26. Answer: 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶ 4s², or [Ar] 3d⁶ 4s².","q":"class 11 structure of atom quantum numbers electronic configuration hindi","kw":["quantum numbers","orbitals","Aufbau principle","Hund's rule","Bohr model"]},{"id":"chemical-bonding","t":"Periodic Table and Chemical Bonding","s":"Periodic trends explain how atoms behave, and bonds form when atoms share or transfer electrons to become stable.","n":["Across a period atomic size decreases and electronegativity increases. Down a group size increases.","Ionic bonds form by electron transfer (NaCl). Covalent bonds form by sharing (H2, CH4).","VSEPR theory: electron pairs repel and spread out. This decides molecular shape.","Hybridisation: sp (linear, 180°), sp² (trigonal planar, 120°), sp³ (tetrahedral, 109.5°).","Molecular orbital theory gives bond order = (bonding - antibonding electrons)/2 and explains magnetism of O2."],"ex":"Shapes from VSEPR: CH4 has 4 bond pairs, so tetrahedral, 109.5°. NH3 has 3 bond pairs + 1 lone pair, so pyramidal, about 107°. H2O has 2 bond pairs + 2 lone pairs, so bent, about 104.5°. Lone pairs push harder, so angles get smaller.","q":"class 11 chemical bonding vsepr hybridisation ncert hindi","kw":["periodic trends","ionic bond","covalent bond","VSEPR","hybridisation"]},{"id":"chemical-thermodynamics","t":"Chemical Thermodynamics","s":"Thermodynamics tells us the heat change in a reaction and whether it will happen on its own.","n":["System is what we study, surroundings are everything else. Enthalpy change ΔH is heat change at constant pressure.","Negative ΔH means exothermic (heat released); positive ΔH means endothermic (heat absorbed).","Hess's law: total ΔH is the same whatever path the reaction takes, so enthalpies can be added.","Entropy (S) measures disorder. Gibbs free energy: ΔG = ΔH - TΔS.","If ΔG is negative the reaction is spontaneous. ΔG° = -RT ln K links free energy with equilibrium constant."],"ex":"N2 + 3H2 -> 2NH3 at 298 K: ΔH° = -92.2 kJ, ΔS° = -198.7 J/K. Step 1: Convert ΔS = -0.1987 kJ/K. Step 2: TΔS = 298 x (-0.1987) = -59.2 kJ. Step 3: ΔG = -92.2 - (-59.2) = -33.0 kJ. Answer: negative, so spontaneous at 298 K.","q":"class 11 chemical thermodynamics enthalpy entropy gibbs energy hindi","kw":["enthalpy","Hess's law","entropy","Gibbs free energy","spontaneity"]},{"id":"equilibrium","t":"Chemical and Ionic Equilibrium","s":"In equilibrium the forward and backward reactions run at the same speed, so amounts stop changing.","n":["Equilibrium is dynamic: both reactions continue, but concentrations stay constant.","Equilibrium constant Kc = [products]/[reactants], each raised to its coefficient power.","Le Chatelier's principle: if conditions change, the equilibrium shifts to reduce that change. Haber process uses high pressure.","pH = -log[H+]. For water at 25°C, [H+][OH-] = 10^-14, so pH + pOH = 14.","Buffers resist pH change. Blood is kept near pH 7.4 by buffers. Solubility product Ksp explains precipitation."],"ex":"pH of 0.001 M HCl: [H+] = 10^-3, so pH = 3. pH of 0.01 M NaOH: Step 1: [OH-] = 10^-2, so pOH = 2. Step 2: pH = 14 - 2 = 12. Answer: 3 (acidic) and 12 (basic).","q":"class 11 equilibrium le chatelier ionic equilibrium ph hindi","kw":["equilibrium constant","Le Chatelier","pH","buffer","solubility product"]},{"id":"electrochemistry","t":"Electrochemistry","s":"Electrochemistry studies how chemical reactions make electricity in cells, and how electricity drives reactions.","n":["A galvanic cell turns chemical energy into electrical energy. Oxidation happens at the anode, reduction at the cathode.","Standard cell potential E°cell = E°cathode - E°anode, using standard reduction potentials.","Nernst equation: E = E° - (0.059/n) log Q at 298 K. It gives potential at any concentration.","Gibbs energy and cell potential: ΔG° = -nFE°, with F = 96500 C/mol.","Electrolysis uses electricity to cause a reaction. Faraday's laws relate charge passed to mass deposited. Batteries and corrosion are applications."],"ex":"Daniell cell (Zn | Zn²+ || Cu²+ | Cu). E°Cu = +0.34 V, E°Zn = -0.76 V. Step 1: E°cell = 0.34 - (-0.76) = 1.10 V. Step 2: n = 2. Step 3: ΔG° = -2 x 96500 x 1.10 = -212300 J = -212.3 kJ. Answer: 1.10 V, spontaneous.","q":"class 12 electrochemistry nernst equation ncert chemistry hindi","kw":["galvanic cell","electrode potential","Nernst equation","electrolysis","Faraday's laws"]},{"id":"chemical-kinetics","t":"Chemical Kinetics","s":"Chemical kinetics studies how fast reactions happen and what factors speed them up or slow them down.","n":["Rate of reaction = change in concentration per unit time. Concentration, temperature, catalyst and surface area affect it.","Rate law: rate = k[A]^x[B]^y. Order = x + y, found by experiment, not from the balanced equation.","First-order reaction: ln([A]0/[A]) = kt. Half-life t½ = 0.693/k, independent of starting amount.","Arrhenius equation: k = A e^(-Ea/RT). Ea is activation energy; higher temperature makes reactions faster.","A catalyst lowers activation energy without being used up. Enzymes are biological catalysts."],"ex":"A first-order reaction has k = 0.0693 per min. Step 1: t½ = 0.693/k = 0.693/0.0693 = 10 min. Step 2: After 30 min = 3 half-lives. Step 3: Fraction left = (1/2)³ = 1/8. Answer: 12.5% remains after 30 min.","q":"class 12 chemical kinetics first order half life arrhenius hindi","kw":["rate law","order of reaction","half-life","Arrhenius equation","catalyst"]},{"id":"organic-chemistry-basics","t":"Organic Chemistry: Basics and Reactions","s":"Organic chemistry studies carbon compounds, how to name them, and how they react step by step.","n":["IUPAC naming: find the longest carbon chain, number it to give functional groups the lowest number, then name substituents.","Electronic effects (inductive, resonance, hyperconjugation) make some parts of a molecule electron-rich or electron-poor.","Reaction types: substitution, addition, elimination and rearrangement. Nucleophiles love positive centres; electrophiles love electrons.","SN2 is one step with inversion of configuration. SN1 goes through a carbocation and favours tertiary halides.","Key families: hydrocarbons, haloalkanes, alcohols, aldehydes, ketones, carboxylic acids, amines and biomolecules."],"ex":"CH3Br + OH- -> CH3OH + Br-. Step 1: OH- (nucleophile) attacks carbon from the side opposite to Br. Step 2: C-O bond forms as C-Br bond breaks, in one step. Step 3: Rate = k[CH3Br][OH-], second order. Answer: SN2 mechanism, product methanol.","q":"class 12 haloalkanes sn1 sn2 organic chemistry ncert hindi","kw":["IUPAC nomenclature","nucleophile","SN1","SN2","functional groups"]}],"ug":[{"id":"quantum-chemistry-mo","t":"Quantum Chemistry and Molecular Orbitals","s":"Quantum chemistry applies the Schrodinger equation to atoms and molecules to explain bonding and spectra.","n":["Schrodinger equation Hψ = Eψ. For hydrogen it gives orbitals and energies; for bigger atoms we use approximations.","LCAO: molecular orbitals are made by adding or subtracting atomic orbitals, giving bonding and antibonding orbitals.","Bond order = (bonding electrons - antibonding electrons)/2. Higher bond order means a stronger, shorter bond.","Unpaired electrons make a molecule paramagnetic (attracted by a magnet). O2 is paramagnetic, N2 is not.","Huckel theory gives simple π-orbital energies for conjugated molecules like benzene and butadiene."],"ex":"O2 valence MO filling: σ2s² σ*2s² σ2p² π2p⁴ π*2p². Step 1: Bonding = 2 + 2 + 4 = 8. Step 2: Antibonding = 2 + 2 = 4. Step 3: Bond order = (8 - 4)/2 = 2. Step 4: Two unpaired electrons in π*. Answer: double bond, paramagnetic.","q":"bsc chemistry quantum chemistry molecular orbital theory lecture hindi","kw":["Schrodinger equation","LCAO","bond order","paramagnetism","Huckel theory"]},{"id":"coordination-chemistry","t":"Coordination Chemistry","s":"Coordination compounds have a central metal ion bonded to ligands, giving bright colours and magnetic properties.","n":["A ligand donates an electron pair to a metal. Coordination number is how many donor atoms attach to the metal.","Werner's theory explained primary and secondary valency. IUPAC names list ligands alphabetically before the metal.","Crystal field theory: ligands split d-orbitals. In octahedral complexes, eg is higher than t2g by Δo.","Strong-field ligands (CN-, CO) give low-spin complexes; weak-field ligands (F-, H2O) usually give high-spin.","Spin-only magnetic moment μ = √(n(n+2)) BM, where n is unpaired electrons. Colour comes from d-d transitions."],"ex":"[CoF6]³- : Co³+ is d⁶, F- is weak-field, so high spin: t2g⁴ eg². Unpaired n = 4. μ = √(4 x 6) = √24 = 4.90 BM. [Co(NH3)6]³+ : NH3 is strong-field for Co³+, low spin t2g⁶, n = 0, diamagnetic.","q":"bsc chemistry coordination compounds crystal field theory lecture hindi","kw":["ligand","crystal field theory","high spin","low spin","magnetic moment"]},{"id":"organic-reaction-mechanisms","t":"Organic Reaction Mechanisms","s":"Mechanisms show, arrow by arrow, how electrons move when organic molecules react.","n":["Curly arrows show movement of an electron pair, from electron-rich to electron-poor sites.","Reactive intermediates: carbocations, carbanions, free radicals and carbenes. Tertiary carbocations are most stable.","Electrophilic addition to alkenes follows Markovnikov's rule: H goes to the carbon that already has more H.","Elimination: E2 is one step and needs anti-periplanar H; E1 goes through a carbocation. Zaitsev product is usually major.","Aromatic compounds undergo electrophilic substitution (nitration, halogenation). Substituents direct to ortho/para or meta positions."],"ex":"Propene + HBr. Step 1: H+ adds to the end carbon (CH2), making a secondary carbocation CH3-CH+-CH3. Step 2: Br- attacks this carbon. Answer: 2-bromopropane is the major product (Markovnikov). With peroxide, the radical path gives 1-bromopropane instead.","q":"bsc chemistry organic reaction mechanism carbocation markovnikov lecture","kw":["reaction mechanism","carbocation","Markovnikov rule","elimination","aromatic substitution"]},{"id":"stereochemistry","t":"Stereochemistry","s":"Stereochemistry studies the 3D arrangement of atoms, which can change how a medicine works in the body.","n":["Isomers have the same formula but different structure. Stereoisomers differ only in 3D arrangement.","A chiral carbon has four different groups. Chiral molecules have non-superimposable mirror images called enantiomers.","R/S naming uses Cahn-Ingold-Prelog priority rules. Enantiomers rotate plane-polarised light in opposite directions.","Diastereomers are stereoisomers that are not mirror images. Meso compounds have chiral centres but are achiral overall.","Conformations (like chair cyclohexane) are shapes from rotation about single bonds. Geometric isomers are cis/trans or E/Z."],"ex":"How many stereoisomers does tartaric acid have? Step 1: It has 2 chiral carbons. Step 2: Maximum = 2² = 4. Step 3: But one form has an internal mirror plane (meso), and two of the four drawings are the same. Answer: 3 stereoisomers (d, l and meso).","q":"bsc chemistry stereochemistry chirality R S nomenclature lecture hindi","kw":["chirality","enantiomers","R/S configuration","diastereomers","conformation"]},{"id":"spectroscopy","t":"Spectroscopy (UV, IR, NMR, Mass)","s":"Spectroscopy uses light and magnetic fields to find the structure of molecules without seeing them.","n":["UV-Visible spectroscopy studies electronic transitions. Conjugated molecules absorb at longer wavelengths.","IR spectroscopy shows bond vibrations. C=O near 1700 cm^-1, broad O-H near 3200-3500 cm^-1.","1H NMR shows types of hydrogen. Chemical shift (ppm) tells environment; splitting follows the n + 1 rule.","Mass spectrometry gives molecular mass from the molecular ion peak and clues from fragments.","Combining all methods usually confirms a structure."],"ex":"1H NMR of ethanol (CH3CH2OH). Step 1: CH3 has 2 neighbours, so n + 1 = 3, a triplet near 1.2 ppm. Step 2: CH2 has 3 neighbours, so a quartet near 3.7 ppm. Step 3: OH is usually a singlet (fast exchange). Answer: 3 signals, area ratio 3:2:1.","q":"bsc chemistry spectroscopy ir nmr uv mass lecture hindi","kw":["UV-Vis","IR spectroscopy","NMR","mass spectrometry","chemical shift"]},{"id":"physical-chemistry-phases","t":"Phase Equilibria and Solutions","s":"Phase equilibria explain when substances are solid, liquid or gas, and how mixtures and solutions behave.","n":["Gibbs phase rule: F = C - P + 2, where F is degrees of freedom, C components and P phases.","A phase diagram shows which phase is stable at each temperature and pressure. The triple point has three phases together.","Raoult's law: vapour pressure of a solvent in an ideal solution = mole fraction x pure vapour pressure.","Colligative properties depend on number of particles: lowering of vapour pressure, boiling point rise, freezing point fall, osmotic pressure.","Azeotropes boil at constant composition and cannot be separated by simple distillation, like 95% ethanol-water."],"ex":"Degrees of freedom of water at its triple point. Step 1: C = 1 (only water). Step 2: P = 3 (ice, liquid, vapour). Step 3: F = 1 - 3 + 2 = 0. Answer: zero, so temperature and pressure are both fixed (about 273.16 K and 611 Pa).","q":"bsc chemistry phase rule phase diagram colligative properties lecture","kw":["phase rule","phase diagram","Raoult's law","colligative properties","azeotrope"]},{"id":"analytical-chemistry","t":"Analytical Chemistry","s":"Analytical chemistry finds what is in a sample and how much, using titration, instruments and careful statistics.","n":["Volumetric analysis uses titration. At the equivalence point, M1V1 = M2V2 for a 1:1 reaction.","Gravimetric analysis weighs a pure precipitate to find the amount of a substance.","Beer-Lambert law: A = εcl. Absorbance is proportional to concentration, used in colorimetry and UV-Vis.","Chromatography (paper, TLC, column, HPLC, GC) separates mixtures based on how components move.","Report results with accuracy, precision, standard deviation and significant figures."],"ex":"20 mL of 0.1 M HCl neutralises 25 mL of NaOH. Find NaOH molarity. Step 1: M1V1 = M2V2. Step 2: 0.1 x 20 = M2 x 25. Step 3: M2 = 2/25 = 0.08 M. Answer: 0.08 M NaOH.","q":"bsc chemistry analytical chemistry titration chromatography beer lambert","kw":["titration","Beer-Lambert law","chromatography","gravimetric analysis","precision"]}],"pg":[{"id":"group-theory-symmetry","t":"Group Theory and Molecular Symmetry","s":"Group theory uses molecular symmetry to predict spectra, bonding and which transitions are allowed.","n":["Symmetry elements: identity E, rotation axis Cn, mirror plane σ, centre of inversion i, improper axis Sn.","A point group is the full set of symmetry operations of a molecule, like C2v for water or D6h for benzene.","Character tables list irreducible representations. They help label orbitals and vibrations.","IR active vibrations transform like x, y or z; Raman active ones transform like quadratic terms (x², xy etc.).","Group theory also builds symmetry-adapted orbitals for MO diagrams of complexes."],"ex":"Point group of H2O. Step 1: Identity E. Step 2: One C2 axis through O bisecting H-O-H. Step 3: Two mirror planes containing the C2 axis (σv and σv'). Step 4: No centre of inversion. Answer: C2v, order 4.","q":"msc chemistry group theory point groups character table lecture","kw":["point group","symmetry elements","character table","irreducible representation","selection rules"]},{"id":"organic-synthesis","t":"Advanced Organic Synthesis","s":"Organic synthesis plans step-by-step routes to build complex molecules like medicines from simple ones.","n":["Retrosynthesis works backwards from the target, breaking bonds into simpler synthons and real reagents.","Carbon-carbon bond formation: Grignard, aldol, Wittig, Diels-Alder and palladium cross-coupling (Suzuki, Heck).","Protecting groups temporarily hide a reactive group so another part of the molecule can react.","Selectivity matters: chemoselective, regioselective and stereoselective reactions give the right product.","Pericyclic reactions follow orbital symmetry (Woodward-Hoffmann rules)."],"ex":"Make 2-phenyl-2-propanol. Retrosynthesis: break the C-Ph bond next to C-OH, giving phenyl anion + acetone. Step 1: PhBr + Mg in dry ether gives PhMgBr. Step 2: Add acetone. Step 3: Acid workup (H3O+). Answer: (CH3)2C(OH)Ph.","q":"msc chemistry organic synthesis retrosynthesis named reactions lecture","kw":["retrosynthesis","Grignard reaction","cross-coupling","protecting groups","pericyclic reactions"]},{"id":"organometallic-chemistry","t":"Organometallic Chemistry and Catalysis","s":"Organometallic compounds have metal-carbon bonds and act as powerful catalysts in industry and medicine making.","n":["The 18-electron rule: stable transition metal complexes often have 18 valence electrons around the metal.","Metal carbonyls like Ni(CO)4 and Fe(CO)5 show back-bonding: metal d-electrons flow into empty CO π* orbitals.","Key steps: oxidative addition, reductive elimination, migratory insertion and β-hydride elimination.","Homogeneous catalysts: Wilkinson's catalyst (hydrogenation), Monsanto process (acetic acid), Ziegler-Natta (polymers).","Many named coupling reactions (Suzuki, Heck) use palladium catalytic cycles."],"ex":"Count electrons in Fe(CO)5. Step 1: Fe(0) has 8 valence electrons. Step 2: Each CO gives 2, so 5 x 2 = 10. Step 3: Total = 18. For Ni(CO)4: Ni(0) 10 + 4 x 2 = 18. Answer: both obey the 18-electron rule and are stable.","q":"msc chemistry organometallic chemistry 18 electron rule catalysis lecture","kw":["18-electron rule","metal carbonyls","oxidative addition","homogeneous catalysis","back-bonding"]},{"id":"advanced-spectroscopy","t":"Advanced NMR and Structure Determination","s":"Advanced spectroscopy, especially multinuclear and 2D NMR, solves the structures of complex molecules.","n":["Chemical shift in ppm = (frequency shift in Hz from TMS) / (spectrometer frequency in MHz).","Coupling constants J (in Hz) reveal neighbours and geometry; for example trans alkene H's couple more strongly than cis.","13C NMR and DEPT tell CH3, CH2, CH and quaternary carbons apart.","2D NMR: COSY links coupled H's; HSQC links H to its carbon; HMBC shows longer-range H-C links; NOESY shows nearby atoms in space.","ESR studies unpaired electrons, and X-ray crystallography gives exact 3D structure."],"ex":"On a 400 MHz NMR, a signal appears 2920 Hz from TMS. Step 1: δ = 2920 Hz / 400 MHz. Step 2: δ = 7.3 ppm. Answer: 7.3 ppm, typical of aromatic (benzene ring) hydrogens. On a 600 MHz machine the same signal would be 4380 Hz from TMS.","q":"msc chemistry 2d nmr cosy hsqc structure elucidation lecture","kw":["chemical shift","coupling constant","13C NMR","2D NMR","ESR"]},{"id":"reaction-dynamics","t":"Chemical Kinetics and Reaction Dynamics","s":"PG kinetics studies reaction mechanisms, transition states and fast reactions in detail.","n":["Arrhenius: ln(k2/k1) = (Ea/R)(1/T1 - 1/T2). It lets us find activation energy from two rates.","Transition state theory (Eyring equation) relates rate to activation enthalpy and entropy.","Steady-state approximation and Lindemann mechanism explain complex and unimolecular reactions.","Chain reactions (like H2 + Br2) have initiation, propagation and termination steps.","Fast reactions are studied by flash photolysis, stopped-flow and femtosecond laser spectroscopy."],"ex":"A rate doubles from 300 K to 310 K. Find Ea. Step 1: ln2 = (Ea/8.314)(1/300 - 1/310). Step 2: 1/300 - 1/310 = 1.075 x 10^-4 K^-1. Step 3: Ea = 0.693 x 8.314 / 1.075 x 10^-4 = 53,600 J/mol. Answer: about 53.6 kJ/mol.","q":"msc chemistry chemical kinetics transition state theory lecture","kw":["Arrhenius equation","transition state theory","steady-state approximation","chain reactions","flash photolysis"]},{"id":"bioinorganic-chemistry","t":"Bioinorganic Chemistry","s":"Bioinorganic chemistry studies the metal ions that living things need, like iron in blood and magnesium in chlorophyll.","n":["Haemoglobin and myoglobin carry oxygen using Fe(II) in a heme (porphyrin) ring.","Chlorophyll has Mg²+ at its centre and captures sunlight for photosynthesis.","Zinc is in enzymes like carbonic anhydrase; cobalt is in vitamin B12.","Na+/K+ pump keeps ion balance across cell membranes and needs ATP energy.","Metal-based drugs like cisplatin (platinum) treat some cancers. Heavy metals like lead and mercury are toxic."],"ex":"Why is carbon monoxide poisonous? Step 1: CO binds to Fe(II) of haemoglobin about 200 times more strongly than O2. Step 2: Haemoglobin is blocked and cannot carry oxygen. Step 3: Tissues get less oxygen. Treatment: fresh air or pure oxygen pushes CO out slowly.","q":"msc chemistry bioinorganic chemistry metalloproteins haemoglobin lecture","kw":["metalloproteins","haemoglobin","chlorophyll","metalloenzymes","metal drugs"]},{"id":"computational-chemistry","t":"Computational Chemistry","s":"Computational chemistry uses computers to calculate molecular structures, energies and reactions before doing experiments.","n":["Molecular mechanics treats atoms as balls and springs. It is fast and good for big molecules like proteins.","Hartree-Fock and post-HF methods solve the Schrodinger equation approximately with basis sets.","Density functional theory (DFT) uses electron density; it balances accuracy and cost and is very widely used.","Geometry optimisation finds the lowest energy shape; frequency calculation checks it is a true minimum.","Molecular dynamics simulates motion over time. Free tools include ORCA (free for academics), Avogadro and GROMACS."],"ex":"Optimise water with DFT (e.g. B3LYP). Step 1: Build H2O in Avogadro. Step 2: Run geometry optimisation. Step 3: Run frequencies; no imaginary frequency means a true minimum. Typical result: O-H about 0.96 Å and angle near 104 to 105°, close to experiment (104.5°).","q":"computational chemistry dft gaussian orca tutorial for beginners","kw":["DFT","basis set","molecular mechanics","geometry optimisation","molecular dynamics"]}],"phd":[{"id":"chemistry-research-methods","t":"Research Methods and Lab Safety","s":"Chemistry research needs a clear question, careful experiments, honest data, and strict safety in the lab.","n":["Search literature using SciFinder, Reaxys, Google Scholar and journals before planning experiments.","Keep a dated lab notebook with every observation, including failed experiments.","Characterise every new compound fully: NMR, IR, mass spectrometry, melting point, elemental analysis or X-ray.","Lab safety: read the safety data sheet (SDS), wear goggles and coat, use a fume hood, and dispose waste correctly.","Publish honestly. Image manipulation, data fabrication and plagiarism are serious misconduct."],"ex":"Before using a new reagent like sodium hydride: Step 1: Read its SDS. It reacts violently with water, releasing flammable H2. Step 2: Use dry solvent under nitrogen. Step 3: Quench extra NaH slowly with isopropanol, then methanol, then water, in an ice bath.","q":"research methodology chemistry phd lab safety literature search","kw":["research methodology","lab notebook","characterisation","lab safety","research ethics"]},{"id":"catalysis-research","t":"Catalysis and Sustainable Processes","s":"Catalysis research designs better catalysts to make chemicals and fuels using less energy and less waste.","n":["Heterogeneous catalysts (solids like zeolites, metal nanoparticles) are easy to separate and reuse.","Homogeneous and enzyme catalysts give high selectivity. Single-atom catalysts try to combine both advantages.","Key measures: turnover number (TON), turnover frequency (TOF), selectivity and stability.","Hot topics: CO2 conversion to fuels, green hydrogen by water splitting, and ammonia synthesis at mild conditions.","India's National Green Hydrogen Mission (2023) encourages research in electrolysers and catalysts."],"ex":"A catalyst of 0.01 mol converts 50 mol of reactant in 5 hours. Step 1: TON = mol product / mol catalyst = 50/0.01 = 5000. Step 2: TOF = TON / time = 5000/5 = 1000 per hour. Answer: TON 5000, TOF 1000 h^-1.","q":"heterogeneous catalysis research lecture green hydrogen co2 conversion","kw":["heterogeneous catalysis","turnover number","CO2 conversion","green hydrogen","zeolites"]},{"id":"materials-chemistry","t":"Materials and Nanochemistry","s":"Materials chemistry creates new solids like MOFs, perovskites and nanoparticles for energy, medicine and the environment.","n":["Metal-organic frameworks (MOFs) are porous crystals of metal ions and organic linkers. They can store gases or capture CO2.","Nanoparticles have very high surface area, so their properties change with size, like colour of gold nanoparticles.","Perovskite solar cells have shown fast efficiency gains, but long-term stability is still a challenge.","Battery research looks at lithium-ion improvements and alternatives like sodium-ion batteries.","Characterisation tools: XRD, SEM, TEM, BET surface area and XPS."],"ex":"Why size matters: a cube of 1 cm side has surface area 6 cm². Cut it into cubes of 1 μm side: you get 10^12 cubes, each 6 x 10^-8 cm². Total = 6 x 10^4 cm², which is 10,000 times more surface for the same material.","q":"materials chemistry MOF perovskite nanomaterials research lecture","kw":["MOFs","nanoparticles","perovskite solar cells","batteries","characterisation"]},{"id":"green-chemistry","t":"Green Chemistry","s":"Green chemistry designs reactions that create less waste, use safer chemicals and save energy.","n":["The 12 principles of green chemistry were given by Anastas and Warner. Prevention of waste is the first one.","Atom economy = (mass of desired product / total mass of reactants) x 100%. Addition reactions can reach 100%.","E-factor = mass of waste / mass of product. Pharmaceutical processes often have high E-factors.","Use safer solvents like water or ethanol, renewable feedstocks, and catalysis instead of large amounts of reagents.","Flow chemistry and microwave or mechanochemical (grinding) methods can save time and energy."],"ex":"Hydration of ethene: C2H4 + H2O -> C2H5OH. Step 1: Reactant mass = 28 + 18 = 46 g/mol. Step 2: Product = 46 g/mol. Step 3: Atom economy = 46/46 x 100 = 100%. Every atom ends up in the product, so no by-product waste.","q":"green chemistry 12 principles atom economy lecture","kw":["green chemistry","atom economy","E-factor","safer solvents","flow chemistry"]},{"id":"ai-in-chemistry","t":"Data Science and AI in Chemistry","s":"Machine learning now helps chemists predict properties, plan syntheses and discover new molecules faster.","n":["Molecules are given to computers as SMILES strings, fingerprints or graphs. RDKit is a free toolkit for this.","Machine learning models predict properties like solubility or toxicity from known data.","AI tools suggest retrosynthesis routes, and protein structure predictors like AlphaFold help drug design.","Good data matters most: clean, well-labelled and unbiased data sets. Always test models on data they have not seen.","Automated labs combine robots with AI to run and choose experiments, speeding up discovery."],"ex":"Ethanol in SMILES is CCO: C = carbon, C = carbon, O = oxygen, hydrogens are implied. Benzene is c1ccccc1 (lowercase means aromatic, 1 marks the ring closure). A model can read thousands of such strings and learn to predict boiling points.","q":"machine learning in chemistry rdkit python tutorial","kw":["cheminformatics","SMILES","machine learning","RDKit","drug discovery"]}]},"order":3},{"id":"biology","name":"Biology","nameHi":"जीव विज्ञान","group":"science","blurb":"Biology is the study of living things, from tiny cells and genes to plants, animals, humans and ecosystems.","levels":{"11-12":[{"id":"diversity-classification","t":"Diversity of Living World and Classification","s":"Scientists group millions of living things into kingdoms and give each one a two-part scientific name.","n":["Taxonomy (वर्गिकी) is naming and classifying organisms. Levels: kingdom, phylum, class, order, family, genus, species.","Binomial nomenclature, given by Linnaeus, uses genus + species, like Mangifera indica (mango) and Homo sapiens (humans).","Whittaker's five kingdoms: Monera (bacteria), Protista, Fungi, Plantae and Animalia.","Viruses are not placed in any kingdom because they live and multiply only inside host cells.","Plants are grouped as algae, bryophytes, pteridophytes, gymnosperms and angiosperms. Animals are grouped by body plan, symmetry and body cavity."],"ex":"Classify the tiger: Kingdom Animalia, Phylum Chordata, Class Mammalia, Order Carnivora, Family Felidae, Genus Panthera, Species tigris. Scientific name: Panthera tigris, written in italics with a capital letter only for the genus.","q":"class 11 biological classification five kingdom ncert biology hindi","kw":["taxonomy","binomial nomenclature","five kingdom classification","species","Whittaker"]},{"id":"cell-cycle-division","t":"Cell Structure and Cell Division","s":"Cells grow and divide by mitosis for body growth, and by meiosis to make sperm and egg cells.","n":["Prokaryotic cells (bacteria) have no true nucleus. Eukaryotic cells have a nucleus and membrane-bound organelles.","Cell cycle: interphase (G1, S where DNA copies, G2) followed by M phase (division).","Mitosis gives 2 identical daughter cells with the same chromosome number. Stages: prophase, metaphase, anaphase, telophase.","Meiosis gives 4 cells with half the chromosome number. Crossing over in meiosis I creates genetic variety.","Mitosis helps growth and repair; meiosis makes gametes and keeps chromosome number constant across generations."],"ex":"Human body cells have 2n = 46 chromosomes. Step 1: After mitosis each daughter cell has 46. Step 2: After meiosis each gamete has n = 23. Step 3: Sperm (23) + egg (23) = zygote with 46. Also: one cell after 5 rounds of mitosis gives 2^5 = 32 cells.","q":"class 11 cell cycle and cell division mitosis meiosis ncert hindi","kw":["cell cycle","mitosis","meiosis","chromosomes","crossing over"]},{"id":"plant-physiology","t":"Plant Physiology: Photosynthesis and Respiration","s":"Plants capture sunlight to make food by photosynthesis and break it down by respiration to get energy.","n":["Photosynthesis happens in chloroplasts. Light reactions in thylakoids split water, release O2 and make ATP and NADPH.","Dark reactions (Calvin cycle) in the stroma fix CO2 into sugar using ATP and NADPH. RuBisCO is the key enzyme.","C4 plants like maize and sugarcane fix CO2 more efficiently in hot climates and avoid photorespiration.","Respiration: glycolysis in cytoplasm, Krebs cycle in mitochondria, then electron transport chain makes most ATP.","Water moves up through xylem by transpiration pull. Plant hormones like auxin, gibberellin and cytokinin control growth."],"ex":"Water potential: a cell has solute potential Ψs = -0.8 MPa and pressure potential Ψp = +0.3 MPa. Step 1: Ψw = Ψs + Ψp. Step 2: Ψw = -0.8 + 0.3 = -0.5 MPa. Answer: -0.5 MPa. Water moves into this cell from a cell with higher (less negative) Ψw.","q":"class 11 photosynthesis in higher plants respiration ncert biology hindi","kw":["photosynthesis","Calvin cycle","C4 plants","respiration","water potential"]},{"id":"human-physiology","t":"Human Physiology","s":"Human physiology explains how our organs digest food, breathe, pump blood, remove waste and send messages.","n":["Breathing: air enters lungs, and gas exchange happens in alveoli. Haemoglobin carries oxygen in red blood cells.","The heart has 4 chambers. Double circulation keeps oxygen-rich and oxygen-poor blood separate. Normal blood pressure is about 120/80 mm Hg.","Kidneys filter blood in nephrons. About 180 L of filtrate forms daily, but only about 1.5 L becomes urine.","Neurons carry electrical impulses. The brain and spinal cord form the central nervous system.","Hormones from glands like the pituitary, thyroid and pancreas (insulin) control growth and metabolism."],"ex":"Cardiac output = heart rate x stroke volume. A resting adult: heart rate 72 beats/min, stroke volume 70 mL. Step 1: 72 x 70 = 5040 mL/min. Step 2: Convert: 5040 mL = 5.04 L. Answer: about 5 L of blood pumped per minute.","q":"class 11 human physiology breathing circulation excretion ncert hindi","kw":["circulation","respiration","excretion","nervous system","hormones"]},{"id":"reproduction","t":"Reproduction in Plants and Humans","s":"Reproduction makes new organisms; flowering plants use flowers and seeds, humans use sperm, egg and pregnancy.","n":["In flowers, the stamen makes pollen and the pistil has the ovary. Pollination carries pollen to the stigma.","Flowering plants show double fertilisation: one sperm fuses with egg (zygote), another forms endosperm (food for the seed).","Human male gametes are sperm made in testes; female gametes are ova made in ovaries.","The menstrual cycle is about 28 days, with ovulation around the middle. Fertilisation happens in the fallopian tube.","Reproductive health includes safe contraception, preventing sexually transmitted infections, and proper care in pregnancy."],"ex":"Endosperm ploidy in angiosperms: Step 1: The central cell has 2 polar nuclei (n + n). Step 2: One male gamete (n) fuses with them. Step 3: n + n + n = 3n. Answer: endosperm is triploid (3n), while the zygote (n + n) is diploid (2n).","q":"class 12 sexual reproduction in flowering plants human reproduction ncert hindi","kw":["pollination","double fertilisation","gametes","menstrual cycle","reproductive health"]},{"id":"genetics-molecular-basis","t":"Inheritance and Molecular Basis of Inheritance","s":"Genes on DNA pass traits from parents to children, following Mendel's rules of inheritance.","n":["Mendel worked with pea plants. Law of dominance, law of segregation and law of independent assortment.","Monohybrid cross gives 3:1 phenotype ratio in F2; dihybrid gives 9:3:3:1.","DNA is a double helix (Watson and Crick, 1953). A pairs with T, G pairs with C (Chargaff's rule).","Central dogma: DNA -> RNA (transcription) -> protein (translation). The genetic code uses 3-letter codons.","Sex in humans: XX is female, XY is male. The father's sperm decides the sex of the child."],"ex":"Cross Tt x Tt (T = tall, dominant). Step 1: Gametes T, t from each parent. Step 2: Punnett square gives TT, Tt, Tt, tt. Step 3: Genotype ratio 1:2:1. Step 4: Phenotype 3 tall : 1 dwarf. Also: if DNA has 20% A, then T = 20%, G = C = 30% each.","q":"class 12 principles of inheritance molecular basis of inheritance ncert hindi","kw":["Mendel's laws","Punnett square","DNA double helix","central dogma","genetic code"]},{"id":"biotechnology-12","t":"Biotechnology: Principles and Applications","s":"Biotechnology uses living cells and DNA tools to make medicines, better crops and tests for diseases.","n":["Restriction enzymes cut DNA at specific sites. DNA ligase joins pieces. Plasmids carry new genes into bacteria.","Recombinant DNA technology made human insulin in bacteria, now used by diabetes patients.","PCR (polymerase chain reaction) makes millions of copies of DNA; each cycle doubles the DNA.","Gel electrophoresis separates DNA pieces by size. It is used in DNA fingerprinting.","Bt cotton has a gene from Bacillus thuringiensis that kills certain insect pests. GM crops need biosafety checks."],"ex":"PCR starting with 1 DNA molecule. Step 1: Each cycle doubles: after n cycles, copies = 2^n. Step 2: After 30 cycles: 2^30 = 1,073,741,824. Answer: about 1 billion copies, ideally. Real reactions are a little less efficient.","q":"class 12 biotechnology principles and processes pcr recombinant dna hindi","kw":["recombinant DNA","restriction enzymes","PCR","gel electrophoresis","Bt cotton"]},{"id":"ecology-evolution","t":"Ecology and Evolution","s":"Ecology studies how living things interact with their environment; evolution explains how species change over time.","n":["An ecosystem has producers, consumers and decomposers. Energy flows in one direction through food chains.","Lindeman's 10% law: only about 10% of energy passes from one trophic level to the next.","Biodiversity is the variety of life. India is a megadiverse country with hotspots like the Western Ghats and the Himalaya.","Darwin's natural selection: individuals with useful variations survive and reproduce more.","Evidence for evolution: fossils, homologous organs, and industrial melanism in peppered moths."],"ex":"Grass captures 10,000 J of energy. Step 1: Grasshopper (primary consumer) gets 10% = 1000 J. Step 2: Frog (secondary) gets 100 J. Step 3: Snake (tertiary) gets 10 J. Answer: 10 J. This is why food chains rarely have more than 4 or 5 levels.","q":"class 12 ecosystem energy flow evolution natural selection ncert hindi","kw":["ecosystem","10% law","biodiversity","natural selection","evolution"]}],"ug":[{"id":"plant-diversity","t":"Plant Diversity and Systematics (Botany)","s":"Plant diversity studies algae, mosses, ferns, gymnosperms and flowering plants, and how to identify them.","n":["Algae are simple aquatic photosynthetic organisms. Spirulina is eaten as a supplement; agar comes from red algae.","Bryophytes (mosses) need water for fertilisation. Pteridophytes (ferns) were the first with vascular tissue.","Gymnosperms like pine and deodar have naked seeds. Angiosperms have seeds inside fruits.","Alternation of generations: plant life cycles switch between a haploid gametophyte and a diploid sporophyte.","Plant identification uses floral formulas, herbarium specimens and systems like Bentham and Hooker or APG."],"ex":"Floral formula of mustard (Brassicaceae): ⊕ ⚥ K2+2 C4 A2+4 G(2). Read it: actinomorphic (⊕) and bisexual (⚥); 4 sepals in two whorls; 4 free petals; 6 stamens (2 short + 4 long, tetradynamous); superior ovary of 2 fused carpels.","q":"bsc botany plant diversity algae bryophytes pteridophytes lecture hindi","kw":["algae","bryophytes","pteridophytes","gymnosperms","angiosperms"]},{"id":"animal-diversity","t":"Animal Diversity (Zoology)","s":"Animal diversity studies all animal groups, from sponges and worms to fish, birds and mammals.","n":["Non-chordates include Porifera (sponges), Cnidaria, Platyhelminthes, Annelida, Arthropoda, Mollusca and Echinodermata.","Arthropods (insects, crabs, spiders) form the largest animal phylum by number of species.","Chordates have a notochord, dorsal nerve cord and pharyngeal gill slits at some stage of life.","Vertebrate classes: fishes, amphibians, reptiles, birds and mammals. Birds and mammals are warm-blooded.","Body plan features used to classify animals: symmetry, germ layers, body cavity (coelom) and segmentation."],"ex":"Classify an earthworm. Step 1: Body is segmented with ring-like parts. Step 2: Bilateral symmetry, triploblastic (3 germ layers). Step 3: True coelom present. Step 4: Moist skin, setae for movement. Answer: Phylum Annelida.","q":"bsc zoology animal diversity non chordates chordates lecture hindi","kw":["non-chordates","chordates","arthropods","coelom","symmetry"]},{"id":
