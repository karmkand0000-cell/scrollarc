hayana Buddhism and devotional worship of Vishnu and Shiva became important.","Early temples, like the Dashavatara temple at Deogarh, were built in the Gupta period."],"ex":"The gateways (toranas) of Sanchi show stories from the Buddha's previous lives, called Jatakas. People who could not read could still learn these stories from carvings.","q":"class 12 history thinkers beliefs and buildings sanchi ncert hindi","kw":["buddhism","jainism","sanchi","stupa"]},{"id":"travellers-accounts","t":"Through the Eyes of Travellers","s":"Foreign travellers like Al-Biruni, Ibn Battuta and Bernier wrote about Indian society from the 11th to 17th century.","n":["Al-Biruni came from Uzbekistan in the 11th century. He wrote Kitab-ul-Hind in Arabic.","Ibn Battuta from Morocco reached India in the 14th century during Muhammad bin Tughluq's reign. His travel book is called the Rihla.","Francois Bernier, a French doctor, visited in the 17th century. He compared India unfavourably with Europe.","Travellers noticed things locals took for granted, but they could also misunderstand what they saw.","Historians compare traveller accounts with other sources to check them."],"ex":"Bernier wrote that there was no private property in land in Mughal India. Later historians showed this was not fully correct, which reminds us that every source needs checking.","q":"class 12 history through the eyes of travellers ncert hindi","kw":["al-biruni","ibn battuta","bernier","travellers"]},{"id":"bhakti-sufi-vijayanagara","t":"Bhakti-Sufi Traditions and Vijayanagara","s":"Devotional movements spread love for God across caste lines, while Vijayanagara grew into a great southern empire.","n":["Alvars (devotees of Vishnu) and Nayanars (devotees of Shiva) in Tamil Nadu began early bhakti.","Later saints like Kabir, Guru Nanak, Mirabai and Basavanna questioned rituals and caste.","Sufis were Muslim mystics. Chishti silsila saints like Khwaja Muinuddin (Ajmer) and Nizamuddin Auliya (Delhi) were popular.","Vijayanagara was founded in 1336 by Harihara and Bukka. Krishnadeva Raya was its most famous ruler.","Its capital Hampi was ruined after the Battle of Talikota (Rakshasi-Tangadi) in 1565."],"ex":"Colin Mackenzie began surveying Hampi's ruins in 1800. Today, by studying temples, water tanks and markets there, historians reconstruct how the city was planned.","q":"class 12 history bhakti sufi traditions vijayanagara ncert hindi","kw":["bhakti","sufi","vijayanagara","hampi"]},{"id":"colonialism-countryside","t":"Colonialism and the Countryside","s":"British land revenue systems changed the lives of zamindars, peasants and tribal people in rural India.","n":["The Permanent Settlement (1793) under Cornwallis fixed revenue forever with zamindars in Bengal.","Many zamindars could not pay and their estates were auctioned.","In Bombay Deccan, the ryotwari system collected revenue directly from cultivators (ryots).","The Santhals rebelled in 1855-56 against moneylenders and the colonial state.","The Deccan Riots of 1875 were peasant attacks on moneylenders' account books."],"ex":"Under the Permanent Settlement the revenue demand stayed fixed. If a harvest failed, the zamindar still had to pay on time, often by sunset of a fixed date, or lose his land.","q":"class 12 history colonialism and the countryside ncert hindi","kw":["permanent settlement","ryotwari","santhal","zamindar"]},{"id":"gandhi-and-national-movement","t":"Mahatma Gandhi and the Nationalist Movement","s":"Gandhi turned the freedom struggle into a mass movement of peasants, workers, women and students.","n":["Gandhi returned from South Africa in January 1915.","His speech at the opening of Banaras Hindu University in 1916 criticised the elite nature of Indian politics.","The Quit India Movement began in August 1942 with the call 'Do or Die'.","Historians use sources like letters, newspapers, police reports and autobiographies to study him.","Gandhi was assassinated on 30 January 1948."],"ex":"Police reports from 1942 often described large protests in small towns. Comparing these reports with nationalist newspapers helps historians see both government and people's views.","q":"class 12 history mahatma gandhi and the nationalist movement ncert hindi","kw":["gandhi","quit india","national movement","sources"]},{"id":"partition-and-constitution","t":"Partition and Framing the Constitution","s":"India's independence came with a painful partition, followed by the long making of the Constitution.","n":["Partition in 1947 caused huge migration and violence. Millions were displaced and many lost their lives.","Historians use oral history, interviews with survivors, to understand partition experiences.","The Constituent Assembly first met on 9 December 1946.","Dr B.R. Ambedkar chaired the Drafting Committee. The Constitution was adopted on 26 November 1949.","It came into force on 26 January 1950, which we celebrate as Republic Day."],"ex":"A survivor's interview may describe how a family left Lahore by train with only a few bags. Such memories show human feelings that official files often miss.","q":"class 12 history partition and framing the constitution ncert hindi","kw":["partition","oral history","constituent assembly","constitution"]}],"ug":[{"id":"historiography-intro","t":"Schools of Indian Historiography","s":"Historiography is the study of how history has been written; Indian history has many schools of interpretation.","n":["Colonial historians like James Mill (History of British India, 1817) divided Indian history into Hindu, Muslim and British periods.","Nationalist historians tried to show India's past achievements and opposed colonial views.","Marxist historians like D.D. Kosambi and R.S. Sharma focused on economy, class and modes of production.","The Subaltern Studies group, started by Ranajit Guha in the 1980s, studied history 'from below' (ordinary people).","Each school asks different questions, so reading many views gives a fuller picture."],"ex":"Mill's three-period division labelled ages by the ruler's religion. Later historians preferred 'ancient, medieval, modern' because religion-based labels ignored economy and society.","q":"historiography of indian history colonial nationalist marxist subaltern lecture","kw":["historiography","colonial","marxist","subaltern"]},{"id":"ancient-india-sources-state","t":"Ancient India: Sources, Society and State","s":"Ancient Indian history is rebuilt using texts, inscriptions, coins and archaeology, each with strengths and limits.","n":["Literary sources include the Vedas, epics, Puranas, Buddhist and Jain texts, and Sangam poetry from Tamil areas.","The varna system described four social orders; jati (caste by birth) grew more complex over time.","The Gupta period (c. 4th-6th century CE) is known for art, science and Sanskrit literature.","Land grants to Brahmanas and temples increased from the Gupta period onwards.","Students should compare normative texts (what should be) with practice (what actually happened)."],"ex":"The Dharmashastras say how society should be ordered. But inscriptions show rulers from many backgrounds, so actual society was more flexible than the texts claim.","q":"ancient indian history sources society state ba history lecture hindi","kw":["ancient india","gupta","varna","sources"]},{"id":"early-medieval-debates","t":"Early Medieval India and the Feudalism Debate","s":"Historians debate whether India between 600 and 1200 CE had a feudal system like medieval Europe.","n":["R.S. Sharma argued that land grants led to Indian feudalism, with declining trade and towns.","Others, like B.D. Chattopadhyaya, argued for 'integrative' state formation where local powers were brought into larger states.","Regional kingdoms like the Cholas, Rashtrakutas and Palas grew strong in this period.","The Cholas had village assemblies (sabha, ur) recorded in inscriptions at Uttaramerur.","The debate teaches that models from Europe must be tested carefully on Indian evidence."],"ex":"A copper-plate grant gives a village to a Brahmana with rights to revenue. Feudalism scholars see this as breaking up state power; integration scholars see it as spreading the state into new areas.","q":"indian feudalism debate early medieval india rs sharma lecture","kw":["feudalism","early medieval","chola","land grants"]},{"id":"medieval-state-economy","t":"Sultanate and Mughal State and Economy","s":"The Delhi Sultanate and Mughal empire built systems of revenue, administration and trade across India.","n":["The iqta system of the Sultanate assigned revenue from areas to officers in return for service.","The Mughals developed mansabdari and jagirdari systems.","The zabt system measured land and fixed revenue in cash under Akbar.","India had a large share of world manufacturing, especially textiles, and active ocean trade.","Historians debate whether the 18th century was a 'dark age' or a time of regional growth."],"ex":"Irfan Habib saw a 'jagirdari crisis' behind Mughal decline, while others pointed to rising regional powers like the Marathas, Sikhs and nawabs of Awadh and Bengal.","q":"mughal state economy mansabdari jagirdari ba history lecture hindi","kw":["iqta","mansabdari","jagirdari","mughal decline"]},{"id":"colonial-economy","t":"Colonial Economy and the Drain of Wealth","s":"Colonial rule reshaped India's economy, and Indian thinkers argued that wealth was being drained to Britain.","n":["Dadabhai Naoroji explained the 'drain of wealth' in Poverty and Un-British Rule in India (1901).","R.C. Dutt wrote a two-volume Economic History of India in the early 1900s, criticising colonial land tax and trade policy.","Commercialisation of agriculture pushed farmers to grow cash crops like indigo, cotton and jute.","Railways began in 1853 (Bombay to Thane). They mainly served trade and administration.","Famines like 1876-78 and 1943 (Bengal) caused millions of deaths."],"ex":"Payments called 'Home Charges', such as salaries, pensions and interest sent to Britain, were part of what Naoroji called the drain. Money left India without equal return.","q":"drain of wealth dadabhai naoroji colonial economy lecture","kw":["drain theory","naoroji","colonial economy","famine"]},{"id":"national-movement-phases","t":"Indian National Movement: Phases and Debates","s":"India's freedom struggle grew from petitions to mass movements, with many groups and ideas inside it.","n":["Moderates (e.g., Gokhale) used petitions; extremists (e.g., Tilak, Lajpat Rai, Bipin Chandra Pal) demanded swaraj.","The partition of Bengal (1905) led to the Swadeshi movement.","Revolutionaries like Bhagat Singh, peasant movements, and workers' unions also shaped the struggle.","Dr Ambedkar led movements for Dalit rights, such as the Mahad Satyagraha (1927).","The Muslim League and the Congress differed over representation, leading to partition debates in the 1940s."],"ex":"In 1905 Bengalis boycotted British cloth and burned it publicly. This Swadeshi idea, using Indian-made goods, later became central to Gandhi's khadi programme.","q":"indian national movement phases moderates extremists gandhian ba lecture hindi","kw":["national movement","swadeshi","moderates","extremists"]},{"id":"modern-world-history","t":"Making of the Modern World","s":"From the Renaissance to the World Wars, events in Europe and beyond shaped the modern world.","n":["The Renaissance (from 14th century Italy) revived interest in classical learning and humanism.","The Reformation began in 1517 when Martin Luther criticised the Catholic Church.","The American Revolution (1776) and French Revolution (1789) spread ideas of rights and republics.","The First World War (1914-1918) and Second World War (1939-1945) changed world power.","Decolonisation after 1945 created many new nations in Asia and Africa."],"ex":"The printing press helped Luther's ideas spread quickly. Within a few years his writings were read across Germany, showing how technology can speed up social change.","q":"modern world history renaissance reformation world wars ba lecture","kw":["renaissance","reformation","world wars","decolonisation"]}],"pg":[{"id":"theory-of-history","t":"Theory and Philosophy of History","s":"This topic asks big questions: what is a historical fact, can history be objective, and how do historians explain change?","n":["Leopold von Ranke wanted history 'as it actually happened' using archival documents.","E.H. Carr in What is History? (1961) said facts are selected by historians, so interpretation is unavoidable.","The Annales school (Marc Bloch, Lucien Febvre, Fernand Braudel) studied long-term structures (longue duree).","Postmodern thinkers questioned grand narratives and stressed language and discourse.","Good historians stay aware of their own position while staying faithful to evidence."],"ex":"Braudel's study of the Mediterranean looked at geography and climate over centuries, not just kings and battles. This shows history can be written at different speeds of time.","q":"philosophy of history ranke carr annales school ma history lecture","kw":["philosophy of history","annales","e h carr","objectivity"]},{"id":"state-formation-india","t":"State Formation in Early and Medieval India","s":"Historians study how states grew from chiefdoms to kingdoms and empires in the Indian subcontinent.","n":["Models include the centralised empire, segmentary state (Burton Stein on the Cholas), and integrative state formation.","Romila Thapar studied the shift 'from lineage to state' in the Ganga valley.","Temples, land grants and Brahmanical legitimation helped rulers in many regions.","Tribal areas were often brought into states through cultural and economic links.","Comparing regions shows there was no single path of state formation."],"ex":"In Odisha, the Jagannath cult connected local tribal deities with royal power. Kings who supported the temple gained legitimacy across the region.","q":"state formation early medieval india segmentary state lecture","kw":["state formation","segmentary state","legitimation","lineage"]},{"id":"agrarian-history","t":"Agrarian Relations and Peasant History","s":"Agrarian history studies land, peasants, revenue and rural power in India over many centuries.","n":["Irfan Habib's Agrarian System of Mughal India (1963) is a classic study.","Colonial land settlements created new property rights and new forms of debt.","Peasant movements like Champaran (1917), Tebhaga (1946-47) and Telangana (1946-51) are studied closely.","Historians use revenue records, settlement reports and village surveys.","Questions include: Did commercialisation help or harm peasants? Who gained from land markets?"],"ex":"In the Tebhaga movement in Bengal, sharecroppers demanded two-thirds of the crop instead of half. Studying this shows how rural tenants organised for a fairer share.","q":"agrarian history india peasant movements ma history lecture","kw":["agrarian history","peasant movements","land revenue","tebhaga"]},{"id":"caste-gender-history","t":"Social History: Caste, Gender and Reform","s":"Social historians study how caste, gender and reform movements shaped everyday life in modern India.","n":["Reformers like Raja Rammohan Roy, Jyotirao and Savitribai Phule, and Pandita Ramabai worked against social injustice.","Sati was banned in 1829 and widow remarriage was legalised in 1856.","Colonial censuses classified castes, which affected how caste identity was understood.","Gender history looks at women's work, property, education and voices often missing from archives.","Dalit history recovers the views of communities long left out of written histories."],"ex":"Savitribai Phule, with Jyotirao Phule, opened a school for girls in Pune in 1848. Studying her writings shows how education became a tool for social change.","q":"social history of modern india caste gender reform ma lecture","kw":["social reform","caste","gender history","phule"]},{"id":"environmental-history","t":"Environmental History","s":"Environmental history studies how people and nature have shaped each other over time.","n":["Madhav Gadgil and Ramachandra Guha wrote This Fissured Land: An Ecological History of India (1992).","Topics include forests, water, famine, disease and climate.","Movements like Chipko (1973 onwards) in the Himalaya are part of this history.","Sources include forest records, travellers' notes, and scientific data like tree rings.","It connects history with ecology, geography and economics."],"ex":"Colonial irrigation canals in Punjab increased farm output but in some places caused waterlogging and salty soil. This shows that development can bring both gains and new problems.","q":"environmental history of india lecture chipko forest","kw":["environmental history","chipko","forest","ecology"]},{"id":"global-connected-history","t":"Global and Connected Histories","s":"Global history studies links across regions, such as trade, migration, empires and ideas.","n":["Sanjay Subrahmanyam promoted 'connected histories' instead of studying regions in isolation.","The Indian Ocean was a busy trade zone connecting Africa, Arabia, India and Southeast Asia.","Kenneth Pomeranz's The Great Divergence (2000) asked why Europe, not Asia, industrialised first.","Histories of labour migration, like indentured workers, connect India with the Caribbean and Africa.","Global history warns against seeing Europe as the centre of all change."],"ex":"Gujarati merchants traded cotton cloth to East Africa and Southeast Asia for centuries. Their records show India was a key player in world trade long before European companies.","q":"global history connected histories indian ocean trade lecture","kw":["global history","indian ocean","great divergence","connected histories"]},{"id":"economic-history-india","t":"Economic History of Modern India","s":"Economic historians measure and explain changes in India's income, trade, industry and living standards.","n":["Debates continue on deindustrialisation in the 19th century and how far handlooms declined.","Indian industry, such as cotton mills in Bombay and jute mills in Calcutta, grew from the late 19th century.","Tata Iron and Steel Company began production at Jamshedpur in 1912.","Historians use trade statistics, census data and price records.","Quantitative methods help estimate national income and wages in the colonial period."],"ex":"If records show Indian cloth exports falling while imports of British cloth rise, historians ask: did handloom workers lose jobs, or move to other work? Data and local studies help answer this.","q":"economic history of colonial india deindustrialisation lecture","kw":["economic history","deindustrialisation","industry","colonial india"]}],"phd":[{"id":"archives-and-sources","t":"Working in Archives","s":"PhD historians find and read original documents in archives, libraries and private collections.","n":["Key archives include the National Archives of India (New Delhi), state archives, and the India Office Records at the British Library, London.","Plan visits early: learn the catalogue, rules for access, and photography rules.","Keep careful notes with full references (file number, year, department) for every document.","Archives reflect who created them. Ask whose voices are missing.","Private papers, missionary records, court cases and newspapers can fill gaps."],"ex":"A researcher studying a 1920s famine finds revenue department files in a state archive. She also reads local newspapers and court cases, so peasants' experiences are not seen only through officials' eyes.","q":"how to do archival research history phd national archives of india","kw":["archives","primary sources","national archives","research"]},{"id":"source-criticism-palaeography","t":"Source Criticism, Epigraphy and Languages","s":"Historians must test the authenticity, date and bias of every source, and often learn old languages and scripts.","n":["External criticism checks if a source is genuine and correctly dated.","Internal criticism asks what the author meant, and why they wrote it.","For early India, epigraphy and numismatics (study of coins) need training in scripts like Brahmi.","Medieval historians often need Persian; others need Sanskrit, Tamil, Urdu or regional languages.","Cross-checking several independent sources gives stronger conclusions."],"ex":"A copper plate claims to be from the 8th century, but its script style matches the 11th century. Through palaeography, the historian may conclude it was a later copy or forgery.","q":"source criticism history research methods epigraphy lecture","kw":["source criticism","epigraphy","palaeography","numismatics"]},{"id":"oral-history-methods","t":"Oral History and Ethnographic Methods","s":"Oral history records people's memories through interviews, giving voice to those absent from written records.","n":["Prepare open-ended questions and let people tell their stories in their own words.","Get informed consent. Explain how recordings will be used and stored.","Memory can change over time, so compare oral accounts with other sources.","Partition, labour, Dalit and women's histories have used oral history widely.","Transcribe carefully and keep audio files safe with clear labels."],"ex":"Urvashi Butalia's The Other Side of Silence used interviews to show how partition affected women. Such work shows oral history can reveal experiences official records ignore.","q":"oral history methodology interview research history","kw":["oral history","interviews","memory","consent"]},{"id":"digital-history","t":"Digital History and Quantitative Methods","s":"Digital tools help historians search large collections, map events and analyse patterns in data.","n":["Digitised newspapers, gazetteers and census reports make large-scale reading possible.","GIS maps can show movement of people, trade routes or famine spread over time.","Text mining and simple statistics can find patterns across thousands of documents.","Always check digitised text (OCR) for errors, especially in Indian scripts.","Digital work still needs close reading and good historical questions."],"ex":"A scholar maps every reported plague case in Bombay Presidency from 1896 onwards using district reports. The map shows how the disease travelled along rail lines.","q":"digital history methods gis text mining historians lecture","kw":["digital history","gis","text mining","quantitative history"]},{"id":"writing-history-thesis","t":"Literature Review and Writing a History Thesis","s":"A history thesis asks a clear question, reviews earlier work, uses sources well and makes an original argument.","n":["Start with a focused research question, not just a topic.","A historiographical review shows what earlier scholars argued and where the gap lies.","Each chapter should support the main argument with evidence.","Use a consistent citation style, such as Chicago style, which is common in history.","Share chapters with your supervisor and at seminars to improve them."],"ex":"Instead of 'Railways in India', a sharper question is: 'How did railways change pilgrimage to Puri between 1890 and 1930?' This points to specific sources and a clear argument.","q":"how to write a history phd thesis research question literature review","kw":["thesis","historiography","research question","citation"]}]},"order":8},{"id":"geography","name":"Geography","nameHi":"भूगोल","group":"social","blurb":"Geography studies the Earth, its land, water, air and living things, and how people live with and change their surroundings.","levels":{"6-8":[{"id":"earth-solar-system","t":"The Earth in the Solar System","s":"The Earth is one of eight planets that move around the Sun; it is the only planet known to have life.","n":["The Sun, eight planets, moons, asteroids and comets together form the solar system (सौर मंडल).","In order from the Sun: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.","The Earth is the third planet from the Sun. It has the right temperature, water and air for life.","The Moon is the Earth's only natural satellite. It goes around the Earth in about 27 days.","Stars make their own light. Planets and moons only reflect sunlight."],"ex":"On a clear night you see stars twinkling, but the Moon does not twinkle. The Moon only reflects the Sun's light and is much closer to us than any star.","q":"class 6 geography the earth in the solar system ncert hindi","kw":["solar system","planets","moon","earth"]},{"id":"latitudes-longitudes","t":"Globe: Latitudes and Longitudes","s":"Imaginary lines called latitudes and longitudes on a globe help us find any place on Earth.","n":["Latitudes (अक्षांश) run east-west. The Equator is 0 degree latitude and divides Earth into northern and southern hemispheres.","Important latitudes: Tropic of Cancer (23.5 degrees N), Tropic of Capricorn (23.5 degrees S), Arctic and Antarctic Circles (66.5 degrees N and S).","Longitudes (देशांतर) run north-south from pole to pole. The Prime Meridian (0 degree) passes through Greenwich, near London.","The Earth turns 360 degrees in 24 hours, so 1 degree of longitude equals 4 minutes of time.","India uses 82.5 degrees E as its Standard Meridian for Indian Standard Time (IST)."],"ex":"Greenwich is at 0 degrees, India's standard meridian at 82.5 degrees E. Time difference = 82.5 x 4 = 330 minutes = 5 hours 30 minutes. So IST is 5:30 hours ahead of Greenwich time.","q":"class 6 geography globe latitudes and longitudes ncert hindi","kw":["latitude","longitude","equator","standard time"]},{"id":"motions-of-earth","t":"Motions of the Earth","s":"The Earth spins on its axis to make day and night, and goes around the Sun to make seasons.","n":["Rotation (घूर्णन) is the spinning of the Earth on its axis. One rotation takes about 24 hours and causes day and night.","Revolution (परिक्रमण) is the Earth's movement around the Sun. It takes about 365 and a quarter days.","Every fourth year February has 29 days. This is a leap year.","The Earth's axis is tilted. This tilt, with revolution, causes seasons.","On 21 June the northern hemisphere has its longest day. On 21 March and 23 September day and night are nearly equal (equinox)."],"ex":"In Delhi in June, the Sun sets late and days are long and hot. In December, the northern hemisphere tilts away from the Sun, so days are short and it is winter.","q":"class 6 geography motions of the earth rotation revolution ncert hindi","kw":["rotation","revolution","seasons","leap year"]},{"id":"maps-and-domains","t":"Maps and the Major Domains of the Earth","s":"Maps show places on paper using scale, direction and symbols; Earth has four domains: land, water, air and life.","n":["A map has three parts: distance (scale), direction and symbols.","The four main directions are north, south, east and west. A map usually shows north at the top.","Lithosphere is land, hydrosphere is water, atmosphere is air, and biosphere is where life exists.","There are seven continents. Asia is the largest. There are five oceans; the Pacific is the largest.","About 71 percent of the Earth's surface is covered by water."],"ex":"If a map's scale is 1 cm = 10 km, and two villages are 4 cm apart on it, the real distance is 4 x 10 = 40 km.","q":"class 6 geography maps major domains of the earth ncert hindi","kw":["map","scale","continents","oceans"]},{"id":"inside-earth-landforms","t":"Inside the Earth and Changing Landforms","s":"The Earth has layers inside, and forces from inside and outside keep changing its surface.","n":["The Earth has three layers: crust (outermost), mantle (middle) and core (centre).","Rocks are of three types: igneous (from cooled magma), sedimentary (from layers of deposits) and metamorphic (changed by heat and pressure).","Earthquakes and volcanoes are caused by movements inside the Earth.","Rivers, wind, glaciers and sea waves wear away land (erosion) and drop material elsewhere (deposition).","Rivers make landforms like waterfalls, meanders, floodplains and deltas."],"ex":"Marble is a metamorphic rock formed from limestone under heat and pressure. The Taj Mahal is built mainly of white marble from Makrana in Rajasthan.","q":"class 7 geography inside our earth our changing earth ncert hindi","kw":["crust","rocks","earthquake","landforms"]},{"id":"air-and-water","t":"Air and Water","s":"The atmosphere is a blanket of air around the Earth, and water moves around the Earth in the water cycle.","n":["Air is mainly nitrogen (about 78 percent) and oxygen (about 21 percent), with small amounts of carbon dioxide and other gases.","The atmosphere has layers. We live in the lowest layer, the troposphere, where weather happens.","The ozone layer in the stratosphere protects us from harmful ultraviolet rays.","In the water cycle, water evaporates, forms clouds, falls as rain and flows back to the sea.","Ocean water moves through waves, tides and currents."],"ex":"When you dry clothes in the sun, the water evaporates into the air. Later, this water vapour cools high up, forms clouds and comes back as rain. This is the water cycle at home.","q":"class 7 geography air and water ncert hindi","kw":["atmosphere","ozone","water cycle","tides"]},{"id":"resources-and-agriculture","t":"Resources, Land, Soil and Agriculture","s":"Resources are things we use to meet our needs; land, soil and water support farming and life.","n":["Resources may be natural, human-made or human. Renewable resources (like sunlight) can be replenished; non-renewable ones (like coal) cannot be quickly.","Sustainable development means using resources carefully so future generations also have enough.","Soil forms over a very long time. Trees, terraces and check dams help prevent soil erosion.","Agriculture includes growing crops and rearing animals. India grows rice, wheat, pulses, cotton and many other crops.","Farming may be subsistence (for family use) or commercial (for sale)."],"ex":"In hilly areas like Uttarakhand, farmers cut steps called terraces on slopes. This slows down running rainwater, so soil is not washed away.","q":"class 8 geography resources land soil water agriculture ncert hindi","kw":["resources","soil","agriculture","sustainable development"]},{"id":"industries-human-resources","t":"Industries and Human Resources","s":"Industries turn raw materials into useful goods, and people with skills and health are a nation's greatest resource.","n":["Industries can be agro-based (cotton textiles), mineral-based (iron and steel) or marine-based (fish processing).","Factors like raw material, power, labour, transport and market decide where industries are set up.","Jamshedpur and Bengaluru are well-known Indian industrial centres for steel and IT respectively.","Population distribution is uneven: many people live in plains, few in deserts and high mountains.","Educated and healthy people make a country's human resource strong."],"ex":"Jamshedpur in Jharkhand grew as a steel city because iron ore, coal and water were close by, and rail links helped bring raw materials and send out steel.","q":"class 8 geography industries human resources ncert hindi","kw":["industries","jamshedpur","population","human resources"]}],"9-10":[{"id":"india-size-location","t":"India: Size and Location","s":"India is a large country in the northern hemisphere, with the Tropic of Cancer passing through its middle.","n":["India's mainland lies between 8 degrees 4 minutes N and 37 degrees 6 minutes N latitude, and 68 degrees 7 minutes E and 97 degrees 25 minutes E longitude.","India's area is about 3.28 million square km, about 2.4 percent of the world's land area. It is the seventh largest country.","The Tropic of Cancer (23.5 degrees N) divides India almost into two halves.","India's neighbours include Pakistan, Afghanistan, China, Nepal, Bhutan, Myanmar and Bangladesh. Sri Lanka and Maldives are across the sea.","The east-west time gap is about two hours, so one standard time (IST) is used."],"ex":"Arunachal Pradesh in the east sees sunrise about two hours earlier than Gujarat in the west. Without IST, clocks in the two states would show different times.","q":"class 9 geography india size and location ncert hindi","kw":["india location","tropic of cancer","ist","neighbours"]},{"id":"physical-features-india","t":"Physical Features of India","s":"India has high mountains, wide plains, a desert, an old plateau, coasts and islands.","n":["The Himalayas are young fold mountains with three ranges: Himadri (Greater), Himachal (Lesser) and Shiwaliks (outer).","The Northern Plains are made by the Indus, Ganga and Brahmaputra rivers. They are very fertile.","The Peninsular Plateau is made of very old rocks. It includes the Central Highlands and the Deccan Plateau.","The Western Ghats and Eastern Ghats edge the plateau. The Thar Desert lies in the west.","Islands: Lakshadweep (Arabian Sea, coral islands) and Andaman and Nicobar (Bay of Bengal)."],"ex":"Wheat and rice grow richly in Punjab and Uttar Pradesh because the Northern Plains have deep alluvial soil brought by rivers from the Himalayas.","q":"class 9 geography physical features of india ncert hindi","kw":["himalayas","northern plains","peninsular plateau","islands"]},{"id":"drainage-india","t":"Drainage: Rivers of India","s":"India's rivers are grouped into Himalayan rivers that flow all year and peninsular rivers that depend on rain.","n":["Himalayan rivers like the Indus, Ganga and Brahmaputra are perennial, fed by rain and melting snow.","The Ganga begins as the Bhagirathi from the Gangotri glacier. It meets the Alaknanda at Devprayag.","Most peninsular rivers, like the Godavari, Krishna, Kaveri and Mahanadi, flow east into the Bay of Bengal.","The Narmada and Tapi flow west into the Arabian Sea through rift valleys.","The Godavari is the longest peninsular river. Lakes and rivers need protection from pollution."],"ex":"The Ganga and Brahmaputra together form the Sundarbans delta, the world's largest delta. It is home to the Royal Bengal tiger.","q":"class 9 geography drainage rivers of india ncert hindi","kw":["rivers","ganga","drainage","peninsular rivers"]},{"id":"climate-monsoon","t":"Climate and the Indian Monsoon","s":"India has a monsoon climate, where winds change direction with seasons and bring most rain in summer.","n":["Factors affecting climate: latitude, altitude, pressure and winds, distance from the sea and relief.","The southwest monsoon usually reaches Kerala around 1 June and covers India by mid-July.","India has four seasons: cold weather, hot weather, advancing monsoon (rainy) and retreating monsoon.","Mawsynram in Meghalaya gets among the highest rainfall in the world.","The monsoon brings a unity to India because farming in most regions depends on it."],"ex":"In summer the land heats faster than the sea, creating low pressure over north India. Moist winds blow from the sea to the land, giving monsoon rain in June to September.","q":"class 9 geography climate monsoon ncert hindi","kw":["monsoon","climate","seasons","rainfall"]},{"id":"vegetation-wildlife-population","t":"Natural Vegetation, Wildlife and Population","s":"India's forests and animals vary with rainfall and land, and its people are spread unevenly.","n":["Main forest types: tropical evergreen, tropical deciduous (monsoon), thorn forests, montane forests and mangroves.","National parks, wildlife sanctuaries and biosphere reserves protect plants and animals.","Census 2011 counted about 121 crore people in India.","Population density is the number of people per square km. It is high in the plains and low in deserts and hills.","Sex ratio means number of females per 1,000 males. In Census 2011 it was 943."],"ex":"If a district has 10 lakh people and 2,000 square km of area, its density = 10,00,000 / 2,000 = 500 people per square km.","q":"class 9 geography natural vegetation wildlife population ncert hindi","kw":["vegetation","wildlife","census","population density"]},{"id":"resources-water-forests","t":"Resources and Development: Soil, Forests and Water","s":"India must use land, soil, forests and water wisely for development that lasts.","n":["Major soils: alluvial (plains), black or regur (good for cotton), red and yellow, laterite, arid and forest soils.","Land degradation happens due to mining, overgrazing and deforestation.","Movements like Chipko and Beej Bachao Andolan in the Himalaya helped protect forests and seeds.","Dams provide irrigation and power but can displace people. Rainwater harvesting saves water.","Sustainable development meets today's needs without harming the future."],"ex":"In Rajasthan, people built tankas (underground tanks) to store rooftop rainwater. This simple method gives drinking water through the dry season.","q":"class 10 geography resources and development water resources ncert hindi","kw":["soil types","rainwater harvesting","forests","dams"]},{"id":"agriculture-india","t":"Agriculture in India","s":"Most rural Indians depend on farming; crops are grown in kharif, rabi and zaid seasons.","n":["Kharif crops are sown with the monsoon (June-July) and harvested around September-October: rice, maize, jowar, bajra, cotton, jute.","Rabi crops are sown in winter (October-December) and harvested in spring (April-June): wheat, barley, gram, mustard.","Zaid crops grow in a short summer season: watermelon, cucumber, muskmelon and fodder.","Types of farming: primitive subsistence, intensive subsistence and commercial (including plantations like tea).","The Green Revolution from the 1960s used high-yield seeds, irrigation and fertilisers."],"ex":"A farmer in Punjab grows rice in the kharif season and wheat in the rabi season on the same field. Two crops a year give more income from the same land.","q":"class 10 geography agriculture kharif rabi zaid ncert hindi","kw":["kharif","rabi","green revolution","agriculture"]},{"id":"minerals-industries-lifelines","t":"Minerals, Energy, Manufacturing and Lifelines","s":"Minerals and energy power industries, while roads, railways, ports and airways connect the economy.","n":["Iron ore, coal, bauxite and mica are important minerals. Odisha, Jharkhand and Chhattisgarh are rich in minerals.","Conventional energy: coal, petroleum, natural gas. Non-conventional energy: solar, wind, biogas, tidal.","Manufacturing turns raw materials into higher value goods, like cotton into cloth.","Transport and communication are called lifelines of the economy.","Indian Railways is one of the largest railway networks in the world."],"ex":"Rajasthan and Gujarat get strong sunlight for most of the year. So they are good places for big solar power parks, which give clean electricity.","q":"class 10 geography minerals energy manufacturing lifelines ncert hindi","kw":["minerals","energy","manufacturing","transport"]}],"11-12":[{"id":"geography-as-discipline","t":"Geography as a Discipline","s":"Geography studies places and the relationship between people and their environment in space and time.","n":["Physical geography studies landforms, climate, water, soil and living things.","Human geography studies population, settlements, economy and culture.","Geography uses ideas from many subjects, such as geology, economics and sociology.","Two approaches: systematic (study one topic across the world) and regional (study one region in all aspects).","Maps, GIS and remote sensing are geographers' key tools."],"ex":"A study of rice farming across Asia is systematic. A study of everything about Kerala, its rivers, climate, people and economy, is regional.","q":"class 11 geography as a discipline ncert hindi","kw":["physical geography","human geography","systematic","regional"]},{"id":"interior-plate-tectonics","t":"Interior of the Earth and Plate Tectonics","s":"Earthquake waves reveal the Earth's interior, and moving plates explain mountains, oceans and earthquakes.","n":["Seismic waves: P-waves pass through solids and liquids; S-waves pass only through solids. This shows the outer core is liquid.","Alfred Wegener proposed continental drift in 1912. All continents were once one landmass, Pangaea.","Sea-floor spreading, proposed in the 1960s, showed new crust forms at mid-ocean ridges.","Plate tectonics says the lithosphere is broken into large plates that move slowly.","Plate boundaries can be divergent, convergent or transform."],"ex":"The Indian plate moved north and collided with the Eurasian plate. This collision pushed up the Himalayas, and it is why the region still has earthquakes.","q":"class 11 geography interior of earth plate tectonics ncert hindi","kw":["plate tectonics","continental drift","seismic waves","pangaea"]},{"id":"atmosphere-climate","t":"Atmosphere, Weather and World Climate","s":"The atmosphere's heat, pressure, winds and moisture create weather and climate across the world.","n":["Insolation is incoming solar radiation. The Earth's heat balance keeps average temperature fairly stable.","Winds blow from high pressure to low pressure. The Coriolis force deflects them.","Air masses, fronts and cyclones bring weather changes.","Koeppen's classification divides world climates into groups using temperature and rainfall.","Global warming is caused mainly by rising greenhouse gases like carbon dioxide."],"ex":"In the northern hemisphere, the Coriolis force turns winds to the right. That is why cyclones in the Bay of Bengal spin anticlockwise.","q":"class 11 geography atmosphere climate pressure winds ncert hindi","kw":["insolation","coriolis force","climate classification","global warming"]},{"id":"oceans-water","t":"Water (Oceans)","s":"Oceans cover most of the Earth and shape climate through temperature, salinity, tides and currents.","n":["The ocean floor has continental shelf, slope, deep sea plain and trenches.","Salinity is the amount of salt in sea water, usually measured in parts per thousand.","Tides are caused mainly by the Moon's gravity, and partly by the Sun.","Warm and cold ocean currents affect climate of coastal areas.","The Mariana Trench in the Pacific is the deepest known part of the ocean."],"ex":"On full moon and new moon days, the Sun, Moon and Earth are in a line. Their pulls add up, giving very high tides called spring tides.","q":"class 11 geography oceans tides currents salinity ncert hindi","kw":["ocean","tides","salinity","currents"]},{"id":"india-physical-environment","t":"India: Physical Environment","s":"This book studies India's structure, drainage, climate, soils, vegetation and natural hazards in detail.","n":["India has three structural divisions: Himalayas, Northern Plains and Peninsular Block.","India is divided into physiographic divisions, river systems and climate regions.","Natural hazards in India include earthquakes, cyclones, floods, droughts and landslides.","About 59 percent of India's land is prone to earthquakes of moderate to very high intensity, according to NDMA assessments.","The Disaster Management Act was passed in 2005."],"ex":"Odisha faced a super cyclone in 1999. After that the state built cyclone shelters and early warning systems, and later cyclones caused far fewer deaths.","q":"class 11 india physical environment ncert geography hindi","kw":["natural hazards","disaster management","physiography","india"]},{"id":"human-geography-population","t":"Human Geography: Population and Human Development","s":"Human geography studies how population grows, moves and develops across the world.","n":["Environmental determinism says nature controls humans. Possibilism says humans can choose and change their surroundings.","Demographic transition theory explains how birth and death rates fall as societies develop.","Migration has push factors (poverty, conflict) and pull factors (jobs, better services).","The Human Development Index (HDI) by UNDP measures health, education and income. It was first published in 1990.","Mahbub ul Haq and Amartya Sen helped develop the human development idea."],"ex":"A youth moves from a village in Bihar to Delhi for work. Lack of jobs at home is a push factor; better wages in the city are a pull factor.","q":"class 12 fundamentals of human geography population human development ncert hindi","kw":["human geography","demographic transition","migration","hdi"]},{"id":"economic-activities-settlements","t":"Economic Activities, Transport and Settlements","s":"People earn through primary, secondary, tertiary and quaternary activities and live in rural or urban settlements.","n":["Primary activities use nature directly: farming, fishing, mining. Secondary activities process goods: factories.","Tertiary activities are services like trade and transport. Quaternary activities deal with knowledge and information.","Transport networks and trade link places across the world.","Rural settlements may be clustered, semi-clustered, hamleted or dispersed.","Urban areas grow through migration and natural growth; they face problems like slums and pollution."],"ex":"A cotton farmer is in the primary sector. The mill that spins cotton is secondary. The truck that carries cloth is tertiary. A data analyst studying sales is quaternary.","q":"class 12 geography economic activities settlements ncert hindi","kw":["primary activities","tertiary","settlements","quaternary"]},{"id":"practical-geography-maps","t":"Practical Geography: Maps, Data and GIS","s":"Practical geography teaches how to read maps, make diagrams from data, and use GIS and remote sensing.","n":["Map scale can be shown as a statement, a representative fraction (RF, like 1:50,000) or a graphic bar.","Survey of India produces topographical sheets of India.","Thematic maps show one topic, like rainfall or population.","Remote sensing collects information about the Earth from satellites without touching it.","GIS (Geographic Information System) stores and analyses map data on computers."],"ex":"On a map with RF 1:50,000, 1 cm on the map equals 50,000 cm on the ground, which is 500 metres. So 4 cm on the map = 2 km on the ground.","q":"class 11 practical geography map scale remote sensing gis ncert hindi","kw":["map scale","toposheet","remote sensing","gis"]}],"ug":[{"id":"geomorphology","t":"Geomorphology","s":"Geomorphology studies landforms and the processes that make and change them.","n":["Endogenic forces work from inside the Earth (folding, faulting, volcanism). Exogenic forces work on the surface (weathering, erosion).","W.M. Davis gave the 'cycle of erosion' model: youth, maturity and old age.","Walther Penck stressed that uplift and erosion happen together.","Fluvial (river), glacial, aeolian (wind), karst (limestone) and coastal landforms are studied.","Slope and drainage basin studies help in planning land use."],"ex":"In Meghalaya's limestone areas, rainwater slowly dissolves rock and forms caves like Mawsmai. This is a karst landform made by chemical weathering.","q":"geomorphology ba geography lecture hindi davis cycle of erosion","kw":["geomorphology","weathering","cycle of erosion","landforms"]},{"id":"climatology","t":"Climatology","s":"Climatology studies the atmosphere's long-term patterns of temperature, pressure, winds and rainfall.","n":["The general circulation includes Hadley, Ferrel and polar cells.","Jet streams are fast upper-air winds that influence the Indian monsoon.","El Nino (warm Pacific waters) is often linked to weaker Indian monsoon years, but not always.","Tropical cyclones form over warm seas, generally above about 27 degrees C surface temperature.","Climate classifications by Koeppen and Thornthwaite are widely used."],"ex":"In some El Nino years, like 2009 and 2015, India got below-normal monsoon rain. Farmers and planners watch El Nino forecasts closely.","q":"climatology ba geography lecture jet stream el nino monsoon","kw":["climatology","el nino","jet stream","general circulation"]},{"id":"oceanography-biogeography","t":"Oceanography and Biogeography","s":"These branches study oceans and the distribution of plants and animals across the Earth.","n":["Ocean bottom relief includes ridges, basins and trenches.","Ocean currents move heat around the world and affect fishing grounds.","Coral reefs need warm, clear and shallow water. They are harmed by warming and pollution.","Biogeography studies biomes like tropical forests, grasslands, deserts and tundra.","India is one of the world's megadiverse countries, with hotspots like the Western Ghats and Himalaya."],"ex":"Where cold and warm currents meet, as near Newfoundland, plankton grows well and fish gather. Such places become rich fishing grounds.","q":"oceanography biogeography ba geography lecture hindi","kw":["oceanography","biogeography","biomes","coral reefs"]},{"id":"human-economic-geography","t":"Human and Economic Geography","s":"This topic explains where economic activities locate and why some regions develop faster than others.","n":["Von Thunen's model (1826) explained farm land use rings around a market town.","Alfred Weber's theory (1909) explained industrial location by minimising transport cost.","Christaller's central place theory (1933) explained the size and spacing of towns.","Regional inequality can be studied using income, infrastructure and human development data.","Globalisation has changed where goods are made and sold."],"ex":"Vegetable and milk farms are found near big cities like Pune because fresh produce spoils fast. Wheat can be grown farther away. This fits Von Thunen's idea.","q":"economic geography location theories von thunen weber christaller lecture","kw":["economic geography","von thunen","weber","central place theory"]},{"id":"regional-geography-india","t":"Regional Geography of India","s":"This topic divides India into regions and studies each region's land, resources, people and problems.","n":["India can be divided into physiographic, agro-climatic and economic regions.","The Planning Commission identified 15 agro-climatic zones in the late 1980s.","Regional problems include drought in western India, floods in the east and hill area development.","Special programmes have targeted backward, tribal and border areas.","Regional planning tries to reduce gaps between developed and less developed areas."],"ex":"Bundelkhand faces frequent drought. Studying its rocks, soils and rainfall helps explain why small check dams and watershed projects suit it better than big canals.","q":"regional geography of india ba lecture hindi agro climatic regions","kw":["regional geography","agro-climatic zones","regional planning","india"]},{"id":"cartography-gis-basics","t":"Cartography, Remote Sensing and GIS Basics","s":"Cartography is map-making; remote sensing and GIS help collect and analyse spatial data with computers.","n":["Map projections show the round Earth on flat paper; every projection distorts something (shape, area, distance or direction).","Remote sensing uses the electromagnetic spectrum, including visible, infrared and microwave.","India launched its first Indian Remote Sensing satellite, IRS-1A, in 1988.","GIS data can be vector (points, lines, polygons) or raster (grid cells).","Free tools like QGIS and ISRO's Bhuvan portal are useful for students."],"ex":"In the Mercator projection, Greenland looks almost as large as Africa, though Africa is about 14 times bigger. This shows how projections distort area.","q":"cartography map projection remote sensing gis basics lecture hindi","kw":["cartography","map projection","remote sensing","qgis"]},{"id":"environment-disasters","t":"Environmental Geography and Disaster Management","s":"This topic studies environmental problems and how societies prepare for and reduce disasters.","n":["Hazard is a possible danger; disaster happens when a hazard strikes vulnerable people.","Risk depends on hazard, exposure and vulnerability.","The Disaster Management Act 2005 set up the National Disaster Management Authority (NDMA).","The disaster management cycle has mitigation, preparedness, response and recovery.","Climate change can increase extreme events like heat waves and heavy rainfall."],"ex":"A cyclone over an empty sea is a hazard. When it hits a crowded coast with weak houses, it becomes a disaster. Strong shelters and warnings lower the risk.","q":"environmental geography disaster management ba lecture hazard vulnerability","kw":["hazard","vulnerability","disaster management","environment"]}],"pg":[{"id":"geographic-thought","t":"Evolution of Geographical Thought","s":"This topic traces how ideas in geography changed, from ancient times to modern approaches.","n":["Alexander von Humboldt and Carl Ritter are seen as founders of modern geography.","Environmental determinism (Ratzel, Ellen Semple) said environment shapes human life; possibilism (Vidal de la Blache) stressed human choice.","The quantitative revolution in the 1950s-60s brought statistics and models.","Behavioural, humanistic and radical (Marxist) geographies challenged the quantitative approach.","Postmodern and feminist geographies study identity, power and difference in space."],"ex":"A determinist might say tropical heat makes people lazy. Later geographers rejected such ideas, showing that history, economy and policy explain differences much better.","q":"geographical thought determinism possibilism quantitative revolution ma lecture","kw":["geographical thought","determinism","possibilism","quantitative revolution"]},{"id":"advanced-remote-sensing-gis","t":"Advanced Remote Sensing and GIS","s":"PG students learn image processing, spatial analysis and how to use satellite data for real problems.","n":["Spectral signatures help identify features like water, vegetation and built-up land.","NDVI (Normalised Difference Vegetation Index) uses red and near-infrared bands to measure greenness.","Image classification can be supervised or unsupervised.","Free satellite data is available from sources like Landsat, Sentinel and ISRO's Bhuvan.","Accuracy assessment checks results against ground truth."],"ex":"NDVI = (NIR - Red) / (NIR + Red). If NIR = 0.5 and Red = 0.1, NDVI = 0.4 / 0.6 = 0.67, which indicates healthy green vegetation.","q":"advanced remote sensing gis ndvi image classification lecture","kw":["ndvi","image classification","spatial analysis","sentinel"]},{"id":"urban-geography","t":"Urban Geography and Planning","s":"Urban geography studies how cities grow, how land inside them is used, and urban problems.","n":["Census of India defines statutory towns and census towns (population at least 5,000, density at least 400 per sq km, and 75 percent of male main workers in non-farm work).","Models of city structure include the concentric zone (Burgess), sector (Hoyt) and multiple nuclei (Harris and Ullman).","Urbanisation in India brings issues of housing, slums, transport and water.","The 74th Constitutional Amendment (1992) strengthened urban local bodies.","Smart city and urban renewal schemes are studied critically."],"ex":"A large village with 6,000 people, high density and most men working in shops and factories may be counted as a 'census town' even without a municipality.","q":"urban geography ma lecture burgess hoyt urbanisation india","kw":["urban geography","census town","city models","urbanisation"]},{"id":"population-geography","t":"Population Geography","s":"Population geography studies size, distribution, composition and movement of people across space.","n":["Key measures: fertility, mortality, migration, age-sex structure and dependency ratio.","Malthus (1798) warned that population would outgrow food supply.","Demographic dividend is the chance for faster growth when the working-age share is high.","Data sources in India include the Census, Sample Registration System and NFHS.","Population pyramids show age-sex structure visually."],"ex":"If a place has many young children and old people but fewer working adults, the dependency ratio is high. This means each worker supports more dependants.","q":"population geography ma lecture demographic dividend population pyramid","kw":["population geography","fertility","demographic dividend","migration"]},{"id":"political-geography","t":"Political Geography and Geopolitics","s":"Political geography studies how power, borders and states relate to space and territory.","n":["Mackinder's Heartland theory (1904) and Spykman's Rimland theory shaped early geopolitics.","Boundaries can follow natural features or be drawn as straight lines.","Electoral geography studies voting patterns and constituency delimitation.","Resource conflicts over rivers and seas are important topics.","Critical geopolitics studies how leaders and media describe the world."],"ex":"Rivers like the Indus are shared by countries. The Indus Waters Treaty (1960) between India and Pakistan shows how geography and diplomacy meet.","q":"political geography geopolitics heartland theory ma lecture","kw":["political geography","geopolitics","boundaries","heartland"]},{"id":"quantitative-methods-geography","t":"Quantitative Methods in Geography","s":"Statistics and spatial methods help geographers measure patterns and test ideas with data.","n":["Descriptive statistics: mean, median, standard deviation and coefficient of variation.","Correlation and regression test links between variables like rainfall and crop yield.","Nearest neighbour analysis shows if settlements are clustered, random or dispersed.","Spatial autocorrelation (like Moran's I) checks whether nearby places are similar.","Sampling methods are needed for field surveys."],"ex":"If nearest neighbour index R is close to 0, settlements are clustered; R near 1 means random; R up to about 2.15 means evenly spread. A value of 0.4 suggests clustering.","q":"quantitative methods in geography nearest neighbour analysis morans i lecture","kw":["statistics","regression","nearest neighbour","spatial autocorrelation"]}],"phd":[{"id":"geography-research-design","t":"Research Design in Geography","s":"A good geography PhD starts with a clear spatial question, the right scale and suitable methods.","n":["Choose your scale: local, regional, national or global. Results can change with scale.","Decide on quantitative, qualitative or mixed methods based on the question.","Be careful about the modifiable areal unit problem (MAUP): results can change with how areas are drawn.","Review literature and existing datasets before collecting new data.","Plan ethics approval if you work with people."],"ex":"District-level data may show no link between irrigation and poverty, but village-level data may show a strong link. This is why scale matters in geographical research.","q":"research methodology in geography phd research design","kw":["research design","scale","maup","mixed methods"]},{"id":"fieldwork-surveys","t":"Fieldwork, Surveys and Qualitative Methods","s":"Fieldwork collects first-hand data through observation, measurement, surveys and interviews.","n":["Use GPS, mobile apps and field notebooks to record locations and observations.","Household surveys need a clear sampling plan and pretested questions.","Interviews, focus groups and participatory mapping capture local knowledge.","Get informed consent and protect people's identity.","Cross-check field data with satellite images and secondary data."],"ex":"To study a flood, a researcher interviews villagers, marks flood levels on houses with GPS, and compares them with satellite images taken during the flood.","q":"geography fieldwork methods survey participatory mapping","kw":["fieldwork","survey","participatory mapping","interviews"]},{"id":"geospatial-modelling","t":"Spatial Statistics and Geospatial Modelling","s":"Advanced research uses spatial statistics, models and big geodata to explain patterns and predict change.","n":["Geographically weighted regression (GWR) lets relationships vary across space.","Land use and land cover change models predict future patterns.","Hydrological models simulate river flow and floods.","Open-source tools like QGIS, R and Python (with packages like GeoPandas) are widely used.","Models must be validated with real observations."],"ex":"A researcher uses 30 years of satellite images to map how farmland around Bengaluru turned into built-up land, and then models where growth may happen next.","q":"spatial statistics geographically weighted regression land use change modelling","kw":["spatial statistics","gwr","land use change","modelling"]},{"id":"climate-change-frontiers","t":"Frontier Areas: Climate Change, Hazards and Sustainability","s":"Current geography research studies climate change impacts, adaptation, disasters and sustainable development.","n":["IPCC reports summarise the science of climate change and are key references.","Research areas include glacier retreat, sea-level rise, urban heat islands and monsoon variability.","Vulnerability and adaptation studies look at how people cope with climate stress.","The Sustainable Development Goals (SDGs, 2015) give a framework for many studies.","Interdisciplinary teams combine physical and social sciences."],"ex":"A study of urban heat islands in Delhi compares surface temperatures from satellites with tree cover, and finds that greener areas are noticeably cooler on summer days.","q":"climate change geography research urban heat island glacier retreat","kw":["climate change","adaptation","urban heat island","sdg"]},{"id":"critical-geographies","t":"Critical and Human Geographies","s":"Critical geographers study power, inequality, identity and justice in how space is made and used.","n":["David Harvey's work links capitalism with urban change.","Feminist geography studies how gender shapes access to space and resources.","Political ecology studies conflicts over natural resources.","Researchers reflect on their own position (positionality) in the field.","Writing should connect theory with careful empirical evidence."],"ex":"A political ecology study of a dam asks: who gets water and power, and who loses land? This shows that environmental changes have social winners and losers.","q":"critical geography political ecology feminist geography lecture","kw":["critical geography","political ecology","positionality","feminist geography"]}]},"order":9},{"id":"polity","name":"Political Science & Polity","nameHi":"राजनीति विज्ञान","group":"social","blurb":"Political science studies how we are governed: the Constitution, rights, government, elections, and ideas about power and justice.","levels":{"6-8":[{"id":"diversity-and-democracy","t":"Diversity, Equality and Democracy","s":"India has many languages, religions and cultures; democracy gives every adult an equal vote.","n":["Diversity (विविधता) means differences in language, food, dress, festivals and religion.","Prejudice means judging people negatively without knowing them. Stereotypes fix people into one image.","Democracy (लोकतंत्र) means people choose their government through elections.","Universal adult franchise means every adult citizen can vote, whatever their caste, religion, gender or wealth.","In India the voting age is 18 years."],"ex":"In one village, a landless labourer and a rich landlord both have exactly one vote each. This is political equality, even if they are not economically equal.","q":"class 6 civics diversity and government ncert hindi","kw":["diversity","democracy","equality","universal adult franchise"]},{"id":"local-government","t":"Panchayati Raj and Urban Local Government","s":"Villages and cities run many of their own affairs through elected local bodies like panchayats and municipalities.","n":["Panchayati Raj has three levels: Gram Panchayat (village), Panchayat Samiti (block) and Zila Parishad (district).","The Gram Sabha is a meeting of all adult voters of the panchayat area. It checks the panchayat's work.","The Sarpanch (or Pradhan) is the elected head of the Gram Panchayat.","In cities, Municipal Corporations and Municipalities look after water, roads, garbage and streetlights.","The 73rd and 74th Constitutional Amendments (1992) gave constitutional status to panchayats and municipalities."],"ex":"If a village handpump is broken, villagers can raise this in the Gram Sabha. The panchayat can then use its funds to repair it and report back.","q":"class 6 civics panchayati raj urban administration ncert hindi","kw":["panchayati raj","gram sabha","sarpanch","municipality"]},{"id":"state-government","t":"How the State Government Works","s":"Each state has an elected legislative assembly, a Chief Minister and a Governor.","n":["Voters in each constituency elect an MLA (Member of Legislative Assembly).","The party or group with a majority of MLAs forms the government. Its leader becomes the Chief Minister.","The Governor is appointed by the President and is the formal head of the state.","Ministers head departments like health, education and public works.","The assembly debates problems and passes laws for the state."],"ex":"If an assembly has 200 seats, a party needs at least 101 MLAs for a majority. If no single party has this, parties may join together to form a coalition government.","q":"class 7 civics how the state government works ncert hindi","kw":["mla","chief minister","governor","assembly"]},{"id":"constitution-intro","t":"The Indian Constitution","s":"The Constitution is the supreme law that sets up the government and protects citizens' rights.","n":["The Constituent Assembly made the Constitution. Dr B.R. Ambedkar chaired its Drafting Committee.","It was adopted on 26 November 1949 (now Constitution Day) and came into force on 26 January 1950 (Republic Day).","Key features: federalism, parliamentary government, separation of powers, Fundamental Rights and secularism.","Secularism means the State does not favour or promote any one religion.","The Constitution can be amended, following Article 368."],"ex":"If a law passed by any government goes against the Constitution, courts can strike it down. This is why the Constitution is called the supreme law of the land.","q":"class 8 civics the indian constitution ncert hindi","kw":["constitution","ambedkar","republic day","secularism"]},{"id":"parliament-basics","t":"Parliament and the Making of Laws","s":"Parliament is the national law-making body made up of the President, Lok Sabha and Rajya Sabha.","n":["Lok Sabha members (MPs) are directly elected by voters. It has 543 elected seats at present.","Rajya Sabha members are mostly elected by state MLAs. The President nominates 12 members.","A bill becomes a law after both Houses pass it and the President gives assent.","The Prime Minister leads the Council of Ministers, which is responsible to the Lok Sabha.","Parliament controls the government through questions, debates and approval of money."],"ex":"During Question Hour, an MP may ask the Railways Minister why trains in her area run late. The minister must answer in the House, which keeps the government accountable.","q":"class 8 civics why do we need a parliament ncert hindi","kw":["parliament","lok sabha","rajya sabha","law making"]},{"id":"judiciary-basics","t":"The Judiciary","s":"Courts settle disputes, protect rights and make sure laws follow the Constitution.","n":["India has an integrated court system: Supreme Court at the top, then High Courts, then district and lower courts.","An independent judiciary means judges are not controlled by the government or the legislature.","Courts deal with civil cases (like property disputes) and criminal cases (like theft).","Public Interest Litigation (PIL) lets any person approach the court for the public good.","Police must register an FIR (First Information Report) for serious crimes."],"ex":"If a person is unhappy with a district court's decision, he can appeal to the High Court, and then to the Supreme Court. This is called the appeal system.","q":"class 8 civics judiciary understanding our criminal justice system ncert hindi","kw":["judiciary","supreme court","pil","fir"]},{"id":"rights-marginalisation","t":"Rights, Marginalisation and Social Justice","s":"The Constitution protects groups who face discrimination, and laws help ensure dignity for all.","n":["Marginalised groups are those pushed to the edge of society, such as Adivasis, Dalits and some minorities.","Article 17 abolishes untouchability. Practising it is a punishable offence.","The Scheduled Castes and the Scheduled Tribes (Prevention of Atrocities) Act was passed in 1989.","Reservations in education and jobs aim to give fair opportunities.","Every citizen can use these rights and laws to seek justice."],"ex":"If a Dalit family is stopped from using a village well, this is untouchability. They can complain to the police under the law, because Article 17 bans such practice.","q":"class 8 civics understanding marginalisation confronting marginalisation ncert hindi","kw":["marginalisation","untouchability","article 17","social justice"]}],"9-10":[{"id":"what-is-democracy","t":"What Is Democracy? Why Democracy?","s":"Democracy is a form of government in which rulers are elected by the people in free and fair elections.","n":["Main features: elected rulers have final power, free and fair elections, one person one vote one value, and rule of law with respect for rights.","Elections must give a real choice. Only a few parties controlling everything is not true democracy.","Democracy allows mistakes to be corrected through debate and elections.","It improves the dignity of citizens and helps deal with differences peacefully.","Democracy can be slow, but it is more accountable than other forms of government."],"ex":"If a country holds elections but the ruling party never allows opposition parties to campaign, people do not get a real choice. Such elections do not meet the standard of democracy.","q":"class 9 political science what is democracy why democracy ncert hindi","kw":["democracy","free and fair elections","rule of law","accountability"]},{"id":"preamble-constitutional-design","t":"Constitutional Design and the Preamble","s":"The Preamble states the Constitution's basic values and tells us what kind of country India wants to be.","n":["The Preamble begins with 'We, the People of India', showing people are the source of authority.","It describes India as a Sovereign, Socialist, Secular, Democratic Republic.","The words 'Socialist', 'Secular' and 'Integrity' were added by the 42nd Amendment in 1976.","It promises Justice (social, economic, political), Liberty, Equality and Fraternity.","The original Constitution had 395 articles, 22 parts and 8 schedules. Today it has 12 schedules."],"ex":"'Republic' means the head of state is elected, not hereditary. India's President is elected, unlike a king or queen who gets the post by birth.","q":"class 9 political science constitutional design preamble ncert hindi","kw":["preamble","republic","secular","42nd amendment"]},{"id":"electoral-politics","t":"Electoral Politics","s":"Elections let people choose representatives; India's Election Commission conducts them independently.","n":["India is divided into constituencies. Each elects one representative.","Some seats are reserved for Scheduled Castes and Scheduled Tribes.","The Election Commission of India is set up under Article 324. It conducts elections to Parliament, state legislatures, and the offices of President and Vice-President.","The voting age was lowered from 21 to 18 by the 61st Amendment (1988).","The Model Code of Conduct guides parties and candidates during elections."],"ex":"India uses 'first past the post'. If candidate A gets 40 percent, B 35 percent and C 25 percent of votes, A wins, even without a majority of all votes.","q":"class 9 political science electoral politics ncert hindi","kw":["election commission","constituency","voting age","model code of conduct"]},{"id":"working-of-institutions","t":"Working of Institutions","s":"Democracy works through institutions: legislature makes laws, executive runs government, judiciary settles disputes.","n":["The President is the head of state. Real executive power lies with the Council of Ministers led by the Prime Minister.","The President is elected indirectly by elected MPs and elected MLAs (Article 54).","The Lok Sabha has more power over money matters. A Money Bill can be introduced only in the Lok Sabha (Article 109, 110).","Permanent civil servants help ministers carry out decisions.","Judges of the Supreme Court and High Courts can be removed only by a special process in Parliament."],"ex":"In 1990 the government announced reservation for backward classes in central government jobs, based on the Mandal Commission. The order was challenged and the Supreme Court decided the case in 1992. This shows all three institutions at work.","q":"class 9 political science working of institutions ncert hindi","kw":["president","prime minister","money bill","institutions"]},{"id":"fundamental-rights","t":"Fundamental Rights","s":"Part III of the Constitution (Articles 12 to 35) gives every person basic rights the State must respect.","n":["Right to Equality (Articles 14-18) and Right to Freedom (Articles 19-22).","Right against Exploitation (Articles 23-24) bans forced labour and child labour in hazardous work.","Right to Freedom of Religion (Articles 25-28) and Cultural and Educational Rights (Articles 29-30).","Right to Constitutional Remedies (Article 32) lets people go to the Supreme Court. Dr Ambedkar called it the 'heart and soul' of the Constitution.","Article 21A (added in 2002) gives free and compulsory education to children aged 6 to 14."],"ex":"If police arrest someone and hide him without telling a court, his family can file a habeas corpus petition. The court can order the police to produce him before it.","q":"class 9 political science democratic rights fundamental rights ncert hindi","kw":["fundamental rights","article 32","article 21","part iii"]},{"id":"power-sharing-federalism","t":"Power Sharing and Federalism","s":"Sharing power between governments and groups reduces conflict; India divides power between Union and states.","n":["Belgium shared power among Dutch and French speakers. Sri Lanka's majoritarian policies led to conflict.","Power can be shared among organs of government, levels of government, social groups and parties.","The Seventh Schedule has three lists: Union List (e.g., defence), State List (e.g., police) and Concurrent List (e.g., education).","Residuary subjects, not in any list, belong to the Union.","Linguistic states were created after the States Reorganisation Act, 1956."],"ex":"Defence is in the Union List, so only Parliament makes laws on it. Police is in the State List, so each state runs its own police. Education is in the Concurrent List, so both can make laws.","q":"class 10 political science power sharing federalism ncert hindi","kw":["federalism","power sharing","seventh schedule","concurrent list"]},{"id":"parties-and-social-divisions","t":"Political Parties, Gender, Religion and Caste","s":"Parties connect people to government; democracy must handle social differences fairly.","n":["A political party is a group that seeks to contest elections and hold power.","Recognised parties get a fixed symbol from the Election Commission. Parties can be national or state parties.","The anti-defection law (Tenth Schedule, added by the 52nd Amendment, 1985) discourages elected members from switching parties.","One-third of seats in panchayats and municipalities are reserved for women. The 106th Amendment (2023) provides one-third reservation for women in Lok Sabha and state assemblies, to apply after a new delimitation.","Communalism and caste-based discrimination are challenges democracy must address."],"ex":"If an MLA elected on a party ticket joins another party without following the law, he can lose his seat under the Tenth Schedule. This keeps elected members accountable to voters.","q":"class 10 political science political parties gender religion caste ncert hindi","kw":["political parties","anti-defection","women reservation","communalism"]},{"id":"outcomes-of-democracy","t":"Outcomes of Democracy","s":"We judge democracy by whether it is accountable, responsive, legitimate, and protects dignity and freedom.","n":["Democracy produces accountable and legitimate government.","Economic growth and reducing inequality depend on many factors, not only the type of government.","Democracies handle social differences through negotiation.","It respects the dignity and freedom of citizens, especially women and weaker groups.","The Right to Information Act (2005) helps citizens ask questions of government."],"ex":"A citizen files an RTI request asking how much money was spent on a local road. The office must reply within 30 days, which helps people check corruption.","q":"class 10 political science outcomes of democracy ncert hindi","kw":["outcomes of democracy","rti","legitimacy","accountability"]}],"11-12":[{"id":"constitution-at-work","t":"Constitution: Why and How","s":"A Constitution sets basic rules, limits government power and expresses society's goals.","n":["The Constituent Assembly first met on 9 December 1946 and took almost three years to finish.","It borrowed ideas from many sources, such as the Government of India Act 1935, the British parliamentary system and the US Bill of Rights.","The Constitution is called a 'living document' because it changes with time through amendments and court interpretation.","In Kesavananda Bharati case (1973), the Supreme Court said Parliament cannot change the 'basic structure' of the Constitution.","The 44th Amendment (1978) removed property from Fundamental Rights; it is now a legal right under Article 300A."],"ex":"Parliament can amend many articles under Article 368. But it cannot abolish, for example, judicial review or free elections, because the Supreme Court treats these as part of the basic structure.","q":"class 11 political science constitution why and how indian constitution at work hindi","kw":["constituent assembly","basic structure","kesavananda bharati","amendment"]},{"id":"dpsp-fundamental-duties","t":"Directive Principles and Fundamental Duties","s":"Directive Principles guide governments toward welfare; Fundamental Duties remind citizens of their responsibilities.","n":["Directive Principles of State Policy (DPSP) are in Part IV, Articles 36 to 51.","They are not enforceable by courts, but are 'fundamental in the governance of the country' (Article 37).","Examples: equal pay for equal work (Article 39), village panchayats (Article 40), uniform civil code (Article 44), protect environment (Article 48A).","Fundamental Duties are in Part IVA, Article 51A. They were added by the 42nd Amendment (1976).","There were 10 duties at first; the 86th Amendment (2002) added an 11th duty on parents to educate children aged 6-14."],"ex":"The Right to Education was first a Directive Principle. Later, the 86th Amendment made education for ages 6-14 a Fundamental Right (Article 21A). This shows DPSP guiding later laws.","q":"class 11 political science directive principles fundamental duties hindi","kw":["dpsp","fundamental duties","article 51a","part iv"]},{"id":"executive-legislature","t":"Executive and Legislature","s":"India has a parliamentary system where the executive is drawn from, and answerable to, the legislature.","n":["The President (Article 52) acts on the advice of the Council of Ministers headed by the Prime Minister (Article 74).","The Council of Ministers is collectively responsible to the Lok Sabha (Article 75).","The Vice-President is the ex officio Chairman of the Rajya Sabha (Article 64).","The Lok Sabha's normal term is five years. The Rajya Sabha is permanent; one-third of members retire every two years.","Emergency provisions: national emergency (Article 352), President's rule in states (Article 356) and financial emergency (Article 360)."],"ex":"If the Lok Sabha passes a no-confidence motion against the government, the Prime Minister and whole Council of Ministers must resign. This is collective responsibility.","q":"class 11 political science executive legislature indian constitution at work hindi","kw":["executive","parliament","collective responsibility
