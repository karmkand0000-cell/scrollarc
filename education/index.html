","emergency"]},{"id":"judiciary-federalism-local","t":"Judiciary, Federalism and Local Governments","s":"An independent judiciary, a federal structure and local self-government work together under the Constitution.","n":["The Supreme Court is set up under Article 124 and High Courts under Article 214.","Judicial review lets courts declare laws unconstitutional. Courts can issue writs: habeas corpus, mandamus, prohibition, certiorari and quo warranto.","Indian federalism has a strong Centre. Article 1 calls India a 'Union of States'.","The 73rd Amendment (Panchayats, Part IX) and 74th Amendment (Municipalities, Part IXA) came into force in 1993.","They require elections every five years and reserve one-third of seats for women."],"ex":"Mandamus means 'we command'. If a government office refuses, without reason, to do a duty it must legally perform, a court can issue mandamus ordering it to act.","q":"class 11 political science judiciary federalism local governments hindi","kw":["judicial review","writs","federalism","73rd amendment"]},{"id":"political-theory-concepts","t":"Political Theory: Freedom, Equality, Justice, Rights","s":"Political theory studies key ideas like freedom, equality, justice and rights that guide public life.","n":["Negative liberty means freedom from interference. Positive liberty means having real ability to make choices.","Equality can be political, social or economic. Equal opportunity may need special support for the disadvantaged.","John Rawls suggested the 'veil of ignorance': choose rules for society without knowing your own position in it.","Rights are claims recognised by society and the State. They come with duties.","Other key ideas include citizenship, nationalism, secularism and development."],"ex":"Imagine designing exam rules without knowing whether you will be rich or poor, able-bodied or disabled. You would likely make fair rules for all. That is Rawls's veil of ignorance.","q":"class 11 political theory freedom equality justice rights hindi","kw":["political theory","liberty","justice","rawls"]},{"id":"contemporary-world-politics","t":"Contemporary World Politics","s":"This topic covers the Cold War, its end, new centres of power and international organisations.","n":["The Cold War (about 1945-1991) was a rivalry between the USA and the USSR without direct full-scale war between them.","India helped found the Non-Aligned Movement; its first summit was in Belgrade in 1961.","The USSR broke up in 1991, ending the bipolar world.","The United Nations was founded in 1945. Its Security Council has five permanent members with veto power.","Regional groups include the European Union, ASEAN and SAARC."],"ex":"During the Cuban Missile Crisis (1962), the USSR placed missiles in Cuba near the USA. Both sides stepped back after tense talks, showing how close the Cold War came to nuclear war.","q":"class 12 contemporary world politics cold war ncert hindi","kw":["cold war","non-aligned movement","united nations","bipolarity"]},{"id":"politics-since-independence","t":"Politics in India Since Independence","s":"This topic studies nation-building, party politics and major events in India after 1947.","n":["Early challenges: integrating over 500 princely states, led by Sardar Patel and V.P. Menon.","The first general elections were held in 1951-52.","The Congress party was dominant in early decades; coalition politics grew from the late 1980s.","A national emergency was in force from June 1975 to March 1977. The 44th Amendment (1978) added safeguards to emergency powers.","Social movements, regional aspirations and economic reforms of 1991 also shaped Indian politics."],"ex":"In the first general election, many voters could not read. So each candidate had a separate ballot box marked with an election symbol, and voters dropped their ballot paper in the box of their choice.","q":"class 12 politics in india since independence ncert hindi","kw":["nation building","emergency 1975","first general election","coalition"]}],"ug":[{"id":"western-political-thought","t":"Western Political Thought","s":"Great thinkers from Plato to Marx asked what a just state is and why people obey government.","n":["Plato's Republic described an ideal state ruled by philosopher-kings. Aristotle studied many constitutions and called man a political animal.","Machiavelli's The Prince discussed how rulers gain and keep power.","Social contract thinkers: Hobbes (Leviathan, 1651), Locke (natural rights to life, liberty, property) and Rousseau (general will).","J.S. Mill's On Liberty (1859) defended free speech and the harm principle.","Karl Marx explained history through class struggle and criticised capitalism."],"ex":"Hobbes said life without government would be 'nasty, brutish and short', so people agree to obey a strong ruler. Locke instead said people can remove a government that violates their rights.","q":"western political thought plato hobbes locke rousseau ba political science hindi","kw":["political thought","social contract","hobbes","locke"]},{"id":"indian-political-thought","t":"Indian Political Thought","s":"Indian thinkers from Kautilya to Gandhi and Ambedkar offered ideas about state, society and justice.","n":["Kautilya's Arthashastra discussed statecraft, including the saptanga (seven limbs) theory of the state.","Raja Rammohan Roy and other reformers argued for rights, reason and social reform.","Gandhi's Hind Swaraj (1909) criticised modern civilisation and explained swaraj and non-violence.","Dr Ambedkar's Annihilation of Caste (1936) argued for ending caste and building social democracy.","Other thinkers include Tilak, Tagore, Nehru, Lohia and Pandita Ramabai."],"ex":"Kautilya's seven limbs of the state are: king, ministers, territory with people, fort, treasury, army and ally. Just as a body needs all its limbs, a state needs all seven.","q":"indian political thought kautilya gandhi ambedkar ba political science hindi","kw":["kautilya","gandhi","ambedkar","indian political thought"]},{"id":"indian-government-politics","t":"Indian Government and Politics","s":"This course studies how India's Constitution works in practice, through parties, elections, federalism and courts.","n":["Parliamentary sovereignty in India is limited by judicial review and the basic structure doctrine.","Centre-state relations cover legislative, administrative and financial powers. The Finance Commission (Article 280) recommends sharing of taxes.","The Goods and Services Tax (101st Amendment, 2016) created the GST Council (Article 279A).","Party system changes, voting behaviour, caste and identity are studied with evidence.","Institutions like the CAG (Article 148) and UPSC (Article 315) support accountability."],"ex":"The Finance Commission is set up every five years. It recommends what share of central tax money goes to states and how it is divided among them, using formulas based on population, area and income.","q":"indian government and politics ba political science lecture hindi","kw":["centre-state relations","finance commission","gst council","indian politics"]},{"id":"comparative-politics","t":"Comparative Government and Politics","s":"Comparative politics studies different countries' political systems to understand similarities and differences.","n":["Systems can be parliamentary (UK, India) or presidential (USA).","Constitutions can be written or largely unwritten (as in the UK).","States can be unitary (France) or federal (USA, India).","Electoral systems include first-past-the-post and proportional representation.","Approaches include institutional, systems (David Easton) and structural-functional (Gabriel Almond)."],"ex":"In the USA, the President is elected separately and cannot be removed by a simple no-confidence vote. In India and the UK, the Prime Minister needs majority support in the lower house to stay in office.","q":"comparative government and politics ba political science lecture","kw":["comparative politics","presidential","parliamentary","electoral systems"]},{"id":"international-relations-theory","t":"International Relations: Theories and Issues","s":"International relations studies how states and other actors interact in war, trade, diplomacy and cooperation.","n":["Realism (e.g., Hans Morgenthau) sees states seeking power and security in an anarchic world.","Liberalism stresses cooperation, trade and international institutions.","Constructivism (e.g., Alexander Wendt) says ideas and identities shape state behaviour.","Key issues include security, globalisation, climate change, terrorism and human rights.","India's foreign policy principles include non-alignment and Panchsheel (agreed with China in 1954)."],"ex":"A realist explains a country raising its defence budget as a response to a stronger neighbour. A liberal might stress how trade links between the two make war costly for both.","q":"international relations theories realism liberalism constructivism ba lecture hindi","kw":["international relations","realism","liberalism","constructivism"]},{"id":"public-administration","t":"Public Administration","s":"Public administration studies how government policies are put into practice through organisations and officials.","n":["Woodrow Wilson's 1887 essay is often seen as the start of the discipline.","Max Weber described bureaucracy: hierarchy, rules, records and merit-based officials.","New Public Management (1980s-90s) brought ideas like efficiency and customer focus.","Good governance values include transparency, accountability, participation and rule of law.","In India, the All India Services include the IAS, IPS and IFoS."],"ex":"Direct Benefit Transfer sends subsidy money straight into beneficiaries' bank accounts. Administrators study whether this reduces leakage compared to older methods.","q":"public administration ba lecture weber bureaucracy good governance hindi","kw":["public administration","bureaucracy","good governance","weber"]}],"pg":[{"id":"contemporary-political-theory","t":"Contemporary Political Theory","s":"PG political theory studies modern debates on justice, liberty, identity, recognition and democracy.","n":["Rawls's A Theory of Justice (1971) defended equal liberties and the difference principle.","Robert Nozick (1974) defended a minimal state and property rights.","Communitarians like Michael Sandel and Charles Taylor stressed community and identity.","Amartya Sen's capability approach focuses on what people are actually able to do and be.","Feminist, multicultural and deliberative democracy theories widen the debate."],"ex":"Rawls's difference principle allows inequality only if it benefits the least advantaged. For example, higher pay for doctors may be fair if it means better health care for the poor.","q":"contemporary political theory rawls nozick sandel capability approach ma lecture","kw":["rawls","nozick","communitarianism","capability approach"]},{"id":"indian-federalism-advanced","t":"Indian Federalism and Centre-State Relations","s":"This topic studies how power is shared and negotiated between the Union and states in practice.","n":["K.C. Wheare described India as 'quasi-federal'. Others call it cooperative or bargaining federalism.","The Sarkaria Commission (1983-88) and Punchhi Commission (2007-10) reviewed centre-state relations.","S.R. Bommai v. Union of India (1994) limited misuse of Article 356.","Fiscal federalism includes the Finance Commission, GST Council and centrally sponsored schemes.","Inter-state river disputes and language issues are recurring themes."],"ex":"After the Bommai judgment, a state government's majority should be tested on the floor of the assembly, not decided only by the Governor's opinion. This reduced arbitrary dismissal of state governments.","q":"indian federalism centre state relations sarkaria commission bommai case lecture","kw":["federalism","sarkaria commission","bommai","article 356"]},{"id":"comparative-political-analysis","t":"Comparative Political Analysis","s":"Advanced comparative politics studies democratisation, state capacity, parties and political economy across countries.","n":["Samuel Huntington described 'waves' of democratisation.","Theories ask why democracies survive or break down, using economic, cultural and institutional factors.","Arend Lijphart compared majoritarian and consensus democracies.","State capacity means a state's ability to collect taxes, enforce laws and deliver services.","Methods include case studies, comparative historical analysis and large-N statistics."],"ex":"Lijphart found that consensus democracies with proportional representation often include more groups in government. Students test such claims by comparing several countries.","q":"comparative political analysis democratisation lijphart ma lecture","kw":["democratisation","lijphart","state capacity","comparative method"]},{"id":"india-foreign-policy","t":"India's Foreign Policy","s":"This topic studies the goals, principles and changes in India's relations with the world since 1947.","n":["Nehru-era foreign policy stressed non-alignment, anti-colonialism and peaceful coexistence.","India conducted nuclear tests in 1974 and 1998.","The 'Look East' policy (1990s) became 'Act East' in 2014.","India is active in groups like BRICS, the G20 and the Shanghai Cooperation Organisation.","Students study India's relations with neighbours, major powers and the Global South."],"ex":"India held the G20 presidency in 2023 and hosted its summit in New Delhi, where the African Union became a permanent member of the G20.","q":"india foreign policy ma political science lecture non alignment act east","kw":["foreign policy","non-alignment","act east","g20"]},{"id":"public-policy","t":"Public Policy Analysis","s":"Public policy studies how governments identify problems, choose solutions, implement them and evaluate results.","n":["The policy cycle: agenda setting, formulation, decision, implementation and evaluation.","Models include rational choice, incrementalism (Lindblom) and multiple streams (Kingdon).","Policy evaluation uses evidence, such as surveys and impact studies.","Indian examples include MGNREGA (2005), Right to Education Act (2009) and National Food Security Act (2013).","Citizen participation and social audits improve accountability."],"ex":"Social audits of MGNREGA in some states have villagers check job records in public meetings. When names of people who never worked are found, money can be recovered.","q":"public policy analysis policy cycle ma political science lecture","kw":["public policy","policy cycle","evaluation","social audit"]},{"id":"human-rights-politics","t":"Human Rights and Politics","s":"This topic studies human rights ideas, laws and institutions at national and global levels.","n":["The Universal Declaration of Human Rights was adopted by the UN on 10 December 1948.","Key covenants: ICCPR and ICESCR (1966).","India's Protection of Human Rights Act (1993) set up the National Human Rights Commission.","Courts have widened Article 21 to include rights like privacy (Puttaswamy judgment, 2017).","Debates include universalism vs. cultural relativism, and balancing security with liberty."],"ex":"In 2017, a nine-judge Supreme Court bench in the Puttaswamy case held privacy to be a Fundamental Right, linked to life and personal liberty under Article 21.","q":"human rights and politics ma lecture udhr nhrc article 21","kw":["human rights","udhr","nhrc","right to privacy"]}],"phd":[{"id":"polsci-research-methods","t":"Research Methods in Political Science","s":"PhD research in political science uses clear questions, theory and careful quantitative or qualitative methods.","n":["Start with a puzzle: an outcome that existing theories do not fully explain.","Define concepts clearly and turn them into measurable indicators (operationalisation).","Quantitative methods include regression and survey analysis; qualitative methods include interviews, process tracing and ethnography.","Case selection must be justified; avoid picking only cases that support your argument.","Follow research ethics, especially when studying vulnerable groups or sensitive issues."],"ex":"Puzzle: why do some states with similar incomes have very different school attendance? A researcher compares two states using data and interviews to trace which policies made the difference.","q":"research methods in political science phd qualitative quantitative","kw":["research methods","operationalisation","case selection","process tracing"]},{"id":"survey-election-studies","t":"Survey Research and Election Studies","s":"Election studies use surveys and electoral data to understand how and why people vote.","n":["Good surveys need random sampling, neutral questions and enough sample size.","Pre-election, exit and post-poll surveys answer different questions.","Official results data from the Election Commission is a key public source.","Researchers must avoid leading questions and respect respondents' privacy.","Results show patterns, not certainty; always report margins of error."],"ex":"With a random sample of about 1,000 people, the margin of error is roughly plus or minus 3 percentage points at 95 percent confidence. So 45 percent support could truly be between 42 and 48.","q":"survey research methods election studies political science","kw":["survey research","sampling","election studies","margin of error"]},{"id":"constitutional-legal-research","t":"Constitutional and Archival Research","s":"Researchers study constitutional debates, court judgments and archives to understand how institutions developed.","n":["The Constituent Assembly Debates are a primary source for the Constitution's meaning.","Court judgments, parliamentary debates and committee reports are key public records.","Read judgments fully: facts, issues, reasoning and final order.","Archival research needs careful citation of every file and document.","Compare legal text with how institutions actually work in practice."],"ex":"To study why Article 32 was included, a researcher reads the Constituent Assembly Debates, where Ambedkar described it as the 'heart and soul' of the Constitution.","q":"constituent assembly debates research constitutional law research methods","kw":["constituent assembly debates","case law","archives","legal research"]},{"id":"frontier-areas-polsci","t":"Frontier Areas in Political Science","s":"New research studies digital politics, welfare delivery, climate politics and global power shifts.","n":["Digital politics: social media, misinformation and data governance.","Political economy of welfare: how schemes are designed and delivered.","Climate politics: negotiations, justice between countries and energy transitions.","Experimental and computational methods (like text analysis) are growing.","Research should be balanced, evidence-based and open to criticism."],"ex":"A researcher uses text analysis on thousands of parliamentary questions to see which topics MPs raise most, and whether this changes before elections.","q":"frontier research political science digital politics computational methods","kw":["digital politics","climate politics","text analysis","political economy"]}]},"order":10},{"id":"economics","name":"Economics","nameHi":"अर्थशास्त्र","group":"social","blurb":"Economics studies how people, businesses and governments use limited resources to produce, share and use goods and services.","levels":{"6-8":[{"id":"economic-activities-work","t":"Economic Activities and the Value of Work","s":"Work done for money or to produce goods and services is economic activity; some valuable work is unpaid.","n":["Economic activities (आर्थिक गतिविधियाँ) earn income or produce goods and services, like farming, teaching or running a shop.","Non-economic activities are done out of love, duty or service, like a mother cooking for her family or helping neighbours.","Unpaid work at home, mostly done by women, is very valuable even though it is not counted as income.","Activities are grouped into primary (farming, fishing), secondary (making things) and tertiary (services) sectors.","All three sectors depend on each other."],"ex":"A farmer grows wheat (primary). A flour mill grinds it into atta (secondary). A truck carries the atta to a shop, and the shopkeeper sells it (tertiary).","q":"class 6 social science value of work economic activities around us ncert hindi","kw":["economic activity","unpaid work","sectors","work"]},{"id":"rural-urban-livelihoods","t":"Rural and Urban Livelihoods","s":"People in villages and cities earn their living in many ways, from farming to factory jobs and street vending.","n":["A livelihood (आजीविका) is the way a person earns money to meet daily needs.","In villages, many people farm their own land, work as farm labourers, fish or keep animals.","Many small farmers borrow money and can fall into debt if crops fail.","In cities, people work as vendors, factory workers, shopkeepers, office staff and in many other jobs.","Some jobs are regular with fixed pay and benefits; many are casual with no job security."],"ex":"A street vendor in Mumbai buys vegetables early morning from a wholesale market and sells them all day. He has no fixed salary, paid leave or pension, so his income is uncertain.","q":"class 6 civics rural livelihoods urban livelihoods ncert hindi","kw":["livelihood","rural","urban","farm labourer"]},{"id":"barter-to-money","t":"From Barter to Money","s":"Before money, people exchanged goods directly; money made buying and selling much easier.","n":["Barter (वस्तु विनिमय) means exchanging one good for another, like rice for cloth.","Barter needs a 'double coincidence of wants': each person must want what the other has.","Money solves this problem. It is a medium of exchange, a measure of value and a store of value.","Money has changed form over time: grain and shells, metal coins, paper notes, and now digital payments like UPI.","In India, the Reserve Bank of India issues currency notes, while one-rupee notes and coins are issued by the Government of India."],"ex":"A potter wants rice, but the rice farmer does not need pots. With barter, no trade happens. With money, the potter sells pots to someone else and uses the money to buy rice.","q":"class 7 social science from barter to money ncert hindi","kw":["barter","money","double coincidence of wants","upi"]},{"id":"markets-around-us","t":"Markets Around Us","s":"Markets are places, physical or online, where buyers and sellers meet to exchange goods and services.","n":["Markets include weekly haats, neighbourhood shops, shopping complexes, malls and online markets.","Goods pass through a chain of markets: producer, wholesaler, retailer and finally the consumer.","Each trader in the chain adds a margin, so prices rise along the chain.","Price depends on demand and supply: if many want a good but supply is low, price rises.","Big traders often earn more than small producers, which raises questions of fairness."],"ex":"A farmer sells tomatoes at Rs 10 per kg to a wholesaler. The wholesaler sells at Rs 15 to a retailer, who sells to you at Rs 25. The farmer gets only 10 out of 25 rupees.","q":"class 7 civics markets around us a shirt in the market ncert hindi","kw":["market","wholesaler","retailer","demand and supply"]},{"id":"public-facilities-government","t":"Public Facilities and the Role of Government","s":"The government provides water, health, schools and roads so that every citizen can access basic needs.","n":["Public facilities are services meant for everyone, like water supply, sanitation, public hospitals, schools and transport.","Article 21 (Right to Life) has been interpreted by courts to include the right to clean water and health.","The government pays for public facilities using taxes collected from people and businesses.","Private facilities may be good but are often costly, so the poor depend on public ones.","Unequal access to facilities between rich and poor areas is a major challenge."],"ex":"A government hospital treats a poor patient for little or no fee. A private hospital may charge thousands of rupees for the same treatment. This shows why public health facilities matter.","q":"class 8 civics public facilities role of government in health ncert hindi","kw":["public facilities","government","taxes","health"]},{"id":"budget-taxes-saving","t":"Budget, Taxes and Saving","s":"A budget plans income and spending; families and governments both need budgets, savings and wise choices.","n":["A family budget lists expected income and expenses for a month.","Needs (food, shelter) should come before wants (luxury items).","Saving money in a bank or post office keeps it safe and can earn interest.","Governments collect direct taxes (like income tax) and indirect taxes (like GST on goods).","The Union Government presents its annual budget in Parliament, usually on 1 February."],"ex":"A family earns Rs 15,000 a month. Food costs Rs 6,000, rent Rs 4,000, school Rs 1,500 and other costs Rs 2,000. Total spending is Rs 13,500, so they can save Rs 1,500.","q":"family budget saving taxes for kids class 7 8 hindi","kw":["budget","saving","tax","gst"]},{"id":"law-social-justice-economy","t":"Law and Social Justice","s":"Laws protect workers, consumers and the environment from unfair treatment by powerful businesses.","n":["The government sets minimum wages so that workers are not paid too little.","Laws require safety measures in factories to protect workers.","Child labour in hazardous work is banned by the Constitution and by law.","Laws also protect consumers and the environment from harm.","Weak enforcement of laws can cause disasters."],"ex":"In 1984 a gas leak from the Union Carbide factory in Bhopal killed thousands of people. Poor safety systems were a major cause, showing why safety laws must be strictly enforced.","q":"class 8 civics law and social justice bhopal gas tragedy ncert hindi","kw":["minimum wage","worker safety","bhopal","social justice"]}],"9-10":[{"id":"village-palampur","t":"The Story of Village Palampur: Factors of Production","s":"Through an imaginary village, we learn how land, labour, capital and enterprise combine to produce goods.","n":["Four factors of production: land, labour, physical capital and human capital (knowledge and enterprise).","Fixed capital (tools, machines, buildings) is used for many years. Working capital (seeds, raw material, cash) is used up in production.","Multiple cropping means growing more than one crop on the same land in a year.","Modern farming (high-yield seeds, fertilisers, irrigation) raised output but can harm soil and groundwater.","Non-farm activities include dairy, small manufacturing, shops and transport."],"ex":"A farmer's tractor is fixed capital because it is used for many seasons. The seeds and fertiliser he buys this season are working capital, because they get used up.","q":"class 9 economics story of village palampur ncert hindi","kw":["factors of production","fixed capital","working capital","multiple cropping"]},{"id":"people-poverty-food-security","t":"People as Resource, Poverty and Food Security","s":"Healthy, educated people drive growth; poverty and hunger remain challenges that public policy tries to solve.","n":["Investment in education and health turns people into human capital.","Unemployment can be seasonal (no work in some months) or disguised (more people work than needed).","The poverty line is the minimum income needed for basic needs. For 2011-12, it was about Rs 816 per person per month in rural areas and Rs 1,000 in urban areas.","Food security means food is available, accessible and affordable for all at all times.","The Public Distribution System (PDS) and National Food Security Act (2013) give subsidised grain."],"ex":"Five family members work on a small farm that needs only three. If two leave for other work, output does not fall. Those two were disguisedly unemployed.","q":"class 9 economics poverty as a challenge food security in india ncert hindi","kw":["human capital","poverty line","food security","pds"]},{"id":"development","t":"Development","s":"Development means better income and also better health, education, safety and freedom for people.","n":["Different people have different development goals, and these can conflict.","Per capita income = total income of a country / total population.","The World Bank uses per capita income to group countries.","The Human Development Index (HDI) by UNDP uses health, education and income.","Sustainable development means growth without destroying resources for the future."],"ex":"Country A has total income Rs 1,000 crore and 10 lakh people. Per capita income = 1,000 crore / 10 lakh = Rs 10,000. Average income alone hides how unequally money is shared.","q":"class 10 economics development ncert hindi","kw":["development","per capita income","hdi","sustainable development"]},{"id":"sectors-of-economy","t":"Sectors of the Indian Economy","s":"The economy is divided into primary, secondary and tertiary sectors, and into organised and unorganised sectors.","n":["GDP (Gross Domestic Product) is the value of all final goods and services produced in a country in a year.","Only final goods are counted in GDP, to avoid double counting.","Over time, the tertiary sector has become the largest part of India's GDP, but many workers are still in agriculture.","The organised sector has registered jobs with regular pay and benefits; the unorganised sector does not.","MGNREGA (2005) guarantees 100 days of wage work a year to rural households who want it."],"ex":"A farmer sells wheat for Rs 100. A baker turns it into bread sold for Rs 300. Only the bread (Rs 300) counts in GDP, because the wheat value is already inside the bread price.","q":"class 10 economics sectors of the indian economy ncert hindi","kw":["gdp","sectors","organised sector","mgnrega"]},{"id":"money-and-credit","t":"Money and Credit","s":"Money makes exchange easy, and credit (loans) helps people invest, but bad credit terms can trap the poor.","n":["Banks accept deposits and use most of them to give loans. They keep a part as cash reserves.","Credit terms include interest rate, collateral (security), documents and repayment method.","Formal sources: banks and cooperatives. Informal sources: moneylenders, traders, relatives.","Informal loans often have very high interest and no regulation.","Self-Help Groups (SHGs) of 15-20 members, often women, help members save and borrow."],"ex":"A farmer borrows Rs 10,000 from a moneylender at 5 percent per month. In one year, interest = 10,000 x 5 x 12 / 100 = Rs 6,000. From a bank at 9 percent a year, interest would be only Rs 900.","q":"class 10 economics money and credit ncert hindi","kw":["money","credit","collateral","self help group"]},{"id":"globalisation-consumer-rights","t":"Globalisation and Consumer Rights","s":"Globalisation links economies through trade and investment; consumer rights protect buyers from unfair practices.","n":["Globalisation means more trade, foreign investment and movement of technology and people across countries.","Multinational corporations (MNCs) produce in many countries. India reduced trade barriers after 1991.","The World Trade Organization (WTO) was set up in 1995 to set rules for international trade.","Consumer rights include the right to safety, information, choice, to be heard and to seek redressal.","The Consumer Protection Act 2019 replaced the 1986 Act. National Consumer Day is 24 December."],"ex":"If you buy a pressure cooker without the ISI mark and it bursts, you can complain to a Consumer Commission. Standard marks like ISI and AGMARK help consumers choose safe products.","q":"class 10 economics globalisation consumer rights ncert hindi","kw":["globalisation","wto","mnc","consumer rights"]}],"11-12":[{"id":"statistics-for-economics","t":"Statistics for Economics","s":"Statistics helps collect, organise and summarise economic data using tables, graphs and averages.","n":["Data can be primary (collected by you) or secondary (collected by others, like the Census).","Measures of central tendency: mean (average), median (middle value) and mode (most common value).","Measures of dispersion, like range and standard deviation, show how spread out data is.","Correlation shows whether two variables move together.","Index numbers, like the Consumer Price Index (CPI), measure changes in prices over time."],"ex":"Daily wages of 5 workers: 200, 300, 300, 400, 800. Mean = 2000 / 5 = 400. Median (middle) = 300. Mode = 300. The mean is pulled up by one high wage, so the median shows the typical worker better.","q":"class 11 statistics for economics mean median mode ncert hindi","kw":["statistics","mean","median","index number"]},{"id":"indian-economic-development","t":"Indian Economic Development","s":"India moved from a colonial economy to planned development and then to market-based reforms after 1991.","n":["At independence, India's economy was mostly agricultural with low incomes and weak industry.","The Planning Commission was set up in 1950. The First Five Year Plan ran from 1951 to 1956.","Planning aimed at growth, modernisation, self-reliance and equity.","In 1991, after a foreign exchange crisis, India began reforms: Liberalisation, Privatisation and Globalisation (LPG).","The NITI Aayog replaced the Planning Commission on 1 January 2015."],"ex":"In 1991 India's foreign exchange reserves were very low, enough for only a few weeks of imports. This crisis pushed the government to reduce controls and open the economy.","q":"class 11 indian economic development planning 1991 reforms ncert hindi","kw":["planning","five year plan","1991 reforms","niti aayog"]},{"id":"rural-development-employment","t":"Human Capital, Rural Development and Employment","s":"Education, health, rural credit and jobs are key to improving lives in India.","n":["Human capital formation means investment in education, health and skills.","Rural development needs credit, marketing, irrigation, diversification and organic farming.","NABARD was set up in 1982 to coordinate rural financing.","Workers can be self-employed, regular salaried or casual wage labourers.","Informalisation means more workers in jobs without social security."],"ex":"A dairy cooperative like Amul buys milk from village members at fair prices and sells it across India. This diversification gives farmers income beyond crops.","q":"class 11 indian economic development rural development employment ncert hindi","kw":["human capital","rural development","nabard","employment"]},{"id":"consumer-demand-elasticity","t":"Microeconomics: Consumer Behaviour and Demand","s":"Microeconomics studies individual buyers and sellers; demand shows how much people buy at different prices.","n":["Every economy faces the central problems: what, how and for whom to produce, because resources are scarce.","Law of demand: other things same, when price falls, quantity demanded rises.","Demand also depends on income, prices of related goods (substitutes and complements) and tastes.","Price elasticity of demand = percentage change in quantity demanded / percentage change in price.","Necessities usually have inelastic demand; luxuries have more elastic demand."],"ex":"Price of tea falls from Rs 10 to Rs 8 (20 percent fall). Demand rises from 100 to 130 cups (30 percent rise). Elasticity = 30 / 20 = 1.5 (in absolute value). Demand is elastic.","q":"class 12 microeconomics consumer equilibrium demand elasticity ncert hindi","kw":["demand","elasticity","law of demand","microeconomics"]},{"id":"production-cost-markets","t":"Producer Behaviour, Costs and Market Forms","s":"Firms decide how much to produce by comparing costs and revenue; market type affects prices.","n":["Total cost = fixed cost + variable cost. Fixed costs stay the same; variable costs change with output.","Marginal cost is the extra cost of producing one more unit.","A firm maximises profit where marginal revenue equals marginal cost (MR = MC), with MC rising.","In perfect competition, many firms sell the same product and are price takers.","Monopoly has one seller; monopolistic competition and oligopoly lie in between."],"ex":"A bakery's rent is Rs 5,000 (fixed). Each loaf costs Rs 20 to make (variable). For 500 loaves, total cost = 5,000 + (500 x 20) = Rs 15,000. Average cost = 15,000 / 500 = Rs 30 per loaf.","q":"class 12 microeconomics production cost perfect competition ncert hindi","kw":["cost","marginal cost","perfect competition","monopoly"]},{"id":"national-income-macro","t":"Macroeconomics: National Income and Income Determination","s":"Macroeconomics studies the whole economy: total output, income, employment, saving and investment.","n":["In the circular flow, households supply factors to firms and firms pay them income.","National income can be measured by the product (value added), income and expenditure methods.","GDP at market price = C + I + G + (X - M): consumption, investment, government spending, net exports.","Real GDP removes the effect of price changes; nominal GDP does not.","Keynesian multiplier = 1 / (1 - MPC), where MPC is the marginal propensity to consume."],"ex":"If MPC = 0.8, multiplier = 1 / (1 - 0.8) = 1 / 0.2 = 5. So an extra investment of Rs 100 crore can raise national income by up to Rs 500 crore.","q":"class 12 macroeconomics national income multiplier ncert hindi","kw":["national income","gdp","multiplier","macroeconomics"]},{"id":"money-banking-budget-bop","t":"Money, Banking, Government Budget and Balance of Payments","s":"The central bank manages money supply, the government budget manages public finances, and BoP records foreign transactions.","n":["The Reserve Bank of India was set up in 1935 and nationalised in 1949.","RBI tools include the repo rate, cash reserve ratio (CRR) and open market operations.","Fiscal deficit = total expenditure - (revenue receipts + non-debt capital receipts).","The Balance of Payments has a current account (trade in goods and services) and a capital account (investment and loans).","Exchange rates can be fixed, flexible or managed floating."],"ex":"If the government spends Rs 50 lakh crore, earns Rs 32 lakh crore in revenue and Rs 1 lakh crore in non-debt capital receipts, fiscal deficit = 50 - 33 = Rs 17 lakh crore, which must be borrowed.","q":"class 12 macroeconomics money banking government budget balance of payments ncert hindi","kw":["rbi","repo rate","fiscal deficit","balance of payments"]}],"ug":[{"id":"micro-theory-ug","t":"Microeconomic Theory","s":"UG microeconomics uses graphs and simple maths to study consumer choice, production and markets.","n":["Indifference curves show combinations of two goods giving equal satisfaction; the budget line shows what is affordable.","Consumer equilibrium is where the indifference curve touches the budget line (MRS = price ratio).","Income and substitution effects explain why demand changes when price changes.","Returns to scale and cost curves explain firm behaviour in the long run.","Market failure arises from externalities, public goods and information problems."],"ex":"A factory dumps waste into a river, harming fishermen downstream. The factory does not pay this cost, so it overproduces. This is a negative externality, a type of market failure.","q":"microeconomics ba economics indifference curve consumer equilibrium hindi","kw":["indifference curve","consumer equilibrium","externality","market failure"]},{"id":"macro-theory-ug","t":"Macroeconomic Theory","s":"UG macroeconomics explains output, inflation, unemployment and policy using models like IS-LM.","n":["Keynes's General Theory (1936) argued that demand can be too low, causing unemployment.","The IS-LM model shows equilibrium in goods (IS) and money (LM) markets together.","The Phillips curve showed a short-run trade-off between inflation and unemployment.","Fiscal policy uses taxes and spending; monetary policy uses interest rates and money supply.","Since 2016, RBI follows flexible inflation targeting: CPI inflation of 4 percent with a band of plus or minus 2 percent."],"ex":"In a slowdown, the government may increase spending on roads (fiscal policy), and RBI may cut the repo rate (monetary policy). Both aim to raise demand and jobs.","q":"macroeconomics ba economics is lm model keynes hindi","kw":["is-lm","keynes","inflation targeting","monetary policy"]},{"id":"intro-econometrics-ug","t":"Statistics and Introductory Econometrics","s":"Econometrics uses statistics to measure economic relationships from real data.","n":["Probability distributions like the normal distribution are basic tools.","Hypothesis testing checks if a result could be due to chance (using p-values and confidence intervals).","Simple linear regression: Y = a + bX + error. Ordinary Least Squares (OLS) estimates a and b.","Correlation does not prove causation.","Free tools like R, Python and Gretl can be used for practice."],"ex":"A regression of wage (Rs per day) on years of schooling gives Wage = 150 + 20 x Schooling. Each extra year of schooling is associated with Rs 20 more daily wage, on average.","q":"introductory econometrics regression ols ba economics lecture hindi","kw":["econometrics","regression","ols","hypothesis testing"]},{"id":"indian-economy-ug","t":"Indian Economy: Policies and Issues","s":"This course studies India's growth, sectors, poverty, inequality, employment and major policies.","n":["Agriculture employs a large share of workers but contributes a smaller share of GDP.","The services sector, including IT, has grown fast since the 1990s.","The Goods and Services Tax (GST) was introduced on 1 July 2017.","Banking issues include non-performing assets (NPAs) and financial inclusion schemes like Jan Dhan (2014).","Key data sources include the National Statistics Office (NSO) and the Periodic Labour Force Survey (PLFS)."],"ex":"Before GST, goods crossing state borders faced several different taxes and check-post delays. GST replaced many indirect taxes with one system, though it has several tax rates.","q":"indian economy ba economics lecture gst agriculture services hindi","kw":["indian economy","gst","npa","plfs"]},{"id":"development-economics-ug","t":"Development Economics","s":"Development economics asks why some countries are rich and others poor, and how to reduce poverty.","n":["Arthur Lewis's dual-sector model (1954) explained moving surplus labour from farms to industry.","Amartya Sen defined development as expanding people's freedoms and capabilities.","Poverty can be measured by headcount ratio and poverty gap; inequality by the Gini coefficient.","Institutions, education, health and infrastructure all affect growth.","Abhijit Banerjee, Esther Duflo and Michael Kremer won the 2019 Nobel for experimental approaches to fighting poverty."],"ex":"If 30 out of 100 people in a village earn below the poverty line, the headcount ratio is 30 percent. It does not show how far below the line they are; the poverty gap measures that.","q":"development economics ba lecture lewis model amartya sen poverty measurement","kw":["development economics","lewis model","gini coefficient","capability"]},{"id":"public-finance-trade-ug","t":"Public Finance and International Trade","s":"Public finance studies government taxes and spending; trade theory explains why countries trade.","n":["Musgrave gave three government functions: allocation, distribution and stabilisation.","Taxes can be progressive (rate rises with income), proportional or regressive.","David Ricardo's comparative advantage (1817): countries gain by specialising in what they produce at lower opportunity cost.","The Heckscher-Ohlin theory says countries export goods that use their abundant factors.","Tariffs, quotas and exchange rates affect trade flows."],"ex":"India has many workers, so labour-intensive goods like garments are relatively cheap to make here. Heckscher-Ohlin theory predicts India will export such goods, which matches real trade data.","q":"public finance international trade comparative advantage ba economics hindi","kw":["public finance","comparative advantage","progressive tax","heckscher-ohlin"]}],"pg":[{"id":"advanced-microeconomics","t":"Advanced Microeconomics","s":"PG microeconomics uses calculus and optimisation to study choice, general equilibrium, games and information.","n":["Consumer and producer problems are solved with constrained optimisation (Lagrange method).","General equilibrium (Arrow-Debreu) studies all markets clearing together.","The first welfare theorem: under certain conditions, competitive equilibrium is Pareto efficient.","Game theory: a Nash equilibrium is where no player gains by changing strategy alone.","Asymmetric information causes adverse selection and moral hazard (Akerlof's 'market for lemons')."],"ex":"In the prisoner's dilemma, both confess even though both staying silent is better for both. Confessing is each player's best response, so (confess, confess) is the Nash equilibrium.","q":"advanced microeconomics ma economics general equilibrium game theory lecture","kw":["general equilibrium","nash equilibrium","pareto efficiency","asymmetric information"]},{"id":"advanced-macroeconomics","t":"Advanced Macroeconomics","s":"PG macroeconomics studies long-run growth, business cycles, expectations and policy using dynamic models.","n":["The Solow growth model (1956) explains growth through capital, labour and technology.","Endogenous growth theory (e.g., Romer) explains how ideas and innovation drive growth.","Rational expectations (Lucas) changed how economists think about policy.","Real business cycle and New Keynesian models explain fluctuations; DSGE models combine them.","Open-economy models study exchange rates and capital flows."],"ex":"In the Solow model, if two countries have the same saving rate, population growth and technology, the poorer one should grow faster until both reach a similar steady state. This is conditional convergence.","q":"advanced macroeconomics ma solow growth model dsge lecture","kw":["solow model","endogenous growth","rational expectations","dsge"]},{"id":"econometrics-pg","t":"Econometrics","s":"PG econometrics teaches how to estimate economic relationships correctly and recognise when estimates are biased.","n":["Under the Gauss-Markov assumptions, OLS is BLUE: Best Linear Unbiased Estimator.","Problems include multicollinearity, heteroskedasticity, autocorrelation and omitted variable bias.","Instrumental variables (IV) help when an explanatory variable is correlated with the error term.","Panel data methods (fixed effects, random effects) use data on the same units over time.","Time series topics include stationarity, unit roots and cointegration."],"ex":"Studying the effect of schooling on wages, ability is unobserved and affects both. OLS then overstates schooling's effect. An instrument like distance to the nearest school may help correct this bias.","q":"econometrics ma economics ols iv panel data lecture","kw":["econometrics","instrumental variables","panel data","heteroskedasticity"]},{"id":"development-pg","t":"Development and Growth Economics","s":"PG development economics studies poverty, inequality, institutions, credit, health and human development in depth.","n":["Poverty measures include the Foster-Greer-Thorbecke (FGT) family and multidimensional poverty indices.","Credit and insurance markets often fail for the poor; microfinance tries to fill gaps.","Institutions (Acemoglu, Johnson, Robinson) are seen as key to long-run development.","Human development links health, education and nutrition to productivity.","Evidence from field experiments and natural experiments is widely used."],"ex":"The Multidimensional Poverty Index looks at deprivations in health, education and living standards (like cooking fuel, sanitation and housing), not just income. A household may have income but still lack basics.","q":"development economics ma lecture fgt poverty measure institutions","kw":["poverty measurement","institutions","microfinance","mpi"]},{"id":"international-economics-pg","t":"International Economics","s":"This topic studies trade theory, trade policy, exchange rates and international finance.","n":["New trade theory (Krugman) explains trade between similar countries through scale economies.","Trade policy instruments: tariffs, quotas, subsidies and trade agreements.","The Mundell-Fleming model studies policy in open economies.","The 'impossible trinity': a country cannot have a fixed exchange rate, free capital flows and independent monetary policy all at once.","Global value chains split production across many countries."],"ex":"A smartphone may be designed in one country, use chips from another and be assembled in India. This global value chain means 'Made in India' includes value added in many countries.","q":"international economics ma lecture impossible trinity mundell fleming","kw":["international economics","impossible trinity","trade policy","global value chains"]},{"id":"public-monetary-economics-pg","t":"Public and Monetary Economics","s":"This topic studies taxation, public goods, government debt, central banking and financial stability.","n":["Public goods are non-rival and non-excludable, so markets underprovide them.","A Pigouvian tax on pollution makes polluters pay the external cost.","Tax incidence asks who finally bears a tax: buyers or sellers.","RBI's Monetary Policy Committee (six members) has set the policy repo rate since 2016.","The FRBM Act (2003) set rules for India's fiscal discipline."],"ex":"Street lighting is a public good. One person's use does not reduce another's, and it is hard to stop non-payers from benefiting. So the government usually provides it through taxes.","q":"public economics monetary economics ma lecture public goods pigouvian tax","kw":["public goods","pigouvian tax","monetary policy committee","frbm"]}],"phd":[{"id":"causal-inference","t":"Research Design and Causal Inference","s":"Modern economics research tries to identify cause and effect using careful designs and data.","n":["Randomised controlled trials (RCTs) randomly assign a treatment to compare outcomes.","Difference-in-differences compares changes over time between treated and untreated groups.","Regression discontinuity uses a cutoff rule (like an age or score) to compare those just above and below it.","Instrumental variables use a factor that affects the treatment but not the outcome directly.","Always state your identification strategy and its assumptions clearly."],"ex":"A scheme starts in some districts in 2018 but not others. If outcomes rose by 10 points in scheme districts and 4 points in others, the difference-in-differences estimate is 10 - 4 = 6 points, assuming parallel trends.","q":"causal inference economics difference in differences regression discontinuity lecture","kw":["causal inference","rct","difference-in-differences","regression discontinuity"]},{"id":"indian-data-sources","t":"Indian Economic Data Sources","s":"PhD researchers in India use large official surveys and administrative data, many of which are free.","n":["National Sample Survey (NSS) rounds cover consumption, employment and enterprises.","The Periodic Labour Force Survey (PLFS), started in 2017-18, measures employment.","The Annual Survey of Industries (ASI) covers registered factories.","National Family Health Survey (NFHS) gives health and nutrition data; the Census gives population data.","Read survey documentation carefully: sampling design, weights and definitions."],"ex":"To estimate average monthly spending per person from NSS household data, a researcher must apply the survey multipliers (weights). Without them, results will not represent the whole population.","q":"indian economic data sources nss plfs asi nfhs for research","kw":["nss","plfs","nfhs","survey weights"]},{"id":"writing-economics-papers","t":"Writing Papers and Reproducible Research","s":"Economics PhDs are judged by research papers that ask clear questions and use transparent, reproducible methods.","n":["A good paper states its question, contribution, data, method and results early.","A literature review shows how your work adds to existing research.","Keep code and data organised so others can reproduce your results.","Robustness checks test whether results hold under different assumptions.","Present at seminars and conferences to get feedback before journal submission."],"ex":"A student finds that a road scheme raised village incomes. She tests whether the result still holds when dropping one state at a time and using a different income measure. The result stays, making it more credible.","q":"how to write an economics research paper phd reproducible research","kw":["research paper","reproducibility","robustness","literature review"]},{"id":"frontier-economics","t":"Frontier Areas in Economics","s":"New research areas include behavioural, climate, digital and computational economics.","n":["Behavioural economics studies how real people deviate from purely rational choices (e.g., Kahneman, Thaler).","Climate economics studies costs of climate change, carbon pricing and energy transition.","Digital economics studies platforms, digital payments and data.","Machine learning and big data are used for prediction and measurement, like using satellite night lights to estimate income.","Structural models combine theory with data to study policy counterfactuals."],"ex":"Researchers have used satellite images of night-time lights to estimate economic activity in places with poor data. Brighter areas generally have higher income, helping fill data gaps.","q":"frontier research economics behavioural climate machine learning lecture","kw":["behavioural economics","climate economics","machine learning","night lights"]}]},"order":11},{"id":"hindi","name":"Hindi","nameHi":"हिंदी","group":"languages","blurb":"हिंदी भाषा का व्याकरण, लेखन और साहित्य, सरल शब्दों में, कक्षा 6 से पीएचडी तक।","levels":{"6-8":[{"id":"varn-vichar","t":"वर्ण विचार","s":"वर्ण भाषा की सबसे छोटी ध्वनि है, जिसके और टुकड़े नहीं हो सकते।","n":["वर्ण वह सबसे छोटी ध्वनि है जिसे तोड़ा नहीं जा सकता, जैसे अ, क, म।","वर्णों के क्रमबद्ध समूह को वर्णमाला कहते हैं। हिंदी देवनागरी लिपि में लिखी जाती है।","स्वर अपने आप बोले जाते हैं: अ आ इ ई उ ऊ ऋ ए ऐ ओ औ (कुल 11)।","व्यंजन स्वर की मदद से बोले जाते हैं। मूल व्यंजन 33 हैं: क से म तक 25, य र ल व (अंतस्थ), श ष स ह (ऊष्म)।","क्ष, त्र, ज्ञ, श्र संयुक्त व्यंजन हैं। जैसे क् + ष = क्ष।","मात्रा स्वर का छोटा रूप है जो व्यंजन के साथ लगती है, जैसे क + ा = का।"],"ex":"शब्द 'कमल' को तोड़ें: क् + अ + म् + अ + ल् + अ। इसमें 3 व्यंजन (क, म, ल) और 3 बार स्वर 'अ' है। शब्द 'ज्ञान' में संयुक्त व्यंजन 'ज्ञ' (ज् + ञ) है।","q":"हिंदी वर्ण विचार स्वर व्यंजन class 6","kw":["वर्ण","स्वर","व्यंजन","वर्णमाला"]},{"id":"sangya","t":"संज्ञा","s":"किसी व्यक्ति, वस्तु, जगह या भाव के नाम को संज्ञा कहते हैं।","n":["संज्ञा का अर्थ है 'नाम'। राम, गंगा, किताब, खुशी, सब संज्ञा हैं।","व्यक्तिवाचक संज्ञा किसी एक खास व्यक्ति, जगह या चीज़ का नाम है, जैसे दिल्ली, गंगा, महात्मा गांधी।","जातिवाचक संज्ञा पूरी जाति या वर्ग का नाम है, जैसे लड़का, नदी, शहर, गाय।","भाववाचक संज्ञा किसी भाव या गुण का नाम है जिसे छू नहीं सकते, जैसे प्रेम, बचपन, मिठास।","द्रव्यवाचक (दूध, सोना) और समूहवाचक (सेना, कक्षा, भीड़) भी संज्ञा के भेद माने जाते हैं।"],"ex":"वाक्य: 'सीता गंगा किनारे बैठकर बचपन की बातें याद कर रही थी।' यहाँ सीता और गंगा व्यक्तिवाचक संज्ञा हैं, किनारे जातिवाचक है, बचपन भाववाचक संज्ञा है।","q":"संज्ञा और उसके भेद हिंदी व्याकरण class 6","kw":["संज्ञा","व्यक्तिवाचक","जातिवाचक","भाववाचक"]},{"id":"sarvanam","t":"सर्वनाम","s":"संज्ञा की जगह आने वाले शब्द सर्वनाम हैं, जैसे मैं, तुम, वह।","n":["बार-बार नाम दोहराना अच्छा नहीं लगता, इसलिए हम नाम की जगह सर्वनाम बोलते हैं।","पुरुषवाचक: मैं, हम (उत्तम पुरुष); तुम, आप (मध्यम पुरुष); वह, वे (अन्य पुरुष)।","निश्चयवाचक (यह, वह) पास या दूर की निश्चित चीज़ बताता है। अनिश्चयवाचक (कोई, कुछ) निश्चित नहीं बताता।","प्रश्नवाचक सर्वनाम प्रश्न पूछते हैं: कौन, क्या।","संबंधवाचक (जो-सो) दो बातों को जोड़ता है। निजवाचक (स्वयं, खुद, अपने आप) अपने लिए आता है।"],"ex":"'रवि स्कूल गया। रवि ने रवि की किताब पढ़ी।' यह अटपटा है। सर्वनाम से: 'रवि स्कूल गया। उसने अपनी किताब पढ़ी।' यहाँ 'उसने' पुरुषवाचक और 'अपनी' निजवाचक सर्वनाम है।","q":"सर्वनाम के भेद हिंदी व्याकरण","kw":["सर्वनाम","पुरुषवाचक","निजवाचक","प्रश्नवाचक"]},{"id":"visheshan","t":"विशेषण","s":"जो शब्द संज्ञा या सर्वनाम की विशेषता बताए, वह विशेषण है।","n":["विशेषण बताता है कि चीज़ कैसी है, कितनी है या कौन-सी है। जिसकी विशेषता बताई जाए उसे विशेष्य कहते हैं।","गुणवाचक विशेषण रंग, रूप, स्वाद, गुण बताता है: लाल, मीठा, ईमानदार।","संख्यावाचक विशेषण गिनती बताता है: दो केले, पहला लड़का, कुछ बच्चे।","परिमाणवाचक विशेषण नाप-तौल बताता है: दो किलो चावल, थोड़ा दूध।","सार्वनामिक विशेषण में सर्वनाम संज्ञा से पहले आता है: वह लड़का, यह किताब।"],"ex":"'माँ ने बाज़ार से दो किलो ताज़ी सब्ज़ी और चार मीठे आम खरीदे।' दो किलो = परिमाणवाचक, ताज़ी = गुणवाचक, चार = संख्यावाचक, मीठे = गुणवाचक विशेषण।","q":"विशेषण के भेद हिंदी व्याकरण class 7","kw":["विशेषण","विशेष्य","गुणवाचक","संख्यावाचक"]},{"id":"kriya-kaal","t":"क्रिया और काल","s":"काम करने या होने को बताने वाला शब्द क्रिया है; काम का समय काल है।","n":["क्रिया काम बताती है: खाना, पढ़ना, सोना। क्रिया का मूल रूप धातु कहलाता है, जैसे 'पढ़'।","सकर्मक क्रिया को कर्म चाहिए: 'मोहन आम खाता है' (क्या खाता है? आम)।","अकर्मक क्रिया को कर्म नहीं चाहिए: 'बच्चा सोता है', 'पत्ता गिरा'।","काल तीन हैं: भूतकाल (बीता समय), वर्तमान काल (अभी), भविष्यत् काल (आने वाला समय)।","उदाहरण: मैंने खाया (भूत), मैं खाता हूँ (वर्तमान), मैं खाऊँगा (भविष्य)।"],"ex":"पहचान का तरीका: क्रिया से 'क्या' या 'किसे' पूछें। 'सीता पत्र लिखती है' — क्या लिखती है? पत्र। उत्तर मिला, तो सकर्मक। 'सीता हँसती है' — क्या हँसती है? उत्तर नहीं, तो अकर्मक। दोनों वाक्य वर्तमान काल में हैं।","q":"क्रिया सकर्मक अकर्मक काल हिंदी व्याकरण","kw":["क्रिया","सकर्मक","अकर्मक","काल"]},{"id":"ling-vachan","t":"लिंग और वचन","s":"लिंग बताता है कि शब्द पुरुष जाति का है या स्त्री जाति का; वचन संख्या बताता है।","n":["हिंदी में दो लिंग हैं: पुल्लिंग (लड़का, घोड़ा, पेड़) और स्त्रीलिंग (लड़की, घोड़ी, नदी)।","निर्जीव चीज़ों का लिंग क्रिया से पहचानें: 'दही खट्टा है' (पुल्लिंग), 'चाय गरम है' (स्त्रीलिंग)।","वचन दो हैं: एकवचन (एक चीज़) और बहुवचन (एक से ज़्यादा)।","बदलाव के नियम: लड़का से लड़के, लड़की से लड़कियाँ, किताब से किताबें, माला से मालाएँ।","आदर देने के लिए एक व्यक्ति के लिए भी बहुवचन बोलते हैं: 'पिताजी आ रहे हैं।'"],"ex":"लिंग बदलें: शेर से शेरनी, नौकर से नौकरानी, देव से देवी, अध्यापक से अध्यापिका। वचन बदलें: कपड़ा से कपड़े, बहू से बहुएँ, रात से रातें, चिड़िया से चिड़ियाँ।","q":"लिंग वचन हिंदी व्याकरण class 6","kw":["लिंग","वचन","पुल्लिंग","स्त्रीलिंग"]},{"id":"karak","t":"कारक","s":"कारक बताता है कि संज्ञा या सर्वनाम का क्रिया से क्या संबंध है।","n":["कारक आठ हैं। उनके चिह्न (परसर्ग) याद रखें।","कर्ता (ने), कर्म (को), करण (से, के द्वारा), संप्रदान (को, के लिए)।","अपादान (से, अलग होने के अर्थ में), संबंध (का, के, की), अधिकरण (में, पर), संबोधन (हे, अरे)।","करण 'से' साधन बताता है (कलम से लिखा), अपादान 'से' अलगाव बताता है (पेड़ से पत्ता गिरा)।","कारक चिह्न सही न हों तो वाक्य का अर्थ बदल जाता है।"],"ex":"'हे राम! माँ ने रसोई में बच्चों के लिए चाकू से सब्ज़ी काटी।' हे = संबोधन, माँ ने = कर्ता, रसोई में = अधिकरण, बच्चों के लिए = संप्रदान, चाकू से = करण, सब्ज़ी = कर्म।","q":"कारक और उसके भेद हिंदी व्याकरण परसर्ग","kw":["कारक","परसर्ग","कर्ता","अपादान"]},{"id":"muhavare","t":"मुहावरे और लोकोक्तियाँ","s":"मुहावरे और लोकोक्तियाँ ऐसे वाक्यांश हैं जिनका अर्थ शब्दों से अलग, खास होता है।","n":["मुहावरा वाक्यांश होता है, पूरा वाक्य नहीं। इसका असली अर्थ अलग होता है: 'आँखों का तारा' मतलब बहुत प्यारा।","लोकोक्ति (कहावत) पूरा वाक्य होती है और जीवन का अनुभव बताती है: 'जैसी करनी वैसी भरनी'।","मुहावरे वाक्य में क्रिया के साथ बदलते हैं: 'नौ दो ग्यारह होना' से 'चोर नौ दो ग्यारह हो गया'।","कुछ मुहावरे: नाक में दम करना (बहुत परेशान करना), हाथ पीले करना (शादी करना), दाँत खट्टे करना (हराना)।","इनसे भाषा सुंदर और असरदार बनती है, पर ज़्यादा भरमार न करें।"],"ex":"वाक्य प्रयोग: 'परीक्षा पास आते ही रमेश के हाथ-पाँव फूल गए।' (बहुत घबरा जाना)। लोकोक्ति: 'अब पछताए होत क्या, जब चिड़िया चुग गई खेत' — समय निकलने पर पछताना बेकार है।","q":"मुहावरे और लोकोक्तियाँ अर्थ वाक्य प्रयोग हिंदी","kw":["मुहावरे","लोकोक्ति","कहावत","वाक्य प्रयोग"]}],"9-10":[{"id":"sandhi","t":"संधि","s":"दो वर्णों के पास आने से जो बदलाव होता है, उसे संधि कहते हैं।","n":["संधि का अर्थ है मेल। संधि वाले शब्द को अलग करना संधि-विच्छेद कहलाता है।","संधि तीन प्रकार की है: स्वर संधि, व्यंजन संधि और विसर्ग संधि।","स्वर संधि के भेद: दीर्घ (विद्या+आलय=विद्यालय), गुण (सूर्य+उदय=सूर्योदय), वृद्धि (सदा+एव=सदैव), यण (इति+आदि=इत्यादि), अयादि (ने+अन=नयन)।","व्यंजन संधि: जगत्+ईश=जगदीश, सत्+जन=सज्जन, उत्+लास=उल्लास।","विसर्ग संधि: निः+चल=निश्चल, मनः+योग=मनोयोग, निः+धन=निर्धन।"],"ex":"'हिमालय' का संधि-विच्छेद: हिम + आलय। यहाँ अ + आ = आ हुआ, यानी दो समान स्वर मिलकर दीर्घ बने। इसलिए यह दीर्घ स्वर संधि है। 'महेश' = महा + ईश (आ + ई = ए), यह गुण संधि है।","q":"संधि और उसके भेद class 10 हिंदी व्याकरण","kw":["संधि","संधि-विच्छेद","स्वर संधि","विसर्ग संधि"]},{"id":"samas","t":"समास","s":"दो या ज़्यादा शब्दों को जोड़कर छोटा नया शब्द बनाना समास है।","n":["समास से बना शब्द समस्त पद कहलाता है। उसे तोड़कर लिखना समास-विग्रह है।","अव्ययीभाव: पहला पद अव्यय, जैसे यथाशक्ति (शक्ति के अनुसार), प्रतिदिन। तत्पुरुष: बीच का कारक चिह्न हटता है, जैसे राजपुत्र (राजा का पुत्र)।","कर्मधारय: विशेषण-विशेष्य या उपमा, जैसे नीलकमल (नीला है जो कमल)। द्विगु: पहला पद संख्या, जैसे चौराहा, त्रिलोक।","द्वंद्व: दोनों पद प्रधान, बीच में 'और', जैसे माता-पिता, दाल-रोटी।","बहुव्रीहि: दोनों पद मिलकर किसी तीसरे की ओर इशारा करते हैं, जैसे दशानन (दस हैं मुख जिसके = रावण)।"],"ex":"'लंबोदर' का विग्रह: लंबा है उदर (पेट) जिसका, अर्थात् गणेश जी। दोनों पद मिलकर तीसरे (गणेश) की ओर संकेत करते हैं, इसलिए बहुव्रीहि समास। पर 'लंबा उदर' अर्थ हो तो कर्मधारय।","q":"समास के भेद class 10 हिंदी व्याकरण","kw":["समास","समास-विग्रह","तत्पुरुष","बहुव्रीहि"]},{"id":"alankar","t":"अलंकार","s":"अलंकार का अर्थ है गहना; ये कविता की भाषा को सुंदर बनाते हैं।","n":["शब्दालंकार शब्दों से सुंदरता लाते हैं; अर्थालंकार अर्थ से।","अनुप्रास: एक वर्ण बार-बार आए। यमक: एक शब्द बार-बार, हर बार अलग अर्थ। श्लेष: एक शब्द, एक बार, कई अर्थ।","उपमा: तुलना, 'सा, सी, सम, सरिस' शब्दों से। तुलसीदास: 'पीपर पात सरिस मन डोला'।","रूपक: उपमेय और उपमान को एक मान लेना, जैसे सूरदास का 'चरण कमल'।","उत्प्रेक्षा: संभावना, 'मनु, मानो, जनु' से। अतिशयोक्ति: बात को बहुत बढ़ाकर कहना।"],"ex":"बिहारी का दोहा: 'कनक कनक ते सौ गुनी मादकता अधिकाय।' यहाँ 'कनक' दो बार आया: पहला अर्थ धतूरा, दूसरा सोना। एक शब्द बार-बार, हर बार अलग अर्थ, इसलिए यमक अलंकार।","q":"अलंकार अनुप्रास यमक श्लेष उपमा रूपक class 10","kw":["अलंकार","अनुप्रास","यमक","उपमा","रूपक"]},{"id":"ras","t":"रस","s":"कविता पढ़ने या सुनने से मन में जो आनंद या भाव जागता है, उसे रस कहते हैं।","n":["भरतमुनि ने नाट्यशास्त्र में रस का सिद्धांत दिया। रस को काव्य की आत्मा माना गया।","रस के चार अंग: स्थायी भाव, विभाव (कारण), अनुभाव (शरीर की प्रतिक्रिया), संचारी भाव (थोड़ी देर के भाव)।","नौ रस: शृंगार, हास्य, करुण, रौद्र, वीर, भयानक, वीभत्स, अद्भुत, शांत। बाद में वात्सल्य और भक्ति रस भी जोड़े गए।","हर रस का एक स्थायी भाव है: शृंगार-रति, हास्य-हास, करुण-शोक, वीर-उत्साह, शांत-निर्वेद।","संचारी भाव 33 माने गए हैं, जैसे चिंता, हर्ष, लज्जा।"],"ex":"सूरदास के बालकृष्ण वर्णन में यशोदा का कृष्ण के प्रति प्रेम है। स्थायी भाव वत्सल (संतान-प्रेम) है, इसलिए वात्सल्य रस। किसी के मरने पर रोते परिवार का वर्णन करुण रस का उदाहरण है (स्थायी भाव शोक)।","q":"रस के भेद स्थायी भाव हिंदी व्याकरण class 10","kw":["रस","स्थायी भाव","संचारी भाव","भरतमुनि"]},{"id":"vakya-bhed","t":"वाक्य भेद (रचना के आधार पर)","s":"रचना के आधार पर वाक्य तीन तरह के होते हैं: सरल, संयुक्त और मिश्र।","n":["सरल वाक्य में एक ही मुख्य क्रिया होती है: 'राम पढ़ता है।'","संयुक्त वाक्य में दो स्वतंत्र वाक्य 'और, पर, लेकिन, या, इसलिए' से जुड़ते हैं।","मिश्र वाक्य में एक मुख्य वाक्य और उस पर टिका आश्रित उपवाक्य होता है। जोड़ने वाले शब्द: 'कि, जो-वह, जब-तब, क्योंकि'।","परीक्षा में अक्सर एक तरह के वाक्य को दूसरी तरह में बदलने को कहा जाता है।","बदलते समय अर्थ नहीं बदलना चाहिए।"],"ex":"सरल: 'मेहनत करके सोहन पास हुआ।' संयुक्त: 'सोहन ने मेहनत की और वह पास हो गया।' मिश्र: 'सोहन पास हुआ क्योंकि उसने मेहनत की थी।' तीनों का अर्थ एक है, बनावट अलग।","q":"रचना के आधार पर वाक्य भेद सरल संयुक्त मिश्र class 10","kw":["वाक्य भेद","सरल वाक्य","संयुक्त वाक्य","मिश्र वाक्य"]},{"id":"vachya","t":"वाच्य","s":"वाच्य बताता है कि वाक्य में मुख्य बात कर्ता की है, कर्म की है या भाव की।","n":["कर्तृवाच्य: कर्ता प्रधान। 'राम पुस्तक पढ़ता है।'","कर्मवाच्य: कर्म प्रधान, कर्ता के साथ 'से' या 'द्वारा'। 'राम द्वारा पुस्तक पढ़ी जाती है।'","भाववाच्य: भाव प्रधान, केवल अकर्मक क्रिया के साथ, अक्सर 'नहीं' के साथ। 'मुझसे चला नहीं जाता।'","भाववाच्य में क्रिया हमेशा पुल्लिंग, एकवचन, अन्य पुरुष में रहती है।","सरकारी सूचना में कर्मवाच्य बहुत आता है: 'आवेदन स्वीकार किए जाते हैं।'"],"ex":"कर्तृवाच्य: 'माली पौधों को पानी देता है।' कर्मवाच्य में बदलें: 'माली द्वारा पौधों को पानी दिया जाता है।' भाववाच्य: 'बूढ़ी दादी से अब दौड़ा नहीं जाता।'","q":"वाच्य कर्तृवाच्य कर्मवाच्य भाववाच्य class 10","kw":["वाच्य","कर्तृवाच्य","कर्मवाच्य","भाववाच्य"]},{"id":"patra-lekhan","t":"पत्र लेखन","s":"पत्र दो तरह के होते हैं: औपचारिक (दफ़्तर के) और अनौपचारिक (अपनों के)।","n":["अनौपचारिक पत्र मित्र या परिवार को। भाषा अपनापन वाली। संबोधन: प्रिय मित्र, आदरणीय पिताजी।","औपचारिक पत्र प्रधानाचार्य, अधिकारी, संपादक को। भाषा छोटी, साफ़ और विनम्र।","औपचारिक पत्र का क्रम: सेवा में, पता, दिनांक, विषय, संबोधन (महोदय), मुख्य भाग, धन्यवाद, भवदीय, नाम-पता।","विषय एक लाइन में लिखें ताकि पढ़ने वाला तुरंत समझ जाए।","एक पत्र में एक ही मुख्य बात रखें। बेकार की लंबाई न करें।"],"ex":"प्रधानाचार्य को अवकाश हेतु: सेवा में, प्रधानाचार्य जी, राजकीय विद्यालय, सीतापुर। विषय: दो दिन के अवकाश हेतु। महोदय, मुझे तेज़ बुखार है, अतः 12 और 13 तारीख का अवकाश देने की कृपा करें। धन्यवाद। आपका आज्ञाकारी शिष्य, रमेश, कक्षा 9।","q":"औपचारिक अनौपचारिक पत्र लेखन class 10 हिंदी","kw":["पत्र लेखन","औपचारिक पत्र","अनौपचारिक पत्र"]},{"id":"nibandh-lekhan","t":"निबंध लेखन","s":"निबंध किसी विषय पर अपने विचार क्रम से, साफ़ भाषा में लिखना है।","n":["निबंध के तीन भाग: भूमिका (शुरुआत), विस्तार (मुख्य बातें), उपसंहार (निष्कर्ष)।","लिखने से पहले 4-5 मुख्य बिंदु कागज़ पर लिख लें। इसे रूपरेखा कहते हैं।","हर अनुच्छेद में एक ही बात रखें। छोटे, साफ़ वाक्य लिखें।","जहाँ उचित हो, उदाहरण, आँकड़े या कोई प्रसिद्ध पंक्ति जोड़ें।","उपसंहार में समाधान या सुझाव दें, नई बात शुरू न करें।"],"ex":"विषय 'स्वच्छ भारत': भूमिका — गंदगी से बीमारियाँ फैलती हैं। विस्तार — 2014 में स्वच्छ भारत अभियान, शौचालय, कूड़ा अलग करना, नागरिक का कर्तव्य। उपसंहार — सफ़ाई केवल सरकार का नहीं, हम सबका काम है।","q":"निबंध लेखन कैसे करें class 10 हिंदी","kw":["निबंध","रूपरेखा","भूमिका","उपसंहार"]}],"11-12":[{"id":"chhand","t":"छंद","s":"मात्रा, वर्ण, यति और गति के नियम से बँधी कविता को छंद कहते हैं।","n":["मात्रा: लघु (ह्रस्व स्वर, 1 मात्रा, चिह्न ।) और गुरु (दीर्घ स्वर, 2 मात्रा, चिह्न ऽ)।","यति = रुकने की जगह, चरण = पंक्ति का भाग, तुक = अंत में समान ध्वनि।","दोहा: हर पंक्ति में 13 + 11 = 24 मात्राएँ। सोरठा इसका उल्टा: 11 + 13।","चौपाई: हर चरण में 16 मात्राएँ, चार चरण। रामचरितमानस मुख्य रूप से चौपाई में है।","रोला में 11 + 13 = 24 मात्राएँ। दोहा + रोला मिलकर कुंडलिया बनता है।"],"ex":"कबीर: 'बड़ा हुआ तो क्या हुआ, जैसे पेड़ खजूर।' गिनती: बड़ा (1+2=3) हुआ (1+2=3) तो (2) क्या (2) हुआ (3) = 13 मात्राएँ; जैसे (2+2=4) पेड़ (3) खजूर (1+2+1=4) = 11। कुल 24, यह दोहा है।","q":"छंद दोहा चौपाई सोरठा मात्रा गणना class 12","kw":["छंद","मात्रा","दोहा","चौपाई"]},{"id":"sahitya-itihas-kaal","t":"हिंदी साहित्य का काल विभाजन","s":"हिंदी साहित्य के इतिहास को चार कालों में बाँटा जाता है।","n":["आचार्य रामचंद्र शुक्ल का 'हिंदी साहित्य का इतिहास' (1929) सबसे प्रसिद्ध इतिहास ग्रंथ है।","शुक्ल जी का विभाजन (विक्रम संवत् में): आदिकाल/वीरगाथा काल (1050-1375), भक्तिकाल/पूर्व मध्यकाल (1375-1700)।","रीतिकाल/उत्तर मध्यकाल (1700-1900) और आधुनिक काल/गद्यकाल (1900 से आगे)।","संवत् को ईसवी में बदलने के लिए लगभग 57 घटाएँ।","जॉर्ज ग्रियर्सन और मिश्रबंधुओं ने भी इतिहास लिखे। हजारीप्रसाद द्विवेदी ने 'आदिकाल' नाम का समर्थन किया।"],"ex":"भक्तिकाल का आरंभ संवत् 1375 है। ईसवी में: 1375 - 57 = 1318 ई. (लगभग)। इसी तरह आधुनिक काल संवत् 1900 = लगभग 1843 ई. से शुरू माना जाता है।","q":"हिंदी साहित्य का इतिहास काल विभाजन रामचंद्र शुक्ल","kw":["काल विभाजन","रामचंद्र शुक्ल","साहित्य इतिहास"]},{"id":"aadikaal","t":"आदिकाल","s":"आदिकाल हिंदी साहित्य का शुरुआती दौर है, जिसमें वीर, धार्मिक और लौकिक रचनाएँ मिलती हैं।","n":["शुक्ल जी ने इसे 'वीरगाथा काल' कहा क्योंकि राजाओं की वीरता पर रासो काव्य लिखे गए।","चंदबरदाई का 'पृथ्वीराज रासो' सबसे प्रसिद्ध रासो ग्रंथ है।","सिद्ध और नाथ साहित्य (सरहपा, गोरखनाथ) तथा जैन साहित्य भी इसी काल का है।","विद्यापति ने मैथिली में प्रेम और भक्ति के मधुर पद लिखे; उन्हें 'मैथिल कोकिल' कहा जाता है।","अमीर खुसरो ने खड़ी बोली में पहेलियाँ और मुकरियाँ लिखीं।"],"ex":"परीक्षा प्रश्न: 'आदिकाल को वीरगाथा काल क्यों कहा गया?' उत्तर: इस काल में पृथ्वीराज रासो, परमाल रासो (आल्हखंड) जैसे वीर रस प्रधान काव्य अधिक मिले, जिनमें राजाओं के युद्ध का वर्णन है।","q":"आदिकाल हिंदी साहित्य वीरगाथा काल रासो","kw":["आदिकाल","वीरगाथा","रासो","विद्यापति"]},{"id":"bhaktikaal","t":"भक्तिकाल","s":"भक्तिकाल को हिंदी साहित्य का 'स्वर्ण युग' कहा जाता है।","n":["भक्ति की दो धाराएँ: निर्गुण (बिना रूप के ईश्वर) और सगुण (रूप वाले ईश्वर, जैसे राम, कृष्ण)।","निर्गुण ज्ञानाश्रयी शाखा: कबीर, रैदास। निर्गुण प्रेमाश्रयी (सूफ़ी) शाखा: मलिक मुहम्मद जायसी, 'पद्मावत'।","सगुण रामभक्ति शाखा: तुलसीदास, 'रामचरितमानस' (अवधी), 'विनय पत्रिका'।","सगुण कृष्णभक्ति शाखा: सूरदास, 'सूरसागर' (ब्रजभाषा), अष्टछाप कवि, मीराबाई।","इन कवियों ने जाति-भेद, आडंबर का विरोध किया और प्रेम, भक्ति का संदेश दिया।"],"ex":"कबीर का दोहा: 'पोथी पढ़ि पढ़ि जग मुआ, पंडित भया न कोय। ढाई आखर प्रेम का, पढ़ै सो पंडित होय॥' अर्थ: केवल किताबें पढ़ने से कोई ज्ञानी नहीं बनता, जो प्रेम को समझ ले वही सच्चा विद्वान है।","q":"भक्तिकाल निर्गुण सगुण भक्ति धारा हिंदी साहित्य","kw":["भक्तिकाल","कबीर","तुलसीदास","सूरदास"]},{"id":"ritikaal","t":"रीतिकाल","s":"रीतिकाल में कवियों ने काव्य के नियमों (रीति) और शृंगार पर अधिक लिखा।","n":["'रीति' का अर्थ है काव्य रचने के नियम, जैसे रस, अलंकार, नायिका भेद। अधिकतर कवि राज दरबारों से जुड़े थे।","रीतिबद्ध कवि: नियमों पर लक्षण ग्रंथ लिखे, जैसे केशवदास ('कविप्रिया', 'रसिकप्रिया'), चिंतामणि, देव।","रीतिसिद्ध कवि: नियम जानते थे पर ग्रंथ नहीं लिखे। बिहारी, 'बिहारी सतसई' (लगभग 700 दोहे)।","रीतिमुक्त कवि: नियमों से आज़ाद, दिल की बात, जैसे घनानंद, बोधा।","भूषण ने इसी काल में वीर रस में शिवाजी पर कविताएँ लिखीं।"],"ex":"बिहारी के दोहों के बारे में कहा जाता है 'देखन में छोटे लगैं, घाव करैं गंभीर।' यानी छोटे दोहे में भी बहुत गहरा अर्थ। यह 'गागर में सागर' भरने की कला है।","q":"रीतिकाल रीतिबद्ध रीतिसिद्ध रीतिमुक्त बिहारी घनानंद","kw":["रीतिकाल","बिहारी","घनानंद","केशवदास"]},{"id":"aadhunik-kaal","t":"आधुनिक काल","s":"आधुनिक काल में खड़ी बोली गद्य और कविता की मुख्य भाषा बनी।","n":["भारतेंदु युग: भारतेंदु हरिश्चंद्र को आधुनिक हिंदी का जनक माना जाता है; नाटक, पत्रकारिता, देशभक्ति।","द्विवेदी युग: महावीर प्रसाद द्विवेदी ने 'सरस्वती' पत्रिका से भाषा को शुद्ध किया। मैथिलीशरण गुप्त, 'भारत-भारती'।","छायावाद: जयशंकर प्रसाद ('कामायनी'), सुमित्रानंदन पंत, सूर्यकांत त्रिपाठी 'निराला', महादेवी वर्मा।","बाद में प्रगतिवाद, प्रयोगवाद (अज्ञेय, 'तार सप्तक' 1943) और नई कविता आए।","गद्य में प्रेमचंद ने उपन्यास ('गोदान', 'गबन') और कहानियों से गाँव के जीवन को दिखाया।"],"ex":"याद रखने का क्रम: भारतेंदु युग (लगभग 1850-1900) → द्विवेदी युग (1900-1920) → छायावाद (1918-1936) → प्रगतिवाद → प्रयोगवाद → नई कविता। छायावाद के चार स्तंभ: प्रसाद, पंत, निराला, महादेवी।","q":"आधुनिक काल हिंदी साहित्य भारतेंदु द्विवेदी छायावाद","kw":["आधुनिक काल","भारतेंदु","छायावाद","प्रेमचंद"]},{"id":"rachnatmak-lekhan","t":"रचनात्मक लेखन: फ़ीचर और रिपोर्ट","s":"जनसंचार माध्यमों के लिए फ़ीचर, रिपोर्ट और समाचार लिखना सीखें।","n":["समाचार छह सवालों (छह ककार) का जवाब देता है: क्या, कौन, कब, कहाँ, क्यों, कैसे।","समाचार 'उल्टा पिरामिड' शैली में लिखा जाता है: सबसे ज़रूरी बात सबसे पहले।","फ़ीचर किसी विषय पर रोचक, भावनात्मक और विस्तार वाला लेख है। इसमें कहानी जैसा स्वाद होता है।","रिपोर्ट (प्रतिवेदन) किसी घटना या कार्यक्रम का तथ्यों पर आधारित ब्योरा है।","शीर्षक छोटा और आकर्षक हो। तथ्य जाँचकर लिखें।"],"ex":"विद्यालय के वार्षिक उत्सव का प्रतिवेदन: 'दिनांक 15 जनवरी को विद्यालय में वार्षिक उत्सव मनाया गया। मुख्य अतिथि ज़िलाधिकारी थे। छात्रों ने नाटक और लोकनृत्य प्रस्तुत किए। मेधावी छात्रों को पुरस्कार दिए गए।'","q":"फ़ीचर लेखन रिपोर्ट लेखन class 12 हिंदी अभिव्यक्ति और माध्यम","kw":["फ़ीचर","रिपोर्ट","समाचार लेखन","उल्टा पिरामिड"]}],"ug":[{"id":"hindi-bhasha-vikas","t":"हिंदी भाषा का उद्भव और विकास","s":"हिंदी संस्कृत से पालि, प्राकृत और अपभ्रंश होते हुए विकसित हुई।","n":["विकास क्रम: वैदिक संस्कृत → लौकिक संस्कृत → पालि → प्राकृत → अपभ्रंश → आधुनिक भारतीय भाषाएँ (हिंदी आदि)।","हिंदी का विकास लगभग 1000 ईसवी के आसपास से माना जाता है।","हिंदी की उपभाषाएँ: पश्चिमी हिंदी, पूर्वी हिंदी, राजस्थानी, बिहारी, पहाड़ी।","पश्चिमी हिंदी की बोलियाँ: खड़ी बोली, ब्रजभाषा, हरियाणवी, बुंदेली, कन्नौजी। पूर्वी हिंदी: अवधी, बघेली, छत्तीसगढ़ी।","संविधान के अनुच्छेद 343 के अनुसार संघ की राजभाषा देवनागरी लिपि में हिंदी है।"],"ex":"एक शब्द की यात्रा: संस्कृत 'हस्त' → प्राकृत 'हत्थ' → हिंदी 'हाथ'। इसी तरह संस्कृत 'कर्म' → प्राकृत 'कम्म' → हिंदी 'काम'। ऐसे शब्दों को तद्भव कहते हैं।","q":"हिंदी भाषा का उद्भव और विकास BA hindi","kw":["हिंदी भाषा","अपभ्रंश","बोलियाँ","तद्भव"]},{"id":"devanagari","t":"देवनागरी लिपि","s":"देवनागरी वह लिपि है जिसमें हिंदी, संस्कृत, मराठी, नेपाली लिखी जाती हैं।","n":["देवनागरी ब्राह्मी लिपि से विकसित हुई है।","यह बाएँ से दाएँ लिखी जाती है और अक्षरों पर शिरोरेखा (ऊपर की लकीर) होती है।","गुण: जैसा बोलते हैं लगभग वैसा लिखते हैं। वर्णों का क्रम ध्वनि के स्थान (कंठ, तालु आदि) पर आधारित है।","सीमाएँ: कुछ वर्णों के दो रूप, शिरोरेखा से लिखने में समय। केंद्रीय हिंदी निदेशालय ने मानकीकरण किया।","आज यूनिकोड के कारण देवनागरी कंप्यूटर और मोबाइल पर आसानी से लिखी जाती है।"],"ex":"वर्गीकरण का वैज्ञानिक क्रम: क-वर्ग (कंठ से), च-वर्ग (तालु से), ट-वर्ग (मूर्धा से), त-वर्ग (दाँत से), प-वर्ग (होंठ से)। बोलकर देखें: 'क' गले से, 'प' होंठों से निकलता है।","q":"देवनागरी लिपि की विशेषताएँ मानकीकरण BA hindi","kw":["देवनागरी","लिपि","ब्राह्मी","मानकीकरण"]},{"id":"bharatiya-kavyashastra","t":"भारतीय काव्यशास्त्र","s":"भारतीय काव्यशास्त्र बताता है कि कविता क्या है और उसकी आत्मा क्या है।","n":["छह मुख्य संप्रदाय: रस (भरतमुनि), अलंकार (भामह), रीति (वामन), ध्वनि (आनंदवर्धन), वक्रोक्ति (कुंतक), औचित्य (क्षेमेंद्र)।","भरत का रस सूत्र: विभाव, अनुभाव और व्यभिचारी भाव के संयोग से रस बनता है।","वामन ने रीति (शब्दों की विशेष रचना) को काव्य की आत्मा कहा।","आनंदवर्धन ने 'ध्वन्यालोक' में ध्वनि, यानी छिपे हुए अर्थ (व्यंग्यार्थ) को काव्य की आत्मा माना।","शब्द शक्तियाँ तीन: अभिधा (सीधा अर्थ), लक्षणा (संबंधित अर्थ), व्यंजना (छिपा अर्थ)।"],"ex":"'गंगा पर गाँव है।' सीधे अर्थ (अभिधा) में गाँव पानी पर नहीं हो सकता। लक्षणा से अर्थ: गंगा के किनारे गाँव है। व्यंजना से भाव: गाँव पवित्र और ठंडा है।","q":"भारतीय काव्यशास्त्र रस अलंकार रीति ध्वनि संप्रदाय","kw":["काव्यशास्त्र","ध्वनि","शब्द शक्ति","रस सूत्र"]},{"id":"chhayavad","t":"छायावाद","s":"छायावाद (लगभग 1918-1936) हिंदी कविता का भाव, कल्पना और प्रकृति-प्रेम वाला दौर है।","n":["मुख्य विशेषताएँ: व्यक्तिगत भावनाएँ, प्रकृति का मानवीकरण, रहस्य भावना, कोमल और चित्रमय भाषा।","जयशंकर प्रसाद: 'कामायनी' (मनु और श्रद्धा की कथा से मानव मन का विकास)।","सुमित्रानंदन पंत को 'प्रकृति का सुकुमार कवि' कहा गया।","निराला ने मुक्त छंद को अपनाया; 'राम की शक्ति पूजा' उनकी प्रसिद्ध लंबी कविता है।","महादेवी वर्मा की कविता में वेदना और रहस्य है; उन्हें 'आधुनिक मीरा' कहा गया।"],"ex":"परीक्षा प्रश्न: 'छायावाद को स्वच्छंदतावाद से क्यों जोड़ा जाता है?' उत्तर: अंग्रेज़ी रोमांटिक कविता की तरह यहाँ भी नियमों से आज़ादी, कल्पना, प्रकृति प्रेम और व्यक्ति की भावना को महत्व मिला।","q":"छायावाद की विशेषताएँ प्रसाद पंत निराला महादेवी","kw":["छायावाद","कामायनी","निराला","महादेवी वर्मा"]},{"id":"katha-sahitya","t":"हिंदी कथा साहित्य: उपन्यास और कहानी","s":"हिंदी उपन्यास और कहानी ने समाज के सच को आम लोगों तक पहुँचाया।","n":["प्रारंभिक उपन्यास: श्रीनिवास दास का 'परीक्षा गुरु' (1882) को कई विद्वान पहला हिंदी उपन्यास मानते हैं।","प्रेमचंद को 'उपन्यास सम्राट' कहा जाता है: 'सेवासदन', 'रंगभूमि', 'गबन', 'गोदान' (1936)।","प्रेमचंद की कहानियाँ: 'कफ़न', 'पूस की रात', 'ईदगाह', 'नमक का दरोगा'।","बाद में मनोवैज्ञानिक (जैनेंद्र, अज्ञेय), आंचलिक (फणीश्वरनाथ रेणु, 'मैला आँचल') उपन्यास आए।","1950 के बाद 'नई कहानी' आंदोलन: मोहन राकेश, कमलेश्वर, राजेंद्र यादव।"],"ex":"'गोदान' का नायक होरी एक गरीब किसान है जिसका सपना एक गाय रखना है। कर्ज़, ज़मींदार और महाजन के बीच वह पिसता है। यह उपन्यास भारतीय किसान के शोषण का सच्चा चित्र है।","q":"हिंदी उपन्यास का विकास प्रेमचंद गोदान BA","kw":["उपन्यास","कहानी","प्रेमचंद","आंचलिक"]},{"id":"hindi-natak","t":"हिंदी नाटक और रंगमंच","s":"हिंदी नाटक भारतेंदु से शुरू होकर आधुनिक रंगमंच तक पहुँचा।","n":["भारतेंदु हरिश्चंद्र: 'अंधेर नगरी', 'भारत दुर्दशा' — व्यंग्य और देशप्रेम।","जयशंकर प्रसाद ने ऐतिहासिक नाटक लिखे: 'स्कंदगुप्त', 'चंद्रगुप्त', 'ध्रुवस्वामिनी'।","मोहन राकेश: 'आषाढ़ का एक दिन', 'आधे अधूरे'। धर्मवीर भारती: 'अंधा युग'।","नाटक के तत्व: कथावस्तु, पात्र, संवाद, देशकाल, भाषा, उद्देश्य और अभिनेयता (मंच पर खेले जाने लायक होना)।","एकांकी एक अंक का छोटा नाटक है। नुक्कड़ नाटक सड़क पर जनता के बीच खेला जाता है।"],"ex":"'अंधेर नगरी' की प्रसिद्ध पंक्ति: 'अंधेर नगरी चौपट राजा, टके सेर भाजी टके सेर खाजा।' यानी जहाँ राजा मूर्ख हो, वहाँ अच्छी-बुरी चीज़ का भेद नहीं रहता। यह कुशासन पर व्यंग्य है।","q":"हिंदी नाटक का विकास भारतेंदु प्रसाद मोहन राकेश","kw":["नाटक","रंगमंच","एकांकी","मोहन राकेश"]},{"id":"prayojanmulak-hindi","t":"प्रयोजनमूलक हिंदी","s":"प्रयोजनमूलक हिंदी वह हिंदी है जो दफ़्तर, बैंक, मीडिया जैसे कामकाज में इस्तेमाल होती है।","n":["इसका मतलब है किसी खास काम (प्रयोजन) के लिए हिंदी। इससे रोज़गार के रास्ते खुलते हैं।","प्रशासनिक लेखन: परिपत्र, अधिसूचना, कार्यालय ज्ञापन, टिप्पण (नोटिंग), मसौदा (ड्राफ्टिंग)।","पारिभाषिक शब्दावली: Office = कार्यालय, Notification = अधिसूचना, Circular = परिपत्र।","राजभाषा अधिनियम 1963 के तहत सरकारी कामकाज में हिंदी और अंग्रेज़ी दोनों का प्रयोग होता है।","अनुवाद, मीडिया लेखन, विज्ञापन लेखन और कंप्यूटर पर हिंदी इसी के हिस्से हैं।"],"ex":"टिप्पणी का नमूना: 'प्रस्तुत आवेदन श्री रमेश कुमार द्वारा दो दिन के आकस्मिक अवकाश हेतु है। उनके खाते में अवकाश शेष है। स्वीकृति हेतु प्रस्तुत।' यह छोटी, तथ्यपूर्ण और विनम्र भाषा है।","q":"प्रयोजनमूलक हिंदी टिप्पण आलेखन BA","kw":["प्रयोजनमूलक हिंदी","राजभाषा","टिप्पण","पारिभाषिक शब्दावली"]}],"pg":[{"id":"pashchatya-kavyashastra","t":"पाश्चात्य काव्यशास्त्र","s":"पश्चिमी विचारकों ने भी बताया कि साहित्य क्या है और कैसे परखा जाए।","n":["प्लेटो ने कविता को नकल की नकल माना। अरस्तू ने 'पोएटिक्स' में अनुकरण (mimesis) और विरेचन (catharsis) के सिद्धांत दिए।","विरेचन: त्रासदी देखकर दर्शक के मन से डर और करुणा का भार हल्का होता है।","लोंजाइनस ने उदात्त (sublime) का सिद्धांत दिया: महान विचार और गहरी भावना।","वर्ड्सवर्थ ने कविता को 'प्रबल भावनाओं का सहज उच्छलन' कहा; कॉलरिज ने कल्पना का सिद्धांत दिया।","टी.एस. इलियट: परंपरा और वैयक्तिक प्रतिभा, निर्वैयक्तिकता, वस्तुनिष्ठ समीकरण (objective correlative)।"],"ex":"तुलना: भरत का रस और अरस्तू का विरेचन, दोनों बताते हैं कि दुखद नाटक देखकर भी दर्शक को एक तरह का आनंद या मानसिक शुद्धि मिलती है। यह भारतीय और पश्चिमी चिंतन का सुंदर मेल है।","q":"पाश्चात्य काव्यशास्त्र अरस्तू विरेचन इलियट MA hindi","kw":["अरस्तू","विरेचन","उदात्त","इलियट"]},{"id":"hindi-alochana","t":"हिंदी आलोचना की परंपरा","s":"आलोचना साहित्य को समझने, परखने और उसका मूल्य बताने की कला है।","n":["आचार्य रामचंद्र शुक्ल: लोकमंगल की भावना, 'चिंतामणि' निबंध, तुलसी और सूर पर गहरी आलोचना।","हजारीप्रसाद द्विवेदी: 'कबीर' पुस्तक, सांस्कृतिक और ऐतिहासिक दृष्टि, आदिकाल पर नया विचार।","रामविलास शर्मा: मार्क्सवादी दृष्टि, निराला और भारतीय परंपरा पर काम।","नामवर सिंह: 'कविता के नए प्रतिमान', 'दूसरी परंपरा की खोज'।","आलोचना के प्रकार: शास्त्रीय, ऐतिहासिक, मनोवैज्ञानिक, मार्क्सवादी, समाजशास्त्रीय, शैलीवैज्ञानिक।"],"ex":"एक कविता को अलग ढंग से पढ़ें: मार्क्सवादी आलोचक गरीबी और वर्ग संघर्ष देखेगा; मनोवैज्ञानिक आलोचक कवि के मन की गाँठें खोजेगा; शैलीवैज्ञानिक शब्द-चयन और लय पर ध्यान देगा।","q":"हिंदी आलोचना रामचंद्र शुक्ल हजारीप्रसाद द्विवेदी नामवर सिंह MA","kw":["आलोचना","रामचंद्र शुक्ल","नामवर सिंह","मार्क्सवादी"]},{"id":"bhasha-vigyan","t":"भाषा विज्ञान","s":"भाषा विज्ञान भाषा का वैज्ञानिक अध्ययन है: ध्वनि, शब्द, वाक्य और अर्थ।","n":["ध्वनि विज्ञान: ध्वनियाँ कैसे बनती हैं। स्वनिम (phoneme) अर्थ बदलने वाली सबसे छोटी ध्वनि इकाई है।","रूप विज्ञान: रूपिम (morpheme) अर्थ वाली सबस
