े छोटी इकाई है, जैसे 'लड़क' + 'ए'।","वाक्य विज्ञान: शब्द वाक्य में कैसे जुड़ते हैं। अर्थ विज्ञान: अर्थ कैसे बदलते हैं।","फ़र्डिनांड द सस्यूर ने भाषा (langue) और वाक् (parole) का भेद बताया।","समाज भाषा विज्ञान बताता है कि जाति, जगह, वर्ग के साथ बोली कैसे बदलती है।"],"ex":"स्वनिम की जाँच: 'काल' और 'खाल' में केवल क/ख का अंतर है, पर अर्थ बदल गया। इसलिए हिंदी में /क/ और /ख/ अलग-अलग स्वनिम हैं। ऐसे जोड़ों को न्यूनतम युग्म (minimal pair) कहते हैं।","q":"भाषा विज्ञान स्वनिम रूपिम MA hindi","kw":["भाषा विज्ञान","स्वनिम","रूपिम","सस्यूर"]},{"id":"vimarsh","t":"समकालीन विमर्श: स्त्री, दलित, आदिवासी","s":"विमर्श हाशिए के समाज की आवाज़ को साहित्य के केंद्र में लाने की कोशिश है।","n":["स्त्री विमर्श: स्त्री के अनुभव, बराबरी और पहचान का प्रश्न। महादेवी वर्मा की 'शृंखला की कड़ियाँ' एक आरंभिक गद्य पाठ है।","दलित विमर्श: जाति अन्याय के विरुद्ध 'स्वानुभूति' का साहित्य। ओमप्रकाश वाल्मीकि की आत्मकथा 'जूठन' प्रसिद्ध है।","आदिवासी विमर्श: जल, जंगल, ज़मीन और संस्कृति की रक्षा का स्वर।","इन विमर्शों पर डॉ. आंबेडकर, फुले और नारीवादी विचारों का गहरा प्रभाव है।","आत्मकथा, कविता और कहानी इन विमर्शों की मुख्य विधाएँ रही हैं।"],"ex":"दलित साहित्य में 'सहानुभूति बनाम स्वानुभूति' बहस: क्या बाहर का लेखक दर्द समझकर लिख सकता है, या केवल वही जो उसे सहता है? इस पर लिखते समय दोनों पक्ष रखें और उदाहरण दें।","q":"स्त्री विमर्श दलित विमर्श आदिवासी विमर्श हिंदी साहित्य MA","kw":["विमर्श","स्त्री विमर्श","दलित साहित्य","आदिवासी"]},{"id":"nayi-kavita","t":"प्रगतिवाद, प्रयोगवाद और नई कविता","s":"छायावाद के बाद हिंदी कविता यथार्थ, प्रयोग और आम आदमी की ओर मुड़ी।","n":["प्रगतिवाद (1936 के आसपास): मार्क्सवादी सोच, किसान-मज़दूर। नागार्जुन, केदारनाथ अग्रवाल।","प्रयोगवाद: अज्ञेय द्वारा संपादित 'तार सप्तक' (1943) से शुरुआत। नए शिल्प और बिंबों के प्रयोग।","नई कविता (1950 के बाद): छोटे मनुष्य का अनुभव, शहरी जीवन। मुक्तिबोध, रघुवीर सहाय, सर्वेश्वर।","मुक्तिबोध की 'अँधेरे में' लंबी कविता को आधुनिक हिंदी की बड़ी कविता माना जाता है।","बाद में अकविता, जनवादी कविता और समकालीन कविता के रूप दिखे।"],"ex":"तुलना-प्रश्न: छायावाद और नई कविता। छायावाद में कोमल कल्पना और प्रकृति है; नई कविता में रोज़ की ज़िंदगी, अकेलापन, व्यवस्था पर सवाल और बोलचाल की भाषा है।","q":"प्रगतिवाद प्रयोगवाद नई कविता तार सप्तक MA hindi","kw":["प्रगतिवाद","प्रयोगवाद","नई कविता","मुक्तिबोध"]},{"id":"anuvad-tulnatmak","t":"अनुवाद और तुलनात्मक साहित्य","s":"अनुवाद एक भाषा का अर्थ दूसरी भाषा में ले जाना है; तुलनात्मक साहित्य भाषाओं के बीच संबंध खोजता है।","n":["अनुवाद के प्रकार: शब्दानुवाद (शब्दशः), भावानुवाद (भाव के अनुसार), छायानुवाद, सारानुवाद।","अच्छा अनुवाद मूल का अर्थ, शैली और संस्कृति, तीनों बचाकर रखता है।","मुहावरे और सांस्कृतिक शब्दों का अनुवाद सबसे कठिन होता है।","तुलनात्मक साहित्य में दो भाषाओं के लेखकों, विषयों, आंदोलनों की तुलना होती है।","भारत में यह स्वाभाविक है, जैसे कई भाषाओं में भक्ति आंदोलन की तुलना।"],"ex":"अंग्रेज़ी 'It is raining cats and dogs' का शब्दानुवाद 'बिल्ली-कुत्ते बरस रहे हैं' बेकार है। भावानुवाद: 'मूसलाधार बारिश हो रही है।' इससे दिखता है कि भाव का अनुवाद ज़रूरी है।","q":"अनुवाद के प्रकार तुलनात्मक साहित्य MA hindi","kw":["अनुवाद","भावानुवाद","तुलनात्मक साहित्य"]}],"phd":[{"id":"shodh-pravidhi","t":"साहित्यिक शोध प्रविधि","s":"शोध प्रविधि बताती है कि साहित्य पर व्यवस्थित, प्रमाण वाला शोध कैसे करें।","n":["शोध के प्रकार: ऐतिहासिक, तुलनात्मक, समाजशास्त्रीय, भाषावैज्ञानिक, पाठालोचन, अंतरानुशासनिक।","प्राथमिक स्रोत: मूल रचनाएँ, पांडुलिपि, साक्षात्कार। द्वितीयक स्रोत: आलोचना, शोध-लेख।","शोध प्रश्न साफ़ हो। परिकल्पना (hypothesis) अनुमान है, जिसे प्रमाण से जाँचा जाता है।","क्षेत्र कार्य (फ़ील्ड वर्क) लोक साहित्य, बोलियों और मौखिक परंपराओं के शोध में ज़रूरी है।","हर दावा उद्धरण और संदर्भ से समर्थित हो, केवल राय न हो।"],"ex":"विषय उदाहरण: 'भोजपुरी लोकगीतों में प्रवास की पीड़ा'। प्राथमिक स्रोत: गाँवों में रिकॉर्ड किए गीत; द्वितीयक: पहले के संग्रह और लेख; प्रविधि: क्षेत्र कार्य + विषय-वस्तु विश्लेषण।","q":"हिंदी साहित्य शोध प्रविधि PhD research methodology","kw":["शोध प्रविधि","प्राथमिक स्रोत","परिकल्पना","क्षेत्र कार्य"]},{"id":"vishay-chayan-synopsis","t":"विषय चयन और शोध रूपरेखा (सिनॉप्सिस)","s":"अच्छा विषय और साफ़ रूपरेखा पूरे शोध की नींव है।","n":["विषय नया हो, बहुत बड़ा न हो, और उस पर स्रोत उपलब्ध हों।","पहले हुए काम की समीक्षा करें। शोधगंगा (Shodhganga) पर भारतीय विश्वविद्यालयों के शोध-प्रबंध मुफ़्त मिलते हैं।","सिनॉप्सिस में: विषय, समस्या, उद्देश्य, पूर्व शोध की समीक्षा, प्रविधि, अध्याय योजना, संदर्भ सूची।","पूर्व शोध में जो कमी (research gap) मिले, वही आपके शोध का औचित्य है।","अपने शोध निर्देशक से हर चरण पर चर्चा करें।"],"ex":"बड़ा विषय: 'हिंदी उपन्यास में स्त्री'। सीमित विषय: '2000 के बाद के हिंदी उपन्यासों में कामकाजी स्त्री: पाँच उपन्यासों के संदर्भ में'। सीमित विषय पर गहरा काम संभव है।","q":"PhD synopsis kaise likhe hindi sahitya shodh","kw":["सिनॉप्सिस","विषय चयन","शोधगंगा","research gap"]},{"id":"sandarbh-sahityik-chori","t":"संदर्भ लेखन और साहित्यिक चोरी से बचाव","s":"दूसरों के विचार लें तो उनका नाम और स्रोत ज़रूर बताएँ।","n":["संदर्भ शैलियाँ: MLA (मानविकी में आम), APA, शिकागो। एक शैली पूरे प्रबंध में एक जैसी रखें।","पाद टिप्पणी (footnote) और संदर्भ सूची (bibliography) दोनों सावधानी से बनाएँ।","बिना नाम दिए किसी का लिखा उठाना साहित्यिक चोरी (plagiarism) है।","UGC के 2018 के नियमों में साहित्यिक चोरी के स्तर और दंड तय किए गए हैं।","Zotero जैसे मुफ़्त टूल से संदर्भ सँभालना आसान होता है।"],"ex":"MLA शैली में पुस्तक संदर्भ: शुक्ल, रामचंद्र। हिंदी साहित्य का इतिहास। प्रकाशक का नाम, प्रकाशन वर्ष। (प्रकाशक और वर्ष उसी संस्करण के लिखें जो आपने पढ़ा।)","q":"MLA citation style hindi research plagiarism UGC","kw":["संदर्भ","MLA","साहित्यिक चोरी","UGC"]},{"id":"path-alochana","t":"पाठालोचन और पांडुलिपि शोध","s":"पाठालोचन पुरानी रचनाओं का सबसे सही और प्रामाणिक पाठ तय करने की विद्या है।","n":["पुरानी रचनाएँ हाथ से लिखी पांडुलिपियों में मिलती हैं, जिनमें कई बार अलग-अलग पाठ होते हैं।","पाठालोचक प्रतियों की तुलना करके पाठ-भेद दर्ज करता है और प्रामाणिक पाठ तय करता है।","लिपि, कागज़, स्याही और लेखन-काल का अध्ययन भी इसमें आता है।","राष्ट्रीय पांडुलिपि मिशन (2003) भारत की पांडुलिपियों का सर्वेक्षण और संरक्षण करता है।","कबीर, तुलसी, पृथ्वीराज रासो के पाठ और प्रामाणिकता पर विद्वानों में लंबी बहस रही है।"],"ex":"मान लीजिए किसी दोहे की तीन प्रतियों में एक शब्द अलग है। पाठालोचक देखेगा कि कौन-सी प्रति पुरानी है, किसमें कम गलतियाँ हैं, और छंद की मात्रा किस पाठ से सही बैठती है।","q":"पाठालोचन पांडुलिपि विज्ञान हिंदी शोध","kw":["पाठालोचन","पांडुलिपि","पाठ-भेद"]},{"id":"digital-hindi-shodh","t":"डिजिटल मानविकी और नए शोध क्षेत्र","s":"कंप्यूटर और इंटरनेट ने हिंदी साहित्य के शोध के नए रास्ते खोले हैं।","n":["डिजिटल मानविकी: बड़े पाठ-संग्रह (corpus) में शब्दों और विषयों का कंप्यूटर से विश्लेषण।","इंटरनेट आर्काइव जैसी जगहों पर कॉपीराइट-मुक्त पुरानी हिंदी किताबें मुफ़्त मिलती हैं।","नए क्षेत्र: डायस्पोरा (प्रवासी) साहित्य, पर्यावरण आलोचना, मीडिया और सिनेमा अध्ययन, लोक साहित्य का डिजिटलीकरण।","शोध-पत्र UGC-CARE सूची वाली पत्रिकाओं में भेजें और फ़र्ज़ी (predatory) पत्रिकाओं से बचें।","हिंदी OCR अभी पूरी तरह सही नहीं है, इसलिए डिजिटल पाठ को मूल से मिलाकर जाँचें।"],"ex":"उदाहरण परियोजना: प्रेमचंद की कॉपीराइट-मुक्त कहानियों में 'किसान', 'महाजन', 'कर्ज़' जैसे शब्द कितनी बार आते हैं, यह मुफ़्त टूल से गिनें और फिर उसके अर्थ की व्याख्या करें।","q":"digital humanities hindi literature research","kw":["डिजिटल मानविकी","corpus","UGC-CARE","डायस्पोरा"]}]},"order":12},{"id":"english","name":"English","nameHi":"अंग्रेज़ी","group":"languages","blurb":"English grammar, reading, writing, speaking and literature, explained simply with Hindi help where useful.","levels":{"6-8":[{"id":"parts-of-speech","t":"Parts of Speech","s":"Every English word does one of eight jobs in a sentence. These jobs are called parts of speech.","n":["Noun (संज्ञा) names a person, place or thing: Ravi, Delhi, book. Pronoun (सर्वनाम) replaces a noun: he, she, it, they.","Verb (क्रिया) shows action or state: run, eat, is. Adjective (विशेषण) describes a noun: big, red, honest.","Adverb (क्रिया-विशेषण) describes a verb, adjective or another adverb: quickly, very, slowly.","Preposition shows position or relation: in, on, under, with. Conjunction joins words or sentences: and, but, because.","Interjection shows sudden feeling: Oh!, Wow!, Alas!. One word can change its part of speech with its use."],"ex":"'Wow! Meena quickly ate a sweet mango and smiled.' Wow = interjection, Meena = noun, quickly = adverb, ate = verb, a = article (a type of adjective), sweet = adjective, mango = noun, and = conjunction, smiled = verb.","q":"parts of speech english grammar in hindi class 6","kw":["parts of speech","noun","verb","adjective","adverb"]},{"id":"nouns-pronouns","t":"Nouns and Pronouns","s":"Nouns are naming words; pronouns stand in place of nouns so we do not repeat them.","n":["Proper noun: a special name, starts with a capital letter (India, Ganga). Common noun: a general name (river, city).","Collective noun: a group (a team of players, a herd of cows). Abstract noun: an idea or feeling (honesty, love).","Countable nouns can be counted (one apple, two apples). Uncountable nouns cannot (water, milk, advice).","Personal pronouns: I, we (first person); you (second person); he, she, it, they (third person).","Use 'I' as subject and 'me' as object: 'I called him.' 'He called me.'"],"ex":"Wrong: 'Sita and me went to the market.' Remove 'Sita and': 'me went' sounds wrong, 'I went' sounds right. So correct: 'Sita and I went to the market.' Also say 'some advice', not 'an advice', because advice is uncountable.","q":"nouns and pronouns english grammar in hindi class 6","kw":["noun","pronoun","countable","uncountable"]},{"id":"articles","t":"Articles: a, an, the","s":"Articles are small words used before nouns: a, an and the.","n":["'A' and 'an' mean one, any one (कोई एक). They are indefinite articles.","Use 'a' before a consonant sound: a book, a university (sounds like 'yu').","Use 'an' before a vowel sound: an apple, an hour (h is silent), an MLA (sounds like 'em').","'The' is used for a specific thing both people know: 'the book on the table'. It is the definite article.","Use 'the' for unique things (the sun, the Ganga) but not before most single names (India, Ravi)."],"ex":"Fill in: '___ honest man saw ___ elephant near ___ Yamuna.' Answer: 'An honest man saw an elephant near the Yamuna.' 'Honest' starts with a vowel sound (h silent), 'elephant' with a vowel, and 'the' is used before river names.","q":"articles a an the english grammar in hindi","kw":["articles","a an the","vowel sound"]},{"id":"prepositions","t":"Prepositions","s":"Prepositions show the relation of a noun with other words, mostly place, time or direction.","n":["Place: in (अंदर), on (ऊपर, सतह पर), under (नीचे), between (दो के बीच), among (कई के बीच).","Time: 'at' for exact time (at 5 o'clock), 'on' for days and dates (on Monday), 'in' for months, years (in May, in 2020).","'Since' for a point of time (since 2015), 'for' for a period (for two hours).","Direction: to, into, from, towards. 'Into' means moving inside: 'He jumped into the river.'","Hindi 'से' can be 'from', 'by', 'with' or 'since' in English. Choose by meaning."],"ex":"Hindi: 'मैं 2019 से दिल्ली में रह रहा हूँ।' English: 'I have been living in Delhi since 2019.' Not 'from 2019', because 'since' is used with a starting point of time with perfect tenses.","q":"prepositions in on at since for english grammar hindi","kw":["prepositions","in on at","since for"]},{"id":"simple-tenses","t":"Simple Present, Past and Future","s":"Tense (काल) shows the time of an action: present, past or future.","n":["Simple present for habits and facts: 'I drink milk daily.' 'The sun rises in the east.'","With he, she, it or one person, add -s or -es: 'She plays.' 'He goes.'","Simple past for finished actions: 'I played yesterday.' Use the second form of the verb (go-went, eat-ate).","Simple future: will + first form of verb. 'I will go tomorrow.'","Negatives: do not / does not (present), did not (past), will not (future). After did not, use the first form: 'He did not go.'"],"ex":"Change the time: 'Ravi walks to school.' (present) → 'Ravi walked to school yesterday.' (past) → 'Ravi will walk to school tomorrow.' (future). Negative past: 'Ravi did not walk to school.' (not 'did not walked').","q":"simple present past future tense in hindi english grammar","kw":["tense","simple present","simple past","future"]},{"id":"subject-verb-agreement","t":"Subject-Verb Agreement","s":"The verb must match its subject: singular subject with singular verb, plural with plural.","n":["Singular subject takes is, was, has, or verb + s: 'The boy runs.' Plural takes are, were, have: 'The boys run.'","'I' takes 'am'; 'you' always takes 'are' and 'have'.","Two subjects joined by 'and' are plural: 'Ram and Shyam are friends.'","Each, every, everyone, nobody take singular verbs: 'Everyone is here.'","Do not get confused by words in between: 'The box of pens is on the desk.' The real subject is 'box'."],"ex":"Choose: 'One of my friends (live/lives) in Patna.' The subject is 'one', not 'friends'. So: 'One of my friends lives in Patna.'","q":"subject verb agreement english grammar in hindi","kw":["subject verb agreement","singular","plural"]},{"id":"vocabulary-basics","t":"Building Vocabulary","s":"Vocabulary means the words you know; more words help you read, write and speak better.","n":["Synonyms are words with similar meaning: big-large, happy-glad. Antonyms are opposites: hot-cold, rich-poor.","Prefixes come before a word and change meaning: un- (unhappy), re- (rewrite), dis- (dislike).","Suffixes come after a word: -ful (helpful), -less (careless), -ness (kindness).","Homophones sound the same but differ in meaning and spelling: their-there, write-right.","Learn 5 new words a day. Write each in your own sentence and use it while speaking."],"ex":"Word family of 'care': careful (adjective, ध्यान से), careless (adjective, लापरवाह), carefully (adverb), carelessness (noun). Sentence: 'Careless driving causes accidents, so drive carefully.'","q":"english vocabulary synonyms antonyms prefix suffix hindi","kw":["vocabulary","synonyms","antonyms","prefix","suffix"]},{"id":"paragraph-informal-letter","t":"Paragraph and Informal Letter Writing","s":"A paragraph explains one idea; an informal letter is written to friends and family.","n":["A paragraph has a topic sentence (main idea), supporting sentences (details), and a closing sentence.","Informal letter format: your address, date, greeting (Dear Rahul), body, closing (Yours lovingly), your name.","Use a friendly tone. Short sentences are fine.","Begin by asking about the person, then share your news, and end with good wishes.","Check spelling, capital letters and full stops before you finish."],"ex":"Dear Priya, I hope you are well. Last week our school held a tree plantation drive. I planted a neem sapling near the gate and I water it every day. Please visit in the holidays and see it. Give my regards to uncle and aunty. Yours lovingly, Anita.","q":"informal letter writing format english class 7","kw":["paragraph writing","informal letter","letter format"]}],"9-10":[{"id":"twelve-tenses","t":"All Twelve Tenses","s":"Each of the three times (present, past, future) has four forms, making twelve tenses.","n":["Four forms: simple, continuous (be + verb-ing), perfect (have/has/had + third form), perfect continuous (have been / had been + verb-ing).","Present continuous: action happening now. 'She is cooking.' Present perfect: finished action, result now. 'I have finished my work.'","Present perfect continuous: action started in the past and still going. 'I have been waiting for an hour.'","Past perfect: the earlier of two past actions. 'The train had left before I reached.'","Do not use present perfect with a fixed past time: say 'I saw him yesterday', not 'I have seen him yesterday'."],"ex":"Verb 'write' in present: I write (simple), I am writing (continuous), I have written (perfect), I have been writing (perfect continuous). Past: I wrote, I was writing, I had written, I had been writing. Future: I will write, will be writing, will have written, will have been writing.","q":"12 tenses in english grammar in hindi with examples","kw":["tenses","present perfect","past perfect","continuous"]},{"id":"active-passive-voice","t":"Active and Passive Voice","s":"In active voice the doer is important; in passive voice the action or receiver is important.","n":["Active: 'Ravi wrote a letter.' Passive: 'A letter was written by Ravi.' (कर्तृवाच्य and कर्मवाच्य)","Steps: object becomes subject, use the right form of 'be', use the third form of the verb, add 'by + doer' if needed.","Present: is/am/are + V3. Past: was/were + V3. Future: will be + V3. Continuous adds 'being'; perfect adds 'been'.","Pronouns change: I→me, he→him, they→them, we→us.","Passive is common in news and notices: 'The bridge was opened yesterday.' 'Mobile phones are not allowed.'"],"ex":"Active: 'The farmer is ploughing the field.' Passive: object 'the field' comes first, tense is present continuous, so 'is being' + V3: 'The field is being ploughed by the farmer.'","q":"active passive voice all tenses in hindi class 10","kw":["active voice","passive voice","V3"]},{"id":"narration","t":"Direct and Indirect Speech (Narration)","s":"Direct speech gives the exact words in quotes; indirect speech reports them in our own words.","n":["Direct: He said, 'I am tired.' Indirect: He said that he was tired.","If the reporting verb is in the past (said), the tense goes one step back: am→was, will→would, is going→was going.","Pronouns change by sense: I→he/she, my→his/her. Time words change: now→then, today→that day, tomorrow→the next day.","Questions: use 'asked' + if/whether (yes-no) or the question word, and make it a statement: She asked where I lived.","Orders: use told/ordered/requested + to + verb: The teacher told us to sit down."],"ex":"Direct: Mother said to me, 'Will you go to the market tomorrow?' Indirect: Mother asked me if I would go to the market the next day. (said to→asked, will→would, you→I, tomorrow→the next day, question mark removed.)","q":"direct indirect speech narration rules in hindi class 10","kw":["narration","direct speech","indirect speech","reported speech"]},{"id":"modals","t":"Modal Verbs","s":"Modals like can, may, must and should add meanings like ability, permission and duty.","n":["Can = ability (सकना): 'I can swim.' Could = past ability or polite request: 'Could you help me?'","May = permission or possibility: 'May I come in?' 'It may rain.' Might = weaker possibility.","Must = strong duty or certainty: 'You must wear a helmet.' Should = advice: 'You should sleep early.'","After a modal, always use the first form of the verb: 'She can sing', not 'She can sings'.","Will/would, shall, ought to and need are also modals."],"ex":"Pick the right modal: 'You ___ not park here; it is a no-parking zone.' The rule is strict, so 'must not' fits best: 'You must not park here.' For advice: 'You should drink more water.'","q":"modal verbs can could may might must should in hindi","kw":["modals","can","must","should"]},{"id":"reading-comprehension","t":"Reading Comprehension","s":"Reading comprehension means understanding a passage and answering questions on it.","n":["First read the questions, then the passage. You will know what to look for.","Find the main idea: usually in the first or last lines of a paragraph.","Guess hard word meanings from nearby words (context clues). Do not stop at every new word.","Answer in your own words, but keep the facts from the passage. Do not add outside opinions.","For 'find the word that means...' questions, search the paragraph mentioned and test each word in place."],"ex":"Passage line: 'The village was parched; not a drop of rain had fallen for months.' Q: What does 'parched' mean? Clue: no rain for months. So 'parched' means very dry (सूखा हुआ).","q":"unseen passage reading comprehension tricks english class 10 hindi","kw":["reading comprehension","unseen passage","context clues"]},{"id":"formal-letter","t":"Formal Letter Writing","s":"Formal letters go to officials, editors or companies and follow a fixed, polite format.","n":["Format: sender's address, date, receiver's designation and address, subject, salutation (Sir/Madam), body, complimentary close, name.","Subject line: short and clear, e.g. 'Subject: Complaint about broken streetlights'.","Body: paragraph 1 states purpose, paragraph 2 gives details, paragraph 3 requests action.","Close with 'Yours faithfully' when you do not know the person by name; 'Yours sincerely' when you use their name.","Keep the tone polite even when complaining. Avoid slang and short forms."],"ex":"To The Municipal Commissioner... Subject: Broken streetlights in Ward 12. Sir, I wish to draw your attention to five streetlights on Station Road that have not worked for a month. The area is unsafe for women and children at night. Kindly get them repaired soon. Yours faithfully, Amit Kumar.","q":"formal letter writing format class 10 english complaint letter","kw":["formal letter","letter to editor","complaint letter"]},{"id":"essay-article","t":"Essay and Article Writing","s":"An essay or article presents your ideas on a topic in an organised way.","n":["Structure: introduction (hook + topic), body (2-3 paragraphs, one idea each), conclusion (summary + suggestion).","An article also has a catchy title and the writer's name below it.","Plan first: write 4-5 points before starting.","Use linking words: firstly, moreover, however, therefore, in conclusion.","Facts and examples make writing strong. Do not repeat the same point."],"ex":"Title: 'Digital India: A Boon for Villages' by Kavita. Intro: phones reach almost every village now. Body: UPI payments, online forms, farmers checking crop prices. Challenge: weak network, online fraud. Conclusion: with digital literacy, technology can reduce the village-city gap.","q":"article writing format class 10 english","kw":["essay","article writing","linking words"]},{"id":"spoken-english-hindi-speakers","t":"Spoken English Tips for Hindi Speakers","s":"Small changes in thinking and pronunciation make Hindi speakers sound clear and confident in English.","n":["Word order differs: Hindi is subject-object-verb (मैं खाना खाता हूँ), English is subject-verb-object (I eat food).","Avoid direct translation: say 'I am going to sleep', not 'I am going to do sleeping'; 'What is your name?', not 'What is your good name?'","Questions use helping verbs first: 'Do you know him?', not 'You know him?' in formal speech.","Pronunciation: 'w' needs rounded lips (want), 'v' needs teeth on lip (van). 'School' has no extra 'i' sound before it.","Speak daily: describe your day aloud for 2 minutes. Mistakes are part of learning."],"ex":"Hindi habit: 'मैं कल से बीमार हूँ' → 'I am ill since yesterday.' (wrong). Correct English: 'I have been ill since yesterday.' An action that started in the past and is still true needs the present perfect.","q":"spoken english for hindi speakers common mistakes","kw":["spoken english","common mistakes","pronunciation"]}],"11-12":[{"id":"clauses-sentence-types","t":"Clauses and Sentence Types","s":"Sentences are simple, compound or complex depending on how clauses are joined.","n":["A clause has a subject and a verb. An independent clause stands alone; a dependent clause cannot.","Simple sentence: one independent clause. 'She studied hard.'","Compound sentence: two independent clauses joined by and, but, or, so. 'She studied hard, so she passed.'","Complex sentence: one independent + one or more dependent clauses using because, although, when, who, which.","Noun, adjective (relative) and adverb clauses do the jobs of nouns, adjectives and adverbs."],"ex":"'The boy who won the race is my brother.' Independent clause: 'The boy is my brother.' Dependent clause: 'who won the race' describes 'boy', so it is an adjective (relative) clause. This is a complex sentence.","q":"clauses simple compound complex sentences english grammar hindi","kw":["clauses","complex sentence","compound sentence"]},{"id":"email-writing","t":"Email Writing","s":"A formal email is a short, clear message for work, college or official purposes.","n":["Parts: To, Subject, greeting (Dear Sir/Madam or Dear Mr Sharma), body, closing (Regards), name and contact.","Subject must tell the purpose in a few words: 'Leave application for 5-6 March'.","First line states why you are writing. Keep paragraphs to 2-3 lines.","Use a professional email address, ideally with your name.","Check attachments, spelling and the recipient before you press Send."],"ex":"Subject: Request for bonafide certificate. Dear Sir, I am Neha Verma, BA second year, roll no. 45. I need a bonafide certificate to apply for a scholarship. Kindly issue it by 10 July. Regards, Neha Verma, Mobile: (your number).","q":"formal email writing format english class 12","kw":["email writing","formal email","subject line"]},{"id":"report-notice-writing","t":"Report and Notice Writing","s":"A report describes an event factually; a notice gives short public information.","n":["Notice: in a box, with institution name, NOTICE, date, heading, body (what, when, where, who to contact), name and designation.","Notices are short, usually about 50 words, and use passive voice often.","Report: heading, byline (reported by), place and date, then what happened, who attended, highlights, conclusion.","Reports are written in past tense and third person.","Answer the 5 Ws and 1 H: What, When, Where, Who, Why, How."],"ex":"NOTICE. Government Inter College, Ballia. 2 August. BLOOD DONATION CAMP: A blood donation camp will be held in the school hall on 10 August from 10 am to 2 pm. Students above 18 may give their names to the undersigned by 7 August. Ravi Singh, Secretary, NSS.","q":"notice writing report writing format class 12 english","kw":["notice writing","report writing","5 Ws"]},{"id":"poetry-devices","t":"Poetic Devices","s":"Poetic devices are special uses of language that make poems beautiful and meaningful.","n":["Simile compares using 'like' or 'as': 'brave as a lion'. Metaphor compares directly: 'Time is money'.","Personification gives human qualities to non-human things: 'The wind whispered.' (मानवीकरण)","Alliteration repeats the first consonant sound: 'Peter Piper picked peppers.' (अनुप्रास)","Imagery creates pictures in the mind through the senses. Hyperbole is exaggeration (अतिशयोक्ति).","Rhyme scheme is the pattern of end sounds, marked aabb or abab. Enjambment continues a sentence into the next line."],"ex":"Line: 'The stars danced playfully in the moonlit sky.' Stars cannot dance, so this is personification. 'Moonlit' creates a picture of light, so it is visual imagery.","q":"poetic devices figures of speech english class 12 in hindi","kw":["poetic devices","simile","metaphor","personification"]},{"id":"drama-basics","t":"Understanding Drama","s":"Drama is literature written to be performed on stage through dialogue and action.","n":["Elements: plot, characters, dialogue, setting, conflict, and stage directions (written in brackets or italics).","Tragedy ends in suffering or death of the hero; comedy ends happily.","Acts are big parts of a play; scenes are smaller parts within acts.","Soliloquy: a character speaks thoughts aloud alone. Aside: a short remark to the audience others do not hear.","Dramatic irony: the audience knows something a character does not."],"ex":"In Shakespeare's 'Romeo and Juliet' (16th century), the audience knows Juliet is only in a deep sleep, but Romeo believes she is dead. This gap between what we know and what he knows is dramatic irony, and it makes the ending painful.","q":"elements of drama tragedy comedy soliloquy english literature","kw":["drama","tragedy","soliloquy","dramatic irony"]},{"id":"novel-short-story","t":"Novel and Short Story","s":"Novels and short stories are prose fiction; they tell imagined stories with characters and events.","n":["Plot stages: exposition, rising action, climax, falling action, resolution.","Narrator: first person uses 'I'; third person uses 'he/she'. An omniscient narrator knows everyone's thoughts.","Characters: protagonist (main), antagonist (opposes), flat (simple) and round (complex, changing).","Theme is the main message or idea, like friendship, freedom or greed.","A short story focuses on one main event; a novel can have many events, characters and sub-plots."],"ex":"Take R.K. Narayan's 'Swami and Friends' (1935), set in fictional Malgudi. Protagonist: young Swaminathan. Setting: a small South Indian town. Themes: childhood, friendship, school life during the freedom movement.","q":"elements of novel short story plot theme english literature","kw":["novel","plot","narrator","theme"]},{"id":"idioms-phrasal-verbs","t":"Idioms and Phrasal Verbs","s":"Idioms and phrasal verbs have special meanings that differ from their separate words.","n":["Idiom: 'once in a blue moon' means very rarely; 'piece of cake' means very easy.","Phrasal verb = verb + small word (up, off, out): 'give up' (छोड़ देना), 'look after' (देखभाल करना).","One verb can have many: 'put off' (postpone), 'put on' (wear), 'put up with' (tolerate).","Learn them in sentences, not as single words.","Use idioms carefully in formal writing; phrasal verbs are common in spoken English."],"ex":"'The meeting was called off because of rain.' 'Call off' means cancel. 'She looks up to her elder sister.' 'Look up to' means respect. 'Please look up the word in a dictionary.' 'Look up' means search.","q":"idioms and phrasal verbs with hindi meaning","kw":["idioms","phrasal verbs","vocabulary"]}],"ug":[{"id":"old-middle-renaissance","t":"Old English to Renaissance Literature","s":"English literature began with Anglo-Saxon poetry and flowered during the Renaissance.","n":["Old English period (about 450-1066): 'Beowulf', an epic about a hero who fights monsters.","Middle English (about 1066-1500): Geoffrey Chaucer, 'The Canterbury Tales', is called the father of English poetry.","Renaissance (about 1500-1660): new interest in Greek and Latin learning, humanism, exploration.","Writers: Edmund Spenser ('The Faerie Queene'), Christopher Marlowe ('Doctor Faustus'), Francis Bacon (essays).","John Milton's 'Paradise Lost' (1667) is a major epic in blank verse."],"ex":"Remember with a timeline: Beowulf (Old English) → Chaucer (14th century) → Shakespeare (1564-1616) → Milton (Paradise Lost, 1667). Each step shows English growing from a local tongue into a rich literary language.","q":"history of english literature old english middle english renaissance in hindi","kw":["Beowulf","Chaucer","Renaissance","Milton"]},{"id":"shakespeare","t":"William Shakespeare","s":"Shakespeare (1564-1616) is the most famous English playwright, known for tragedies, comedies and sonnets.","n":["Major tragedies: 'Hamlet', 'Othello', 'King Lear', 'Macbeth'. A tragic hero often has a flaw that leads to downfall.","Comedies: 'A Midsummer Night's Dream', 'Twelfth Night', 'As You Like It', 'The Merchant of Venice'.","History plays show English kings, like 'Henry V' and 'Richard III'.","He wrote 154 sonnets. The Shakespearean sonnet has 14 lines with rhyme scheme abab cdcd efef gg.","He mostly wrote in blank verse: unrhymed iambic pentameter (ten syllables, da-DUM pattern)."],"ex":"In 'Macbeth', a brave general hears a prophecy that he will be king. His ambition, pushed by Lady Macbeth, leads him to murder King Duncan. Guilt and more crimes follow, and he is finally killed. Ambition is his tragic flaw.","q":"shakespeare tragedies comedies explained in hindi BA english","kw":["Shakespeare","tragedy","sonnet","blank verse"]},{"id":"romantic-age","t":"The Romantic Age","s":"The Romantic Age (about 1798-1832) valued feeling, imagination, nature and the common person.","n":["It began with 'Lyrical Ballads' (1798) by William Wordsworth and Samuel Taylor Coleridge.","Wordsworth defined poetry as the spontaneous overflow of powerful feelings, using the language of ordinary people.","Coleridge wrote supernatural poems like 'The Rime of the Ancient Mariner'.","Younger Romantics: Lord Byron, P.B. Shelley ('Ode to the West Wind'), John Keats (odes).","Keats's idea of 'negative capability': being comfortable with uncertainty without forcing answers."],"ex":"Compare: neoclassical poets wrote polished verse about city society; Romantics wrote about daffodils, mountains and village people. For example, Wordsworth's poems on rural life show a shift from reason to emotion and nature.","q":"romantic age english literature wordsworth keats in hindi","kw":["Romanticism","Wordsworth","Keats","Lyrical Ballads"]},{"id":"victorian-age","t":"The Victorian Age","s":"The Victorian Age (1837-1901) was the time of Queen Victoria, industry, science and social problems.","n":["The novel became the most popular form: Charles Dickens ('Oliver Twist', 'Great Expectations') showed poverty and child labour.","Other novelists: George Eliot ('Middlemarch'), the Brontë sisters ('Jane Eyre', 'Wuthering Heights'), Thomas Hardy.","Poets: Alfred Tennyson ('In Memoriam'), Robert Browning (dramatic monologues).","Darwin's 'On the Origin of Species' (1859) created a conflict between faith and science, seen in many works.","Dramatic monologue: one character speaks to a silent listener and reveals their true nature."],"ex":"In 'Oliver Twist', an orphan in a workhouse asks for more food and is punished. Dickens uses this scene to criticise how the poor and children were treated in industrial England.","q":"victorian age english literature dickens tennyson browning hindi","kw":["Victorian","Dickens","Tennyson","dramatic monologue"]},{"id":"modernism","t":"Modernism","s":"Modernist writers (about 1900-1940) broke old forms to show a broken, uncertain modern world.","n":["World War I shook beliefs. Writers used fragments, many voices and new styles.","T.S. Eliot's 'The Waste Land' (1922) shows spiritual emptiness through fragments and allusions.","Stream of consciousness: showing the flow of a character's thoughts. James Joyce ('Ulysses', 1922), Virginia Woolf ('Mrs Dalloway').","W.B. Yeats moved from Irish legend to modern themes; Joseph Conrad's 'Heart of Darkness' questions colonialism.","Common features: alienation, irony, free verse, open endings."],"ex":"Old style: 'She felt sad when she remembered her father.' Stream of consciousness: 'Rain again, Papa's umbrella, the black one, where did it go, those Sunday walks, why didn't I call him.' Thoughts jump as they do in a real mind.","q":"modernism in english literature stream of consciousness eliot woolf hindi","kw":["Modernism","stream of consciousness","T.S. Eliot","Virginia Woolf"]},{"id":"indian-writing-english","t":"Indian Writing in English","s":"Indian writers have used English to tell Indian stories, from colonial times to today.","n":["Early figures: Toru Dutt and Sarojini Naidu (poetry). Rabindranath Tagore won the Nobel Prize in 1913 for 'Gitanjali'.","The 1930s trio: Mulk Raj Anand ('Untouchable'), R.K. Narayan ('Swami and Friends'), Raja Rao ('Kanthapura').","Poets after independence: Nissim Ezekiel, Kamala Das, A.K. Ramanujan, Jayanta Mahapatra.","Salman Rushdie's 'Midnight's Children' won the Booker Prize in 1981; Arundhati Roy's 'The God of Small Things' won it in 1997.","Key questions: how to make English carry Indian rhythms, and writing about caste, partition and identity."],"ex":"In 'Untouchable' (1935), Anand follows one day in the life of Bakha, a young sweeper. The single day shows the daily humiliation caused by caste, and ends with possible solutions like Gandhi's message and the flush toilet.","q":"indian writing in english history BA english hindi","kw":["Indian English literature","R.K. Narayan","Mulk Raj Anand","Booker"]},{"id":"phonetics-communication","t":"Phonetics and Communication Skills","s":"Phonetics studies speech sounds; it helps you pronounce English clearly and read dictionary symbols.","n":["English has 26 letters but about 44 sounds in standard British English: about 20 vowels and 24 consonants.","The IPA (International Phonetic Alphabet) gives one symbol per sound, used in dictionaries.","Word stress: one syllable is stronger. 'PHOtograph', 'phoTOgraphy', 'photoGRAPHic'.","Schwa /ə/ is the weak 'uh' sound, the most common vowel: 'about', 'banana'.","Good communication: listen actively, be clear and short, use body language and check understanding."],"ex":"'Record' as a noun: REcord (stress on first syllable) — 'He broke the record.' As a verb: reCORD (stress on second) — 'Please record the song.' Changing stress changes the part of speech.","q":"english phonetics word stress IPA in hindi BA","kw":["phonetics","IPA","word stress","schwa"]}],"pg":[{"id":"classical-criticism","t":"Classical and Neoclassical Criticism","s":"Literary criticism asks what literature is, what it does, and how to judge it.","n":["Plato distrusted poets: art is an imitation of an imitation and stirs emotions.","Aristotle's 'Poetics': mimesis (imitation), plot as the soul of tragedy, hamartia (error), catharsis (purging of pity and fear).","Longinus, 'On the Sublime': great writing comes from great thoughts and strong emotion.","Philip Sidney's 'An Apology for Poetry' defended poetry as teaching and delighting.","Samuel Johnson's 'Preface to Shakespeare' (1765) praised Shakespeare as a poet of nature, true to general human life."],"ex":"Apply Aristotle to Oedipus: a good man of high position, through an error of judgement (hamartia), falls into ruin. The audience feels pity and fear and leaves emotionally cleansed (catharsis). Compare with Bharata's rasa in Indian poetics.","q":"aristotle poetics catharsis hamartia MA english in hindi","kw":["Aristotle","catharsis","hamartia","Sidney"]},{"id":"eliot-new-criticism","t":"T.S. Eliot and New Criticism","s":"New Criticism focused on the text itself through close reading, not the author's life.","n":["Eliot's 'Tradition and the Individual Talent' (1919): a poet must know the past; poetry is an escape from personality.","Objective correlative: a set of objects or events that evokes a specific emotion in the reader.","I.A. Richards's 'Practical Criticism' (1929) tested students on unnamed poems and encouraged close reading.","New Critics (Cleanth Brooks, John Crowe Ransom) studied irony, paradox, ambiguity and unity.","'Intentional fallacy' (Wimsatt and Beardsley): meaning should not be judged by the author's intention."],"ex":"Close reading a line: note every word choice, image, sound and contradiction, then show how they build one unified meaning. You do not ask what the poet 'wanted'; you show what the words do on the page.","q":"T S Eliot tradition and individual talent new criticism MA english","kw":["New Criticism","close reading","objective correlative","Eliot"]},{"id":"structuralism-poststructuralism","t":"Structuralism and Poststructuralism","s":"These theories study how language and systems of signs create meaning.","n":["Ferdinand de Saussure: a sign = signifier (sound/word) + signified (concept). The link is arbitrary.","Meaning comes from difference: 'cat' means something because it is not 'bat' or 'cap'.","Structuralists (Lévi-Strauss, early Barthes) looked for common structures in myths and stories.","Jacques Derrida's deconstruction shows that texts contain contradictions and meaning is always deferred.","Roland Barthes's 'The Death of the Author' (1967): the reader, not the author, makes meaning."],"ex":"Binary pairs: good/evil, man/woman, West/East. Deconstruction shows that one term is usually privileged and the other pushed down, and that each depends on the other. Read a text by finding such pairs and reversing their hierarchy.","q":"structuralism saussure derrida deconstruction explained in hindi","kw":["structuralism","Saussure","deconstruction","Derrida"]},{"id":"marxist-feminist","t":"Marxist and Feminist Criticism","s":"These approaches study how class and gender shape literature and its readers.","n":["Marxist criticism: literature reflects economic base and class struggle. Key terms: ideology, base and superstructure.","Thinkers: Georg Lukács, Raymond Williams, Terry Eagleton.","Feminist criticism: how women are shown, and how women writers were ignored.","Simone de Beauvoir's 'The Second Sex' (1949): 'woman' as 'the Other'. Virginia Woolf's 'A Room of One's Own' (1929) on women's need for money and space.","Elaine Showalter's 'gynocriticism' studies women's writing as its own tradition."],"ex":"Read 'Jane Eyre' two ways. Marxist: Jane's position as a poor governess shows class limits. Feminist: Jane's demand to be treated as an equal shows a woman claiming her voice; later critics also studied the 'madwoman' Bertha as a silenced figure.","q":"marxist feminist literary criticism MA english hindi","kw":["Marxist criticism","feminism","ideology","Showalter"]},{"id":"postcolonial","t":"Postcolonial Studies","s":"Postcolonial criticism studies how colonialism shaped literature, identity and knowledge.","n":["Edward Said's 'Orientalism' (1978): the West built a false image of the East as backward and exotic.","Gayatri Chakravorty Spivak, 'Can the Subaltern Speak?': the most oppressed are spoken for and rarely heard.","Homi K. Bhabha: hybridity, mimicry and the 'third space' of cultural mixing.","Ngũgĩ wa Thiong'o argued for writing in African languages ('Decolonising the Mind').","Chinua Achebe's 'Things Fall Apart' (1958) tells the story of colonialism from an African view."],"ex":"Read a colonial-era English novel set in India and ask: who speaks, who is silent, how are Indians described, and whose land and labour fund the comfort of the English characters? This is a postcolonial reading.","q":"postcolonial theory said spivak bhabha explained hindi","kw":["postcolonialism","Said","Spivak","subaltern"]},{"id":"american-literature","t":"American Literature","s":"American literature grew from colonial writing into a strong voice on freedom, race and the American Dream.","n":["19th century: Emerson and Thoreau (Transcendentalism), Hawthorne, Melville ('Moby-Dick'), Mark Twain ('Huckleberry Finn').","Poets: Walt Whitman ('Leaves of Grass', free verse) and Emily Dickinson (short, unusual lyrics).","20th century: F. Scott Fitzgerald ('The Great Gatsby', 1925), Ernest Hemingway, William Faulkner.","Drama: Arthur Miller ('Death of a Salesman'), Tennessee Williams.","African American writing: Harlem Renaissance (Langston Hughes), Ralph Ellison, Toni Morrison (Nobel 1993)."],"ex":"'The Great Gatsby' studies the American Dream: Gatsby becomes rich to win back Daisy, but money cannot buy the past or social acceptance. The novel shows the dream turning hollow in the wealthy 1920s.","q":"american literature history MA english in hindi","kw":["American literature","Whitman","Great Gatsby","Toni Morrison"]},{"id":"linguistics-elt","t":"Linguistics and English Language Teaching","s":"Linguistics studies language scientifically; ELT applies it to teaching English well.","n":["Levels: phonology (sounds), morphology (word parts), syntax (sentence structure), semantics (meaning), pragmatics (meaning in context).","Noam Chomsky proposed that humans have an inborn capacity for language.","Methods: Grammar-Translation (rules and translation), Direct Method, Communicative Language Teaching (real use).","Stephen Krashen: we acquire language through 'comprehensible input', input slightly above our level.","In India, using the mother tongue as support can help first-generation learners understand English better."],"ex":"Teaching 'past tense' communicatively: instead of only drilling rules, pairs ask, 'What did you do on Sunday?' and answer with real experiences. The rule is noticed through use, then summarised by the teacher.","q":"linguistics and ELT methods MA english hindi","kw":["linguistics","ELT","Chomsky","Krashen"]}],"phd":[{"id":"research-methodology-literature","t":"Research Methodology in English Studies","s":"Literary research builds a clear argument about texts using evidence, theory and earlier scholarship.","n":["Start with a research question, not just a topic: 'How does X represent Y?'","Choose a method: close reading, historical, comparative, theoretical, archival, or interviews for language studies.","Primary sources are the literary texts; secondary sources are criticism and theory.","A thesis statement is your main claim. Every chapter should support it.","Shodhganga hosts Indian PhD theses for free; JSTOR and Project MUSE need access, often through a university library."],"ex":"Topic: 'Women in Partition fiction.' Better research question: 'How do Partition novels by Indian women writers use silence to represent violence?' This is focused, arguable and can be tested by close reading of chosen novels.","q":"research methodology english literature PhD thesis statement","kw":["research question","thesis statement","Shodhganga"]},{"id":"literature-review-gap","t":"Literature Review and Research Gap","s":"A literature review shows what scholars have already said and where your work fits.","n":["Read and group earlier studies by theme, method or approach, not just one by one.","Summarise and also evaluate: what is strong, what is missing.","The research gap is what has not been studied, or studied with a different text, theory or region.","Keep notes with full citation details from day one.","Free tools like Zotero help store and cite sources."],"ex":"If many studies read a novel through feminism and postcolonialism but none through ecocriticism, you can write: 'Existing scholarship has focused on gender and nation; the novel's treatment of land and rivers remains largely unexamined.' That sentence states your gap.","q":"how to write literature review research gap PhD","kw":["literature review","research gap","Zotero"]},{"id":"mla-citation-plagiarism","t":"MLA Style, Citation and Academic Integrity","s":"Correct citation gives credit to others and lets readers check your sources.","n":["MLA style is standard in English studies: in-text (Author page) and a Works Cited list.","Quote exactly, paraphrase in your own words and structure, and cite both.","Plagiarism includes copying without credit and reusing your own published work without saying so.","In India, UGC's 2018 regulations set levels of similarity and penalties for plagiarism in research.","Check the current MLA Handbook edition your university follows."],"ex":"In-text: (Narayan 45). Works Cited entry pattern: Narayan, R. K. Swami and Friends. Publisher, Year. Fill in the publisher and year of the edition you actually used, and keep the same format for every entry.","q":"MLA format citation works cited explained","kw":["MLA","citation","plagiarism","UGC"]},{"id":"frontier-areas-english","t":"Frontier Areas in English Studies","s":"New fields connect literature with environment, technology, translation and other disciplines.","n":["Ecocriticism: literature and nature, climate and environment.","Digital humanities: computer analysis of large text collections, digital archives.","Translation studies: Indian bhasha literature in English translation, politics of translation.","Other areas: disability studies, Dalit literature in English translation, graphic novels, diaspora studies, medical humanities.","Interdisciplinary work needs reading in both fields; involve a co-guide if possible."],"ex":"A digital humanities project: collect copyright-free 19th-century Indian English novels from free archives, count words like 'native' and 'home' with free software, then explain what the patterns reveal about identity. Numbers support, not replace, close reading.","q":"ecocriticism digital humanities translation studies english research","kw":["ecocriticism","digital humanities","translation studies"]},{"id":"thesis-writing-publishing","t":"Thesis Writing and Publishing","s":"A thesis is a long, organised argument; publishing papers shares your findings with scholars.","n":["Common structure: introduction, literature review, theory/method, analysis chapters, conclusion, works cited.","Write a little every day. Revise each chapter with your supervisor's comments.","Turn one chapter into a journal article for practice.","Prefer peer-reviewed journals in the UGC-CARE list; avoid predatory journals that charge fees without real review.","Present at seminars and conferences to get feedback before submission."],"ex":"Chapter plan for a thesis on R.K. Narayan's Malgudi: Ch 1 Introduction and gap; Ch 2 Theory of small-town space; Ch 3 Early novels; Ch 4 Later novels; Ch 5 Short stories; Ch 6 Conclusion and future scope.","q":"how to write PhD thesis chapters publish research paper UGC CARE","kw":["thesis writing","publication","UGC-CARE","peer review"]}]},"order":13},{"id":"sanskrit","name":"Sanskrit","nameHi":"संस्कृत","group":"languages","blurb":"संस्कृत भाषा का व्याकरण, अनुवाद, साहित्य, वेद और दर्शन, सरल हिंदी में समझाया गया।","levels":{"6-8":[{"id":"varnamala","t":"संस्कृत वर्णमाला","s":"संस्कृत देवनागरी लिपि में लिखी जाती है और इसके वर्ण स्वर और व्यंजन में बँटे हैं।","n":["स्वर: अ आ इ ई उ ऊ ऋ ॠ ऌ ए ऐ ओ औ। ह्रस्व स्वर छोटे (अ, इ, उ), दीर्घ स्वर लंबे (आ, ई, ऊ) हैं।","व्यंजन: क-वर्ग, च-वर्ग, ट-वर्ग, त-वर्ग, प-वर्ग (हर वर्ग में 5), अंतःस्थ (य र ल व), ऊष्म (श ष स ह)।","अनुस्वार (ं) और विसर्ग (ः) अयोगवाह कहलाते हैं। संस्कृत में विसर्ग बहुत आता है: रामः, बालकः।","हलन्त (्) का अर्थ है व्यंजन में स्वर नहीं है: वाक्, जगत्।","उच्चारण स्थान: कण्ठ (क), तालु (च), मूर्धा (ट), दन्त (त), ओष्ठ (प)।"],"ex":"'रामः' को तोड़ें: र् + आ + म् + अः। इसमें दो व्यंजन (र्, म्), एक दीर्घ स्वर (आ), एक ह्रस्व स्वर (अ) और अंत में विसर्ग है। 'जगत्' में अंतिम 'त्' हलन्त है।","q":"संस्कृत वर्णमाला स्वर व्यंजन उच्चारण स्थान class 6","kw":["वर्णमाला","स्वर","व्यंजन","विसर्ग"]},{"id":"balak-shabd-roop","t":"शब्द रूप: बालक (अकारान्त पुल्लिङ्ग)","s":"संस्कृत में संज्ञा का रूप विभक्ति और वचन के अनुसार बदलता है।","n":["संस्कृत में 7 विभक्तियाँ और सम्बोधन हैं, और तीन वचन: एकवचन, द्विवचन, बहुवचन।","प्रथमा: बालकः बालकौ बालकाः। द्वितीया: बालकम् बालकौ बालकान्। तृतीया: बालकेन बालकाभ्याम् बालकैः।","चतुर्थी: बालकाय बालकाभ्याम् बालकेभ्यः। पञ्चमी: बालकात् बालकाभ्याम् बालकेभ्यः।","षष्ठी: बालकस्य बालकयोः बालकानाम्। सप्तमी: बालके बालकयोः बालकेषु। सम्बोधन: हे बालक!","राम, देव, छात्र, गज जैसे सभी अकारान्त पुल्लिङ्ग शब्द इसी तरह चलते हैं।"],"ex":"'छात्र' के रूप बालक जैसे: 'छात्रः पठति' (एक छात्र पढ़ता है), 'छात्रौ पठतः' (दो छात्र), 'छात्राः पठन्ति' (कई छात्र)। 'छात्रस्य पुस्तकम्' = छात्र की पुस्तक (षष्ठी)।","q":"बालक शब्द रूप संस्कृत अकारान्त पुल्लिंग","kw":["शब्द रूप","बालक","विभक्ति","वचन"]},{"id":"lata-phal-shabd-roop","t":"शब्द रूप: लता (स्त्रीलिङ्ग) और फल (नपुंसकलिङ्ग)","s":"संस्कृत में तीन लिङ्ग हैं; स्त्रीलिङ्ग और नपुंसकलिङ्ग शब्दों के रूप अलग चलते हैं।","n":["लता (आकारान्त स्त्रीलिङ्ग) प्रथमा: लता लते लताः। द्वितीया: लताम् लते लताः।","लता तृतीया: लतया लताभ्याम् लताभिः। षष्ठी: लतायाः लतयोः लतानाम्। सप्तमी: लतायाम् लतयोः लतासु।","फल (अकारान्त नपुंसकलिङ्ग) प्रथमा और द्वितीया: फलम् फले फलानि।","फल के बाकी रूप बालक जैसे: फलेन, फलाय, फलात्, फलस्य, फले।","बाला, माला, छात्रा लता जैसे; वन, पुस्तक, मित्र (नपुं.) फल जैसे चलते हैं।"],"ex":"'वने फलानि सन्ति' = वन में फल हैं (वने सप्तमी एकवचन, फलानि प्रथमा बहुवचन)। 'बालिका मालां धारयति' = बालिका माला पहनती है (मालाम् द्वितीया, म् अनुस्वार बन गया)।","q":"लता फल शब्द रूप संस्कृत class 6 7","kw":["लता","फल","स्त्रीलिङ्ग","नपुंसकलिङ्ग"]},{"id":"asmad-yushmad","t":"सर्वनाम: अस्मद् और युष्मद्","s":"अस्मद् (मैं) और युष्मद् (तुम) सबसे ज़्यादा प्रयोग होने वाले संस्कृत सर्वनाम हैं।","n":["अस्मद् प्रथमा: अहम् आवाम् वयम् (मैं, हम दोनों, हम सब)।","युष्मद् प्रथमा: त्वम् युवाम् यूयम् (तुम, तुम दोनों, तुम सब)।","षष्ठी (का/की/के): मम (मेरा), तव (तुम्हारा), अस्माकम् (हमारा), युष्माकम् (तुम सबका)।","चतुर्थी (के लिए): मह्यम् (मेरे लिए), तुभ्यम् (तुम्हारे लिए)। तृतीया: मया (मेरे द्वारा), त्वया।","सर्वनाम 'तत्' पुल्लिङ्ग: सः तौ ते (वह, वे दोनों, वे सब)। स्त्री.: सा ते ताः।"],"ex":"'मम नाम सीता। तव नाम किम्?' = मेरा नाम सीता है। तुम्हारा नाम क्या है? उत्तर: 'मम नाम गीता।' 'अहं विद्यालयं गच्छामि, त्वं कुत्र गच्छसि?' = मैं विद्यालय जाती हूँ, तुम कहाँ जाते हो?","q":"अस्मद् युष्मद् शब्द रूप संस्कृत सर्वनाम","kw":["अस्मद्","युष्मद्","सर्वनाम","तत्"]},{"id":"path-lat-lakar","t":"धातु रूप: पठ् (लट् लकार)","s":"धातु क्रिया का मूल है; लट् लकार वर्तमान काल बताता है।","n":["संस्कृत में तीन पुरुष हैं: प्रथम पुरुष (वह), मध्यम पुरुष (तुम), उत्तम पुरुष (मैं)।","पठ् लट् प्रथम पुरुष: पठति पठतः पठन्ति।","मध्यम पुरुष: पठसि पठथः पठथ। उत्तम पुरुष: पठामि पठावः पठामः।","कर्ता जिस पुरुष और वचन का हो, क्रिया भी उसी की होती है: अहं पठामि, त्वं पठसि, सः पठति।","गम् (गच्छ), खाद्, लिख्, वद् भी ऐसे ही चलते हैं: गच्छति, खादति, लिखति, वदति।"],"ex":"रिक्त स्थान: 'वयं संस्कृतं ___।' कर्ता 'वयम्' उत्तम पुरुष बहुवचन है, इसलिए 'पठामः'। पूरा वाक्य: 'वयं संस्कृतं पठामः' = हम संस्कृत पढ़ते हैं।","q":"पठ् धातु रूप लट् लकार संस्कृत class 6","kw":["धातु रूप","लट् लकार","पठ्","पुरुष"]},{"id":"lrit-lakar","t":"लृट् लकार (भविष्यत् काल)","s":"लृट् लकार आने वाले समय की क्रिया बताता है।","n":["पठ् लृट्: पठिष्यति पठिष्यतः पठिष्यन्ति।","मध्यम: पठिष्यसि पठिष्यथः पठिष्यथ। उत्तम: पठिष्यामि पठिष्यावः पठिष्यामः।","पहचान: 'स्य' या 'ष्य' बीच में आता है: गमिष्यति, खादिष्यति, लेखिष्यति, द्रक्ष्यति (देखेगा)।","समय बताने वाले शब्द: श्वः (आने वाला कल), परश्वः (परसों)।","अद्य (आज), ह्यः (बीता हुआ कल) भी याद रखें।"],"ex":"हिंदी: 'मैं कल मंदिर जाऊँगा।' संस्कृत: 'अहं श्वः मन्दिरं गमिष्यामि।' यहाँ गम् धातु, लृट् लकार, उत्तम पुरुष, एकवचन है।","q":"लृट् लकार भविष्यत् काल संस्कृत धातु रूप","kw":["लृट् लकार","भविष्यत्","श्वः"]},{"id":"sankhya","t":"संख्या (गिनती)","s":"संस्कृत में संख्याएँ भी लिङ्ग के अनुसार बदल सकती हैं।","n":["1 से 10 (पुल्लिङ्ग): एकः, द्वौ, त्रयः, चत्वारः, पञ्च, षट्, सप्त, अष्ट (अष्टौ), नव, दश।","एक, द्वि, त्रि, चतुर् तीनों लिङ्गों में अलग रूप लेते हैं। जैसे स्त्रीलिङ्ग: एका, द्वे, तिस्रः, चतस्रः।","पञ्च से आगे की संख्याएँ तीनों लिङ्गों में एक जैसी रहती हैं।","11-20: एकादश, द्वादश, त्रयोदश, चतुर्दश, पञ्चदश, षोडश, सप्तदश, अष्टादश, नवदश/एकोनविंशतिः, विंशतिः।","क्रम: प्रथमः (पहला), द्वितीयः, तृतीयः, चतुर्थः।"],"ex":"'त्रयः बालकाः' = तीन बालक (पुल्लिङ्ग)। 'तिस्रः बालिकाः' = तीन बालिकाएँ (स्त्रीलिङ्ग)। 'त्रीणि फलानि' = तीन फल (नपुंसकलिङ्ग)। एक ही संख्या तीन रूपों में।","q":"संस्कृत संख्या 1 से 100 लिङ्ग अनुसार","kw":["संख्या","गिनती","लिङ्ग"]},{"id":"saral-anuvad","t":"सरल अनुवाद (हिंदी से संस्कृत)","s":"अनुवाद के लिए कर्ता, कर्म और क्रिया का सही रूप चुनना होता है।","n":["पहले कर्ता पहचानें और उसका पुरुष-वचन तय करें।","कर्म (क्या, किसे) द्वितीया विभक्ति में रखें: पुस्तकम्, जलम्, विद्यालयम्।","क्रिया कर्ता के पुरुष-वचन के अनुसार, सही लकार में रखें।","संस्कृत में शब्द-क्रम बदलने से भी अर्थ नहीं बदलता, क्योंकि विभक्ति अर्थ बताती है।","कुछ अव्यय: अत्र (यहाँ), तत्र (वहाँ), कुत्र (कहाँ), अपि (भी), च (और), न (नहीं)।"],"ex":"'राम विद्यालय जाता है।' कर्ता: रामः (प्रथम पुरुष एकवचन), कर्म: विद्यालयम् (द्वितीया), क्रिया: गच्छति। अनुवाद: 'रामः विद्यालयं गच्छति।' 'विद्यालयं रामः गच्छति' भी सही है।","q":"हिंदी से संस्कृत अनुवाद नियम class 7 8","kw":["अनुवाद","कर्ता","कर्म","अव्यय"]}],"9-10":[{"id":"swar-sandhi","t":"स्वर संधि","s":"दो स्वरों के पास आने से होने वाला बदलाव स्वर संधि (अच् संधि) है।","n":["दीर्घ (अकः सवर्णे दीर्घः): समान स्वर मिलकर दीर्घ। हिम + आलयः = हिमालयः।","गुण: अ/आ + इ/ई = ए; अ/आ + उ/ऊ = ओ। देव + इन्द्रः = देवेन्द्रः, महा + उत्सवः = महोत्सवः।","वृद्धि: अ/आ + ए/ऐ = ऐ; अ/आ + ओ/औ = औ। सदा + एव = सदैव, वन + ओषधिः = वनौषधिः।","यण् (इको यणचि): इ→य्, उ→व्, ऋ→र् जब आगे अलग स्वर हो। इति + आदि = इत्यादि, सु + आगतम् = स्वागतम्।","अयादि: ए→अय्, ऐ→आय्, ओ→अव्, औ→आव्। ने + अनम् = नयनम्, पो + अनः = पवनः।"],"ex":"'गणेशः' का संधि-विच्छेद: गण + ईशः। अ + ई = ए, यह गुण संधि है। 'प्रत्येकम्' = प्रति + एकम्: इ के आगे अलग स्वर ए है, तो इ → य्, यण् संधि।","q":"संस्कृत स्वर संधि दीर्घ गुण वृद्धि यण अयादि class 10","kw":["स्वर संधि","गुण","वृद्धि","यण्"]},{"id":"vyanjan-visarg-sandhi","t":"व्यंजन और विसर्ग संधि","s":"व्यंजन (हल्) संधि और विसर्ग संधि में व्यंजन या विसर्ग बदलता है।","n":["जश्त्व: पहले वर्ण का तीसरा अक्षर बनता है। वाक् + ईशः = वागीशः, जगत् + ईशः = जगदीशः।","श्चुत्व: स/त-वर्ग का श/च-वर्ग से मेल। सत् + चित् = सच्चित्।","अनुस्वार: पद के अंत का म् व्यंजन से पहले अनुस्वार बनता है: हरिम् + वन्दे = हरिं वन्दे।","विसर्ग का ओ: मनः + रथः = मनोरथः। विसर्ग का स्: नमः + ते = नमस्ते।","विसर्ग का र्: निः + धनः = निर्धनः, दुः + उपयोगः = दुरुपयोगः।"],"ex":"'उल्लासः' का विच्छेद: उत् + लासः। त् के बाद ल आया तो त् भी ल् बन गया (लत्व/परसवर्ण)। 'नमस्कारः' = नमः + कारः, विसर्ग स् बना।","q":"संस्कृत व्यंजन संधि विसर्ग संधि class 10","kw":["व्यंजन संधि","विसर्ग संधि","जश्त्व"]},{"id":"samas-sanskrit","t":"समास","s":"अनेक पदों को मिलाकर एक पद बनाना समास है; बीच की विभक्तियाँ हट जाती हैं।","n":["अव्ययीभाव: पहला पद अव्यय। यथाशक्ति (शक्तिम् अनतिक्रम्य), उपगङ्गम् (गङ्गायाः समीपम्)।","तत्पुरुष: बाद वाला पद प्रधान। राजपुरुषः = राज्ञः पुरुषः (षष्ठी तत्पुरुष)।","कर्मधारय: विशेषण-विशेष्य। नीलोत्पलम् = नीलम् उत्पलम्। द्विगु: पहला पद संख्या। त्रिलोकी, पञ्चवटी।","द्वन्द्व: सभी पद प्रधान, 'च' से जुड़े। रामलक्ष्मणौ = रामः च लक्ष्मणः च।","बहुव्रीहि: अन्य पद प्रधान। पीताम्बरः = पीतम् अम्बरं यस्य सः (कृष्णः)।"],"ex":"'चक्रपाणिः' का विग्रह: चक्रं पाणौ यस्य सः, अर्थात् विष्णु। यहाँ न 'चक्र' प्रधान है न 'पाणि', बल्कि तीसरा व्यक्ति (विष्णु)। इसलिए बहुव्रीहि समास।","q":"संस्कृत समास विग्रह class 10","kw":["समास","विग्रह","द्वन्द्व","बहुव्रीहि"]},{"id":"karak-upapad-vibhakti","t":"कारक और उपपद विभक्ति","s":"कारक क्रिया से संबंध बताते हैं; कुछ विशेष शब्दों के साथ तय विभक्ति लगती है जिसे उपपद विभक्ति कहते हैं।","n":["कारक-विभक्ति: कर्ता-प्रथमा, कर्म-द्वितीया, करण-तृतीया, सम्प्रदान-चतुर्थी, अपादान-पञ्चमी, अधिकरण-सप्तमी। सम्बन्ध में षष्ठी।","द्वितीया: अभितः, परितः, उभयतः, प्रति के साथ। 'ग्रामं परितः वृक्षाः सन्ति।'","तृतीया: सह, साकम्, अलम् के साथ। 'पुत्रेण सह पिता गच्छति।'","चतुर्थी: नमः, स्वस्ति, स्वाहा, रुच् धातु के साथ। 'गुरवे नमः', 'बालकाय मोदकं रोचते।'","पञ्चमी: भी (डरना), बहिः, ऋते के साथ। 'बालकः सिंहात् बिभेति।' 'विना' के साथ द्वितीया, तृतीया या पञ्चमी।"],"ex":"रिक्त स्थान: '___ नमः।' (शिव) — नमः के साथ चतुर्थी आती है, इसलिए 'शिवाय नमः'। '___ सह सीता वनं गच्छति।' (राम) — सह के साथ तृतीया: 'रामेण सह सीता वनं गच्छति।'","q":"उपपद विभक्ति संस्कृत class 10","kw":["कारक","उपपद विभक्ति","विभक्ति"]},{"id":"pratyay-ktva-lyap-tumun","t":"प्रत्यय: क्त्वा, ल्यप्, तुमुन्, क्त, क्तवतु","s":"धातु के बाद जुड़कर नया शब्द बनाने वाले अंश प्रत्यय (कृत् प्रत्यय) हैं।","n":["क्त्वा (करके): बिना उपसर्ग वाली धातु से। पठ् → पठित्वा, गम् → गत्वा, कृ → कृत्वा।","ल्यप् (करके): उपसर्ग वाली धातु से। आ + गम् → आगम्य, वि + ज्ञा → विज्ञाय।","तुमुन् (के लिए): पठ् → पठितुम्, गम् → गन्तुम्, दृश् → द्रष्टुम्।","क्त (भूतकाल विशेषण): गतः, पठितः, कृतः। क्तवतु (कर्ता के साथ): गतवान्, पठितवान्।","क्तवतु का स्त्रीलिङ्ग: गतवती, पठितवती।"],"ex":"'छात्र पढ़कर खेलने के लिए गया।' पढ़कर = पठित्वा (क्त्वा), खेलने के लिए = क्रीडितुम् (तुमुन्), गया = गतवान् (क्तवतु)। अनुवाद: 'छात्रः पठित्वा क्रीडितुं गतवान्।'","q":"क्त्वा ल्यप् तुमुन् क्त क्तवतु प्रत्यय संस्कृत class 10","kw":["प्रत्यय","क्त्वा","ल्यप्","तुमुन्"]},{"id":"lang-lot-vidhiling","t":"लङ्, लोट् और विधिलिङ् लकार","s":"लङ् बीते समय, लोट् आज्ञा और विधिलिङ् 'चाहिए' का अर्थ बताता है।","n":["लङ् (भूतकाल), पठ्: अपठत् अपठताम् अपठन्; अपठः अपठतम् अपठत; अपठम् अपठाव अपठाम। पहचान: शुरू में 'अ'।","लोट् (आज्ञा, प्रार्थना), पठ्: पठतु पठताम् पठन्तु; पठ पठतम् पठत; पठानि पठाव पठाम।","विधिलिङ् (चाहिए), पठ्: पठेत् पठेताम् पठेयुः; पठेः पठेतम् पठेत; पठेयम् पठेव पठेम।","गम् लङ्: अगच्छत्। लोट्: गच्छतु, गच्छ। विधिलिङ्: गच्छेत्।","पाँच मुख्य लकार: लट्, लृट्, लङ्, लोट्, विधिलिङ्।"],"ex":"तीन वाक्य: 'सः ह्यः ग्रामम् अगच्छत्' (वह कल गाँव गया — लङ्)। 'त्वं गृहं गच्छ' (तुम घर जाओ — लोट्)। 'छात्रः प्रतिदिनं पठेत्' (छात्र को रोज़ पढ़ना चाहिए — विधिलिङ्)।","q":"लङ् लोट् विधिलिङ् लकार धातु रूप संस्कृत class 9","kw":["लकार","लङ्","लोट्","विधिलिङ्"]},{"id":"subhashit","t":"सुभाषित (सुंदर वचन)","s":"सुभाषित छोटे, अर्थपूर्ण श्लोक हैं जो जीवन की सीख देते हैं।","n":["सुभाषित का अर्थ है 'अच्छी तरह कहा गया'। ये पंचतंत्र, हितोपदेश, नीतिशतक जैसे ग्रंथों में मिलते हैं।","'विद्या ददाति विनयं, विनयाद् याति पात्रताम्' — विद्या विनम्रता देती है, विनम्रता से योग्यता आती है (हितोपदेश)।","'सत्यमेव जयते' — सत्य की ही जीत होती है (मुण्डक उपनिषद्)। यह भारत का राष्ट्रीय आदर्श वाक्य है।","'उदारचरितानां तु वसुधैव कुटुम्बकम्' — उदार लोगों के लिए पूरी धरती परिवार है।","श्लोक का अर्थ लिखते समय पहले अन्वय (गद्य क्रम) बनाएँ, फिर हिंदी अर्थ।"],"ex":"श्लोक: 'अयं निजः परो वेति गणना लघुचेतसाम्।' अन्वय: 'अयं निजः वा परः इति गणना लघुचेतसाम् (भवति)।' अर्थ: 'यह अपना है, वह पराया' — ऐसी गिनती छोटे मन वाले करते हैं।","q":"संस्कृत सुभाषित अर्थ सहित class 9 10","kw":["सुभाषित","श्लोक","अन्वय","नीति"]},{"id":"apathit-avbodhan","t":"अपठित गद्यांश और पत्र लेखन","s":"अनदेखा संस्कृत गद्यांश पढ़कर प्रश्नों के उत्तर देना और संस्कृत में पत्र पूरा करना।","n":["पहले प्रश्न पढ़ें, फिर गद्यांश। प्रश्न में जो शब्द हैं, गद्यांश में वही खोजें।","एकपदेन उत्तर (एक शब्द) और पूर्णवाक्येन उत्तर (पूरा वाक्य) अलग-अलग माँगे जाते हैं।","पूर्ण वाक्य में उत्तर देते समय प्रश्नवाचक शब्द (कः, किम्, कुत्र) की जगह सही उत्तर रखें।","पत्र में संबोधन: 'पूज्याः पितृचरणाः', 'प्रिय मित्र'। अंत में 'भवदीयः' या 'भवतः पुत्रः'।","पत्र में अक्सर मञ्जूषा (शब्द-सूची) से रिक्त स्थान भरने होते हैं।"],"ex":"गद्यांश: 'एकस्मिन् वने सिंहः वसति स्म।' प्रश्न: 'सिंहः कुत्र वसति स्म?' एकपदेन: 'वने'। पूर्णवाक्येन: 'सिंहः एकस्मिन् वने वसति स्म।' (कुत्र की जगह 'एकस्मिन् वने' रखा।)","q":"संस्कृत अपठित गद्यांश पत्र लेखन class 10","kw":["अपठित गद्यांश","पत्र लेखन","मञ्जूषा"]}],"11-12":[{"id":"ramayan-mahabharat","t":"रामायण और महाभारत","s":"रामायण और महाभारत संस्कृत के दो महान इतिहास-काव्य (आर्ष महाकाव्य) हैं।","n":["रामायण: महर्षि वाल्मीकि, 'आदिकाव्य'; वाल्मीकि 'आदिकवि'। 7 काण्ड, लगभग 24,000 श्लोक।","महाभारत: महर्षि वेदव्यास, 18 पर्व, लगभग एक लाख श्लोक; इसे 'शतसाहस्री संहिता' भी कहते हैं।","भगवद्गीता महाभारत के भीष्मपर्व में है: 18 अध्याय, लगभग 700 श्लोक।","इनका मुख्य छंद अनुष्टुप् है।","बाद के कई काव्यों और नाटकों की कथाएँ इन्हीं से ली गई हैं।"],"ex":"गीता (2.47) का प्रसिद्ध श्लोक: 'कर्मण्येवाधिकारस्ते मा फलेषु कदाचन।' अर्थ: तुम्हारा अधिकार केवल कर्म करने में है, फल में कभी नहीं। संधि: कर्मणि + एव + अधिकारः + ते।","q":"रामायण महाभारत परिचय संस्कृत साहित्य class 11","kw":["रामायण","महाभारत","वाल्मीकि","गीता"]},{"id":"kalidas","t":"महाकवि कालिदास","s":"कालिदास संस्कृत के सबसे प्रसिद्ध कवि और नाटककार हैं।","n":["नाटक: अभिज्ञानशाकुन्तलम्, विक्रमोर्वशीयम्, मालविकाग्निमित्रम्।","महाकाव्य: रघुवंशम्, कुमारसम्भवम्। खण्डकाव्य/गीतिकाव्य: मेघदूतम्, ऋतुसंहारम्।","'उपमा कालिदासस्य' — उपमा अलंकार के प्रयोग में कालिदास सबसे श्रेष्ठ माने जाते हैं।","मेघदूत में एक यक्ष मेघ (बादल) से अपनी पत्नी तक संदेश भेजता है। इसमें मन्दाक्रान्ता छंद है।","रघुवंश, कुमारसम्भव और मेघदूत को 'लघुत्रयी' कहा जाता है।"],"ex":"अभिज्ञानशाकुन्तलम् की कथा: राजा दुष्यन्त और शकुन्तला का विवाह, दुर्वासा के शाप से राजा का भूलना, अँगूठी (अभिज्ञान = पहचान) मिलने पर स्मृति लौटना और अंत में मिलन। नाम इसी अँगूठी से जुड़ा है।","q":"कालिदास की रचनाएँ अभिज्ञानशाकुन्तलम् मेघदूतम्","kw":["कालिदास","शाकुन्तलम्","मेघदूतम्","लघुत्रयी"]},{"id":"sanskrit-natak-gadya","t":"संस्कृत नाटक और गद्य साहित्य","s":"संस्कृत में सुंदर नाटक और कठिन, अलंकृत गद्य काव्य दोनों लिखे गए।","n":["भास: स्वप्नवासवदत्तम्। शूद्रक: मृच्छकटिकम् (आम लोगों का जीवन)। भवभूति: उत्तररामचरितम् (करुण रस)।","विशाखदत्त: मुद्राराक्षसम् (चाणक्य की राजनीति)। हर्ष: रत्नावली, नागानन्द।","गद्य: बाणभट्ट की कादम्बरी और हर्षचरितम्; दण्डी का दशकुमारचरितम्; सुबन्धु की वासवदत्ता।","'बाणोच्छिष्टं जगत्सर्वम्' — कहा जाता है कि बाण ने किसी भी विषय को अछूता नहीं छोड़ा।","नाटक के अंग: नान्दी (मंगलाचरण), सूत्रधार, प्रस्तावना, अंक, भरतवाक्य।"],"ex":"'मृच्छकटिकम्' का अर्थ है 'मिट्टी की छोटी गाड़ी'। नायक चारुदत्त गरीब ब्राह्मण है। राजाओं के बजाय आम लोग, चोर, जुआरी इसमें पात्र हैं, इसलिए यह सामाजिक नाटक माना जाता है।","q":"संस्कृत नाटक भास भवभूति बाणभट्ट कादम्बरी","kw":["नाटक","बाणभट्ट","भवभूति","मृच्छकटिकम्"]},{"id":"neeti-katha","t":"नीति कथा: पञ्चतन्त्र और हितोपदेश","s":"पञ्चतन्त्र और हितोपदेश पशु-पक्षियों की कहानियों से जीवन और व्यवहार की सीख देते हैं।","n":["पञ्चतन्त्र के लेखक विष्णुशर्मा माने जाते हैं। उन्होंने राजकुमारों को कहानियों से नीति सिखाई।","पाँच तन्त्र: मित्रभेद, मित्रसम्प्राप्ति, काकोलूकीय, लब्धप्रणाश, अपरीक्षितकारक।","हितोपदेश: नारायण पण्डित; पञ्चतन्त्र पर आधारित, चार भाग।","कहानी के बीच में नीति श्लोक आते हैं जो सीख को याद करने लायक बनाते हैं।","पञ्चतन्त्र का अनुवाद दुनिया की बहुत-सी भाषाओं में हुआ।"],"ex":"बंदर और मगरमच्छ की कथा (लब्धप्रणाश): मगर बंदर का दिल लेने के लिए उसे पीठ पर ले जाता है। बंदर कहता है 'दिल तो पेड़ पर रह गया', और लौटकर बच जाता है। सीख: संकट में बुद्धि से काम लो।","q":"पञ्चतन्त्र हितोपदेश विष्णुशर्मा संस्कृत कथा","kw":["पञ्चतन्त्र","हितोपदेश","नीति कथा"]},{"id":"chhand-sanskrit","t":"संस्कृत छन्द","s":"संस्कृत श्लोक तय नियम वाले छन्दों में लिखे जाते हैं; वर्णों का लघु-गुरु क्रम महत्वपूर्ण है।","n":["लघु: ह्रस्व स्वर (अ, इ, उ)। गुरु: दीर्घ स्वर, या अनुस्वार/विसर्ग वाला, या संयुक्त व्यंजन से पहले का वर्ण।","अनुष्टुप्: 4 पाद, हर पाद में 8 अक्षर। हर पाद में पाँचवाँ लघु, छठा गुरु; सातवाँ दूसरे-चौथे पाद में लघु।","वर्णिक छन्द गणों से पहचाने जाते हैं: य, म, त, र, ज, भ, न, स (हर गण 3 वर्ण)।","इन्द्रवज्रा (11 वर्ण), वंशस्थ (12), वसन्ततिलका (14), मन्दाक्रान्ता (17), शार्दूलविक्रीडित (19)।","आर्या एक मात्रिक छन्द है, यानी मात्राएँ गिनी जाती हैं।"],"ex":"गीता का पाद 'धर्मक्षेत्रे कुरुक्षेत्रे' गिनें: ध, र्म, क्षे, त्रे, कु, रु, क्षे, त्रे = 8 अक्षर। पाँचवाँ 'कु' लघु, छठा 'रु' संयुक्त 'क्ष' से पहले होने से गुरु। अनुष्टुप् का नियम पूरा हुआ।","q":"संस्कृत छन्द अनुष्टुप् इन्द्रवज्रा लक्षण class 12","kw":["छन्द","अनुष्टुप्","लघु गुरु","गण"]},{"id":"shatru-shanach-tavyat","t":"प्रत्यय: शतृ, शानच्, तव्यत्, अनीयर्, टाप्","s":"ये प्रत्यय 'करता हुआ', 'करना चाहिए' जैसे अर्थ और स्त्रीलिङ्ग शब्द बनाते हैं।","n":["शतृ (करता हुआ, परस्मैपदी धातु): पठ् → पठत् (पुं. प्रथमा: पठन्), गम् → गच्छत् (गच्छन्)।","शानच् (करता हुआ, आत्मनेपदी धातु): सेव् → सेवमानः, वृध् → वर्धमानः।","तव्यत् और अनीयर् (करना चाहिए/करने योग्य): पठितव्यम्, कर्तव्यम्; पठनीयम्, करणीयम्।","टाप् (स्त्रीलिङ्ग बनाने वाला): अज → अजा, बाल → बाला, छात्र → छात्रा।","ङीप्: नद → नदी, देव → देवी।"],"ex":"'बालक हँसता हुआ जाता है।' = 'बालकः हसन् गच्छति।' (हस् + शतृ = हसत्, पुं. प्रथमा: हसन्)। 'हमें सत्य बोलना चाहिए।' = 'अस्माभिः सत्यं वक्तव्यम्।' (वच् + तव्यत्)।","q":"शतृ शानच् तव्यत् अनीयर् प्रत्यय संस्कृत class 12","kw":["शतृ","शानच्","तव्यत्","अनीयर्"]},{"id":"brihattrayi-mahakavya","t":"महाकाव्य और बृहत्त्रयी","s":"संस्कृत महाकाव्य लंबी, सर्गों में बँटी कविता है; तीन बड़े महाकाव्य 'बृहत्त्रयी' कहलाते हैं।","n":["महाकाव्य के लक्षण: सर्गबद्ध रचना, धीरोदात्त नायक, प्रकृति वर्णन, एक प्रधान रस।","बृहत्त्रयी: भारवि का किरातार्जुनीयम्, माघ का शिशुपालवधम्, श्रीहर्ष का नैषधीयचरितम्।","'भारवेरर्थगौरवम्' — भारवि अर्थ की गहराई के लिए प्रसिद्ध हैं।","'माघे सन्ति त्रयो गुणाः' — माघ में उपमा, अर्थगौरव और पदलालित्य तीनों गुण माने जाते हैं।","अश्वघोष (बुद्धचरितम्) ने भी महाकाव्य लिखे।"],"ex":"याद करने की युक्ति: लघुत्रयी = कालिदास (रघुवंश, कुमारसम्भव, मेघदूत)। बृहत्त्रयी = भारवि, माघ, श्रीहर्ष (किरात, शिशुपालवध, नैषध)। 'लघु' का मतलब छोटा नहीं, ये सरल मानी जाती हैं।","q":"बृहत्त्रयी लघुत्रयी संस्कृत महाकाव्य","kw":["महाकाव्य","बृहत्त्रयी","भारवि","माघ"]}],"ug":[{"id":"ved-parichay","t":"वेद परिचय","s":"वेद भारत के सबसे प्राचीन ग्रंथ हैं, जिन्हें 'श्रुति' भी कहा जाता है।","n":["चार वेद: ऋग्वेद, यजुर्वेद, सामवेद, अथर्ववेद। ऋग्वेद सबसे पुराना माना जाता है।","ऋग्वेद में 10 मण्डल और 1028 सूक्त हैं। अग्नि, इन्द्र, वरुण, सोम मुख्य देवता हैं।","यजुर्वेद यज्ञ विधि से जुड़ा है (शुक्ल और कृष्ण); सामवेद गायन से; अथर्ववेद दैनिक जीवन, औषधि से।","वैदिक साहित्य के चार भाग: संहिता, ब्राह्मण, आरण्यक, उपनिषद।","छह वेदाङ्ग: शिक्षा, कल्प, व्याकरण, निरुक्त, छन्द, ज्योतिष।"],"ex":"ऋग्वेद का पहला मंत्र: 'अग्निमीळे पुरोहितम्' (1.1.1)। अर्थ: मैं अग्नि की स्तुति करता हूँ जो पुरोहित (आगे रखा गया) है। ऋग्वेद अग्नि की स्तुति से शुरू होता है।","q":"वेद परिचय ऋग्वेद संहिता ब्राह्मण आरण्यक उपनिषद BA sanskrit","kw":["वेद","ऋग्वेद","वेदाङ्ग","संहिता"]},{"id":"upanishad","t":"उपनिषद्","s":"उपनिषद् वेदों का दार्शनिक भाग है, जो आत्मा और ब्रह्म का ज्ञान देता है।","n":["उपनिषद् को 'वेदान्त' (वेद का अंतिम भाग) कहा जाता है।","मुख्य उपनिषद्: ईश, केन, कठ, प्रश्न, मुण्डक, माण्डूक्य, तैत्तिरीय, ऐतरेय, छान्दोग्य, बृहदारण्यक।","कठोपनिषद् में बालक नचिकेता यम से मृत्यु और आत्मा का रहस्य पूछता है।","महावाक्य: 'तत्त्वमसि' (छान्दोग्य), 'अहं ब्रह्मास्मि' (बृहदारण्यक), 'प्रज्ञानं ब्रह्म' (ऐतरेय), 'अयमात्मा ब्रह्म' (माण्डूक्य)।","मुख्य विचार: आत्मा और ब्रह्म एक हैं; ज्ञान से मुक्ति मिलती है।"],"ex":"'तत्त्वमसि' = तत् + त्वम् + असि। अर्थ: 'वह (ब्रह्म) तुम हो।' छान्दोग्य उपनिषद् में उद्दालक अपने पुत्र श्वेतकेतु को नमक-पानी जैसे उदाहरणों से यह समझाते हैं: नमक दिखता नहीं, पर पूरे पानी में है।","q":"उपनिषद् परिचय महावाक्य कठोपनिषद् BA sanskrit","kw":["उपनिषद्","वेदान्त","महावाक्य","नचिकेता"]},{"id":"panini-ashtadhyayi","t":"पाणिनि और अष्टाध्यायी","s":"पाणिनि की अष्टाध्यायी संस्कृत व्याकरण का सबसे प्रमाणिक और वैज्ञानिक ग्रंथ है।","n":["अष्टाध्यायी में 8 अध्याय, 32 पाद और लगभग 4000 सूत्र हैं।","शुरुआत 14 माहेश्वर सूत्रों से होती है (अइउण्, ऋऌक्...), जिनसे प्रत्याहार बनते हैं, जैसे 'अच्' = सभी स्वर।","मुनित्रय: पाणिनि (सूत्र), कात्यायन (वार्तिक), पतञ्जलि (महाभाष्य)।","सूत्र बहुत छोटे होते हैं: 'वृद्धिरादैच्' (1.1.1) = आ, ऐ, औ को वृद्धि कहते हैं।","भट्टोजि दीक्षित की 'वैयाकरणसिद्धान्तकौमुदी' और वरदराज की 'लघुसिद्धान्तकौमुदी' पढ़ाई में आसान क्रम देती हैं।"],"ex":"सूत्र 'इको यणचि' (6.1.77): इक् (इ, उ, ऋ, ऌ) के स्थान पर यण् (य, व, र, ल) हो जाता है, जब आगे अच् (स्वर) हो। प्रयोग: सुधी + उपास्यः = सुध्युपास्यः (ई → य्)।","q":"पाणिनि अष्टाध्यायी माहेश्वर सूत्र प्रत्याहार BA sanskrit","kw":["पाणिनि","अष्टाध्यायी","माहेश्वर सूत्र","प्रत्याहार"]},{"id":"kavyashastra-sanskrit","t":"संस्कृत काव्यशास्त्र","s":"काव्यशास्त्र बताता है कि काव्य क्या है, उसकी आत्मा क्या है और उसे कैसे परखें।","n":["भरतमुनि (नाट्यशास्त्र): रस सूत्र 'विभावानुभावव्यभिचारिसंयोगाद्रसनिष्पत्तिः'।","भामह: अलंकार। वामन: 'रीतिरात्मा काव्यस्य'। आनन्दवर्धन: 'काव्यस्यात्मा ध्वनिः' (ध्वन्यालोक)।","कुन्तक: वक्रोक्ति (वक्रोक्तिजीवितम्)। क्षेमेन्द्र: औचित्य।","मम्मट का काव्यप्रकाश प्रमुख ग्रंथ है। विश्वनाथ (साहित्यदर्पण): 'वाक्यं रसात्मकं काव्यम्'।","पण्डितराज जगन्नाथ (रसगङ्गाधर): 'रमणीयार्थप्रतिपादकः शब्दः काव्यम्'।"],"ex":"रस सूत्र का अर्थ: विभाव (कारण), अनुभाव (शरीर की प्रतिक्रिया) और व्यभिचारी भाव (क्षणिक भाव) के संयोग से रस की निष्पत्ति होती है। 'निष्पत्ति' की व्याख्या पर भट्ट लोल्लट, शंकुक, भट्ट नायक और अभिनवगुप्त के अलग मत हैं।","q":"संस्कृत काव्यशास्त्र रस ध्वनि अलंकार रीति वक्रोक्ति BA","kw":["काव्यशास्त्र","ध्वनि","रस सूत्र","मम्मट"]},{"id":"bharatiya-darshan","t":"भारतीय दर्शन परिचय","s":"दर्शन जीवन, संसार, ज्ञान और मुक्ति के बारे में गहरा विचार है।","n":["आस्तिक (वेद को प्रमाण मानने वाले) छह दर्शन: न्याय, वैशेषिक, सांख्य, योग, मीमांसा, वेदान्त।","प्रवर्तक: न्याय-गौतम, वैशेषिक-कणाद, सांख्य-कपिल, योग-पतञ्जलि, मीमांसा-जैमिनि, वेदान्त-बादरायण (ब्रह्मसूत्र)।","नास्तिक (वेद को प्रमाण न मानने वाले): चार्वाक, बौद्ध, जैन।","योगसूत्र: 'योगश्चित्तवृत्तिनिरोधः' — मन की वृत्तियों को रोकना योग है। अष्टाङ्ग योग: यम से समाधि तक।","सांख्य: प्रकृति और पुरुष, दो मूल तत्व; प्रकृति के तीन गुण: सत्त्व, रजस्, तमस्।"],"ex":"अष्टाङ्ग योग के आठ अंग क्रम से: यम, नियम, आसन, प्राणायाम, प्रत्याहार, धारणा, ध्यान, समाधि। ध्यान दें: आज का 'योगा' अधिकतर केवल आसन और प्राणायाम है, जो पूरे योग का एक हिस्सा है।","q":"भारतीय दर्शन षड्दर्शन परिचय आस्तिक नास्तिक","kw":["दर्शन","षड्दर्शन","योग","सांख्य"]},{"id":"gita-adhyayan","t":"श्रीमद्भगवद्गीता का अध्ययन","s":"गीता कर्म, ज्ञान और भक्ति के मार्गों को एक साथ समझाती है।","n":["युद्धभूमि में अर्जुन के मोह को दूर करने के लिए श्रीकृष्ण का उपदेश है।","निष्काम कर्मयोग: फल की इच्छा छोड़कर कर्तव्य करना।","स्थितप्रज्ञ (अध्याय 2): सुख-दुख में एक जैसा रहने वाला स्थिर बुद्धि का व्यक्ति।","ज्ञानयोग, कर्मयोग, भक्तियोग, तीनों मार्ग गीता में मिलते हैं।","शंकराचार्य, रामानुजाचार्य, तिलक ('गीता रहस्य') आदि ने अलग-अलग भाष्य लिखे।"],"ex":"गीता 2.47 का अन्वय: 'ते कर्मणि एव अधिकारः, फलेषु कदाचन मा।' यहाँ 'कर्मणि' सप्तमी, 'फलेषु' सप्तमी बहुवचन है। 'मा' निषेध बताता है। अर्थ: कर्म में ही अधिकार है, फल में कभी नहीं।","q":"श्रीमद्भगवद्गीता अध्ययन कर्मयोग स्थितप्रज्ञ BA sanskrit","kw":["गीता","कर्मयोग","स्थितप्रज्ञ","भाष्य"]},{"id":"puran-smriti","t":"पुराण और स्मृति साहित्य","s":"पुराण कथा और इतिहास के ग्रंथ हैं; स्मृतियाँ आचार और नियम बताती हैं।","n":["पुराण 18 माने गए हैं, जैसे विष्णु, भागवत, शिव, मार्कण्डेय, वायु पुराण।","पुराण के पाँच लक्षण (पञ्चलक्षण): सर्ग, प्रतिसर्ग, वंश, मन्वन्तर, वंशानुचरित।","स्मृति ग्रंथ: मनुस्मृति, याज्ञवल्क्यस्मृति, नारदस्मृति। इनमें आचार, व्यवहार (कानून), प्रायश्चित्त हैं।","मिताक्षरा (विज्ञानेश्वर) याज्ञवल्क्यस्मृति की टीका है, जिसका भारतीय उत्तराधिकार कानून पर प्रभाव रहा।","स्मृतियों को आलोचनात्मक दृष्टि से पढ़ें; उनमें जाति और स्त्री संबंधी कई विचार आज के संवैधानिक मूल्यों से मेल नहीं खाते।"],"ex":"पुराण की पहचान: मार्कण्डेय पुराण के अंदर 'दुर्गासप्तशती' (देवी माहात्म्य) है, जिसमें देवी की कथा है। इसमें सृष्टि, राजवंश और कथाएँ, यानी पञ्चलक्षण के अंश मिलते हैं।","q":"पुराण परिचय पञ्चलक्षण स्मृति साहित्य BA sanskrit","kw":["पुराण","पञ्चलक्षण","स्मृति","मिताक्षरा"]}],"pg":[{"id":"nirukt-vedic-vyakhya","t":"निरुक्त और वेद-व्याख्या","s":"निरुक्त वैदिक शब्दों के अर्थ और उनकी व्युत्पत्ति बताने वाला वेदाङ्ग है।","n":["यास्क का निरुक्त, निघण्टु (वैदिक शब्द-सूची) की व्याख्या है।","यास्क के चार पदजात: नाम, आख्यात, उपसर्ग, निपात।","यास्क का मत: सभी नाम धातु से बने हैं (नामानि आख्यातजानि)।","वैदिक स्वर: उदात्त, अनुदात्त, स्वरित। स्वर बदलने से अर्थ बदल सकता है।","सायण का वेदभाष्य प्रसिद्ध है; आधुनिक काल में दयानन्द सरस्वती, श्री अरविन्द और पश्चिमी विद्वानों ने अलग व्याख्याएँ दीं।"],"ex":"निरुक्त की पद्धति: किसी वैदिक शब्द का अर्थ उसकी धातु खोजकर निकालना। जैसे 'निघण्टु' और 'निरुक्त' दोनों में 'नि' उपसर्ग है; व्याख्याकार हर शब्द को धातु, प्रत्यय और प्रसंग से समझाता है।","q":"यास्क निरुक्त चार पदजात वैदिक स्वर MA sanskrit","kw":["निरुक्त","यास्क","पदजात","वैदिक स्वर"]},{"id":"vyakaran-darshan","t":"व्याकरण दर्शन: भर्तृहरि और स्फोट","s":"व्याकरण दर्शन पूछता है कि शब्द से अर्थ कैसे समझ आता है।","n":["पतञ्जलि का महाभाष्य व्याकरण के साथ भाषा-दर्शन की चर्चा भी करता है।","भर्तृहरि का 'वाक्यपदीय' व्याकरण दर्शन का मुख्य ग्रंथ है; तीन काण्ड: ब्रह्म, वाक्य, पद।","शब्दब्रह्म: शब्द को ही परम सत्य का रूप माना गया।","स्फोटवाद: अर्थ ध्वनियों के टुकड़ों से नहीं, एक अखण्ड 'स्फोट' से प्रकट होता है।","भर्तृहरि वाक्य को अर्थ की मूल इकाई मानते हैं (अखण्ड वाक्य पक्ष)।"],"ex":"'गौः' बोलते समय ग्, औ, विसर्ग की ध्वनियाँ एक के बाद एक आती हैं और नष्ट होती जाती हैं। फिर भी पूरा अर्थ 'गाय' एक साथ समझ आता है। स्फोटवादी कहते हैं: यह अखण्ड स्फोट से होता है।","q":"भर्तृहरि वाक्यपदीय स्फोटवाद व्याकरण दर्शन MA","kw":["वाक्यपदीय","भर्तृहरि","स्फोट","महाभाष्य"]},{"id":"siddhant-kaumudi","t":"सिद्धान्तकौमुदी: प्रक्रिया अध्ययन","s":"सिद्धान्तकौमुदी अष्टाध्यायी के सूत्रों को विषय के क्रम में रखकर शब्द-सिद्धि सिखाती है।","n":["भट्टोजि दीक्षित ने सूत्रों को प्रकरणों में रखा: संज्ञा, परिभाषा, संधि, सुबन्त, तिङन्त, कृदन्त, तद्धित, समास।","रूप-सिद्धि: किसी शब्द को धातु/प्रातिपदिक से शुरू करके सूत्र लगाते हुए अंतिम रूप तक पहुँचाना।","संज्ञा सूत्र नाम देते हैं, परिभाषा सूत्र नियम समझाते हैं, विधि सूत्र कार्य करते हैं।","अनुवृत्ति: पिछले सूत्र के शब्द आगे के सूत्र में अपने आप आ जाते हैं।","टीकाएँ: बालमनोरमा, तत्त्वबोधिनी; नागेश भट्ट की 'परमलघुमञ्जूषा' दर्शन पक्ष के लिए।"],"ex":"'रमेशः' की सिद्धि (संक्षेप में): रमा + ईशः। 'आद्गुणः' (6.1.87) से आ + ई = ए गुण। रमेश प्रातिपदिक से 'सु' प्रत्यय, फिर स् → रु → विसर्ग। अंतिम रूप: रमेशः।","q":"सिद्धान्तकौमुदी रूप सिद्धि प्रक्रिया MA sanskrit vyakaran","kw":["सिद्धान्तकौमुदी","रूप सिद्धि","अनुवृत्ति"]},{"id":"dhvanyalok-kavyaprakash","t":"ध्वन्यालोक और काव्यप्रकाश","s":"ये दो ग्रंथ संस्कृत काव्यशास्त्र में ध्वनि सिद्धांत के आधार स्तंभ हैं।","n":["आनन्दवर्धन (9वीं शताब्दी) का ध्वन्यालोक: व्यंग्यार्थ (छिपा अर्थ) ही उत्तम काव्य का प्राण है।","अभिनवगुप्त ने इस पर 'लोचन' टीका और नाट्यशास्त्र पर 'अभिनवभारती' लिखी।","ध्वनि के तीन रूप: वस्तुध्वनि, अलंकारध्वनि, रसध्वनि। रसध्वनि सबसे श्रेष्ठ मानी गई।","मम्मट (काव्यप्रकाश) के अनुसार काव्य के तीन भेद: उत्तम (ध्वनि), मध्यम (गुणीभूतव्यंग्य), अधम (चित्र काव्य)।","मम्मट की काव्य परिभाषा: 'तददोषौ शब्दार्थौ सगुणावनलंकृती पुनः क्वापि'।"],"ex":"सरल उदाहरण: शाम को कोई कहे 'सूर्य अस्त हो गया।' सीधा अर्थ एक तथ्य है। पर प्रसंग से व्यंग्यार्थ: चरवाहे के लिए 'गायें लौटाओ', प्रेमी के लिए 'मिलन का समय', पुजारी के लिए 'संध्या करो'। यही ध्वनि है।","q":"ध्वन्यालोक काव्यप्रकाश ध्वनि सिद्धान्त MA sanskrit","kw":["ध्वन्यालोक","काव्यप्रकाश","अभिनवगुप्त","व्यंग्यार्थ"]},{"id":"nyay-vaisheshik","t":"न्याय-वैशेषिक दर्शन","s":"न्याय तर्क और प्रमाण का दर्शन है; वैशेषिक संसार की वस्तुओं को श्रेणियों में बाँटता है।","n":["न्याय के चार प्रमाण: प्रत्यक्ष, अनुमान, उपमान, शब्द।","पञ्चावयव वाक्य: प्रतिज्ञा, हेतु, उदाहरण, उपनय, निगमन।","वैशेषिक के पदार्थ: द्रव्य, गुण, कर्म, सामान्य, विशेष, समवाय; बाद में अभाव जोड़कर सात।","वैशेषिक का परमाणुवाद: सभी द्रव्य छोटे परमाणुओं से बने हैं।","अन्नंभट्ट का 'तर्कसंग्रह' इन दोनों का आसान परिचय ग्रंथ है। गङ्गेश की 'तत्त्वचिन्तामणि' से नव्यन्याय शुरू हुआ।"],"ex":"पञ्चावयव अनुमान: प्रतिज्ञा 'पर्वतो वह्निमान्' (पर्वत पर आग है)। हेतु 'धूमात्' (धुएँ के कारण)। उदाहरण 'यो यो धूमवान् स वह्निमान्, यथा महानसम्' (जैसे रसोई)। उपनय: पर्वत धूमवान् है। निगमन: इसलिए पर्वत पर आग है।","q":"न्याय वैशेषिक दर्शन तर्कसंग्रह प्रमाण पदार्थ MA","kw":["न्याय","वैशेषिक","प्रमाण","तर्कसंग्रह"]},{"id":"vedant-sampraday","t":"वेदान्त के सम्प्रदाय","s":"वेदान्त के आचार्यों ने ब्रह्म, जीव और जगत् के संबंध को अलग-अलग ढंग से समझाया।","n":["प्रस्थानत्रयी: उपनिषद्, ब्रह्मसूत्र, भगवद्गीता। हर आचार्य ने इन पर भाष्य लिखा।","अद्वैत (शंकराचार्य): 'ब्रह्म सत्यं जगन्मिथ्या जीवो ब्रह्मैव नापरः'। माया के कारण भेद दिखता है।","विशिष्टाद्वैत (रामानुजाचार्य): जीव और जगत् ब्रह्म के अंग (विशेषण) हैं, सत्य हैं।","द्वैत (मध्वाचार्य): ईश्वर, जीव और जगत् सदा अलग हैं।","अन्य: शुद्धाद्वैत (वल्लभ), द्वैताद्वैत (निम्बार्क), अचिन्त्य भेदाभेद (चैतन्य)।"],"ex":"रस्सी-साँप का उदाहरण (अद्वैत): अँधेरे में रस्सी साँप दिखती है। रोशनी (ज्ञान) आने पर पता चलता है कि साँप कभी था ही नहीं। उसी तरह अज्ञान से जगत् अलग दिखता है, ज्ञान से केवल ब्रह्म बचता है।","q":"अद्वैत विशिष्टाद्वैत द्वैत वेदान्त शंकराचार्य रामानुज MA","kw":["वेदान्त","अद्वैत","विशिष्टाद्वैत","प्रस्थानत्रयी"]},{"id":"mimamsa-dharmashastra","t":"मीमांसा और वाक्य-व्याख्या","s":"मीमांसा वेद-वाक्यों के सही अर्थ और व्याख्या के नियम बताने वाला दर्शन है।","n":["जैमिनि के मीमांसासूत्र का पहला सूत्र: 'अथातो धर्मजिज्ञासा'।","शबरस्वामी का शाबरभाष्य; बाद में कुमारिल भट्ट और प्रभाकर के दो सम्प्रदाय बने।","वेद-वाक्यों के भेद: विधि (करने का आदेश), निषेध, अर्थवाद (प्रशंसा), मन्त्र, नामधेय।","मीमांसा के व्याख्या-नियम आगे चलकर धर्मशास्त्र और भारतीय कानून की व्याख्या में भी उपयोग हुए।","शब्दबोध पर मीमांसा, न्याय और व्याकरण के बीच गहरी बहस हुई।"],"ex":"विधि और अर्थवाद का भेद: 'स्वर्गकामो यजेत' (स्वर्ग चाहने वाला यज्ञ करे) एक विधि वाक्य है। उस यज्ञ की प्रशंसा वाले वाक्य अर्थवाद हैं; वे विधि को प्रेरणा देते हैं, स्वयं आदेश नहीं।","q":"पूर्व मीमांसा दर्शन विधि अर्थवाद MA sanskrit","kw":["मीमांसा","जैमिनि","विधि","अर्थवाद"]}],"phd":[{"id":"shodh-pravidhi-sanskrit","t":"संस्कृत में शोध प्रविधि","s":"संस्कृत शोध में मूल ग्रंथ, टीका-परंपरा और आधुनिक विद्वत्ता, तीनों को जोड़ना होता है।","n":["शोध के प्रकार: शास्त्रीय (एक ग्रंथ या सिद्धांत), तुलनात्मक, ऐतिहासिक, पाठालोचनात्मक, अंतर्विषयक।","प्राथमिक स्रोत: मूल ग्रंथ और टीकाएँ। द्वितीयक स्रोत: आधुनिक शोध और अनुवाद।","मूल पाठ को स्वयं पढ़कर अर्थ करें; केवल अनुवाद पर निर्भर न रहें।","पूर्वपक्ष (विरोधी मत) को ईमानदारी से रखें, फिर सिद्धान्त पक्ष स्थापित करें। यह शास्त्र की अपनी पद्धति है।","शोधगंगा पर संस्कृत के पुराने शोध-प्रबंध देखकर विषय की पुनरावृत्ति से बचें।"],"ex":"विषय उदाहरण: 'काव्यप्रकाश के उल्लास 4 में रसनिष्पत्ति: टीकाओं का तुलनात्मक अध्ययन'। प्रविधि: मूल कारिकाएँ, 3-4 प्रमुख टीकाएँ, उनके मतभेद की तालिका, और अपना निष्कर्ष।","q":"sanskrit research methodology PhD शोध प्रविधि","kw":["शोध प्रविधि","पूर्वपक्ष","टीका","शोधगंगा"]},{"id":"pandulipi-path-sampadan","t":"पाण्डुलिपि विज्ञान और पाठ-सम्पादन","s":"हज़ारों संस्कृत ग्रंथ अभी भी अप्रकाशित पाण्डुलिपियों में हैं; उनका सम्पादन बड़ा शोध-कार्य है।","n":["पाण्डुलिपियाँ ताड़पत्र, भूर्जपत्र और कागज़ पर, देवनागरी, शारदा, ग्रन्थ, नन्दिनागरी जैसी लिपियों में मिलती हैं।","समालोचनात्मक सम्पादन: सभी प्रतियाँ इकट्ठा करना, पाठ-भेद दर्ज करना, प्रतियों का वंशवृक्ष बनाना, मूल पाठ तय करना।","भण्डारकर ओरिएण्टल रिसर्च इंस्टीट्यूट (पुणे) का महाभारत का समालोचनात्मक संस्करण इसका प्रसिद्ध उदाहरण है।","राष्ट्रीय पाण्डुलिपि मिशन (2003) पाण्डुलिपियों का सर्वेक्षण, सूचीकरण और संरक्षण करता है।","पुष्पिका (कोलोफ़ोन) से लेखक, लिपिकार और ति
