Swaramela Kalanidhi (16th century).","Bhatkhande's 10-thaat system is widely taught but some raags do not fit neatly.","Raaganga system groups raags by shared characteristic phrases, not only scale.","Comparing systems shows that raags are defined by movement and phrases, not just notes."],"ex":"Bhimpalasi and Bageshri both use komal Ga and komal Ni and fall under Kafi thaat. Yet they sound very different because their phrases and emphasised notes differ. This shows why the raaganga approach is useful.","q":"raag classification raag ragini mela thaat raaganga","kw":["raag classification","raag-ragini","mela","raaganga"]},{"id":"time-theory-rasa","t":"Raag Samay and Rasa","s":"Hindustani tradition links raags to times of day and seasons, and connects music with rasa (emotion).","n":["Day is divided into 8 prahars of about 3 hours each.","Sandhi prakash raags (at dawn and dusk) often use komal Re and Dha, like Bhairav and Poorvi.","Purvang raags emphasise the lower tetrachord; uttarang raags the upper.","Seasonal raags: Malhar family for monsoon, Basant and Bahar for spring.","Rasa theory from the Natyashastra connects art with emotions like shringar (love) and karuna (compassion)."],"ex":"Marwa (komal Re, tivra Ma) is sung at sunset; its restless mood matches dusk. Miyan ki Malhar is linked with rain. Concert organisers in many traditions still try to follow these times, even though recordings let us listen any time.","q":"raag samay time theory prahar sandhi prakash raag","kw":["raag samay","prahar","sandhi prakash","rasa"]},{"id":"laykari-tabla","t":"Laykari and Advanced Taal","s":"Laykari is playful rhythm work, fitting notes into beats in different ratios like dugun and tigun.","n":["Thah is single speed (one bol per matra). Dugun is double, tigun triple, chaugun four times.","Tihai is a phrase played three times to land exactly on sam.","Kayda is a theme with variations (paltas) on tabla; rela is a fast rolling composition.","Other taals: Rupak (7, starting with khali), Chautaal (12), Dhamar (14), Jhumra (14), Deepchandi (14).","Bol writing and padhant (reciting bols aloud) are core skills."],"ex":"Tihai math in Teentaal: a 4-beat phrase, a 2-beat gap, the phrase again, a 2-beat gap, the phrase a third time. Total = 4 + 2 + 4 + 2 + 4 = 16 beats. Start it on beat 2 of one cycle, and its final beat lands exactly on sam (beat 1) of the next cycle.","q":"laykari dugun tigun chaugun tihai calculation tabla","kw":["laykari","tihai","kayda","dugun"]},{"id":"organology","t":"Instruments: Structure and Playing","s":"Organology studies how instruments are built, how they make sound and how they are played.","n":["Sitar: long neck, movable frets, main and sympathetic strings (taraf), gourd resonator; played with a mizrab.","Sarod: fretless, metal fingerboard, played with a plectrum (java).","Tabla: right drum (dayan) tuned to Sa; left (bayan) gives bass; the black spot is called syahi.","Mridangam: double-headed barrel drum, main percussion of Carnatic music.","Hornbostel-Sachs system: chordophones, aerophones, membranophones, idiophones, plus electrophones."],"ex":"Compare: tabla = membranophone (Indian avanaddha); ghatam (clay pot) = idiophone (ghana); bansuri = aerophone (sushir); sitar = chordophone (tata). The Indian four-fold system and the Western system match closely, with electrophones added for electronic instruments.","q":"sitar sarod tabla structure parts organology","kw":["organology","sitar","tabla","Hornbostel-Sachs"]},{"id":"music-theory-harmony","t":"Music Theory: Intervals and Harmony","s":"Intervals measure distance between notes; harmony studies how notes sound together.","n":["Semitone is the smallest step on a keyboard; an octave has 12 semitones.","Intervals: major third (4 semitones), perfect fourth (5), perfect fifth (7).","Sa-Ma (fourth) and Sa-Pa (fifth) are the strongest consonances; Indian music calls them shadja-madhyam and shadja-pancham bhav.","Equal temperament divides the octave into 12 equal parts; Indian music often uses just intonation (natural ratios).","Western harmony uses chord progressions like I-IV-V-I."],"ex":"Frequency ratios: if Sa = 240 Hz, Pa (ratio 3:2) = 240 x 3/2 = 360 Hz. Ma (4:3) = 240 x 4/3 = 320 Hz. Taar Sa (2:1) = 480 Hz. These simple ratios are why these notes sound so pleasant together.","q":"music intervals frequency ratio just intonation equal temperament","kw":["intervals","harmony","just intonation","frequency ratio"]},{"id":"film-and-regional","t":"Film, Light and Regional Music","s":"Light music, film music and regional styles connect classical roots with everyday listeners.","n":["Light forms: ghazal, bhajan, qawwali, geet and natya sangeet (Marathi stage music).","Rabindra Sangeet (Tagore's songs) is central to Bengali culture.","Many film songs are based on raags; composers used Yaman, Bhairavi, Darbari and others.","Qawwali developed in the Sufi tradition; Amir Khusrau is traditionally linked with it.","Analysing songs by raag, taal and orchestration is good listening practice."],"ex":"Listening exercise: take any old film song you know. Hum its tune and check which notes are used. If you hear tivra Ma and all other notes shuddha, it may be close to Yaman. Then clap along to find the taal, often Keherwa or Dadra.","q":"raag based film songs analysis light music forms","kw":["light music","ghazal","Rabindra Sangeet","film music"]},{"id":"music-technology","t":"Music Technology and Recording","s":"Modern musicians use free software to record, edit and share music professionally.","n":["A DAW (Digital Audio Workstation) records and edits audio; free options include Audacity and Cakewalk.","Microphones: dynamic (rugged, for live) and condenser (sensitive, for studio).","Sample rate 44.1 kHz and 16-bit depth is CD quality.","MIDI stores note information, not sound, so it can be played by any virtual instrument.","Copyright: performances and compositions are protected; get permission before using others' recordings."],"ex":"File size of 1 minute of CD-quality stereo audio: 44,100 samples x 16 bits x 2 channels x 60 seconds = 84,672,000 bits. Divide by 8 = 10,584,000 bytes, about 10.6 MB. That is why MP3 compression is used for sharing.","q":"home recording basics Audacity tutorial musicians","kw":["DAW","Audacity","MIDI","recording"]}],"pg":[{"id":"musicology-intro","t":"Introduction to Musicology","s":"Musicology is the scholarly study of music: its history, theory, culture and science.","n":["Historical musicology studies texts, composers, manuscripts and change over time.","Systematic musicology covers acoustics, psychology of music and music theory.","Ethnomusicology studies music in its cultural and social context, often through fieldwork.","Indian musicology combines Sanskrit texts, oral tradition and performance practice.","Key scholars include V.N. Bhatkhande, K.C.D. Brihaspati and Premlata Sharma, among many others."],"ex":"A historical question: did raag Todi sound the same 300 years ago? A musicologist compares descriptions in old texts, old notations, early 20th-century recordings and current practice to trace how its notes and phrases changed.","q":"what is musicology ethnomusicology introduction","kw":["musicology","ethnomusicology","historical musicology","Indian musicology"]},{"id":"shruti-debates","t":"Shruti, Grama and Murchhana","s":"Ancient theory built scales from 22 shrutis using gramas and murchhanas, still debated by scholars today.","n":["Natyashastra describes two gramas (Shadja grama and Madhyama grama); a third, Gandhara grama, is mentioned as lost.","Swaras in Shadja grama span 4, 3, 2, 4, 4, 3, 2 shrutis, totalling 22.","Murchhana is a sequential series of seven notes starting from different notes of a grama.","Bharata's experiment with two veenas (dhruva and chala) demonstrated the shruti intervals.","Modern scholars debate whether shrutis are equal and how they match today's intonation."],"ex":"Shadja grama shruti distribution: Sa 4, Re 3, Ga 2, Ma 4, Pa 4, Dha 3, Ni 2. Sum = 4 + 3 + 2 + 4 + 4 + 3 + 2 = 22. In ancient convention each swar sits on the last shruti of its group.","q":"22 shruti grama murchhana Natyashastra explained","kw":["shruti","grama","murchhana","Natyashastra"]},{"id":"aesthetics","t":"Music Aesthetics","s":"Aesthetics studies beauty and emotional experience in music, in both Indian and Western thought.","n":["Rasa theory: the audience tastes rasa through bhava presented by the artist.","Abhinavagupta's commentary (Abhinavabharati) deeply explained how rasa is experienced.","Shanta rasa (peace) was accepted as a ninth rasa in later tradition.","Western views include formalism (beauty in musical form itself) and expression theory.","Key questions: Is meaning in the music, in the listener or in the culture?"],"ex":"A slow alaap in raag Darbari can make listeners feel calm seriousness. Rasa theory says this feeling is not personal sadness but a shared, universalised emotion (sadharanikaran) that the listener enjoys aesthetically.","q":"rasa theory music aesthetics Abhinavagupta","kw":["aesthetics","rasa","Abhinavagupta","formalism"]},{"id":"comparative-systems","t":"Comparative Study: Hindustani, Carnatic, Western","s":"Comparing music systems shows shared foundations and different approaches to melody, rhythm and composition.","n":["Hindustani emphasises improvisation and gradual raag development; Carnatic gives central place to composed kritis with improvisation.","Gamaka (ornamentation) is essential in Carnatic; meend and andolan are key in Hindustani.","Western classical music emphasises harmony, written scores and orchestration.","Rhythm: Indian systems use cyclical tala; Western music uses metre with bar lines.","Many raags have related ragas in the other Indian system, such as Hindustani Yaman and Carnatic Kalyani."],"ex":"Carnatic Shankarabharanam (29th melakarta) uses the same pitch set as Hindustani Bilawal and the Western major scale. Yet each tradition treats it differently: Carnatic with gamakas, Hindustani with raag-specific phrases, Western with chord harmony.","q":"comparison Hindustani Carnatic western classical music","kw":["comparative music","gamaka","Shankarabharanam","Bilawal"]},{"id":"music-psychology-acoustics","t":"Acoustics and Music Psychology","s":"Acoustics explains the physics of musical sound; music psychology studies how we perceive and feel music.","n":["Sound waves have frequency (pitch), amplitude (loudness) and waveform (timbre).","Overtones (harmonics) are multiples of the fundamental frequency; their mix creates timbre.","The tanpura's rich overtones, shaped by the jawari bridge and cotton threads (jivari), help singers find pitch.","Music psychology studies memory, expectation, emotion and learning of music.","Music therapy uses music to support health and well-being under trained professionals."],"ex":"If a tanpura string has fundamental 130 Hz, its harmonics are 260, 390, 520, 650 Hz and so on. The 3rd harmonic (390 Hz) is a fifth above the octave, Pa, and the 5th (650 Hz) relates to Ga. Singers hear these hidden notes.","q":"acoustics of music harmonics tanpura jawari","kw":["acoustics","harmonics","tanpura","music psychology"]},{"id":"pedagogy-of-music","t":"Pedagogy of Music","s":"Music teaching blends traditional guru-shishya learning with structured, modern classroom methods.","n":["Guru-shishya parampara: oral learning, imitation, years of close guidance.","Institutional teaching: syllabus, graded exams, notation and group classes.","Western methods like Kodaly, Orff and Dalcroze use singing, movement and simple instruments.","Good music teaching develops listening, singing, playing, creating and understanding.","Technology: online lessons, apps for tanpura and tabla, and recordings for self-study."],"ex":"A school teacher teaches Bhupali to Class 6: children first listen to a recording, sing the aroh-avroh after her, move hands up and down with pitch (inspired by Kodaly hand signs), then create their own 4-note tune using Bhupali notes.","q":"music pedagogy guru shishya parampara Kodaly Orff","kw":["music pedagogy","guru-shishya","Kodaly","Orff"]}],"phd":[{"id":"musicology-research-methods","t":"Research Methods in Musicology","s":"Music research uses textual study, fieldwork, transcription, analysis and recordings to answer clear questions.","n":["Textual research: critical editions of Sanskrit and Persian treatises, with careful translation.","Fieldwork: interviews and participant observation with performers and communities, with consent.","Transcription and analysis of performances into notation, aware of what notation misses.","Archives: All India Radio recordings, early 78 rpm discs, and collections like the Archive and Research Centre for Ethnomusicology (ARCE).","Cite sources properly and respect performers' rights and community knowledge."],"ex":"Research question: 'How has the bandish repertoire of a family of Rampur-Sahaswan singers changed across three generations?' Methods: interviews with living members, comparison with old recordings, transcription of selected bandishes and analysis of changes in text, taal and raag treatment.","q":"research methodology in music PhD ethnomusicology fieldwork","kw":["music research","fieldwork","transcription","archives"]},{"id":"computational-musicology","t":"Computational Musicology","s":"Computational methods analyse large music collections for pitch, rhythm and raag patterns using software.","n":["Pitch tracking extracts the melody line from recordings.","Pitch histograms show which notes are emphasised, useful for raag studies.","Raag recognition systems use machine learning on pitch and phrase features.","Projects like CompMusic built datasets of Hindustani and Carnatic music for research.","Free tools: Sonic Visualiser, Praat and Python libraries like librosa and Essentia."],"ex":"A researcher plots pitch histograms of 50 Yaman recordings. Peaks appear at Ga and Ni, matching the textbook vadi-samvadi. Small differences in the exact pitch of Ga across singers become measurable evidence of gharana style.","q":"computational musicology raga recognition librosa","kw":["computational musicology","pitch tracking","raag recognition","librosa"]},{"id":"ethnomusicology-advanced","t":"Ethnomusicology and Living Traditions","s":"Ethnomusicology studies music as culture, including folk, tribal and devotional traditions often missing from textbooks.","n":["Key questions: who makes this music, for whom, why, and how does it change?","Studies of communities like the Manganiyars and Langas of Rajasthan explore patron-musician relations.","Issues of caste, gender and power shape who gets to perform and be recognised.","Ethics: shared authorship, fair benefit and returning recordings to communities.","UNESCO recognition (like Vedic chanting, 2008) raises questions about preservation and change."],"ex":"A thesis studies how Baul singers of Bengal adapt their songs for festival stages and online platforms. The researcher records performances, interviews singers and audiences, and asks whether new audiences change the meaning or form of the tradition.","q":"ethnomusicology India research folk traditions","kw":["ethnomusicology","Manganiyar","Baul","intangible heritage"]},{"id":"frontier-areas-music","t":"Frontier Areas in Music Research","s":"New research connects music with cognition, health, technology, policy and the creative economy.","n":["Music cognition: how the brain processes raag, rhythm and emotion, using experiments and brain imaging.","Music and health: evidence-based studies of music therapy for stress, autism and dementia care.","AI and music: generation tools raise questions of creativity, copyright and fair pay for artists.","Digital archives and preservation of endangered traditions.","Choose a topic where your musical skill, available data and a real gap in literature meet."],"ex":"Possible thesis: 'Effect of 20 minutes of daily raag-based listening on anxiety scores of college students: a controlled study.' It needs a clear hypothesis, a validated anxiety scale, a control group, ethical approval and honest reporting even if results are small.","q":"music cognition music therapy research India PhD","kw":["music cognition","music therapy","AI music","research topics"]}]},"order":19},{"id":"dance","name":"Dance","nameHi":"नृत्य","group":"arts","blurb":"Learn India's classical and folk dances, the Natyashastra, mudras, rasa and bhava, body care, choreography and dance research.","levels":{"6-8":[{"id":"what-is-dance","t":"What is Dance?","s":"Dance is moving the body in rhythm to express feelings, tell stories or celebrate.","n":["Dance (नृत्य) uses body movement, rhythm, expression and often music.","People dance at festivals, weddings, harvests, prayers and on stage.","Indian dance is of two broad types: classical (शास्त्रीय), with strict rules and long training, and folk (लोक), learnt by community participation.","Dance improves fitness, balance, memory and confidence.","Every Indian state has its own dances, showing our cultural variety."],"ex":"During Navratri in Gujarat, people dance Garba in circles around a lamp. Nobody needs a stage or years of training; families and neighbours join in. Compare this with a Bharatanatyam dancer who trains for years to perform solo on stage.","q":"what is dance classical and folk dance of India class 6","kw":["dance","classical dance","folk dance","rhythm"]},{"id":"eight-classical-dances","t":"The Eight Classical Dances of India","s":"The Sangeet Natak Akademi recognises eight classical dance forms, each linked to a region of India.","n":["Bharatanatyam - Tamil Nadu. Kathak - North India, especially Uttar Pradesh.","Kathakali - Kerala. Mohiniyattam - Kerala.","Kuchipudi - Andhra Pradesh. Odissi - Odisha.","Manipuri - Manipur. Sattriya - Assam (the most recently recognised, in 2000).","The Sangeet Natak Akademi is India's national academy for music, dance and drama, set up by the Government of India in 1952."],"ex":"Memory trick: two forms come from Kerala (Kathakali and Mohiniyattam). Two come from the North-East (Manipuri from Manipur, Sattriya from Assam). The remaining four: Bharatanatyam (Tamil Nadu), Kuchipudi (Andhra Pradesh), Odissi (Odisha) and Kathak (Uttar Pradesh). Total = 2 + 2 + 4 = 8.","q":"8 classical dances of India and their states","kw":["classical dances","Sangeet Natak Akademi","Bharatanatyam","Kathak"]},{"id":"folk-dances-states","t":"Folk Dances of Indian States","s":"Folk dances are community dances connected with seasons, festivals, work and local beliefs.","n":["Punjab: Bhangra (men) and Giddha (women). Gujarat: Garba and Dandiya Raas.","Rajasthan: Ghoomar and Kalbelia. Maharashtra: Lavani and Lezim.","Assam: Bihu. Karnataka: Yakshagana (dance-drama) and Dollu Kunitha.","Himachal Pradesh: Nati. Jammu and Kashmir: Rouf. Mizoram: Cheraw (bamboo dance).","Chhau is performed in Odisha, Jharkhand and West Bengal, and is often performed with masks."],"ex":"In Mizoram's Cheraw, people hold long bamboo poles near the ground and clap them together in rhythm. Dancers step in and out between the poles without getting caught. It needs great timing, teamwork and focus.","q":"folk dances of India state wise list","kw":["folk dances","Bhangra","Garba","Bihu","Cheraw"]},{"id":"rhythm-and-counting","t":"Rhythm, Beats and Counting","s":"Dancers must feel the beat and count steps so their movements match the music.","n":["Beat is the steady pulse of music. Tempo (laya) is how fast the beat goes.","Indian dancers count rhythm in taal cycles; for example Teentaal has 16 beats.","Footwork is the base of rhythm in Kathak and Bharatanatyam.","Practise by clapping first, then stepping with the beat.","Ghungroo (ankle bells) make footwork rhythm clearly heard."],"ex":"Clap and count 1 to 8 slowly. Now step right foot on 1, left on 2, and continue to 8. Repeat at double speed: two steps per clap. This is how dancers train to change speed while staying exactly on the beat.","q":"rhythm counting for dance beginners hindi","kw":["rhythm","beat","tempo","footwork"]},{"id":"hand-gestures-intro","t":"Hand Gestures (Mudras)","s":"Mudras are hand gestures that show objects, actions and feelings in Indian classical dance.","n":["Mudra or hasta means hand gesture. Each has a name and many meanings.","Asamyukta hasta use one hand; samyukta hasta use both hands.","Pataka: all fingers straight and together, like a flag. It can show a cloud, a forest, blessing or a river's waves.","Alapadma: fingers spread like a blooming lotus. It can show a flower, the moon or beauty.","The same mudra means different things depending on movement and expression."],"ex":"Try this: make pataka with both hands, palms facing down, and move them in waves sideways: that shows a river. Raise one pataka hand with palm facing out at shoulder level: that can show blessing. One gesture, two meanings.","q":"basic mudras of Bharatanatyam for beginners pataka alapadma","kw":["mudra","hasta","pataka","alapadma"]},{"id":"expressions-navarasa","t":"Expressions and the Nine Feelings","s":"Indian dance uses the face and eyes to show feelings called rasas, like love, laughter and courage.","n":["Abhinaya means expression or acting in dance.","Navarasa means nine rasas (emotional flavours) shown by dancers.","Shringara (love), Hasya (laughter), Karuna (sorrow), Raudra (anger), Veera (courage).","Bhayanaka (fear), Bibhatsa (disgust), Adbhuta (wonder) and Shanta (peace).","Dancers practise facial expressions in front of a mirror."],"ex":"Practise with a mirror: show Adbhuta (wonder) by widening your eyes, raising eyebrows and opening the mouth slightly, as if seeing a huge waterfall. Then show Shanta (peace): relaxed face, soft eyes, gentle smile. Notice how only your face changes the story.","q":"navarasa expressions dance for students","kw":["navarasa","abhinaya","expressions","rasa"]},{"id":"dance-safety-warmup","t":"Warming Up and Staying Safe","s":"Warming up before dancing and cooling down after protects your muscles, knees and back.","n":["Warm-up for 5 to 10 minutes: march in place, roll shoulders, circle ankles and wrists.","Stretch gently. Never bounce or force a stretch.","Dance on a flat, non-slippery floor. Keep the area clear.","Drink water and rest when tired. Stop if you feel sharp pain and tell a teacher.","Cool down after dancing with slow walking and gentle stretches."],"ex":"Before a school annual-day rehearsal, the class does: 2 minutes marching, 1 minute arm circles, 1 minute ankle circles, 2 minutes gentle leg stretches. After practice: 3 minutes slow walking and breathing. Nobody pulls a muscle during the month of rehearsals.","q":"dance warm up exercises for kids","kw":["warm-up","stretching","cool down","safety"]}],"9-10":[{"id":"bharatanatyam","t":"Bharatanatyam","s":"Bharatanatyam is a classical dance of Tamil Nadu known for geometric lines, strong footwork and rich expression.","n":["It developed from temple and court dance traditions of Tamil Nadu, earlier called Sadir.","Basic posture araimandi (half-sitting, knees bent outward) gives its geometric shape.","Adavus are basic step units combining feet, hands and body.","A traditional performance (margam) includes alarippu, jatiswaram, shabdam, varnam, padam and tillana.","Rukmini Devi Arundale founded Kalakshetra in Chennai in 1936 and helped revive the form for public stages."],"ex":"The varnam is the longest and central item in a margam. The dancer switches between pure rhythmic dance (nritta) and expressive storytelling (nritya). It tests stamina, memory and abhinaya together, so it is often called the test of a Bharatanatyam dancer.","q":"Bharatanatyam history margam adavu explained","kw":["Bharatanatyam","araimandi","adavu","margam","Kalakshetra"]},{"id":"kathak","t":"Kathak","s":"Kathak, from North India, grew from storytelling and is famous for fast footwork and spins.","n":["The name comes from 'katha' (story); kathakars were storytellers.","It grew in temples and later in Mughal and Rajput courts, mixing devotional and courtly styles.","Tatkar is rhythmic footwork; chakkar means fast spins.","Compositions include thaat, amad, toda, tukda, paran and tihai.","Main gharanas: Lucknow, Jaipur and Banaras. Pt. Birju Maharaj of the Lucknow gharana was a legendary master."],"ex":"In tatkar, the dancer says 'Ta Thei Thei Tat, Aa Thei Thei Tat' and strikes the floor with flat feet, matching Teentaal's 16 beats. The ghungroo (often around 100 bells or more per ankle) make each beat clear to the audience.","q":"Kathak dance history gharanas tatkar chakkar","kw":["Kathak","tatkar","chakkar","gharana","Birju Maharaj"]},{"id":"kathakali-mohiniyattam","t":"Kathakali and Mohiniyattam (Kerala)","s":"Kerala gives us two classical forms: powerful, dramatic Kathakali and graceful, gentle Mohiniyattam.","n":["Kathakali is a dance-drama with elaborate costumes and painted faces, telling stories from epics.","Make-up types: pacha (green) for noble heroes, kathi for proud villains, kari (black) for demons and hunters.","Music uses chenda and maddalam drums; songs are in Manipravalam (Malayalam-Sanskrit mix).","Mohiniyattam, named after Mohini, is a lasya (graceful) style with swaying movements and white-gold costume.","Poet Vallathol Narayana Menon founded Kerala Kalamandalam in 1930, helping revive both forms."],"ex":"A Kathakali actor may spend hours on make-up before a show, and traditionally does not speak on stage. A seed (chundapoovu) placed in the eye is used by some artists to redden the eyes for dramatic effect. Mohiniyattam, by contrast, uses soft, wave-like body movements.","q":"Kathakali Mohiniyattam Kerala classical dance explained","kw":["Kathakali","Mohiniyattam","Kerala Kalamandalam","lasya"]},{"id":"kuchipudi-odissi","t":"Kuchipudi and Odissi","s":"Kuchipudi of Andhra Pradesh and Odissi of Odisha are lively classical forms with deep temple and drama traditions.","n":["Kuchipudi is named after a village in Andhra Pradesh; it began as dance-drama by Brahmin male performers.","Siddhendra Yogi is linked with its development and the dance-drama Bhama Kalapam.","Tarangam: the dancer performs on the rim of a brass plate, sometimes with a pot of water on the head.","Odissi uses tribhangi (body bent in three places) and chowk (square, stable stance).","Odissi traditions come from Maharis (temple dancers) and Gotipuas (young boys dressed as girls); Guru Kelucharan Mohapatra shaped its modern form."],"ex":"Stand in tribhangi: tilt your head one way, chest the opposite way, and hips back the first way, like an S-shape. Now try chowk: feet apart, knees bent outward, arms bent up at shoulder level. These two shapes are the building blocks of Odissi.","q":"Kuchipudi Odissi classical dance history features","kw":["Kuchipudi","Odissi","tribhangi","tarangam"]},{"id":"manipuri-sattriya","t":"Manipuri and Sattriya","s":"Manipuri from Manipur and Sattriya from Assam are devotional dances of the North-East linked to Vaishnavism.","n":["Manipuri is gentle and flowing; its Ras Leela shows Radha, Krishna and the gopis.","Raja Bhagyachandra (18th century) is credited with shaping Manipuri Ras Leela.","Female dancers wear the stiff, cylindrical skirt called potloi. Pung cholom is a drum dance.","Sattriya was created by saint Srimanta Sankardev (15th-16th century) and performed in Assam's sattras (monasteries).","Sattriya was kept alive by monks (bhakats) and recognised as classical by the Sangeet Natak Akademi in 2000."],"ex":"In Pung cholom, Manipuri drummers play the pung (barrel drum) while leaping and spinning in the air without missing a beat. It shows that the musicians themselves can be dancers too, combining music, rhythm and athletic skill.","q":"Manipuri dance Sattriya dance history features","kw":["Manipuri","Sattriya","Ras Leela","Sankardev"]},{"id":"nritta-nritya-natya","t":"Nritta, Nritya and Natya","s":"Indian dance has three aspects: pure dance (nritta), expressive dance (nritya) and drama (natya).","n":["Nritta is pure rhythmic movement with no story, focusing on lines, steps and patterns.","Nritya combines movement with expression (abhinaya) to convey meaning and feeling.","Natya is dramatic performance, telling a full story often with characters and dialogue.","Tandava is vigorous dance associated with Shiva; lasya is graceful dance associated with Parvati.","Most classical performances move between nritta and nritya."],"ex":"In Bharatanatyam: a jatiswaram is mostly nritta (pure patterns). A padam is nritya (slow song expressing love). A full dance-drama like 'Kuravanji' with many characters is natya. Watching one complete recital shows all three.","q":"nritta nritya natya difference tandava lasya","kw":["nritta","nritya","natya","tandava","lasya"]},{"id":"costumes-music-dance","t":"Costume, Music and Make-up","s":"Costume, jewellery, make-up and live music are part of the meaning and beauty of classical dance.","n":["Aharya abhinaya means expression through costume, make-up, jewellery and stage setting.","Bharatanatyam and Kuchipudi use pleated costumes that open like fans during deep sitting movements.","Odissi uses silver jewellery and a flower head-piece (tahia).","Hindustani music accompanies Kathak; Carnatic music accompanies Bharatanatyam, Kuchipudi and Mohiniyattam.","Red alta on hands and feet helps the audience see mudras and footwork clearly."],"ex":"Why red alta? On a big stage, the audience sits far away. Red-coloured fingertips and soles create a clear outline, so even someone in the last row can see a dancer's mudras and foot patterns. It is both decoration and stage technique.","q":"classical dance costume make up jewellery explained","kw":["aharya","costume","alta","accompaniment"]}],"11-12":[{"id":"natyashastra","t":"The Natyashastra","s":"The Natyashastra, credited to Bharata Muni, is India's ancient text on drama, dance and music.","n":["It is around 2,000 years old; scholars date it roughly between 200 BCE and 200 CE.","Tradition calls it the fifth Veda (Natya Veda), made by combining text from Rigveda, music from Samaveda, acting from Yajurveda and rasa from Atharvaveda.","It has about 36 chapters (some versions 37) on stage, acting, music, dance and theatre.","It describes 108 karanas (basic dance units), shown in sculptures at temples like Chidambaram.","It gives the theory of rasa and bhava, used across Indian arts."],"ex":"At the Nataraja temple in Chidambaram, Tamil Nadu, the gateway towers carry sculptures of dancers in karana poses described in the Natyashastra. Dancers and researchers use these carvings to understand and reconstruct ancient movements.","q":"Natyashastra Bharata Muni explained dance 108 karanas","kw":["Natyashastra","Bharata Muni","karanas","fifth Veda"]},{"id":"abhinaya-types","t":"Four Types of Abhinaya","s":"Abhinaya, the art of expression, has four types: angika, vachika, aharya and sattvika.","n":["Angika: expression through body, limbs, face and hand gestures.","Vachika: expression through speech, song and words.","Aharya: expression through costume, make-up, jewellery and props.","Sattvika: inner emotional expression like tears, trembling or sweating, coming from deep feeling.","A complete performance uses all four together."],"ex":"A dancer playing Sita in Ashoka Vatika: angika - sitting curled, head bowed; vachika - the singer's sad song; aharya - simple white clothes; sattvika - tearful eyes and slight trembling. Together they make the audience feel karuna (compassion).","q":"four types of abhinaya angika vachika aharya sattvika","kw":["abhinaya","angika","vachika","aharya","sattvika"]},{"id":"mudras-abhinaya-darpana","t":"Mudras of the Abhinaya Darpana","s":"Nandikeshvara's Abhinaya Darpana lists hand gestures, head, eye and neck movements used in classical dance.","n":["It lists 28 asamyukta hastas (single-hand gestures), like pataka, tripataka, ardhapataka, kartarimukha, mayura and alapadma.","It lists about 24 samyukta hastas (double-hand gestures), like anjali, kapota, swastika and shankha.","It also describes 9 head movements (shiro bheda), 8 glances (drishti bheda) and 4 neck movements (griva bheda).","A shloka called viniyoga lists the uses of each mudra.","Learning a mudra means learning its shape, its uses and how to move it with expression."],"ex":"Anjali hasta: both palms joined (pataka hands together). Raised above the head it salutes a god, in front of the face it greets a guru, and in front of the chest it greets an elder or person. Position changes the meaning.","q":"Abhinaya Darpana asamyukta samyukta hasta list","kw":["Abhinaya Darpana","asamyukta hasta","samyukta hasta","mudras"]},{"id":"rasa-bhava","t":"Rasa and Bhava","s":"Bhava is the emotion the performer shows; rasa is the aesthetic feeling the audience experiences.","n":["Bharata's rasa sutra: rasa arises from the union of vibhava, anubhava and vyabhichari bhava.","Vibhava: cause (like a beloved or a garden). Anubhava: visible effects (smile, glance). Vyabhichari bhava: passing feelings.","Sthayi bhava is the lasting emotion behind each rasa; Natyashastra names 8 sthayi bhavas and 8 rasas.","Natyashastra lists 33 vyabhichari (sanchari) bhavas and 8 sattvika bhavas.","Shanta rasa was added as the ninth in later tradition, giving navarasa."],"ex":"Shringara rasa: sthayi bhava is rati (love). Vibhava: moonlight and the beloved. Anubhava: shy smile, sideways glance. Vyabhichari bhava: brief worry, eagerness. When combined well, the audience tastes shringara rasa, not just sees one emotion.","q":"rasa bhava theory Natyashastra explained hindi","kw":["rasa","bhava","sthayi bhava","rasa sutra"]},{"id":"folk-tribal-detailed","t":"Folk and Tribal Dances in Depth","s":"Folk and tribal dances reflect local life, beliefs and seasons; some are recognised by UNESCO.","n":["UNESCO lists of intangible cultural heritage include Chhau and Kalbelia (both 2010) and Garba of Gujarat (2023).","Theyyam (North Kerala) is a ritual form where performers are believed to embody deities.","Lavani (Maharashtra) uses fast rhythm with dholki; Ghoomar (Rajasthan) has graceful spinning in long skirts.","Tribal dances: Gaur Maria (Chhattisgarh), Hojagiri (Tripura), Wangala (Meghalaya), Santhali dances (Jharkhand and nearby).","Folk dances often use local instruments like dhol, madal, nagara and bamboo flutes."],"ex":"Chhau has three styles named after places: Seraikella (Jharkhand), Purulia (West Bengal) and Mayurbhanj (Odisha). Seraikella and Purulia use masks; Mayurbhanj dancers do not. This is a common exam question.","q":"folk dances tribal dances of India UNESCO Chhau Kalbelia","kw":["Chhau","Kalbelia","Theyyam","UNESCO","tribal dance"]},{"id":"body-conditioning","t":"Body Conditioning for Dancers","s":"Dancers need strength, flexibility, stamina and correct alignment to perform well and avoid injury.","n":["Core strength (stomach and back muscles) supports balance, spins and posture.","Leg strength and correct knee alignment over toes protect knees in deep stances like araimandi.","Flexibility comes from regular, gentle stretching after warming up.","Stamina: build with steady practice, skipping, swimming or brisk walking.","Yoga helps balance, breathing and body awareness; rest and good food help muscles recover."],"ex":"Simple routine 3 times a week: plank 3 x 30 seconds, wall-sit 3 x 30 seconds, calf raises 3 x 15, and gentle hamstring stretches after class. Over 6 weeks, a dancer finds araimandi easier to hold and spins more stable.","q":"strength and conditioning for dancers exercises","kw":["body conditioning","core strength","flexibility","injury prevention"]},{"id":"dance-history-india","t":"History of Dance in India","s":"Indian dance has a long history, from ancient sculptures to temple traditions, colonial decline and modern revival.","n":["The bronze 'Dancing Girl' from Mohenjo-daro (about 2500 BCE) is early evidence of dance culture.","Temple sculptures and texts show dance in worship and royal courts for centuries.","In colonial times, the anti-nautch campaign and social stigma harmed hereditary dancers, especially devadasis.","The Madras Devadasis (Prevention of Dedication) Act, 1947 ended temple dedication in Madras Presidency.","Revivalists like Rukmini Devi Arundale, E. Krishna Iyer and Vallathol brought classical dance to public stages and schools."],"ex":"The story of Bharatanatyam shows both gain and loss: revival made it respected and widely taught, but many hereditary dancers who preserved it for generations, like T. Balasaraswati's family tradition, struggled for recognition. Historians now study both sides.","q":"history of Indian classical dance revival devadasi","kw":["dance history","Mohenjo-daro","devadasi","revival"]}],"ug":[{"id":"classical-comparative","t":"Comparative Study of Classical Forms","s":"Comparing the eight classical forms shows their shared Natyashastra roots and very different regional styles.","n":["Basic stance: araimandi (Bharatanatyam), chowk and tribhangi (Odissi), straight upright posture (Kathak).","Music: Carnatic for Bharatanatyam, Kuchipudi and Mohiniyattam; Sopana-style music in Kerala forms; Hindustani for Kathak; Odissi music for Odissi.","Themes: mainly devotional and epic stories, plus secular themes in Kathak's courtly tradition.","Solo forms (Bharatanatyam, Odissi, Kathak, Mohiniyattam) and dance-drama forms (Kathakali, Kuchipudi traditionally, Sattriya).","Contemporary dancers also create new works using these vocabularies."],"ex":"A student makes a comparison table with columns: state, posture, music, costume, key items and major gurus. Filling it for all eight forms is excellent revision for UGC-NET Dance and helps see patterns, like the dance-drama roots of Kathakali, Kuchipudi and Sattriya.","q":"comparison of Indian classical dances UGC NET dance","kw":["classical dances","comparison","UGC NET dance","posture"]},{"id":"karanas-angaharas","t":"Karanas, Angaharas and Movement Theory","s":"Natyashastra's tandava lakshana chapter describes karanas and angaharas, the ancient units of dance movement.","n":["A karana combines hand, foot and body movement into one unit; there are 108.","Angaharas are sequences of karanas; the text lists 32.","Two karanas make a matrika; several make an angahara.","Charis are movements of a single leg; mandalas are standing positions.","Dancers like Padma Subrahmanyam have researched and reconstructed karanas from texts and sculptures."],"ex":"Researchers compare karana descriptions in the Natyashastra with carved panels at temples such as Chidambaram and Thanjavur. Where text and sculpture agree on limb positions, they test the movement on the body to rebuild the full karana.","q":"108 karanas angaharas Natyashastra explained","kw":["karana","angahara","chari","Padma Subrahmanyam"]},{"id":"choreography-basics","t":"Choreography: Principles","s":"Choreography is the art of designing dance movements and arranging them in space and time.","n":["Elements of dance: body, space, time and energy (or dynamics).","Space: levels (high, middle, low), directions, pathways and formations.","Time: tempo, rhythm, pause and stillness. Energy: strong, light, sharp or smooth.","Devices: motif (short movement idea), repetition, variation, canon (one after another) and unison.","Structure: beginning, development, climax and ending, like a story."],"ex":"Theme 'monsoon': motif - fingers falling like raindrops (light, sharp). Development - group performs it in canon, one after another, like rain spreading. Climax - strong, fast turns for a storm. Ending - slow movements at low level, as calm returns.","q":"choreography principles elements of dance space time energy","kw":["choreography","motif","canon","elements of dance"]},{"id":"laban-notation","t":"Movement Analysis and Notation","s":"Rudolf Laban's systems help describe, analyse and write dance movements, like musical notation for movement.","n":["Laban Movement Analysis studies Body, Effort, Shape and Space.","Effort has four factors: weight, time, space and flow.","Labanotation writes movement on a vertical staff read from bottom to top.","Benesh notation is another system, used especially in ballet.","Today, video plus written notes is the most common way to record choreography."],"ex":"Laban's effort actions: 'punch' is strong, sudden and direct; 'float' is light, sustained and indirect. A Kathakali warrior's attack resembles punching, while Mohiniyattam's swaying resembles floating. Analysts can compare styles using such terms.","q":"Laban movement analysis effort Labanotation basics","kw":["Laban","Labanotation","effort","movement analysis"]},{"id":"western-contemporary","t":"Western and Contemporary Dance","s":"Western dance includes ballet and modern dance; Indian contemporary dance blends traditions with new ideas.","n":["Ballet developed in European courts, with five basic foot positions and French terms.","Modern dance pioneers: Isadora Duncan (natural movement), Martha Graham (contraction and release).","Pina Bausch developed dance-theatre (Tanztheater) in Germany.","In India, Uday Shankar blended Indian and Western stage ideas in the 1930s.","Indian contemporary artists include Chandralekha, Astad Deboo and Mrinalini Sarabhai's Darpana Academy (founded 1949)."],"ex":"Chandralekha used Bharatanatyam and yoga movements but removed storytelling and decoration, focusing on the body's lines and energy. Her work 'Sharira' shows how a classical vocabulary can create something completely contemporary.","q":"modern contemporary dance history Uday Shankar Martha Graham","kw":["ballet","modern dance","Uday Shankar","contemporary dance"]},{"id":"dance-pedagogy","t":"Teaching Dance","s":"Dance teaching blends guru-shishya tradition with structured, safe and inclusive classroom methods.","n":["Guru-shishya parampara: close, long-term learning through imitation and correction.","Break movements into small parts, then join them gradually.","Give clear counts, demonstrate from different angles and use mirrors.","Adapt for different bodies, ages and abilities; never force flexibility.","Assess technique, rhythm, expression and understanding with simple rubrics."],"ex":"Teaching a Kathak chakkar to beginners: first practise the half-turn slowly on counts, then spotting (fixing the eyes on one point), then a full turn on 4 counts, then 2 counts. Step-by-step, students avoid dizziness and fall less often.","q":"how to teach dance pedagogy classroom beginners","kw":["dance pedagogy","guru-shishya","teaching","assessment"]},{"id":"stagecraft-production","t":"Stagecraft and Production","s":"A dance production needs planning of stage, lights, sound, costume, team and budget.","n":["Stage areas: upstage (back), downstage (front), stage left and stage right are from the performer's view.","Lighting sets mood: warm colours for joy, blue for night or sadness.","Sound check and rehearsals with live musicians or recorded tracks are essential.","A cue sheet lists every light, sound and entry change in order.","Production also needs publicity, ticketing, permissions and a budget."],"ex":"For a 60-minute show, a dancer plans: 6 items, 2 costume changes of 4 minutes each covered by musical interludes, a cue sheet of 25 light changes, and a technical rehearsal the day before. On the day, the show runs without gaps.","q":"stagecraft for dancers lighting stage directions production","kw":["stagecraft","lighting","cue sheet","production"]}],"pg":[{"id":"dance-aesthetics","t":"Aesthetics of Dance","s":"Dance aesthetics studies beauty, meaning and audience experience, drawing on Indian rasa theory and Western thought.","n":["Abhinavagupta's Abhinavabharati, a commentary on the Natyashastra, explains rasa as universalised experience (sadharanikaran).","Sahridaya is the sensitive, prepared spectator who can taste rasa.","Western aesthetics discusses form, expression and the dancer's body as both subject and object.","Modern questions: Can abstract dance carry rasa? How does gender shape the gaze?","Compare Indian and Western ideas critically, not as one better than another."],"ex":"In a padam about a heroine waiting for her lover, the audience does not feel personal sadness. Through sadharanikaran, the emotion becomes general and enjoyable, which is why people return to watch sad pieces again and again.","q":"aesthetics of dance rasa Abhinavagupta sadharanikaran","kw":["aesthetics","Abhinavagupta","sadharanikaran","sahridaya"]},{"id":"nayika-bheda","t":"Nayika Bheda and Literary Sources","s":"Nayika bheda classifies heroines by situation and mood, giving dancers rich material for abhinaya.","n":["The ashtanayika (eight heroines) are classified by situation in love, as described in Natyashastra tradition.","Examples: vasakasajja (prepared for the lover), virahotkanthita (longing in separation), khandita (angered by betrayal), abhisarika (going to meet the lover).","Others: swadhinabhartrika, kalahantarita, vipralabdha and proshitabhartrika.","Sources include Jayadeva's Gita Govinda (12th century), central to Odissi.","Dancers interpret these texts with personal and contemporary insight."],"ex":"Abhisarika nayika: the heroine slips out on a stormy night to meet her beloved. The dancer shows lightning, fear of snakes on the path, wet clothes and determination. One situation lets her display bhayanaka, shringara and veera moods together.","q":"ashtanayika nayika bheda in classical dance explained","kw":["nayika bheda","ashtanayika","Gita Govinda","abhinaya"]},{"id":"dance-anatomy-science","t":"Dance Science and Anatomy","s":"Dance science applies anatomy, physiology and psychology to improve performance and prevent injury.","n":["Key joints: hips (turnout), knees (alignment), ankles (jumps and footwork) and spine.","Common injuries: knee strain from forced turnout, ankle sprains, shin splints and lower back pain.","Training principles: progressive overload, rest and periodisation before shows.","Nutrition and hydration affect energy, bone health and recovery.","Performance psychology: managing stage fright with breathing, visualisation and routine."],"ex":"A dancer forces a deep araimandi by twisting the knees outward while the feet point further than the hips allow. Over months this strains the knees. Correct method: turn out only as far as the hips allow, and keep knees in line with toes.","q":"dance science anatomy injury prevention for dancers","kw":["dance science","anatomy","injury prevention","performance psychology"]},{"id":"dance-gender-society","t":"Dance, Gender and Society","s":"Dance reflects social structures of gender, caste and class; studying these helps us understand its history honestly.","n":["Hereditary communities like devadasis, nattuvanars and Kathak families preserved dance for centuries.","Colonial and reform movements stigmatised many hereditary performers.","Revival shifted dance to middle- and upper-class practitioners, changing who could perform.","Male dancers in female-dominated forms, and women in male traditions like Kathakali, challenge norms.","Scholars such as Davesh Soneji and others have written critical histories of these changes."],"ex":"Gotipua tradition of Odisha: boys dressed as girls dance in temple-related contexts. This fed into Odissi's modern revival. Studying Gotipua shows how gender roles in dance are cultural, not fixed by nature.","q":"dance gender caste devadasi history critical study","kw":["gender","devadasi","hereditary dancers","social history"]},{"id":"dance-therapy","t":"Dance Movement Therapy","s":"Dance movement therapy uses movement to support emotional, mental and physical health, guided by trained therapists.","n":["It treats body and mind as connected: changing movement can change mood.","Used with children with autism, older adults, people with depression and trauma survivors.","Sessions use improvisation, mirroring and group rhythm, not perfect technique.","Professionals train formally; this is different from a regular dance class.","Research uses before-after measures of mood, balance or social skills."],"ex":"In a session for older adults, the therapist plays a slow folk tune. Participants sit in a circle and copy each other's arm movements (mirroring). After 8 weekly sessions, researchers record improved mood scores and better balance in a simple test.","q":"dance movement therapy introduction India","kw":["dance therapy","mirroring","mental health","movement"]},{"id":"arts-management","t":"Arts Management and Careers","s":"Dancers can build careers in performance, teaching, choreography, research, therapy and arts management.","n":["Institutions: Sangeet Natak Akademi, Indian Council for Cultural Relations (ICCR), Ministry of Culture.","The Ministry of Culture runs scholarship and fellowship schemes for young artists and researchers.","UGC-NET in Dance qualifies for assistant professor roles and research fellowships.","Digital presence (videos, online classes) helps reach students and audiences.","Basic contracts, copyright of choreography and fair payment are important to understand."],"ex":"A Kuchipudi graduate plans her career: teaches evening classes, qualifies UGC-NET, applies to the Ministry of Culture's scholarship for young artists, and records short performance videos for an online portfolio. Several income streams make her career stable.","q":"career in dance India UGC NET dance scholarships","kw":["arts management","UGC NET","ICCR","dance careers"]}],"phd":[{"id":"dance-research-methods","t":"Research Methods in Dance","s":"Dance research uses textual, historical, ethnographic and practice-based methods to study movement and culture.","n":["Textual study: Sanskrit treatises like Natyashastra, Abhinaya Darpana and Sangita Ratnakara, with careful translation.","Archival research: old programmes, photographs, films, letters and newspaper reviews.","Ethnography: fieldwork with dancers and communities, interviews, observation and consent.","Practice-as-research: the researcher's own dancing becomes a method, with careful documentation and reflection.","Movement analysis using video and notation for detailed study."],"ex":"Research question: 'How has the presentation of Sattriya changed from sattra performance to urban stage?' Methods: fieldwork at sattras in Majuli, interviews with bhakats and urban teachers, comparison of old and new video recordings, and analysis of costume, time and audience.","q":"research methodology in dance PhD practice as research","kw":["dance research","ethnography","practice-as-research","archives"]},{"id":"historiography-dance","t":"Historiography of Indian Dance","s":"Historiography asks how dance histories were written, by whom, and what voices were left out.","n":["Early 20th-century histories often linked classical dance directly to ancient texts, sometimes skipping recent hereditary practice.","Critical scholars examine how 'classical' status was constructed, including for forms recognised later like Sattriya.","Oral histories of hereditary artists add missing voices.","Sources must be compared: texts, sculptures, colonial records and living memory.","Write with care: avoid both romantic glorification and simple blame."],"ex":"A researcher compares a 1930s magazine article praising Bharatanatyam's 'ancient purity' with oral interviews of descendants of hereditary dancers. The two sources give very different pictures, and the thesis analyses why.","q":"historiography of Indian classical dance critical studies","kw":["historiography","oral history","classical status","hereditary artists"]},{"id":"digital-dance-archives","t":"Digital Archiving and Technology","s":"Digital tools help record, preserve and analyse dance, but raise questions of ownership and access.","n":["High-quality video with multiple angles is the basic method of preservation.","Motion capture records exact body positions as 3D data for analysis.","Metadata (who, what, when, where, which item, which guru) makes archives searchable.","Rights and consent: dancers and communities must agree on how recordings are used.","Indian initiatives include archives at the Sangeet Natak Akademi and IGNCA (Indira Gandhi National Centre for the Arts)."],"ex":"A project records 50 elderly folk dancers of Jharkhand. Each video gets metadata in English and Hindi, plus a consent form explaining public or restricted access. Copies are returned to the village community, not kept only in a city archive.","q":"dance documentation digital archive motion capture research","kw":["digital archive","motion capture","metadata","IGNCA"]},{"id":"frontier-dance-research","t":"Frontier Areas in Dance Research","s":"New dance research connects movement with cognition, health, technology, ecology and global performance.","n":["Embodied cognition: how dancers think and remember through the body.","Dance and health: evidence for dance in Parkinson's care, ageing and mental health.","Intercultural performance: collaborations across Indian and global traditions, and questions of appropriation.","Screen dance and social media: how short-video platforms change folk and classical forms.","A good topic combines your dance practice, available sources and a real gap in literature."],"ex":"Possible thesis: 'Effect of 12 weeks of Bharatanatyam-based movement on balance in women over 60: a controlled study.' It needs ethical approval, a validated balance test, a comparison group and honest reporting of results.","q":"dance research topics PhD embodied cognition dance and health","kw":["embodied cognition","dance and health","screen dance","research topics"]}]},"order":20}],"exams":[{"id":"upsc-cse","name":"UPSC Civil Services","category":"Civil Services","body":"Union Public Service Commission","site":"https://upsc.gov.in","who":"Any graduate from a recognised university can apply; age limit and number of attempts depend on category, so check the latest notification.","stages":["Prelims: two objective papers (General Studies and CSAT); CSAT is qualifying.","Mains: written     if (t.dataset.ask) { A.confirm = t.dataset.ask; render(); return true; }
    if (t.dataset.lup || t.dataset.ldown) {
      startEdit(); var list = W_sub(A.sub).levels[A.lv], i = +(t.dataset.lup || t.dataset.ldown), j = t.dataset.lup ? i - 1 : i + 1;
      var tmp = list[i]; list[i] = list[j]; list[j] = tmp; change("Reordered lessons in " + SUB[A.sub].name + " · " + LV[A.lv].name); render(); return true;
    }
    if (t.dataset.lrm) {
      startEdit(); var l2 = W_sub(A.sub).levels[A.lv], k = l2.findIndex(function (x) { return x.id === t.dataset.lrm; }), gone = l2[k];
      l2.splice(k, 1); A.confirm = null; change("Removed lesson \"" + gone.t + "\" from " + SUB[A.sub].name + " · " + LV[A.lv].name); A.msg = ["ok", "Removed. Press Publish to apply, or Discard changes to undo."]; render(); return true;
    }
    if (t.dataset.srm) {
      startEdit(); var si = W.subjects.findIndex(function (x) { return x.id === t.dataset.srm; }), sg = W.subjects[si];
      W.subjects.splice(si, 1); A.confirm = null; if (A.sub === sg.id) A.sub = null; change("Removed subject " + sg.name); A.msg = ["ok", "Removed. Press Publish to apply, or Discard changes to undo."]; render(); return true;
    }
    if (t.dataset.erm) {
      startEdit(); var ei = W.exams.findIndex(function (x) { return x.id === t.dataset.erm; }), eg = W.exams[ei];
      W.exams.splice(ei, 1); A.confirm = null; change("Removed exam " + eg.name); A.msg = ["ok", "Removed. Press Publish to apply, or Discard changes to undo."]; render(); return true;
    }
    return false;
  }
  var discardAsk = false;
  function discard() {
    if (!discardAsk) { discardAsk = true; $("pub-discard").textContent = "Tap again to discard all"; setTimeout(function () { discardAsk = false; var b = $("pub-discard"); if (b) b.textContent = "Discard changes"; }, 4000); return; }
    discardAsk = false; $("pub-discard").textContent = "Discard changes";
    W = null; CHANGES = []; save("efe-draft", null); reindex(); applySettings(); pubbar(); A.msg = ["ok", "All unpublished changes were discarded."]; render();
  }

  // ---------- render ----------
  function render() {
    var v = $("view"), q = $("q").value.trim();
    if (state.view === "search" && q) v.innerHTML = viewSearch(q);
    else if (state.view === "subjects") v.innerHTML = viewSubjects();
    else if (state.view === "exams") v.innerHTML = viewExams();
    else if (state.view === "subject") v.innerHTML = viewSubject(state.a, state.b);
    else if (state.view === "exam") v.innerHTML = viewExam(state.a);
    else if (state.view === "admin") v.innerHTML = viewAdmin();
    else { state.view = "home"; v.innerHTML = viewHome(); }
    navCurrent();
    if (state.topic) { var el = document.getElementById("L-" + state.topic); if (el) { el.open = true; setTimeout(function () { el.scrollIntoView({ block: "start" }); window.scrollBy(0, -150); }, 30); } state.topic = null; }
    if (state.view === "admin") {
      var s1 = $("al-sub"); if (s1) s1.onchange = function () { A.sub = s1.value; A.editing = null; A.confirm = null; render(); };
      var s2 = $("al-lv"); if (s2) s2.onchange = function () { A.lv = s2.value; A.editing = null; A.confirm = null; render(); };
    }
  }

  function boot() {
    var root = $("efe-root");
    root.appendChild($("efe-shell").content.cloneNode(true));
    reindex(); applySettings();

    document.addEventListener("submit", onSubmit);
    document.addEventListener("click", function (e) {
      var t = e.target.closest("button, a"); if (!t) return;
      if (t.id === "pub-go") return publish();
      if (t.id === "pub-discard") return discard();
      if (state.view === "admin" && adminClick(t)) return;
      if (t.id === "go-home") { $("q").value = ""; return go("home"); }
      if (t.dataset.go) { $("q").value = ""; return go(t.dataset.go); }
      if (t.dataset.level) { pickedLevel = pickedLevel === t.dataset.level ? null : t.dataset.level; save("efe-level", pickedLevel); render(); return; }
      if (t.id === "clear-lv") { pickedLevel = null; save("efe-level", null); render(); return; }
      if (t.dataset.sub) { var topic = t.dataset.topic; $("q").value = ""; go("subject", t.dataset.sub, t.dataset.lv || null); if (topic) { state.topic = topic; render(); } return; }
      if (t.dataset.exam) { $("q").value = ""; return go("exam", t.dataset.exam); }
      if (t.dataset.lvtab) { go("subject", state.a, t.dataset.lvtab, true); return; }
      if (t.dataset.cat !== undefined && state.view === "exams") { examFilter = t.dataset.cat || null; render(); return; }
      if (t.dataset.vl) { vlang = t.dataset.vl; save("efe-vlang", vlang); var open = [].map.call(document.querySelectorAll("details.lesson[open]"), function (d) { return d.id; }); render(); open.forEach(function (id) { var d = document.getElementById(id); if (d) d.open = true; }); return; }
      if (t.dataset.done) {
        var k = t.dataset.done; if (done[k]) delete done[k]; else done[k] = 1; save("efe-done", done);
        var det = t.closest("details"); det.classList.toggle("done", !!done[k]);
        t.setAttribute("aria-pressed", !!done[k]); t.textContent = done[k] ? "Finished" : "Mark as finished";
        var s = SUB[state.a], lv = state.b, topics = s.levels[lv], fin = topics.filter(function (x) { return done[s.id + "/" + lv + "/" + x.id]; }).length;
        var pr = document.querySelector(".progress"); if (pr) pr.innerHTML = '<span class="pbar"><i style="width:' + Math.round(fin / topics.length * 100) + '%"></i></span>' + fin + " / " + topics.length + " finished";
        if (done[k]) toast("Lesson finished. Shabash!");
        return;
      }
      if (t.id === "copy-wa") {
        var num = "+" + String(cur().settings.whatsapp || "").replace(/\D/g, "");
        try { navigator.clipboard.writeText(num).then(function () { toast("Number copied"); }, selectNum); } catch (er) { selectNum(); }
      }
    });
    var st;
    $("q").addEventListener("input", function () {
      clearTimeout(st);
      st = setTimeout(function () {
        var q = $("q").value.trim();
        if (q.length >= 2) { var was = state.view; state = { view: "search" }; render(); if (was !== "search") window.scrollTo({ top: 0 }); }
        else if (state.view === "search") go("home");
      }, 160);
    });
    $("q").addEventListener("keydown", function (e) { if (e.key === "Escape") { $("q").value = ""; go("home"); } });
    function measureBar() { document.documentElement.style.setProperty("--barh", $("bar").offsetHeight + "px"); }
    window.addEventListener("resize", measureBar); measureBar();
    fromHash();

    // Owner-only admin: light up when the viewer can publish this page.
    if (window.claude && typeof window.claude.use === "function") {
      Promise.all([window.claude.use("artifact"), window.claude.use("user")]).then(function (r) {
        ART = r[0]; var user = r[1];
        if (!ART || !user) return;
        return user.canEdit().then(function (ok) {
          if (!ok) return;
          IS_ADMIN = true; $("n-admin").hidden = false;
          var dr = load("efe-draft", null);
          if (dr && dr.base === PUB.updated && dr.data && dr.changes && dr.changes.length) { W = dr.data; CHANGES = dr.changes; reindex(); applySettings(); pubbar(); if (state.view !== "admin") render(); }
          else if (dr) save("efe-draft", null);
          if (pendingAdmin) { pendingAdmin = false; go("admin"); }
        });
      }).catch(function () {});
    }
  }
  function selectNum() { var r = document.createRange(); r.selectNodeContents($("wa-num")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Select and copy the number"); }

  boot();
})();
</script>
</body></html>
