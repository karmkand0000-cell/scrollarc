 mutual funds are taxed as capital gains, with different rules for short and long term."],"ex":"You buy a Rs 1,000 item with 18% GST. GST = 18% x 1,000 = Rs 180. Bill = Rs 1,180. The shop deposits this Rs 180 with the government; you paid an indirect tax.","q":"income tax basics for students direct indirect tax pan itr hindi","kw":["income tax","GST","PAN","ITR","TDS"]},{"id":"investment-fraud","t":"Investment Frauds and Red Flags","s":"Guaranteed high returns, secret tips and pressure to invest fast are signs of investment fraud.","n":["Market-linked investments can never be guaranteed. 'Guaranteed 5% a month' is a big red flag.","Fake 'tip' groups on WhatsApp or Telegram pump a stock and dump it on followers.","Ponzi schemes pay old investors with new investors' money and always collapse.","Only SEBI-registered investment advisers and research analysts can give paid advice. Check registration on the SEBI website.","Never share demat login or OTP, and never transfer money to a person's account for 'trading'."],"ex":"A scheme promises 4% a month, guaranteed. That is 48% a year simple, or about 60% compounded (1.04^12 = 1.60). Safe options pay far less, so such a promise is a strong sign of fraud.","q":"investment fraud red flags ponzi scheme stock tips scam sebi hindi","kw":["investment fraud","Ponzi scheme","guaranteed returns","SEBI registered"]}],"ug":[{"id":"time-value-of-money","t":"Time Value of Money","s":"A rupee today is worth more than a rupee tomorrow because it can earn interest.","n":["Future Value FV = PV x (1 + r)^n. Present Value PV = FV / (1 + r)^n.","Discounting means bringing future money back to today's value.","An annuity is equal payments at regular intervals, like EMIs or pensions.","Effective annual rate rises with more frequent compounding.","Time value of money is the base of loans, bonds, valuation and capital budgeting."],"ex":"You will get Rs 1,10,000 after 1 year. At 10%, PV = 1,10,000 / 1.10 = Rs 1,00,000. Monthly compounding at 12% yearly: effective rate = (1.01)^12 - 1 = 12.68%.","q":"time value of money present value future value annuity bcom hindi","kw":["time value of money","present value","future value","annuity"]},{"id":"capital-budgeting","t":"Capital Budgeting","s":"Capital budgeting decides which long-term projects a firm should invest in.","n":["Net Present Value (NPV) = Present value of cash inflows - Initial investment. Accept if NPV is positive.","Internal Rate of Return (IRR) is the rate at which NPV becomes zero. Accept if IRR is above the cost of capital.","Payback period is the time to recover the investment. It ignores time value and later cash flows.","Profitability Index = PV of inflows / Initial investment. Accept if above 1.","Use cash flows, not accounting profit, and include only extra (incremental) cash flows."],"ex":"Invest Rs 1,00,000. Inflows Rs 60,000 in each of 2 years. At 10%: PV = 60,000 x 0.9091 + 60,000 x 0.8264 = 54,546 + 49,584 = Rs 1,04,130. NPV = 1,04,130 - 1,00,000 = Rs 4,130. Positive, so accept.","q":"capital budgeting npv irr payback period bcom hindi","kw":["capital budgeting","NPV","IRR","payback period"]},{"id":"cost-of-capital-structure","t":"Cost of Capital, Capital Structure and Leverage","s":"Firms raise money from equity and debt; each source has a cost, and the mix affects risk.","n":["Cost of debt after tax = Interest rate x (1 - Tax rate), because interest is tax-deductible.","Cost of equity is the return shareholders expect. It is higher than cost of debt because equity is riskier.","WACC (Weighted Average Cost of Capital) = weight of equity x cost of equity + weight of debt x after-tax cost of debt.","Leverage means using fixed costs or debt. It raises returns in good times and losses in bad times.","Theories include Modigliani-Miller, trade-off theory and pecking order theory."],"ex":"Equity 60% at 14%; debt 40% at 10% interest with 20% tax, so after-tax cost = 10% x 0.8 = 8%. WACC = 0.6 x 14% + 0.4 x 8% = 8.4% + 3.2% = 11.6%.","q":"cost of capital wacc capital structure leverage bcom hindi","kw":["WACC","cost of capital","capital structure","leverage"]},{"id":"working-capital-dividend","t":"Working Capital and Dividend Decisions","s":"Working capital keeps daily business running; dividend policy decides how much profit goes to shareholders.","n":["Net working capital = Current assets - Current liabilities.","Operating cycle = time from buying raw material to collecting cash from customers.","Too little working capital stops operations; too much wastes money.","Dividend decision: pay profits as dividend or retain them for growth.","Theories include Walter's model, Gordon's model and the MM irrelevance theory."],"ex":"Inventory period 60 days + Debtors period 45 days - Creditors period 30 days = Cash conversion cycle of 75 days. The firm must fund 75 days of operations from its own working capital.","q":"working capital management operating cycle dividend policy bcom hindi","kw":["working capital","operating cycle","dividend policy","cash conversion cycle"]},{"id":"financial-system-banking","t":"Indian Financial System and Banking","s":"The financial system connects savers with borrowers through institutions, markets, instruments and regulators.","n":["Parts: institutions (banks, NBFCs, insurers), markets (money and capital), instruments (deposits, bonds, shares) and regulators.","The RBI's Monetary Policy Committee sets the repo rate, the rate at which RBI lends to banks.","CRR is the share of deposits banks keep with RBI. SLR is the share kept in safe liquid assets like government securities.","Non-performing assets (NPAs) are loans where interest or principal is overdue for more than 90 days.","Regulators: RBI (banking), SEBI (securities), IRDAI (insurance), PFRDA (pensions)."],"ex":"A bank has Rs 100 crore deposits. If CRR is 4%, it keeps Rs 4 crore with RBI. The rest is available for SLR investments and lending, as per current RBI rules.","q":"indian financial system rbi monetary policy repo rate crr slr bcom hindi","kw":["financial system","repo rate","CRR","SLR","NPA"]},{"id":"securities-market-operations","t":"Securities Market Operations (NISM-type Basics)","s":"Covers how trades happen, settle and are regulated in India's securities market.","n":["Market intermediaries include stock brokers, depository participants, clearing corporations, and registrars. All must be registered with SEBI.","India moved to T+1 settlement for equities in 2023: shares and money are exchanged one working day after the trade.","KYC is mandatory. Client funds and securities must be kept separate from the broker's own.","Insider trading (using unpublished price-sensitive information) and market manipulation are offences under SEBI rules.","NISM conducts certification exams for people working in the securities market."],"ex":"An investor buys shares on Monday. Under T+1, they settle on Tuesday (if it is a working day). If Tuesday is a trading holiday, settlement moves to Wednesday.","q":"nism equity derivatives securities market foundation basics hindi","kw":["T+1 settlement","SEBI","insider trading","NISM","depository"]},{"id":"financial-markets-instruments","t":"Money and Capital Market Instruments","s":"Different instruments let governments and firms borrow for short or long periods.","n":["Money market (up to one year): Treasury bills, commercial paper, certificates of deposit and call money.","Capital market: shares, debentures, government securities (G-secs) and bonds.","Treasury bills are issued at a discount and repaid at face value; the difference is the return.","Yield to maturity (YTM) is the total yearly return if a bond is held till maturity.","Retail investors can buy G-secs directly through RBI Retail Direct."],"ex":"A 364-day T-bill with face value Rs 100 is bought for Rs 93. Return = 100 - 93 = Rs 7. Yield is about 7 / 93 x 100 = 7.53% for the year.","q":"money market instruments treasury bills commercial paper capital market bcom","kw":["treasury bill","commercial paper","G-sec","yield to maturity"]},{"id":"personal-finance-ethics","t":"Personal Financial Planning and Ethics","s":"A financial plan links goals, budget, insurance, investments and taxes into one clear roadmap.","n":["Steps: set goals, check current position, make a plan, act, and review every year.","Order: emergency fund and insurance first, then investments matched to goal time frames.","Mis-selling means selling an unsuitable product to earn commission. It is unfair and often against rules.","Advisers should disclose fees and conflicts of interest. SEBI separates advice from distribution for registered advisers.","Guaranteed high returns, pressure selling and unregistered entities are clear red flags."],"ex":"Goal: Rs 3,00,000 for a course in 3 years. Monthly saving needed without returns = 3,00,000 / 36 = Rs 8,334. With some interest, it will be a little less. Since it is a short goal, low-risk options suit it better.","q":"personal financial planning goal based investing basics hindi","kw":["financial planning","goals","mis-selling","investment adviser"]}],"pg":[{"id":"portfolio-theory","t":"Modern Portfolio Theory","s":"Harry Markowitz showed how to combine assets to get the best return for a given risk.","n":["Portfolio expected return is the weighted average of each asset's expected return.","Portfolio risk depends on each asset's risk and on how assets move together (correlation).","Low or negative correlation reduces total risk. This is the maths of diversification.","The efficient frontier shows portfolios with the highest return for each risk level.","The Sharpe ratio = (Portfolio return - Risk-free rate) / Standard deviation measures return per unit of risk."],"ex":"50% in Asset A (return 12%) and 50% in B (return 8%). Expected return = 0.5 x 12% + 0.5 x 8% = 10%. If the portfolio's SD is 10% and risk-free rate is 6%, Sharpe = (10 - 6) / 10 = 0.4.","q":"markowitz portfolio theory efficient frontier sharpe ratio lecture","kw":["portfolio theory","Markowitz","efficient frontier","Sharpe ratio","correlation"]},{"id":"capm-asset-pricing","t":"CAPM and Asset Pricing","s":"CAPM links an asset's expected return to its market risk, measured by beta.","n":["Systematic risk affects the whole market and cannot be diversified away. Unsystematic risk is company-specific.","Beta measures how much a stock moves with the market. Beta 1.2 means 20% more movement than the market.","CAPM: Expected return = Risk-free rate + Beta x (Market return - Risk-free rate).","The Security Market Line plots expected return against beta.","Multi-factor models, like Fama-French, add size, value and other factors."],"ex":"Risk-free rate 6%, market return 12%, beta 1.2. Expected return = 6% + 1.2 x (12% - 6%) = 6% + 7.2% = 13.2%.","q":"capm beta security market line explained lecture","kw":["CAPM","beta","systematic risk","Fama-French"]},{"id":"valuation","t":"Equity Valuation","s":"Valuation estimates what a business or share is truly worth using cash flows or comparisons.","n":["DCF (Discounted Cash Flow) values a firm as the present value of its future free cash flows.","Gordon Growth Model: Price = Next year's dividend / (Required return - Growth rate). Works only when growth is below required return.","Relative valuation uses multiples like P/E, EV/EBITDA and P/B compared with peers.","Terminal value often forms a large part of DCF value, so assumptions matter a lot.","Valuation is an estimate, not a fact. Test results with different assumptions."],"ex":"Next year's dividend Rs 10, required return 12%, growth 7%. Price = 10 / (0.12 - 0.07) = 10 / 0.05 = Rs 200.","q":"equity valuation dcf gordon growth model relative valuation lecture","kw":["valuation","DCF","Gordon growth model","P/E ratio","terminal value"]},{"id":"futures-forwards","t":"Derivatives: Forwards and Futures","s":"Derivatives are contracts whose value comes from an underlying asset like a share, index, currency or commodity.","n":["A forward is a private agreement to buy or sell later at a fixed price.","A futures contract is standardised and traded on an exchange, with a clearing corporation guaranteeing settlement.","Traders pay margin and gains or losses are settled daily (mark-to-market).","Futures are used for hedging (reducing risk) and speculation (betting on price moves).","In India, equity derivatives trade on NSE and BSE and are regulated by SEBI. Leverage magnifies losses too."],"ex":"You buy one futures lot of 100 units at Rs 1,000. Price rises to Rs 1,050. Profit = (1,050 - 1,000) x 100 = Rs 5,000. If it falls to Rs 950, loss = Rs 5,000.","q":"futures and forwards derivatives basics mark to market margin lecture","kw":["derivatives","futures","forwards","margin","hedging"]},{"id":"options","t":"Options and Option Pricing","s":"An option gives the right, but not the duty, to buy or sell at a fixed price.","n":["A call option gives the right to buy; a put option gives the right to sell, at the strike price.","The buyer pays a premium. The buyer's loss is limited to the premium; the seller's risk can be very large.","Option value = intrinsic value + time value.","Black-Scholes and binomial models are used to price options. Key inputs: price, strike, time, volatility, interest rate.","Put-call parity links prices of calls, puts, the share and a risk-free bond."],"ex":"Buy a call with strike Rs 100 for premium Rs 5. At expiry, share = Rs 120. Payoff = 120 - 100 = Rs 20. Profit = 20 - 5 = Rs 15 per share. If share is Rs 95, the call expires worthless and loss = Rs 5.","q":"options call put payoff black scholes model lecture","kw":["options","call option","put option","Black-Scholes","premium"]},{"id":"risk-management","t":"Financial Risk Management","s":"Risk management identifies, measures and controls market, credit, liquidity and operational risks.","n":["Market risk: losses from price changes. Credit risk: borrower may not repay. Liquidity risk: cannot sell or fund in time.","Value at Risk (VaR) estimates the maximum likely loss over a period at a confidence level.","Stress testing checks what happens in extreme but possible events.","Banks follow Basel III capital rules, applied in India by the RBI.","Hedging with derivatives, diversification and limits are main tools."],"ex":"Portfolio Rs 1 crore, daily SD 1%. One-day 95% VaR (normal approx.) = 1.65 x 1% x 1,00,00,000 = Rs 1,65,000. So on about 95% of days, loss should not exceed Rs 1.65 lakh.","q":"value at risk var financial risk management basel lecture","kw":["risk management","Value at Risk","credit risk","Basel III","stress testing"]},{"id":"behavioural-finance","t":"Behavioural Finance","s":"Behavioural finance studies how human biases cause people and markets to act irrationally.","n":["Prospect theory (Kahneman and Tversky) shows that losses hurt more than equal gains feel good.","Common biases: overconfidence, herding, anchoring, loss aversion and confirmation bias.","Disposition effect: investors sell winners too early and hold losers too long.","Bubbles and crashes can come from herding and fear.","Fraudsters exploit these biases with fear of missing out (FOMO) and fake guaranteed returns."],"ex":"An investor buys a stock at Rs 500. It falls to Rs 350, but he refuses to sell, waiting to 'get back Rs 500'. Rs 500 is an anchor; his decision should rely on the company's future, not his buying price.","q":"behavioural finance biases prospect theory lecture","kw":["behavioural finance","prospect theory","loss aversion","herding"]}],"phd":[{"id":"empirical-finance-methods","t":"Empirical Methods in Finance","s":"Finance research tests theories using large data sets and careful statistics.","n":["Common methods: time-series regression, panel regressions, Fama-MacBeth regressions and GARCH for volatility.","Standard errors must handle clustering and heteroskedasticity to avoid false conclusions.","Endogeneity is a key problem. Tools include instrumental variables, difference-in-differences and regression discontinuity.","Indian data sources include exchange data, RBI databases and CMIE Prowess.","Pre-register ideas where possible and avoid data mining (p-hacking)."],"ex":"A researcher regresses monthly stock returns on beta and size across Indian firms each month (Fama-MacBeth), then averages the slopes over 15 years to test if size is priced.","q":"empirical finance econometrics fama macbeth panel data phd lecture","kw":["empirical finance","Fama-MacBeth","endogeneity","GARCH"]},{"id":"event-studies","t":"Event Study Methodology","s":"Event studies measure how security prices react to news like earnings, mergers or policy changes.","n":["Define the event date and an event window, such as 5 days before to 5 days after.","Estimate normal return using a market model over an earlier estimation window.","Abnormal return (AR) = Actual return - Expected return. Add ARs to get cumulative abnormal return (CAR).","Test whether average CAR across firms is statistically different from zero.","Event studies test market efficiency and the value effect of corporate decisions."],"ex":"On a merger announcement day, a stock returns 3% while the market model predicts 1%. AR = 3% - 1% = 2%. Over 3 days ARs are 2%, 0.5% and -0.5%; CAR = 2 + 0.5 - 0.5 = 2%.","q":"event study methodology abnormal return car finance research","kw":["event study","abnormal return","CAR","market efficiency"]},{"id":"asset-pricing-research","t":"Asset Pricing Research","s":"Asks why different assets earn different returns and tests factor models and anomalies.","n":["Factor models: CAPM, Fama-French three and five factor, and momentum.","Anomalies are return patterns not explained by models, like momentum or low volatility effects.","Researchers test whether anomalies survive transaction costs and out-of-sample checks.","Machine learning methods are now used to predict returns, but overfitting is a serious risk."],"ex":"A study forms Indian stock portfolios sorted by past 12-month returns. If winners beat losers by a margin that CAPM and Fama-French factors cannot explain, it reports a momentum anomaly.","q":"asset pricing research factor models anomalies phd finance","kw":["asset pricing","factor models","anomalies","momentum"]},{"id":"corporate-finance-research","t":"Empirical Corporate Finance","s":"Studies how firms choose investment, financing, payouts and governance, using causal methods.","n":["Key questions: what drives capital structure, investment, cash holdings and dividend choices.","Policy changes, like new governance rules, give natural experiments for causal research.","Difference-in-differences compares affected and unaffected firms before and after a change.","India-specific themes: business groups, promoter ownership, and insolvency reform under the IBC, 2016."],"ex":"After the IBC (2016), a study compares how borrowing costs changed for firms more exposed to creditor-friendly rules versus less exposed firms, using difference-in-differences.","q":"empirical corporate finance research difference in differences phd","kw":["corporate finance","natural experiment","IBC","business groups"]},{"id":"frontier-finance","t":"Frontier Areas: Fintech, Climate and Household Finance","s":"New finance research studies digital payments, climate risk, and how households save and borrow.","n":["Fintech research covers UPI, digital lending, robo-advice and their effects on inclusion.","Climate finance studies how climate risk is priced and how green bonds work.","Household finance studies saving, debt, insurance and investing mistakes of real families.","Market microstructure studies trading, liquidity and high-frequency and algorithmic trading.","Fraud and financial literacy research helps design better protection for first-time investors."],"ex":"A researcher uses district-level UPI data and bank records to test whether areas with faster UPI growth saw more small-business credit, controlling for income and bank branches.","q":"fintech climate finance household finance research phd","kw":["fintech","climate finance","household finance","market microstructure"]}]},"order":17},{"id":"education","name":"Education & Teaching","nameHi":"शिक्षाशास्त्र","group":"education","blurb":"Learn how people learn: study skills for students, and teaching, child development and education research for future teachers.","levels":{"6-8":[{"id":"how-we-learn","t":"How Your Brain Learns","s":"Your brain grows stronger every time you practise, just like a muscle grows with exercise.","n":["The brain has billions of nerve cells. When you learn, connections between them become stronger.","Mistakes are part of learning. Each mistake shows your brain what to fix.","A growth mindset means believing 'I cannot do this yet', not 'I can never do this'.","Learning sticks better when you understand the meaning, not just memorise words.","Sleep, water, food and play help the brain learn. A tired brain forgets quickly."],"ex":"Ravi could not ride a cycle on day one. He fell many times, but practised daily. By day ten he rode easily. Maths works the same way. Doing 5 sums daily for a month builds skill more than 50 sums in one night.","q":"how brain learns growth mindset for students hindi","kw":["learning","growth mindset","brain","practice"]},{"id":"active-recall","t":"Active Recall: Test Yourself","s":"Active recall means closing the book and trying to remember. It is one of the strongest study methods.","n":["Reading again and again feels easy, but you forget quickly.","Instead, read a page, close the book and say or write what you remember.","Make question cards: question on the front, answer on the back.","Check what you missed and try again. Struggling a little helps memory grow.","Teach a friend or a younger sibling. If you can explain it simply, you have learnt it."],"ex":"Sana reads the Science chapter on 'Food: Where Does It Come From?'. She closes the book and writes 5 points from memory. She remembers 3. She opens the book, learns the missing 2, and tests herself again the next day.","q":"active recall study technique for students hindi","kw":["active recall","self testing","flashcards","study skills"]},{"id":"memory-tricks","t":"Memory Tricks and Spaced Revision","s":"Memory tricks and revising after gaps help you remember facts for a long time.","n":["We forget quickly after learning. Psychologist Hermann Ebbinghaus showed this as the forgetting curve.","Spaced revision: revise after 1 day, 3 days, 1 week and 1 month. Each revision makes memory last longer.","Mnemonics are memory tricks, like making a sentence from first letters.","Make pictures in your mind or draw small diagrams. The brain remembers images well.","Link new facts to things you already know."],"ex":"To remember the planets in order (Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune), use: 'My Very Educated Mother Just Served Us Noodles.' Each first letter matches a planet.","q":"memory techniques spaced repetition students hindi","kw":["memory","mnemonics","spaced repetition","forgetting curve"]},{"id":"time-management-school","t":"Managing Your Time","s":"Good time management means planning your day so you have time for study, play, rest and family.","n":["Make a simple timetable for weekdays and weekends. Keep it realistic.","Pomodoro method: study 25 minutes, then take a 5-minute break. After 4 rounds, take a longer break.","Do the hardest subject when your mind is fresh, often in the morning.","Keep the phone away while studying. Every notification breaks focus.","Tick off tasks in a notebook. Seeing progress keeps you motivated."],"ex":"Meena has 2 hours after school. Plan: 25 min Maths, 5 min break, 25 min Science, 5 min break, 25 min English reading, 5 min break, then 30 min play. She finishes homework and still plays every day.","q":"time management for students pomodoro technique hindi","kw":["time management","pomodoro","timetable","focus"]},{"id":"note-making","t":"Making Good Notes","s":"Good notes are short, in your own words and easy to revise before exams.","n":["Do not copy the whole book. Write only key ideas, words and examples.","Use headings, bullet points, arrows and boxes.","Mind maps put the main topic in the centre and branches for sub-topics.","Use 2 or 3 colours: one for headings, one for definitions, one for examples.","Leave space to add points later when the teacher explains more."],"ex":"Topic 'Water Cycle' as a mind map: centre 'Water Cycle'; branches 'Evaporation (sun heats water)', 'Condensation (clouds form)', 'Precipitation (rain)', 'Collection (rivers, lakes)'. One page covers the whole chapter for quick revision.","q":"how to make notes mind map students hindi","kw":["notes","mind map","revision","study skills"]},{"id":"exam-prep-school","t":"Getting Ready for Exams","s":"Smart exam preparation starts early, uses practice papers and keeps the mind calm.","n":["Start revising at least 3 to 4 weeks before exams, not the night before.","Solve old question papers and sample papers. You learn the question style.","Practise writing answers in the given time.","On exam day, read all questions first and start with the ones you know best.","Sleep well the night before. A rested brain remembers better than a tired one."],"ex":"Arjun has a 3-hour paper with 80 marks. That is about 2 minutes per mark, leaving 20 minutes to read and check. So a 5-mark question should take about 10 minutes. He wears a watch and keeps to this plan.","q":"exam preparation tips for class 6 7 8 students hindi","kw":["exam preparation","sample papers","revision","exam tips"]},{"id":"asking-questions-reading","t":"Asking Questions and Reading Well","s":"Good learners ask questions and read with attention. Both make learning deeper and more interesting.","n":["There is no silly question. Asking shows you are thinking.","Before reading, look at headings and pictures to guess what the chapter is about.","While reading, underline new words and find their meaning.","After reading, ask: what was the main idea? What surprised me?","Read something you enjoy every day, like stories, newspapers or comics, in any language."],"ex":"In a lesson on plants, Kiran asks, 'Why are leaves green?' The teacher explains chlorophyll. Kiran now remembers the whole topic better because it answered her own question.","q":"reading skills for students how to read a chapter hindi","kw":["reading skills","curiosity","questions","vocabulary"]}],"9-10":[{"id":"learning-science","t":"The Science of Effective Learning","s":"Research shows some study methods work far better than others. Use the proven ones.","n":["Strong methods: practice testing (active recall) and spaced practice.","Interleaving: mix different types of problems in one session instead of doing one type only.","Elaboration: ask 'why' and 'how', and connect ideas to real life.","Weak methods: re-reading many times and highlighting everything. They feel productive but give little gain.","Feynman technique: explain the topic in simple words as if to a child, then fill the gaps you discover."],"ex":"For Class 10 Trigonometry, Neha mixes sin, cos and tan problems instead of doing 20 sin problems in a row. In the test, she quickly identifies which ratio each question needs, because she practised choosing, not just repeating.","q":"best study techniques science backed active recall interleaving hindi","kw":["interleaving","Feynman technique","spaced practice","elaboration"]},{"id":"sq3r-reading","t":"SQ3R Reading Method","s":"SQ3R is a five-step method to read textbook chapters actively and remember them better.","n":["S = Survey: skim the headings, pictures, bold words and summary.","Q = Question: turn each heading into a question.","R1 = Read: read the section to answer your question.","R2 = Recite: close the book and say or write the answer in your own words.","R3 = Review: at the end, go over all questions again, and revise after a few days."],"ex":"History chapter 'The French Revolution'. Heading: 'The Outbreak of the Revolution'. Question: 'What caused the Revolution to start in 1789?' Read the section, then recite causes like debts, taxes and food shortages. Review all headings at the end.","q":"SQ3R reading method explained hindi","kw":["SQ3R","reading method","textbook","comprehension"]},{"id":"time-management-boards","t":"Time Management for Board Exams","s":"Class 10 boards need a long-term plan, weekly goals and daily habits.","n":["List all chapters of each subject. Mark them strong, average or weak.","Make a monthly plan to finish the syllabus 2 months before boards, leaving time for revision.","Eisenhower matrix: sort tasks into urgent-important, important-not-urgent, urgent-not-important and neither.","Most real progress comes from 'important but not urgent' work, like daily revision.","Fix a weekly 'catch-up' slot for anything left unfinished."],"ex":"Rahul has 120 days until boards and 60 chapters in total. Plan: finish 1 chapter per day for 60 days. Next 40 days: revise 2 chapters per day with sample questions (80 revisions, all chapters revised once plus weak ones twice). Last 20 days: full papers.","q":"class 10 board exam study plan timetable hindi","kw":["board exams","study plan","Eisenhower matrix","time management"]},{"id":"concentration-stress","t":"Focus, Stress and Well-Being","s":"A calm, healthy mind studies better. Learn to manage distractions and exam stress.","n":["Keep a fixed study place, clean and quiet if possible.","Put the phone in another room or use focus mode while studying.","Some stress is normal and can help you work. Too much stress blocks memory.","Simple calm-down tool: breathe in for 4 counts, hold for 4, breathe out for 4, hold for 4. Repeat 4 times.","Talk to a parent, teacher or friend when worried. The Tele-MANAS helpline 14416 offers free mental health support in India."],"ex":"Before her Science paper, Pooja's hands shake. She does 4 rounds of box breathing, then reads the easiest question first. Her heartbeat slows and she starts writing confidently.","q":"exam stress management tips for students hindi","kw":["concentration","exam stress","well-being","breathing"]},{"id":"answer-writing","t":"Writing Good Answers","s":"Good answers are clear, well-organised and match the marks given for the question.","n":["Read the question twice. Underline key words like 'explain', 'compare', 'list'.","Match length to marks: a 1-mark answer is one line; a 5-mark answer needs about 5 clear points.","Use headings, points and underline key terms. Examiners read quickly.","Add diagrams, examples, formulas and units where suitable.","Leave 10 to 15 minutes at the end to check answers and question numbers."],"ex":"Q (3 marks): 'Give three differences between arteries and veins.' Best format: a small table with 3 rows: (1) carry blood away from heart vs towards heart, (2) thick elastic walls vs thin walls, (3) no valves (except at the start) vs valves present. Clear and quick to mark.","q":"how to write answers in board exam presentation tips hindi","kw":["answer writing","presentation","board exams","marks"]},{"id":"goal-setting-motivation","t":"Goals and Motivation","s":"Clear goals and small daily wins keep you motivated through a long school year.","n":["SMART goals are Specific, Measurable, Achievable, Relevant and Time-bound.","Break big goals into weekly and daily tasks.","Motivation comes and goes. Habits and routine carry you on low days.","Track progress: a chart of chapters done or marks in weekly tests.","Reward yourself after reaching small goals, like a favourite snack or a game."],"ex":"Vague goal: 'I will improve in Maths.' SMART goal: 'I will raise my Maths score from 55 to 70 in the December test by solving 10 textbook problems daily for 8 weeks.'","q":"SMART goals for students motivation hindi","kw":["SMART goals","motivation","habits","progress tracking"]},{"id":"digital-learning-skills","t":"Learning Online Wisely","s":"Free online resources can help you learn, but you must choose good sources and stay focused.","n":["Government platforms like DIKSHA and ePathshala offer free NCERT textbooks and lessons.","Watch a video with your notebook open. Pause and try the problem before seeing the solution.","Check that a source matches your syllabus and board.","Limit scrolling: decide what you will watch before opening the app.","Online learning works best together with your textbook and practice."],"ex":"Ankit is stuck on 'quadratic equations'. He scans the QR code in his NCERT textbook, which opens a DIKSHA video for that exact chapter. He pauses at each example, solves it himself, then checks.","q":"DIKSHA app ePathshala how to use for students","kw":["DIKSHA","ePathshala","online learning","NCERT"]}],"11-12":[{"id":"choosing-stream-career","t":"Choosing a Career Path","s":"Career choice should match your interests, abilities and values, not only what others say.","n":["Know yourself: what subjects you enjoy, what you are good at, and what kind of work you like.","Holland's RIASEC model groups interests as Realistic, Investigative, Artistic, Social, Enterprising and Conventional.","Explore many careers: talk to people in those jobs, watch real work videos, try internships.","Every stream has many paths. Science, Commerce and Arts all lead to good careers.","Consider cost, time, job demand and your family situation, and keep a backup plan."],"ex":"Sunita loves biology and helping people, but cannot afford a long MBBS preparation. She explores nursing, pharmacy, physiotherapy and medical lab technology. She picks BSc Nursing with a government college option and a scholarship, matching both interest and situation.","q":"career guidance after class 12 all streams hindi","kw":["career guidance","RIASEC","career options","streams"]},{"id":"entrance-exams","t":"Entrance Exams and Admissions","s":"Many Indian colleges admit students through national entrance exams. Know them early and prepare smartly.","n":["JEE Main and Advanced: engineering, including IITs and NITs.","NEET-UG: medical courses like MBBS and BDS, and related programmes.","CUET-UG: admission to central universities and many other universities for most UG courses.","CLAT for law, NDA for defence, NIFT and NID for design, and others for specific fields.","Always check the official website (most national exams are run by NTA) for dates and rules. Avoid fake agents."],"ex":"Imran wants a BA in History at a central university. He finds that it requires CUET-UG. He checks the subject combinations on the university website, registers on the official NTA portal, and prepares the History and language papers along with his Class 12 boards.","q":"entrance exams after 12th complete list JEE NEET CUET","kw":["entrance exams","CUET","JEE","NEET","NTA"]},{"id":"learning-styles","t":"Learning Styles: What Research Says","s":"People have learning preferences, but research shows mixing many methods works better than matching one style.","n":["The VARK model names four preferences: Visual, Auditory, Read/Write and Kinesthetic.","Many students say they are 'visual learners' or 'auditory learners'.","However, research has not found that teaching only in a person's preferred style improves learning.","What helps everyone: combining words with pictures (dual coding), practice, examples and doing activities.","Use your preference for comfort, but choose methods that fit the content: maps for geography, practice for maths."],"ex":"Rohan thinks he learns only by listening. For Chemistry, he listens to the lecture, draws the structure of benzene, writes the reaction steps, and builds a model with clay. Using all channels, he remembers far better than by listening alone.","q":"learning styles VARK myth explained","kw":["learning styles","VARK","dual coding","multiple methods"]},{"id":"multiple-intelligences","t":"Multiple Intelligences","s":"Howard Gardner suggested intelligence is not one thing; people can be smart in many different ways.","n":["Gardner (1983) listed linguistic, logical-mathematical, spatial, musical, bodily-kinesthetic, interpersonal and intrapersonal intelligences.","He later added naturalist intelligence, making eight.","Marks in one subject do not show all your talents.","Knowing your strengths can guide hobbies, projects and careers.","Psychologists still debate the theory, but it reminds teachers to value different abilities."],"ex":"In one class: Aisha writes great stories (linguistic), Dev solves puzzles fast (logical), Lata draws maps easily (spatial), Arif is the best footballer (bodily-kinesthetic), and Kavya resolves fights between friends (interpersonal). Each is intelligent in a different way.","q":"Howard Gardner multiple intelligences theory hindi","kw":["multiple intelligences","Howard Gardner","talents","strengths"]},{"id":"scholarships-skills","t":"Scholarships and Skill Courses","s":"Money should not stop education. India has many scholarships and free skill programmes.","n":["The National Scholarship Portal (scholarships.gov.in) lists many central and state scholarships.","Schemes exist for SC, ST, OBC, minority, girl students and students with disabilities, as well as merit-based awards.","Keep documents ready: income certificate, caste certificate if applicable, marksheets, bank account linked to Aadhaar.","ITIs, polytechnics and Skill India programmes offer job-ready courses.","Never pay an agent to 'get' you a scholarship. Applications on official portals are free."],"ex":"Pinki, a first-generation learner, scores 85% in Class 12. She registers on the National Scholarship Portal, checks schemes she is eligible for, uploads documents and applies before the deadline. The money reaches her bank account directly through DBT.","q":"national scholarship portal how to apply hindi","kw":["scholarships","NSP","Skill India","ITI"]},{"id":"self-study-habits","t":"Self-Study and Independent Learning","s":"In Class 11-12 and college, you must learn to study on your own, without someone checking daily.","n":["Plan weekly: what topics, which problems, which revision.","Use metacognition: think about your own thinking. Ask 'Do I really understand this, or does it just look familiar?'","Keep an error log: note every mistake from tests and the correct method.","Use free resources like NCERT, NPTEL, SWAYAM and library books.","Join or form a study group for discussion, but do your own practice first."],"ex":"Kabir keeps an error log for Physics. Entry: 'Projectile question - forgot to split velocity into components - remember u cos theta and u sin theta.' Before each test he reads the log and stops repeating old mistakes.","q":"self study tips class 11 12 how to study alone","kw":["self study","metacognition","error log","SWAYAM"]},{"id":"communication-soft-skills","t":"Communication and Soft Skills","s":"Soft skills like speaking, listening, teamwork and confidence are needed in every career.","n":["Listening fully before replying is the base of good communication.","Practise speaking: explain a topic to family for 2 minutes every day.","Write clearly: short sentences, one idea per paragraph.","Teamwork means sharing work, respecting others and meeting deadlines.","Interview basics: research the place, prepare examples from your life, dress neatly and be on time."],"ex":"In a group project on water saving, Neeraj listens to all ideas, divides tasks (survey, poster, report), and sets a deadline. The group finishes on time and presents confidently. His teamwork skill becomes a strong example for future interviews.","q":"soft skills for students communication skills hindi","kw":["soft skills","communication","teamwork","interview"]}],"ug":[{"id":"child-development","t":"Child Development: Principles and Stages","s":"Child development studies how children grow physically, mentally, emotionally and socially from birth to adolescence.","n":["Growth means physical increase (height, weight); development means overall change in abilities and quality.","Principles: development is continuous, follows a sequence, goes from general to specific, and differs from child to child.","Directions: cephalocaudal (head to toe) and proximodistal (centre of body outward).","Both heredity (nature) and environment (nurture) shape development; they interact.","Stages: infancy, early childhood, later childhood and adolescence, each with typical needs."],"ex":"A baby controls head movement first, then sitting, then walking. This is cephalocaudal development. The baby also moves the whole arm before it can pick up a small grain with fingers: proximodistal development. Both are frequent CTET questions.","q":"child development and pedagogy CTET principles of development","kw":["child development","heredity","environment","cephalocaudal"]},{"id":"piaget","t":"Piaget's Cognitive Development Theory","s":"Jean Piaget said children actively build knowledge and think differently at four stages.","n":["Sensorimotor (0-2 years): learns through senses and actions; develops object permanence.","Pre-operational (2-7 years): symbolic play and language; egocentrism; lacks conservation.","Concrete operational (7-11 years): logical thinking about real objects; conservation and classification.","Formal operational (11 years and above): abstract and hypothetical reasoning.","Key ideas: schema, assimilation (fitting new info into old schema), accommodation (changing the schema) and equilibration."],"ex":"Pour equal water into a short wide glass and a tall thin glass. A 5-year-old says the tall glass has more: no conservation (pre-operational). An 8-year-old says both are equal because nothing was added: conservation (concrete operational).","q":"Piaget cognitive development theory CTET hindi","kw":["Piaget","schema","conservation","stages of development"]},{"id":"vygotsky-bruner","t":"Vygotsky and Bruner","s":"Vygotsky stressed social learning and the ZPD; Bruner stressed discovery learning and a spiral curriculum.","n":["Vygotsky: learning happens first through social interaction, then inside the child's mind.","Zone of Proximal Development (ZPD): the gap between what a child can do alone and with help.","Scaffolding: temporary support from a More Knowledgeable Other (MKO), removed gradually. The term came from Wood, Bruner and Ross (1976).","Bruner's modes of representation: enactive (action), iconic (images) and symbolic (language, symbols).","Bruner's spiral curriculum: revisit topics at higher levels as the child grows; supports discovery learning."],"ex":"Teaching fractions with Bruner's modes: first children cut a real roti into 4 pieces (enactive), then draw circles divided into 4 (iconic), then write 1/4 (symbolic). The teacher gives hints only when a child is stuck, using Vygotsky's scaffolding.","q":"Vygotsky ZPD scaffolding Bruner theory CTET hindi","kw":["Vygotsky","ZPD","scaffolding","Bruner","spiral curriculum"]},{"id":"behaviourism","t":"Behaviourist Theories: Pavlov, Thorndike, Skinner","s":"Behaviourism explains learning as changes in observable behaviour caused by stimuli, responses and consequences.","n":["Pavlov's classical conditioning: a neutral stimulus (bell) paired with food came to produce salivation.","Thorndike's trial and error learning and laws of readiness, exercise and effect.","Skinner's operant conditioning: behaviour is shaped by its consequences.","Positive reinforcement adds something pleasant; negative reinforcement removes something unpleasant. Both increase behaviour. Punishment decreases it.","Classroom use: praise, reward charts, immediate feedback, and breaking skills into small steps."],"ex":"A teacher praises Rani each time she submits homework on time (positive reinforcement). Another student is excused from extra cleaning duty after a week of punctuality (negative reinforcement). Both behaviours increase. Negative reinforcement is not punishment, a common exam trap.","q":"Skinner operant conditioning Pavlov Thorndike CTET hindi","kw":["Skinner","Pavlov","Thorndike","reinforcement","behaviourism"]},{"id":"pedagogy-inclusive","t":"Pedagogy and Inclusive Education","s":"Good pedagogy puts the child at the centre, and inclusive education ensures every child learns together.","n":["Child-centred pedagogy: activity, discussion, connecting to the child's life, and constructing knowledge.","Inclusive education means children with and without disabilities, and from all backgrounds, learn in the same classroom with support.","The Rights of Persons with Disabilities Act, 2016 recognises 21 types of disabilities.","Learning disabilities: dyslexia (reading), dysgraphia (writing), dyscalculia (maths).","Strategies: differentiated instruction, peer learning, Universal Design for Learning, and assistive tools like large print or audio."],"ex":"A Class 4 student with low vision sits in the front, gets large-print worksheets, and a peer buddy reads the board aloud. The teacher uses clay models in a lesson on shapes. All children benefit, not just one. This is inclusion.","q":"inclusive education CTET child centred pedagogy hindi","kw":["inclusive education","RPwD Act 2016","dyslexia","pedagogy"]},{"id":"assessment","t":"Assessment and Evaluation","s":"Assessment checks learning to improve teaching, not only to give marks.","n":["Formative assessment happens during learning (quizzes, observation); summative comes at the end (term exams).","Assessment for learning, as learning (self-assessment) and of learning are three purposes.","Continuous and Comprehensive Evaluation (CCE) covered scholastic and co-scholastic areas throughout the year.","Revised Bloom's taxonomy (2001): remember, understand, apply, analyse, evaluate, create.","Tools: rubrics, portfolios, checklists, anecdotal records and projects."],"ex":"Questions on 'photosynthesis' at Bloom's levels: Remember - 'Name the gas released.' Apply - 'Why does a plant in a dark room turn yellow?' Create - 'Design an experiment to show light is needed for photosynthesis.' Good tests include higher levels too.","q":"assessment for learning Bloom's taxonomy CTET B.Ed hindi","kw":["formative assessment","Bloom's taxonomy","CCE","rubric"]},{"id":"nep-2020-rte","t":"NEP 2020 and the RTE Act","s":"NEP 2020 reshapes Indian education; the RTE Act 2009 guarantees free, compulsory schooling for ages 6-14.","n":["NEP 2020 replaced the 10+2 structure with 5+3+3+4: Foundational (ages 3-8), Preparatory (8-11), Middle (11-14), Secondary (14-18).","It stresses foundational literacy and numeracy, mother tongue as medium till at least Grade 5, and flexible subject choice.","It proposes the 4-year integrated B.Ed as the minimum teacher qualification by 2030.","RTE Act 2009 (in force from 1 April 2010) gives effect to Article 21A, added by the 86th Amendment, 2002.","RTE reserves 25% of entry-level seats in private unaided schools for disadvantaged and weaker-section children."],"ex":"A child aged 3 joins Anganwadi or pre-school: start of the Foundational stage. Classes 1-2 complete it at age 8. Classes 3-5 are Preparatory, 6-8 Middle, 9-12 Secondary. So 5 + 3 + 3 + 4 = 15 years, ages 3 to 18.","q":"NEP 2020 explained 5+3+3+4 RTE Act CTET hindi","kw":["NEP 2020","RTE Act 2009","Article 21A","5+3+3+4"]},{"id":"ctet-overview","t":"CTET: Pattern and Preparation","s":"CTET is a national eligibility test for teachers of Classes 1 to 8, conducted by CBSE.","n":["Paper I is for Classes 1-5 and Paper II for Classes 6-8. You may take both.","Each paper has 150 multiple-choice questions in 2.5 hours, with no negative marking.","Child Development and Pedagogy has 30 questions in both papers.","Qualifying mark is 60% for general category; relaxations apply for reserved categories as notified.","The CTET certificate is valid for life. Always check the latest official notification on ctet.nic.in."],"ex":"To pass with 60%, you need 90 out of 150 marks (150 x 0.6 = 90). If you score 26/30 in CDP, 25/30 in each language and 20/30 in Maths and EVS each, total = 26 + 25 + 25 + 20 + 20 = 116. Pass.","q":"CTET exam pattern syllabus preparation strategy hindi","kw":["CTET","Paper I","Paper II","CDP"]}],"pg":[{"id":"philosophy-education","t":"Philosophical Foundations of Education","s":"Philosophy of education asks what education is for, what to teach, and how, based on different schools of thought.","n":["Idealism (Plato): education develops mind and moral values; teacher is central.","Naturalism (Rousseau): follow the child's nature; learn from experience and environment.","Pragmatism (John Dewey): learning by doing, problem-solving and democracy in school.","Existentialism: freedom, choice and personal responsibility of the learner.","Indian thinkers: Gandhi's Nai Talim (Basic Education, 1937), Tagore's Santiniketan, Vivekananda's man-making education, Sri Aurobindo's integral education."],"ex":"In Gandhi's Nai Talim, children learn maths by measuring cloth while spinning, and science by caring for plants. Learning is linked to productive work and community life. Compare this with Dewey's pragmatism, which also values learning through activity.","q":"philosophy of education idealism naturalism pragmatism M.Ed","kw":["philosophy of education","Dewey","Nai Talim","Tagore","Rousseau"]},{"id":"sociology-education","t":"Sociology of Education","s":"Sociology of education studies how schools shape society and how society, caste, class and gender shape schooling.","n":["Functionalism (Durkheim): education transmits shared values and socialises children.","Conflict theory: schools can reproduce inequality between classes.","Bourdieu's cultural capital: children from educated homes carry knowledge and habits schools reward.","Education can drive social mobility, especially for first-generation learners.","Indian issues: gender gaps, caste discrimination, rural-urban divide, language barriers and the digital divide."],"ex":"Two children score equally in Class 5. One has books at home and parents who explain homework (cultural capital); the other works after school. By Class 10 the gap widens. Free coaching, libraries and mentoring can reduce this inequality.","q":"sociology of education Durkheim Bourdieu cultural capital M.Ed","kw":["sociology of education","cultural capital","social mobility","Durkheim"]},{"id":"curriculum-development","t":"Curriculum Development","s":"Curriculum is the planned set of learning experiences; developing it involves aims, content, methods and evaluation.","n":["Tyler's rationale (1949) asks four questions: purposes, learning experiences, organisation and evaluation.","Hilda Taba's grassroots model starts with teachers diagnosing learners' needs.","Types: subject-centred, learner-centred, problem-centred; also the hidden curriculum of unstated lessons.","Indian frameworks: NCF 2005, NCF for Foundational Stage 2022 and NCF for School Education 2023.","Curriculum, syllabus and textbook are different: curriculum is broadest, syllabus lists content, textbook is one resource."],"ex":"A school designs an environmental studies unit using Tyler: Aim - students reduce plastic use. Experience - survey plastic waste in the locality. Organisation - survey, then data chart, then campaign. Evaluation - waste measured before and after, plus a reflection rubric.","q":"curriculum development Tyler model Taba NCF M.Ed","kw":["curriculum","Tyler rationale","NCF 2005","hidden curriculum"]},{"id":"educational-psychology","t":"Advanced Educational Psychology","s":"Educational psychology applies theories of intelligence, motivation, personality and learning to teaching.","n":["Intelligence: Spearman's g factor, Thurstone's primary abilities, Sternberg's triarchic theory, Gardner's multiple intelligences.","Classic IQ = (Mental Age / Chronological Age) x 100; modern tests use deviation IQ with mean 100.","Motivation: Maslow's hierarchy, intrinsic vs extrinsic motivation, self-determination theory (autonomy, competence, relatedness).","Erikson's 8 psychosocial stages; Kohlberg's 3 levels and 6 stages of moral development.","Information processing and cognitive load theory guide how much new information to present at once."],"ex":"A child aged 10 (chronological age) performs at the level of a 12-year-old (mental age). Classic IQ = (12/10) x 100 = 120. A child of 10 performing like an 8-year-old: (8/10) x 100 = 80.","q":"educational psychology M.Ed intelligence motivation Kohlberg Erikson","kw":["educational psychology","IQ","Maslow","Kohlberg","Erikson"]},{"id":"educational-technology","t":"Educational Technology","s":"Educational technology uses tools, media and systematic design to make teaching and learning more effective.","n":["Hardware (devices), software (apps, content) and systems approach (planning the whole process) are all ed-tech.","ADDIE model: Analysis, Design, Development, Implementation, Evaluation.","TPACK: good teachers combine Technological, Pedagogical and Content Knowledge.","Edgar Dale's cone of experience moves from direct experience to abstract symbols.","Indian platforms: SWAYAM (MOOCs), DIKSHA, NPTEL, PM eVIDYA and NROER."],"ex":"Designing a SWAYAM-style module on 'Fractions for teachers' with ADDIE: analyse teachers' common errors, design 6 short videos with quizzes, develop them with free tools, implement in a 4-week course, then evaluate through pre-test and post-test scores.","q":"educational technology ADDIE TPACK SWAYAM M.Ed","kw":["educational technology","ADDIE","TPACK","SWAYAM"]},{"id":"teacher-education-policy","t":"Teacher Education and Policy","s":"Teacher education prepares and supports teachers through pre-service and in-service programmes guided by national bodies.","n":["Pre-service: D.El.Ed, B.Ed, integrated B.Ed; in-service: workshops, refresher courses and online training like NISHTHA.","NCTE regulates teacher education; NCERT and SCERTs develop curriculum and training; DIETs work at district level.","Major commissions: Kothari Commission (1964-66), NPE 1986 (revised 1992), and NEP 2020.","Reflective practice: teachers study their own lessons to keep improving.","Action research lets teachers solve real classroom problems systematically."],"ex":"A teacher notices that half her class skips homework. Action research: she tries short daily homework with a peer-check for 4 weeks and records submission rates. Rates rise from 50% to 80%, so she continues and shares results in a school meeting.","q":"teacher education in India NCTE Kothari commission M.Ed","kw":["teacher education","NCTE","Kothari Commission","action research"]},{"id":"comparative-education","t":"Comparative and Higher Education","s":"Comparative education studies education systems of different countries to learn lessons and improve policy.","n":["Compare structure, curriculum, teacher training, assessment and funding across countries.","Finland is often studied for highly trained teachers and limited high-stakes testing.","International assessments like PISA compare 15-year-olds' skills across countries.","Indian higher education bodies include UGC and AICTE; NEP 2020 proposes a single regulator called HECI.","NEP 2020 aims for 50% Gross Enrolment Ratio in higher education by 2035."],"ex":"A researcher compares teacher selection in Finland and India. Finland admits a small share of applicants to selective master's-level teacher programmes. India's NEP 2020 moves toward a 4-year integrated B.Ed. She discusses what can be adapted to Indian conditions, not just copied.","q":"comparative education Finland India PISA M.Ed","kw":["comparative education","PISA","higher education","UGC"]}],"phd":[{"id":"research-methodology","t":"Research Methodology in Education","s":"Educational research systematically answers questions about teaching and learning using clear designs and methods.","n":["Types: fundamental, applied and action research; quantitative, qualitative and mixed methods.","Designs: descriptive survey, correlational, experimental and quasi-experimental, case study, ethnography.","A good research problem is specific, researchable, significant and ethical. Hypotheses should be testable.","Sampling: probability (simple random, stratified, cluster) and non-probability (purposive, snowball).","Use Shodhganga (INFLIBNET), ERIC and Google Scholar for literature review."],"ex":"Problem: 'Effect of mother-tongue instruction on Class 3 reading comprehension in rural Bihar.' Design: quasi-experimental with two schools. Sample: 60 children each, from two comparable schools. Tool: standardised reading test. Hypothesis: mother-tongue group scores significantly higher.","q":"research methodology in education PhD hindi","kw":["research methodology","sampling","hypothesis","research design"]},{"id":"tools-reliability-validity","t":"Research Tools, Reliability and Validity","s":"Research tools collect data; they must be reliable (consistent) and valid (measure what they claim).","n":["Tools: questionnaire, interview schedule, observation schedule, rating scale, achievement test, attitude scale (Likert).","Reliability types: test-retest, split-half, inter-rater and internal consistency (Cronbach's alpha).","Validity types: content, construct, criterion (concurrent and predictive) and face validity.","Pilot-test every tool on a small sample before the main study.","A tool can be reliable but not valid, but it cannot be valid without being reliable."],"ex":"A weighing scale always shows 2 kg extra. It gives the same reading each time (reliable) but the wrong weight (not valid). Similarly, a test of 'maths ability' full of hard English words may be consistent but actually measures language skill.","q":"reliability and validity in research Cronbach alpha education","kw":["reliability","validity","Cronbach's alpha","Likert scale"]},{"id":"statistics-education","t":"Statistics in Education","s":"Statistics summarise data and test hypotheses so researchers can draw sound conclusions.","n":["Descriptive: mean, median, mode, standard deviation, percentiles.","Correlation (Pearson's r from -1 to +1) shows relationship, not cause.","Inferential tests: t-test (two means), ANOVA (three or more means), chi-square (frequencies).","p \u003c 0.05 is a common significance level; also report effect size, like Cohen's d.","Free software: R, jamovi, JASP and PSPP, so you need not pay for SPSS."],"ex":"Scores of 5 students: 10, 12, 14, 16, 18. Mean = 70/5 = 14. Deviations: -4, -2, 0, 2, 4; squares 16, 4, 0, 4, 16; sum = 40. Population variance = 40/5 = 8; SD = sqrt(8) = about 2.83. (Sample SD uses n-1: sqrt(10) = 3.16.)","q":"statistics in education research t test ANOVA chi square hindi","kw":["statistics","t-test","ANOVA","standard deviation","correlation"]},{"id":"qualitative-research","t":"Qualitative and Mixed Methods Research","s":"Qualitative research explores meanings and experiences in depth through interviews, observation and documents.","n":["Approaches: phenomenology, grounded theory, ethnography, narrative inquiry and case study.","Data come from in-depth interviews, focus groups, field notes and classroom observation.","Thematic analysis: code the data, group codes into themes, review and define them.","Trustworthiness: credibility, transferability, dependability and confirmability.","Mixed methods combine numbers and stories, such as explanatory sequential design."],"ex":"A study of first-generation college girls in Rajasthan interviews 15 students. Codes like 'family permission', 'travel safety' and 'hostel fees' group into the theme 'barriers to continuing'. Member-checking with participants confirms the findings are accurate.","q":"qualitative research thematic analysis grounded theory education PhD","kw":["qualitative research","thematic analysis","grounded theory","mixed methods"]},{"id":"ethics-thesis-writing","t":"Research Ethics and Thesis Writing","s":"Ethical, well-written research protects participants and builds trust in your findings.","n":["Get informed consent; for children, get parent consent and the child's assent.","Protect confidentiality and store data safely.","UGC's 2018 plagiarism regulations set penalty levels by similarity; up to 10% is treated as minor. Always cite properly.","Common thesis structure: introduction, review of literature, methodology, analysis, findings, discussion, conclusion, references.","Use a consistent citation style like APA 7th edition, and free reference managers like Zotero."],"ex":"A researcher records classroom videos of Class 6 students. She takes written consent from parents, simple oral assent from children, blurs faces in shared clips, and stores files on an encrypted drive. Her ethics section explains each step clearly.","q":"research ethics plagiarism UGC thesis writing PhD","kw":["research ethics","plagiarism","APA style","thesis writing"]}]},"order":18},{"id":"music","name":"Music","nameHi":"संगीत","group":"arts","blurb":"Learn Indian classical music - swar, taal, raag, instruments and gharanas - along with Western basics and music research.","levels":{"6-8":[{"id":"sound-and-music","t":"Sound, Noise and Music","s":"Music is organised sound with pleasing pitch and rhythm; noise is disorganised sound.","n":["Sound is made by vibration. A guitar string, a drum skin or our vocal cords vibrate to make sound.","Naad (नाद) is the musical sound used in Indian music. Steady, regular vibrations make musical sound.","Pitch means how high or low a sound is. A child's voice is usually higher in pitch than a man's.","Rhythm (लय) is the regular beat or flow in music, like a clock's tick-tock.","Indian music has two main classical systems: Hindustani (mostly North India) and Carnatic (mostly South India)."],"ex":"Tap a steel glass with a spoon and then hit a table randomly. The glass gives a clear, steady tone you can sing along with. The random hits are noise. Music is made by choosing sounds carefully and arranging them in time.","q":"what is music naad swar laya class 6 hindi","kw":["sound","naad","pitch","rhythm"]},{"id":"seven-swar","t":"The Seven Swar","s":"Indian music has seven main notes: Sa, Re, Ga, Ma, Pa, Dha, Ni.","n":["Swar (स्वर) means a musical note. The seven swar are Sa Re Ga Ma Pa Dha Ni.","Full names: Shadja, Rishabh, Gandhar, Madhyam, Pancham, Dhaivat, Nishad.","Sa and Pa are fixed (achal swar). They never change.","Re, Ga, Dha and Ni can become komal (flat, lower). Ma can become tivra (sharp, higher).","So in total there are 12 notes: 7 shuddha (pure), 4 komal and 1 tivra."],"ex":"Count the notes: shuddha Sa Re Ga Ma Pa Dha Ni = 7. Komal Re, komal Ga, komal Dha, komal Ni = 4. Tivra Ma = 1. Total = 7 + 4 + 1 = 12 notes in one saptak, the same count as the 12 keys (7 white + 5 black) in one octave of a harmonium.","q":"sa re ga ma pa dha ni seven swar shuddha komal tivra hindi","kw":["swar","saptak","komal","tivra","shuddha"]},{"id":"saptak","t":"Saptak: Low, Middle and High","s":"A saptak is a group of seven notes; music uses three main saptaks: mandra, madhya and taar.","n":["Saptak (सप्तक) means a set of seven swar, from Sa to Ni.","Madhya saptak is the middle range, where we usually sing comfortably.","Mandra saptak is the lower range, below madhya.","Taar saptak is the higher range, above madhya.","After Ni of one saptak comes Sa of the next higher saptak."],"ex":"Sing Sa Re Ga Ma Pa Dha Ni comfortably: that is madhya saptak. Continue upward and the next note is taar Sa, sounding like Sa but higher. Go below your first Sa to Ni: that is mandra Ni. In notation, mandra notes get a dot below and taar notes a dot above.","q":"saptak mandra madhya taar class 7 music hindi","kw":["saptak","mandra","madhya","taar"]},{"id":"taal-basics","t":"Taal and Laya","s":"Taal is a fixed cycle of beats that keeps time in Indian music.","n":["Matra (मात्रा) is one beat. A taal has a fixed number of matras.","Laya is speed: vilambit (slow), madhya (medium) and drut (fast).","Sam is the first and most important beat of a taal. Musicians meet there.","Keherwa taal has 8 matras. Dadra taal has 6 matras. Both are common in light and folk music.","We show taal by clapping (tali) and waving the hand (khali)."],"ex":"Dadra taal, 6 matras: Dha Dhi Na | Dha Ti Na. Clap on beat 1 (sam) and wave on beat 4 (khali). Keherwa, 8 matras: Dha Ge Na Ti | Na Ka Dhi Na. Clap on beat 1, wave on beat 5. Practise counting aloud while clapping.","q":"taal laya matra keherwa dadra for beginners hindi","kw":["taal","matra","laya","keherwa","dadra"]},{"id":"instrument-families","t":"Families of Indian Instruments","s":"The Natyashastra divides instruments into four families: string, wind, skin-covered and solid.","n":["Tata vadya (तत): string instruments, like sitar, veena, sarangi and violin.","Sushir vadya (सुषिर): wind instruments, like bansuri, shehnai and nadaswaram.","Avanaddha vadya (अवनद्ध): skin-covered drums, like tabla, dholak, pakhawaj and mridangam.","Ghana vadya (घन): solid instruments that are struck, like manjira, ghatam and jal tarang.","This classification was given in Bharata's Natyashastra, an ancient text on drama, dance and music."],"ex":"At a wedding band: the shehnai (wind, sushir) plays the tune, the dhol (skin, avanaddha) gives the beat, and small cymbals (solid, ghana) add sparkle. If someone plays a guitar (string, tata), all four families are present.","q":"tata sushir avanaddha ghana vadya Indian instruments classification","kw":["instruments","tata","sushir","avanaddha","ghana"]},{"id":"great-musicians","t":"Great Musicians of India","s":"India's great musicians took classical and popular music to every corner of the world.","n":["M.S. Subbulakshmi, a Carnatic singer, was the first musician to receive the Bharat Ratna (1998).","Pandit Ravi Shankar (sitar) made Indian music famous around the world.","Ustad Bismillah Khan made the shehnai a classical concert instrument.","Pandit Bhimsen Joshi was a great Kirana gharana khayal singer.","Lata Mangeshkar, Bhupen Hazarika and others also received the Bharat Ratna for music."],"ex":"Ustad Bismillah Khan of Varanasi played the shehnai, once mainly heard at weddings and temples. Through decades of practice, he brought it to big concert halls. He received the Bharat Ratna in 2001. His story shows how dedication can raise an art form.","q":"great Indian classical musicians Bharat Ratna music general knowledge","kw":["Indian musicians","Bharat Ratna","Bismillah Khan","MS Subbulakshmi"]},{"id":"folk-music","t":"Folk Music of India","s":"Every region of India has its own folk music, sung at festivals, harvests and family occasions.","n":["Folk music (लोक संगीत) is passed by ear from generation to generation.","Examples: Baul (Bengal), Lavani (Maharashtra), Bihu songs (Assam), Pandavani (Chhattisgarh), Maand (Rajasthan).","Folk songs follow seasons: Kajri in the rainy season, Chaiti in the month of Chaitra.","Folk instruments include ektara, dhol, chimta, algoza and dotara.","Folk music keeps local languages, stories and history alive."],"ex":"Teejan Bai of Chhattisgarh performs Pandavani, telling stories from the Mahabharata with song and acting while holding a tambura. One performer becomes singer, narrator and actor. Ask elders in your family for a folk song from your village and write down its occasion.","q":"folk music of India states class 7 8","kw":["folk music","Baul","Pandavani","Kajri"]}],"9-10":[{"id":"shruti-swar","t":"Naad, Shruti and Swar","s":"Naad is musical sound, shruti is the smallest audible pitch difference, and swar are the main notes.","n":["Naad has three qualities: magnitude (loud or soft), pitch (high or low) and timbre (jati, the special colour of each voice or instrument).","Ancient texts describe 22 shrutis in one saptak.","The seven swar are placed on chosen shrutis.","Shuddha swar are natural notes; vikrit swar are changed notes (komal or tivra).","Timbre is why a flute and a violin playing the same note still sound different."],"ex":"A sitar and a singer both sound Pa at the same pitch. You can still tell which is which. Same pitch, same loudness, but different timbre (naad jati). Timbre comes from the different mix of overtones each source produces.","q":"naad shruti swar class 9 music hindustani hindi","kw":["naad","shruti","timbre","vikrit swar"]},{"id":"thaat-system","t":"Thaat: Parent Scales","s":"A thaat is a parent scale of seven notes from which raags are grouped.","n":["Pandit Vishnu Narayan Bhatkhande grouped Hindustani raags into 10 thaats.","The 10 thaats: Bilawal, Kalyan, Khamaj, Bhairav, Poorvi, Marwa, Kafi, Asavari, Bhairavi, Todi.","Rules: a thaat has all seven notes in order, only an ascending form, and is not sung for pleasure itself.","Each thaat is named after a well-known raag.","Bilawal thaat has all shuddha notes, like the major scale in Western music."],"ex":"Kalyan thaat: Sa Re Ga Ma(tivra) Pa Dha Ni. Only Ma is changed. Kafi thaat: Sa Re ga(komal) Ma Pa Dha ni(komal). Two notes are komal. Bhairavi thaat: Re, Ga, Dha and Ni are all komal.","q":"10 thaat Bhatkhande hindustani music class 9 hindi","kw":["thaat","Bhatkhande","Bilawal","Kalyan"]},{"id":"raag-features","t":"What Makes a Raag","s":"A raag is a melodic framework with set notes, movement, mood and often a time to perform.","n":["A raag uses at least 5 notes. Sa is never dropped, and Ma and Pa are not both dropped.","Aroh is the ascending order of notes; avroh is the descending order.","Vadi is the most important note; samvadi is the second most important.","Pakad is a short phrase that identifies the raag.","Jati by number of notes: audav (5), shadav (6), sampoorna (7). Varjit swar are notes left out."],"ex":"Raag Bhupali: Kalyan thaat. Ma and Ni are varjit, so it uses 5 notes in both aroh and avroh: audav-audav jati. Aroh: Sa Re Ga Pa Dha Sa'. Avroh: Sa' Dha Pa Ga Re Sa. Vadi Ga, samvadi Dha. Sung in the first part of the night.","q":"raag lakshan aroh avroh vadi samvadi pakad class 10 hindi","kw":["raag","aroh avroh","vadi samvadi","pakad","jati"]},{"id":"teentaal-ektaal","t":"Teentaal, Jhaptaal and Ektaal","s":"Major classical taals have fixed matras, divisions, tali and khali that musicians must know.","n":["Vibhag is a section of the taal. Avartan is one full cycle.","Teentaal: 16 matras, 4 vibhags of 4. Tali on 1, 5, 13; khali on 9.","Jhaptaal: 10 matras, divided 2+3+2+3. Khali on 6.","Ektaal: 12 matras, 6 vibhags of 2.","Theka is the basic set of tabla syllables (bols) of a taal."],"ex":"Teentaal theka: Dha Dhin Dhin Dha | Dha Dhin Dhin Dha | Dha Tin Tin Ta | Ta Dhin Dhin Dha. Mark X (sam) on 1, 2 on 5, 0 (khali) on 9, 3 on 13. Notice the 'Tin Tin Ta' khali part has no open bass sound.","q":"teentaal jhaptaal ektaal theka tali khali class 10","kw":["teentaal","jhaptaal","ektaal","theka","vibhag"]},{"id":"bhatkhande-notation","t":"Bhatkhande Notation System","s":"Bhatkhande notation is the standard way to write Hindustani music using simple marks around swar names.","n":["Komal notes have a short line below them; tivra Ma has a small vertical line above it.","Mandra saptak notes have a dot below; taar saptak notes have a dot above.","In taal writing: X for sam, 0 for khali, and numbers 2, 3, 4 for other talis.","A dash (-) or avagraha (S) shows a note held for an extra beat.","Two notes in one beat are joined with a curved line below (a small arc)."],"ex":"Writing Sa Re komal-Ga Ma: write 'Sa Re Ga Ma' and draw a line under Ga. Writing taar Sa: put a dot above Sa. Writing 'Pa held for two beats': Pa | - . Learning these marks lets you read any bandish from a printed book.","q":"Bhatkhande notation system explained hindi music class 9","kw":["Bhatkhande notation","komal","tivra","sam khali"]},{"id":"music-forms","t":"Forms of Hindustani Music","s":"Hindustani music includes forms like dhrupad, khayal, thumri, tarana and bhajan, each with its own style.","n":["Dhrupad: old, serious form with slow alaap, sung with pakhawaj.","Khayal: most popular classical vocal form today; bada khayal (slow) and chhota khayal (fast).","Thumri: semi-classical, romantic and emotional, often in Braj bhasha.","Tarana: fast form using syllables like 'na', 'dir', 'tom'.","Bandish is a fixed composition with two parts: sthayi and antara."],"ex":"A typical khayal concert: the singer starts with a short alaap, then a slow bada khayal in vilambit Ektaal, then a fast chhota khayal in drut Teentaal, and may finish with a tarana. The same raag is explored from slow to fast.","q":"dhrupad khayal thumri tarana difference hindi","kw":["dhrupad","khayal","thumri","bandish"]},{"id":"music-pioneers-modern","t":"Bhatkhande, Paluskar and Music Education","s":"Bhatkhande and Paluskar made classical music teachable in schools and colleges in the early 20th century.","n":["Pt. Vishnu Narayan Bhatkhande (1860-1936) collected compositions, created the thaat system and a notation system.","Pt. Vishnu Digambar Paluskar (1872-1931) started the Gandharva Mahavidyalaya in Lahore in 1901.","Paluskar also created a notation system and took music to public concerts.","Before them, music was learnt mainly in the guru-shishya parampara inside gharanas.","Today, music is taught in schools, universities and online, alongside traditional gurus."],"ex":"Before 1900, a student had to live with a guru for years to learn compositions orally. Because Bhatkhande wrote thousands of bandishes in his books (Kramik Pustak Malika), a student today can read and learn them anywhere.","q":"Bhatkhande Paluskar contribution to music hindi","kw":["Bhatkhande","Paluskar","Gandharva Mahavidyalaya","music education"]}],"11-12":[{"id":"important-raags","t":"Study of Important Raags","s":"Knowing the thaat, notes, vadi-samvadi and time of key raags is central to the Class 11-12 syllabus.","n":["Yaman: Kalyan thaat, tivra Ma, all 7 notes; vadi Ga, samvadi Ni; first part of the night.","Bhairav: Bhairav thaat, komal Re and komal Dha; morning raag; vadi Dha, samvadi Re.","Bageshri: Kafi thaat; komal Ga and komal Ni; night raag.","Bhimpalasi: Kafi thaat; komal Ga and Ni; afternoon raag.","Raag samay (time theory) links raags to parts of the day, a special feature of Hindustani music."],"ex":"Yaman aroh: Ni Re Ga Ma(tivra) Dha Ni Sa' (often starting from mandra Ni). Avroh: Sa' Ni Dha Pa Ma(tivra) Ga Re Sa. Pakad: Ni Re Ga Re, Pa Re, Ni Re Sa. Practise slowly with a tanpura app.","q":"raag yaman bhairav bageshri class 12 music theory","kw":["Yaman","Bhairav","Bageshri","raag samay"]},{"id":"carnatic-basics","t":"Carnatic Music Basics","s":"Carnatic music is South India's classical system, rich in compositions called kritis and complex rhythm.","n":["Purandara Dasa is called the father (pitamaha) of Carnatic music. He designed graded lessons like sarali varisai.","The Trinity: Tyagaraja, Muthuswami Dikshitar and Syama Sastri, all from the 18th-19th century.","Swaras: Sa Ri Ga Ma Pa Da Ni; raga and tala are the two pillars.","Main forms: varnam, kriti, keertanam, tillana and javali.","Instruments: veena, violin, mridangam, ghatam, kanjira, nadaswaram and flute."],"ex":"A typical Carnatic concert (kutcheri) begins with a varnam to warm up, moves to several kritis, then a long main piece (often ragam-tanam-pallavi) with a mridangam solo called tani avartanam, and ends with lighter pieces like a tillana.","q":"Carnatic music basics for beginners trinity Purandara Dasa","kw":["Carnatic music","Tyagaraja","kriti","Purandara Dasa"]},{"id":"melakarta-tala","t":"Melakarta and Carnatic Talas","s":"Carnatic music organises ragas into 72 melakartas and rhythms into the suladi sapta tala system.","n":["Melakarta (parent) ragas have all 7 swaras in order in both arohana and avarohana. There are 72.","This scheme is linked with Venkatamakhin's 17th-century text Chaturdandi Prakashika, later systematised.","Janya ragas are derived from melakartas.","Suladi sapta talas: 7 talas, each can take 5 jatis, giving 35 talas.","Adi tala (8 aksharas: 4 + 2 + 2) is the most common tala."],"ex":"Mayamalavagowla, the 15th melakarta, is used to teach beginners: Sa Ri1 Ga3 Ma1 Pa Da1 Ni3 Sa. Its notes match Hindustani Bhairav thaat. 7 talas x 5 jatis = 35 talas. Adi tala: laghu (4) + drutam (2) + drutam (2) = 8 beats.","q":"72 melakarta system suladi sapta tala explained","kw":["melakarta","janya raga","Adi tala","suladi sapta tala"]},{"id":"gharanas","t":"Gharanas of Hindustani Music","s":"A gharana is a musical family or school with its own style passed from guru to disciple.","n":["Gwalior gharana is considered the oldest khayal gharana, with clear and balanced singing.","Agra, Kirana, Jaipur-Atrauli, Patiala, Rampur-Sahaswan and Mewati are other major khayal gharanas.","Kirana is known for slow, note-by-note development; Jaipur-Atrauli for complex raags and rhythmic play.","Tabla gharanas include Delhi, Ajrara, Lucknow, Farukhabad, Benaras and Punjab.","Dhrupad's best-known family tradition is the Dagar vani."],"ex":"Pt. Bhimsen Joshi (Kirana gharana) learned from Sawai Gandharva, who learned from Ustad Abdul Karim Khan, a founder of the Kirana style. This chain of teachers is the guru-shishya parampara that keeps a gharana alive.","q":"gharanas of hindustani classical music explained","kw":["gharana","Kirana","Gwalior","guru-shishya parampara"]},{"id":"western-basics","t":"Western Music Basics","s":"Western music uses a staff, clefs, scales and chords to write and organise music.","n":["Notes are named C D E F G A B; solfege names are do re mi fa sol la ti.","Music is written on a staff of 5 lines and 4 spaces, with treble or bass clef.","Note values: whole (4 beats), half (2), quarter (1), eighth (1/2) in 4/4 time.","Major scale pattern: Whole-Whole-Half-Whole-Whole-Whole-Half steps.","A triad chord has root, third and fifth, like C-E-G for C major. Harmony is notes played together."],"ex":"Build G major scale with W-W-H-W-W-W-H: G to A (W), A to B (W), B to C (H), C to D (W), D to E (W), E to F# (W), F# to G (H). So G major has one sharp: F#.","q":"western music theory basics staff notes scales chords","kw":["staff notation","major scale","chords","time signature"]},{"id":"ancient-texts","t":"Ancient and Medieval Music Texts","s":"Indian music theory comes from texts like Natyashastra, Brihaddeshi and Sangeet Ratnakar.","n":["Sama Veda chants are considered an early root of Indian music.","Natyashastra by Bharata discusses shruti, swar, jati and instruments.","Brihaddeshi by Matanga is the earliest known text to define 'raga' in detail.","Sangeet Ratnakar by Sharangadeva (13th century) is a major text respected by both Hindustani and Carnatic traditions.","Later texts include Sangeet Parijat by Ahobala (17th century), which described swar positions on veena string lengths."],"ex":"Ask: why do both North and South traditions honour Sangeet Ratnakar? It was written in the 13th century, before the two systems clearly separated. So it serves as a shared root, like a common grandparent in a family tree.","q":"Natyashastra Brihaddeshi Sangeet Ratnakar music history","kw":["Natyashastra","Brihaddeshi","Sangeet Ratnakar","music history"]},{"id":"riyaz-practice","t":"Riyaz: How to Practise","s":"Riyaz is regular, focused practice. It builds voice, finger control, sense of pitch and rhythm.","n":["Practise daily with a tanpura or tanpura app to train pitch.","Start with kharaj (low notes) and alankars (patterns like Sa Re Ga, Re Ga Ma).","Use a metronome or tabla app to hold steady laya.","Record yourself and listen. Your ears will catch mistakes you miss while singing.","Rest the voice when tired; drink warm water and avoid shouting."],"ex":"A 30-minute daily plan: 5 min long Sa with tanpura, 10 min alankars in three speeds, 10 min practise a raag's aroh-avroh and pakad, 5 min record and listen. In 3 months, pitch accuracy usually improves clearly.","q":"riyaz kaise kare alankar practice for beginners","kw":["riyaz","alankar","tanpura","practice"]}],"ug":[{"id":"raag-classification","t":"Raag Classification Systems","s":"Over history, raags were grouped by gender families, mela, thaat and raaganga methods.","n":["Medieval raag-ragini system grouped raags in families, like six main raags each with wives (raginis).","Mela system: grouping by parent scale, as in Ramamatya's
