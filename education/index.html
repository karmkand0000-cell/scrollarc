"cell-molecular-biology","t":"Cell and Molecular Biology","s":"Cell and molecular biology studies how cell parts work and how DNA is copied and read inside them.","n":["Fluid mosaic model: the cell membrane is a lipid bilayer with proteins floating in it.","Organelles: ER and Golgi make and pack proteins; lysosomes digest; mitochondria and chloroplasts have their own DNA.","DNA replication is semi-conservative (Meselson-Stahl). DNA polymerase adds nucleotides only in the 5' to 3' direction.","Transcription by RNA polymerase makes mRNA; in eukaryotes introns are removed by splicing.","Translation on ribosomes uses tRNA to read codons. Start codon AUG; stop codons UAA, UAG, UGA."],"ex":"A microscope has a 10x eyepiece and a 40x objective. Step 1: Total magnification = 10 x 40 = 400x. Step 2: A cell 20 μm wide looks like 20 x 400 = 8000 μm = 8 mm. Answer: 400x, and the cell appears about 8 mm wide.","q":"bsc cell biology molecular biology replication transcription translation hindi","kw":["cell membrane","organelles","DNA replication","transcription","translation"]},{"id":"genetics-ug","t":"Genetics","s":"Genetics studies how genes are passed on, linked, mutated and shared within populations.","n":["Beyond Mendel: incomplete dominance, codominance (AB blood group), multiple alleles and epistasis.","Linked genes on the same chromosome are inherited together; recombination frequency helps make gene maps.","Mutations can be point mutations or chromosomal changes. Sickle cell anaemia comes from a single base change.","Pedigree analysis tracks a trait through a family to find whether it is dominant, recessive or X-linked.","Hardy-Weinberg law: p² + 2pq + q² = 1 when no evolution is happening in a population."],"ex":"In a population, 4% people show a recessive trait (aa). Step 1: q² = 0.04, so q = 0.2. Step 2: p = 1 - 0.2 = 0.8. Step 3: Carriers 2pq = 2 x 0.8 x 0.2 = 0.32. Answer: 32% are carriers (Aa), 64% are AA.","q":"bsc genetics linkage hardy weinberg pedigree analysis lecture hindi","kw":["linkage","mutation","pedigree analysis","Hardy-Weinberg","codominance"]},{"id":"ecology-ug","t":"Ecology and Environmental Biology","s":"Ecology studies populations, communities and ecosystems, and how humans affect them.","n":["Population growth: exponential (J-shaped) when resources are unlimited; logistic (S-shaped) when limited by carrying capacity K.","Species interactions: competition, predation, mutualism, commensalism and parasitism.","Ecological succession changes a bare area into a stable climax community over time.","Biogeochemical cycles move carbon, nitrogen and phosphorus between living and non-living parts.","Conservation: in-situ (national parks, biosphere reserves) and ex-situ (zoos, seed banks)."],"ex":"A deer population grows exponentially at r = 0.1 per year, starting with N0 = 100. Step 1: N = N0 e^(rt). Step 2: After 10 years: N = 100 x e^1 = 100 x 2.718. Answer: about 272 deer, if food and space stay unlimited.","q":"bsc ecology population growth succession biogeochemical cycles hindi","kw":["population ecology","carrying capacity","succession","nutrient cycles","conservation"]},{"id":"animal-physiology","t":"Animal Physiology","s":"Animal physiology explains how organ systems work and keep the body's internal conditions stable.","n":["Homeostasis keeps body temperature, blood sugar and water balance steady using negative feedback.","Nerve impulse: resting potential about -70 mV; an action potential travels as Na+ rushes in and K+ moves out.","Muscle contraction follows the sliding filament theory: actin and myosin slide past each other using ATP and calcium.","Digestive enzymes: amylase for starch, pepsin and trypsin for proteins, lipase for fats.","Endocrine control: insulin lowers blood sugar, glucagon raises it; thyroxine controls metabolic rate."],"ex":"Blood sugar after a meal: Step 1: Glucose rises. Step 2: Pancreas beta cells release insulin. Step 3: Cells take in glucose and the liver stores it as glycogen. Step 4: Sugar returns to normal, so insulin release falls. This is negative feedback.","q":"bsc zoology animal physiology nerve impulse muscle contraction hindi","kw":["homeostasis","action potential","muscle contraction","enzymes","endocrine system"]},{"id":"plant-physiology-ug","t":"Plant Physiology and Biochemistry","s":"Plant physiology studies how plants take water and minerals, make food, grow and respond to their surroundings.","n":["Water moves along a water potential gradient. Stomata open and close using guard cells to balance gas exchange and water loss.","Mineral nutrients: macronutrients (N, P, K) and micronutrients (Fe, Zn, Mn). Deficiency shows as yellowing or stunting.","Nitrogen fixation by Rhizobium in legume root nodules uses the enzyme nitrogenase.","Photoperiodism: some plants flower in short days, some in long days. Phytochrome senses light.","Hormones: auxin (cell elongation), gibberellin (stem growth), cytokinin (cell division), ABA (stress), ethylene (fruit ripening)."],"ex":"Why do farmers grow moong or chana between cereal crops? Step 1: Legume roots have Rhizobium nodules. Step 2: Nitrogenase turns air N2 into ammonia. Step 3: Some of this nitrogen stays in the soil. Answer: soil fertility improves and less urea is needed.","q":"bsc botany plant physiology nitrogen fixation plant hormones hindi","kw":["water relations","mineral nutrition","nitrogen fixation","plant hormones","photoperiodism"]},{"id":"evolution-biostatistics","t":"Evolution and Biostatistics","s":"Evolution explains how life changes over generations, and biostatistics gives tools to test biological ideas with data.","n":["Forces of evolution: mutation, natural selection, genetic drift, gene flow and non-random mating.","Speciation happens when populations become reproductively isolated, often after geographic separation.","Phylogenetic trees show evolutionary relationships using shared features or DNA sequences.","Basic statistics: mean, median, standard deviation describe data. Tests like t-test and chi-square check if differences are real.","A p-value below 0.05 is commonly taken as significant, but it does not prove the idea is true."],"ex":"Chi-square on Mendel's F2: 290 tall, 110 dwarf (total 400). Expected 3:1 is 300 and 100. Step 1: (290-300)²/300 = 0.33. Step 2: (110-100)²/100 = 1.00. Step 3: χ² = 1.33. Step 4: Critical value (df = 1, 0.05) = 3.84. Answer: fits 3:1.","q":"bsc evolution genetic drift speciation biostatistics chi square hindi","kw":["natural selection","genetic drift","speciation","chi-square test","phylogeny"]}],"pg":[{"id":"biochemistry-metabolism","t":"Biochemistry and Metabolism","s":"Biochemistry studies the molecules of life and the chemical pathways cells use to make and use energy.","n":["Biomolecules: carbohydrates, lipids, proteins and nucleic acids. Protein structure has primary, secondary, tertiary and quaternary levels.","Glycolysis breaks glucose into 2 pyruvate, giving a net 2 ATP and 2 NADH.","Krebs (TCA) cycle and oxidative phosphorylation in mitochondria produce most ATP using an H+ gradient and ATP synthase.","Fatty acids are broken by beta-oxidation; amino acid nitrogen is removed as urea in the urea cycle.","Metabolism is regulated by key enzymes, hormones (insulin, glucagon) and feedback inhibition."],"ex":"ATP from one glucose (modern estimate). Glycolysis: 2 ATP + 2 NADH. Pyruvate to acetyl-CoA: 2 NADH. Krebs: 2 GTP/ATP + 6 NADH + 2 FADH2. Using 2.5 ATP/NADH and 1.5 ATP/FADH2: 4 + 25 + 3 = 32 ATP. Answer: about 30 to 32 ATP, depending on the shuttle used.","q":"msc biochemistry metabolism glycolysis krebs cycle oxidative phosphorylation lecture","kw":["glycolysis","Krebs cycle","oxidative phosphorylation","protein structure","metabolic regulation"]},{"id":"enzymology","t":"Enzymology","s":"Enzymology studies how enzymes speed up reactions, how fast they work and how drugs can block them.","n":["Enzymes lower activation energy. The active site binds the substrate (lock and key or induced fit).","Michaelis-Menten equation: v = Vmax[S]/(Km + [S]). Km is the substrate concentration giving half of Vmax.","Lineweaver-Burk plot (1/v vs 1/[S]) gives a straight line to find Km and Vmax.","Inhibitors: competitive (raises apparent Km), non-competitive (lowers Vmax), uncompetitive (lowers both).","Allosteric enzymes give S-shaped curves and are key control points in metabolism."],"ex":"Vmax = 100 μmol/min, Km = 2 mM. Find v at [S] = 2 mM and 6 mM. Step 1: v = 100 x 2/(2 + 2) = 50 μmol/min. Step 2: v = 100 x 6/(2 + 6) = 600/8 = 75 μmol/min. Answer: 50 and 75 μmol/min.","q":"msc biochemistry enzyme kinetics michaelis menten inhibition lecture","kw":["Michaelis-Menten","Km","Vmax","enzyme inhibition","allosteric enzymes"]},{"id":"gene-regulation","t":"Molecular Biology and Gene Regulation","s":"Gene regulation decides which genes are switched on or off, so each cell makes only the proteins it needs.","n":["In bacteria, operons control groups of genes. The lac operon switches on when lactose is present and glucose is low.","Eukaryotic genes are controlled by promoters, enhancers and transcription factors.","Chromatin structure matters: DNA methylation and histone modifications (epigenetics) can silence or activate genes.","RNA level control: alternative splicing makes many proteins from one gene; microRNAs block translation.","Errors in gene regulation can cause cancer, for example when oncogenes are over-active or tumour suppressors fail."],"ex":"Lac operon states. Lactose absent: repressor binds the operator, genes off. Lactose present and glucose high: repressor removed, but low cAMP, so only weak expression. Lactose present and glucose low: repressor off and cAMP-CAP activates. Answer: strong expression only in the last case.","q":"msc molecular biology gene regulation lac operon epigenetics lecture","kw":["operon","transcription factors","epigenetics","alternative splicing","microRNA"]},{"id":"genetic-engineering","t":"Genetic Engineering and Biotechnology","s":"Genetic engineering changes DNA on purpose to study genes, make medicines and improve crops.","n":["Cloning: insert a gene into a vector (plasmid), put it into a host cell, and select cells that took it up.","PCR variants: RT-PCR detects RNA, and qPCR measures how much DNA is present in real time.","DNA sequencing: Sanger method and next-generation sequencing (NGS) read millions of DNA pieces together.","CRISPR-Cas9 uses a guide RNA to cut DNA at a chosen site for precise gene editing. It earned the 2020 Chemistry Nobel.","Biosafety: India regulates GM organisms through the Genetic Engineering Appraisal Committee (GEAC)."],"ex":"qPCR: Sample A crosses the threshold at Ct = 20, sample B at Ct = 23 (same efficiency, 100%). Step 1: Difference = 3 cycles. Step 2: Each cycle doubles DNA, so 2³ = 8. Answer: sample A had about 8 times more starting target DNA.","q":"msc biotechnology genetic engineering crispr qpcr cloning lecture","kw":["gene cloning","qPCR","next-generation sequencing","CRISPR-Cas9","biosafety"]},{"id":"immunology","t":"Immunology","s":"Immunology studies how the body defends itself against germs using innate and adaptive immunity.","n":["Innate immunity is quick and general: skin, phagocytes, inflammation, fever and complement proteins.","Adaptive immunity is specific and has memory. B cells make antibodies; T cells kill infected cells or help others.","An antibody has 2 heavy and 2 light chains in a Y shape. Classes: IgG, IgA, IgM, IgE, IgD.","MHC molecules show antigen pieces to T cells. MHC I to CD8 T cells, MHC II to CD4 T cells.","Vaccines train immune memory. Problems include allergy, autoimmunity and immunodeficiency like HIV/AIDS."],"ex":"ELISA for a disease test: Step 1: Antigen is fixed in a well. Step 2: Patient serum is added; antibodies bind if present. Step 3: An enzyme-linked second antibody binds them. Step 4: Substrate gives colour. Answer: colour means the patient has antibodies (positive).","q":"msc immunology innate adaptive immunity antibodies mhc lecture","kw":["innate immunity","adaptive immunity","antibodies","MHC","vaccines"]},{"id":"bioinformatics","t":"Bioinformatics","s":"Bioinformatics uses computers to store, compare and understand DNA and protein data.","n":["Databases: GenBank (NCBI) for DNA sequences, UniProt for proteins, PDB for 3D structures. All are free.","BLAST compares a query sequence with databases to find similar sequences. E-value shows how likely a match is by chance.","Multiple sequence alignment (Clustal Omega, MUSCLE) lines up related sequences to build phylogenetic trees.","Structure prediction tools like AlphaFold predict protein 3D shape from sequence.","Python, R and Linux skills help analyse large genomic data such as RNA-seq."],"ex":"Two protein sequences of 200 amino acids are aligned. 150 positions are identical. Step 1: Percent identity = identical / aligned length x 100. Step 2: = 150/200 x 100 = 75%. Answer: 75% identity, suggesting they are likely related (homologous) proteins.","q":"bioinformatics for beginners blast ncbi sequence alignment hindi","kw":["BLAST","sequence alignment","GenBank","phylogenetics","protein structure prediction"]},{"id":"cell-signalling","t":"Cell Signalling and Developmental Biology","s":"Cells talk to each other using signals, which guide how an embryo develops into a full body.","n":["Signals bind receptors: G-protein coupled receptors, receptor tyrosine kinases, ion channels or nuclear receptors (steroids).","Second messengers like cAMP and Ca²+ carry and amplify the signal inside the cell.","Apoptosis is programmed cell death; it shapes fingers in the embryo and removes damaged cells.","Development: fertilisation, cleavage, gastrulation (three germ layers) and organ formation.","Stem cells can become many cell types. Morphogen gradients and Hox genes set up body pattern."],"ex":"Adrenaline signalling: Step 1: Adrenaline binds a GPCR on liver cells. Step 2: G-protein activates adenylyl cyclase, making cAMP. Step 3: cAMP activates protein kinase A. Step 4: A kinase cascade breaks glycogen into glucose. Answer: quick energy for fight or flight.","q":"msc cell signalling gpcr developmental biology lecture","kw":["cell signalling","GPCR","second messenger","apoptosis","stem cells"]}],"phd":[{"id":"biology-research-methods","t":"Research Methods and Experimental Design","s":"Good biology research needs a clear hypothesis, proper controls, enough samples and honest statistics.","n":["Form a testable hypothesis after reading literature on PubMed and Google Scholar.","Use positive and negative controls, randomisation and blinding to avoid bias.","Biological replicates (different animals or cultures) matter more than technical replicates (repeat measures of one sample).","Choose statistics before the experiment. Do a power analysis to decide sample size.","Share data and methods clearly so others can reproduce your results."],"ex":"Testing a new drug on cancer cells: Step 1: Negative control gets only the solvent (e.g. DMSO). Step 2: Positive control gets a known drug. Step 3: Test 3 independent cultures per group. Step 4: Compare groups with a suitable test. Without controls, cell death could be from the solvent alone.","q":"experimental design biology research phd controls replicates statistics","kw":["hypothesis","controls","replicates","power analysis","reproducibility"]},{"id":"genomics-omics","t":"Genomics and Multi-omics","s":"Omics studies all genes, RNAs, proteins or metabolites together to understand biology at a large scale.","n":["Genomics reads whole genomes. The human genome has about 3 billion base pairs and around 20,000 protein-coding genes.","Transcriptomics (RNA-seq) measures which genes are active. Single-cell RNA-seq does this for each cell separately.","Proteomics uses mass spectrometry to identify proteins; metabolomics studies small molecules.","Genome India Project aims to capture the genetic diversity of Indian populations.","Big omics data need computational skills, good storage and careful correction for multiple testing."],"ex":"Testing 20,000 genes at p \u003c 0.05 would give about 20,000 x 0.05 = 1000 false positives by chance alone. Step 1: Use a correction like Bonferroni: 0.05/20,000 = 2.5 x 10^-6. Step 2: Or control false discovery rate (Benjamini-Hochberg). This keeps findings reliable.","q":"genomics transcriptomics rna seq multi omics lecture for researchers","kw":["genomics","RNA-seq","proteomics","single-cell","multiple testing"]},{"id":"gene-editing-therapy","t":"Gene Editing and Gene Therapy","s":"New tools like CRISPR, base editing and gene therapy aim to fix faulty genes that cause disease.","n":["CRISPR-Cas9 makes a double-strand cut; the cell repairs it, which can disrupt or correct a gene.","Base editors and prime editors change single DNA letters without a full double-strand break.","Delivery is a big challenge: viral vectors (AAV, lentivirus) or lipid nanoparticles carry the tools into cells.","Off-target edits and immune reactions are key safety concerns and must be measured carefully.","Sickle cell disease, common in some tribal communities of India, is a major target of gene therapy research."],"ex":"Design check for a guide RNA: Step 1: Pick a 20-letter target next to an NGG PAM site (for SpCas9). Step 2: Search the genome for similar sites. Step 3: Prefer guides with no close matches elsewhere. This lowers off-target cutting risk.","q":"crispr gene editing base editing gene therapy lecture for researchers","kw":["CRISPR","base editing","gene therapy","off-target effects","viral vectors"]},{"id":"systems-synthetic-biology","t":"Systems and Synthetic Biology","s":"Systems biology models whole networks of genes and proteins, and synthetic biology designs new biological parts.","n":["Systems biology combines experiments with mathematical models to understand networks, not just single genes.","Feedback loops in networks create switches, oscillators (like circadian clocks) and stable states.","Synthetic biology builds genetic circuits from standard parts: promoters, ribosome binding sites, genes and terminators.","Applications include microbes that make medicines (like artemisinin precursors), biosensors and biofuels.","Biosafety and biosecurity rules must guide all designs."],"ex":"The repressilator (2000) is a classic circuit: gene A blocks B, B blocks C, and C blocks A. Step 1: When A is high, B falls. Step 2: Low B lets C rise. Step 3: High C turns A down. Result: protein levels oscillate like a clock inside E. coli.","q":"systems biology synthetic biology genetic circuits lecture","kw":["systems biology","gene networks","synthetic biology","genetic circuits","biosensors"]},{"id":"bioethics-biosafety","t":"Bioethics, Biosafety and Research Integrity","s":"Biology research must protect people, animals and the environment, and must be honest at every step.","n":["Human studies need approval from an Institutional Ethics Committee and informed consent; ICMR guidelines apply in India.","Animal research needs approval from the Institutional Animal Ethics Committee (IAEC). Follow the 3 Rs: Replace, Reduce, Refine.","Biosafety levels (BSL-1 to BSL-4) set the containment needed for different microbes.","Research misconduct includes fabrication, falsification and plagiarism. It can end careers and harm patients.","Benefit sharing and respect for traditional knowledge matter when using India's biological resources."],"ex":"A study wants to test a new herbal mix on 100 volunteers. Step 1: Write a protocol. Step 2: Get ethics committee approval. Step 3: Explain risks in the local language and take written consent. Step 4: Register the trial with CTRI (Clinical Trials Registry-India) before starting.","q":"bioethics biosafety research ethics icmr guidelines lecture","kw":["bioethics","informed consent","animal ethics","biosafety levels","research integrity"]}]},"order":4},{"id":"cs","name":"Computer Science","nameHi":"कंप्यूटर विज्ञान","group":"tech","blurb":"Computer Science is the study of how computers work, how to program them, and what problems they can solve.","levels":{"6-8":[{"id":"computer-parts","t":"Parts of a Computer","s":"A computer takes input, processes it, stores it, and gives output. Learn its main parts and what each does.","n":["Hardware is the parts you can touch: keyboard, mouse, monitor, CPU. Software is the set of instructions, like apps and Windows.","Input devices send data in (keyboard, mouse, microphone). Output devices show results (monitor, printer, speaker).","The CPU (Central Processing Unit) is the brain. It does calculations and follows instructions very fast.","RAM is short-term memory that is cleared when power goes off. Storage like a hard disk or SSD keeps files permanently.","Every computer follows the IPO cycle: Input, Process, Output, with Storage to save results."],"ex":"When you type 2 + 3 in a calculator app: the keyboard is input, the CPU processes it and adds the numbers, RAM holds the numbers while working, and the monitor shows 5 as output.","q":"class 6 parts of computer input output cpu hindi","kw":["hardware","software","CPU","RAM"]},{"id":"operating-system-basics","t":"Operating System and Files","s":"The operating system is the main software that runs the computer and lets you open apps and save files.","n":["An operating system (OS) manages hardware and software. Examples: Windows, Linux, macOS, and Android on phones.","Files store your work, like a photo or a letter. Folders group files, like a school bag holds notebooks.","A file name has an extension that shows its type: .txt for text, .jpg for photo, .py for Python program.","Size is measured in bytes. 1 KB = 1024 bytes, 1 MB = 1024 KB, 1 GB = 1024 MB (in the binary convention).","Always save your work often and keep a backup copy in another place, like a pen drive or cloud storage."],"ex":"Riya makes a folder 'Class7' with subfolders 'Maths' and 'Science'. She saves 'fractions.docx' inside Maths. Path: Class7 > Maths > fractions.docx. A 3 MB photo is about 3 x 1024 = 3072 KB.","q":"class 6 7 operating system files folders computer hindi","kw":["operating system","file","folder","bytes"]},{"id":"binary-numbers","t":"Binary Numbers and Data","s":"Computers store everything as 0s and 1s, called binary. Numbers, letters, pictures and songs all become bits.","n":["A bit is a single 0 or 1. 8 bits make 1 byte. One byte can store 256 different values (0 to 255).","In decimal, places are 1, 10, 100. In binary (द्वि-आधारी), places are 1, 2, 4, 8, 16 and so on.","To convert decimal to binary, divide by 2 repeatedly and read the remainders from bottom to top.","Letters are stored using codes. In ASCII, 'A' is 65. Unicode also covers Hindi and other Indian scripts.","Pictures are made of tiny dots called pixels. Each pixel's colour is stored as numbers."],"ex":"Convert 13 to binary. 13 / 2 = 6 r 1; 6 / 2 = 3 r 0; 3 / 2 = 1 r 1; 1 / 2 = 0 r 1. Read upward: 1101. Check: 8 + 4 + 0 + 1 = 13. Correct.","q":"class 7 8 binary number system computer hindi","kw":["binary","bit","byte","ASCII"]},{"id":"algorithms-flowcharts","t":"Algorithms and Flowcharts","s":"An algorithm is a clear list of steps to solve a problem, like a recipe. Flowcharts draw those steps.","n":["An algorithm must be clear, have a start and an end, and each step must be doable.","A flowchart uses shapes: oval for start/end, parallelogram for input/output, rectangle for process, diamond for a decision.","Sequence means steps one after another. Selection means choosing based on a condition (if-else). Iteration means repeating (loops).","Pseudocode is writing steps in simple English-like lines before writing real code.","Test your algorithm with a few examples, including tricky ones, to find mistakes (bugs)."],"ex":"Algorithm to check if a number is even: 1. Start. 2. Input N. 3. If N divided by 2 leaves remainder 0, print 'Even', else print 'Odd'. 4. Stop. Test: N = 14 gives remainder 0, so 'Even'. N = 7 gives 'Odd'.","q":"class 6 7 algorithm flowchart computer science hindi","kw":["algorithm","flowchart","pseudocode","loop"]},{"id":"scratch-programming","t":"Programming with Scratch","s":"Scratch is a free block-based language where you snap blocks together to make games, stories and animations.","n":["Scratch is made by MIT. You drag coloured blocks instead of typing code, so spelling errors cannot happen.","A sprite is a character, like the cat. The stage is the background where sprites move.","Event blocks like 'when green flag clicked' start the program. Motion blocks move sprites; Looks blocks change costumes and speech.","Control blocks give loops ('repeat 10', 'forever') and decisions ('if ... then ... else').","Variables store values like score. Use 'change score by 1' each time the player catches something."],"ex":"Make the cat draw a square: when green flag clicked > pen down > repeat 4 [move 100 steps, turn 90 degrees]. The loop runs 4 times, and 4 x 90 = 360 degrees, so the cat comes back to start.","q":"scratch programming for beginners hindi tutorial","kw":["Scratch","sprite","blocks","loop"]},{"id":"logic-boolean","t":"Logic and Boolean Thinking","s":"Computers make decisions using true or false values and the logic words AND, OR and NOT.","n":["A Boolean value is either True or False. Named after mathematician George Boole.","AND is True only when both parts are True. OR is True when at least one part is True.","NOT flips the value: NOT True is False.","A truth table lists all input combinations and the result. Two inputs give 4 rows.","Real rule: 'You can enter the exam hall if you have an admit card AND an ID card.' Both are needed."],"ex":"Let A = 'it is raining' = True, B = 'I have an umbrella' = False. A AND B = False. A OR B = True. NOT B = True. So 'raining AND umbrella' is false: you will get wet.","q":"class 8 boolean logic and or not truth table hindi","kw":["Boolean","AND OR NOT","truth table"]},{"id":"python-intro","t":"First Steps in Python","s":"Python is a simple, free programming language. You type instructions and the computer runs them line by line.","n":["print('Namaste') shows text on the screen. Text must be inside quotes.","A variable stores a value: age = 12. Python works out the type by itself (number, text and so on).","input() takes a value from the user as text. Use int(input()) to turn it into a whole number.","Python uses +, -, *, / for maths, // for whole-number division and % for remainder.","Indentation (spaces at the start of a line) matters in Python. It shows which lines belong together."],"ex":"Program: a = int(input('First: ')); b = int(input('Second: ')); print('Sum =', a + b). If the user types 7 and 5, output is 'Sum = 12'. Also 17 // 5 = 3 and 17 % 5 = 2.","q":"python for beginners class 8 hindi","kw":["Python","print","variable","input"]}],"9-10":[{"id":"python-data-types","t":"Python Variables and Data Types","s":"Every value in Python has a type, like whole number, decimal or text. The type decides what you can do with it.","n":["int is a whole number (5), float is a decimal (3.14), str is text ('hello'), bool is True or False.","type(x) tells you the type. int('25') turns text into a number; str(25) turns a number into text.","Variable names can use letters, digits and underscore, but cannot start with a digit. Python is case-sensitive: Age and age differ.","Operators: ** is power, // is floor division, % is remainder. Comparison operators ==, !=, \u003c, > give True or False.","Comments start with # and are ignored by Python. Use them to explain your code."],"ex":"x = '5'; y = 5. x + x gives '55' (text joined), but y + y gives 10. int(x) + y gives 10. Also 2 ** 5 = 32 and 7 / 2 = 3.5 while 7 // 2 = 3.","q":"class 9 python data types variables operators hindi","kw":["int","float","string","type conversion"]},{"id":"conditionals","t":"Decisions with if, elif and else","s":"Programs choose what to do using if statements, just like you decide to carry an umbrella if it rains.","n":["if condition: runs the indented block only when the condition is True.","else: runs when the condition is False. elif (else if) checks another condition.","Combine conditions with and, or, not: if marks >= 33 and attendance >= 75:","Only the first True branch in an if-elif-else chain runs. Order your conditions carefully.","Always use == to compare. A single = assigns a value and is a common beginner mistake."],"ex":"marks = 72. if marks >= 90: grade = 'A' / elif marks >= 60: grade = 'B' / elif marks >= 33: grade = 'C' / else: grade = 'Fail'. 72 is not >= 90 but is >= 60, so grade = 'B'.","q":"class 9 10 python if elif else hindi","kw":["if else","elif","conditions","comparison"]},{"id":"loops","t":"Loops: for and while","s":"Loops repeat work so you do not write the same line many times. Python has for loops and while loops.","n":["for i in range(5): runs 5 times with i = 0, 1, 2, 3, 4. range(1, 11) gives 1 to 10.","while condition: repeats as long as the condition stays True. Make sure something changes, or the loop never ends.","break stops the loop immediately. continue skips to the next round.","Use an accumulator variable to build a total: start total = 0 and add inside the loop.","Nested loops (a loop inside a loop) are used for patterns and tables."],"ex":"Sum of 1 to 10: total = 0; for i in range(1, 11): total = total + i. After the loop, print(total) shows 55. Check with formula n(n + 1)/2 = 10 x 11 / 2 = 55.","q":"class 9 10 python for loop while loop hindi","kw":["for loop","while loop","range","break"]},{"id":"lists-strings","t":"Lists and Strings","s":"A list holds many values in order. A string is text. Both use positions called indexes starting at 0.","n":["marks = [78, 92, 65] is a list. marks[0] is 78. marks[-1] is the last item, 65.","Lists can change: marks.append(88) adds at the end; marks.sort() arranges in order; len(marks) gives count.","Slicing: s[1:4] gives items from index 1 up to, but not including, 4.","Strings cannot be changed in place, but methods give new strings: 'india'.upper() gives 'INDIA'.","Use for x in list: to visit each item. sum(), max() and min() work on number lists."],"ex":"marks = [78, 92, 65, 88]. sum(marks) = 323, len(marks) = 4, average = 323 / 4 = 80.75. max(marks) = 92. name = 'Sabki'; name[0] = 'S', name[1:3] = 'ab'.","q":"class 9 10 python list string slicing hindi","kw":["list","string","index","slicing"]},{"id":"functions-basics","t":"Functions","s":"A function is a named block of code you can reuse, like a machine that takes input and gives output.","n":["Define with def: def area(l, b): return l * b. Call it with area(5, 3).","Parameters are the names inside the brackets; arguments are the actual values you pass.","return sends a value back. Without return, a function gives None.","Functions make code shorter, easier to read and easier to fix.","Built-in functions include print(), len(), input() and round(). You can also import more from modules like math."],"ex":"def simple_interest(p, r, t): return p * r * t / 100. Calling simple_interest(5000, 8, 3) returns 1200.0. import math; math.sqrt(49) returns 7.0.","q":"class 10 python functions def return hindi","kw":["function","def","return","parameters"]},{"id":"data-representation","t":"Number Systems and Data Representation","s":"Computers use binary, but programmers also use octal and hexadecimal as short ways to write binary.","n":["Binary is base 2 (digits 0-1), octal base 8 (0-7), decimal base 10, hexadecimal base 16 (0-9 and A-F).","Each hex digit equals 4 binary bits. Each octal digit equals 3 bits. So 1111 in binary = F in hex.","To convert binary to decimal, multiply each bit by its place value (1, 2, 4, 8, ...) and add.","Character codes: ASCII uses 7 bits for English letters. Unicode (UTF-8) can store Hindi, Tamil, emojis and more.","Larger units: 1 KB = 1024 bytes, 1 MB = 1024 KB, 1 GB = 1024 MB, 1 TB = 1024 GB (binary convention)."],"ex":"Convert 10110110 (binary) to decimal and hex. Decimal: 128 + 32 + 16 + 4 + 2 = 182. Hex: split into 1011 and 0110, which are 11 (B) and 6. Answer: 182 = B6 in hex.","q":"number system binary octal hexadecimal conversion hindi","kw":["binary","hexadecimal","octal","Unicode"]},{"id":"logic-gates","t":"Logic Gates","s":"Logic gates are tiny electronic switches inside chips that perform AND, OR and NOT on bits.","n":["AND gate output is 1 only if both inputs are 1. OR gate output is 1 if any input is 1. NOT gate inverts the input.","NAND is NOT of AND; NOR is NOT of OR. NAND and NOR are 'universal': any circuit can be built from them alone.","XOR gives 1 when inputs are different. It is used in adding binary numbers.","De Morgan's laws: NOT(A AND B) = (NOT A) OR (NOT B), and NOT(A OR B) = (NOT A) AND (NOT B).","A half adder adds two bits: Sum = A XOR B, Carry = A AND B."],"ex":"Half adder with A = 1, B = 1: Sum = 1 XOR 1 = 0, Carry = 1 AND 1 = 1. So 1 + 1 = 10 in binary, which is 2 in decimal. Correct.","q":"logic gates and or not nand nor truth table hindi","kw":["logic gates","NAND","XOR","De Morgan"]}],"11-12":[{"id":"computer-system-organisation","t":"Computer System Organisation","s":"How a computer is built inside: CPU, memory types, software types, and how programs get translated for the machine.","n":["The CPU has the ALU (does arithmetic and logic), the Control Unit (directs steps) and registers (very fast small storage).","Memory hierarchy: registers, cache, RAM, then SSD/HDD. Faster memory is smaller and costlier.","System software (OS, drivers, utilities) runs the machine; application software (browsers, editors) does user tasks.","A compiler translates the whole program at once; an interpreter translates and runs line by line. Python uses an interpreter.","Boolean algebra simplifies logic circuits using laws like A + A' = 1 and A . A' = 0."],"ex":"Why does a second run of a program open faster? The first time, data is read from SSD into RAM and cache. The second time much of it is already in faster memory, so the CPU waits less.","q":"class 11 computer science computer system organisation cbse hindi","kw":["CPU","memory hierarchy","compiler","interpreter"]},{"id":"python-collections","t":"Lists, Tuples and Dictionaries","s":"Python collections store many values. Lists can change, tuples cannot, and dictionaries map keys to values.","n":["A list [ ] is mutable (can change). A tuple ( ) is immutable. Use tuples for fixed data like (lat, long).","A dictionary { } stores key: value pairs, like {'roll': 12, 'name': 'Amit'}. Look up by key: d['name'].","Useful methods: list.append(), list.pop(), dict.get(key, default), dict.items() to loop over pairs.","Strings support split() and join(): 'a,b,c'.split(',') gives ['a', 'b', 'c'].","Choose the right structure: list for order, dictionary for fast lookup by name, tuple for safety."],"ex":"Count letters in 'banana': d = {}; for ch in 'banana': d[ch] = d.get(ch, 0) + 1. Result: {'b': 1, 'a': 3, 'n': 2}.","q":"class 11 python list tuple dictionary cbse computer science hindi","kw":["list","tuple","dictionary","mutable"]},{"id":"functions-files-exceptions","t":"Functions, File Handling and Exceptions","s":"Class 12 Python: write reusable functions, save data in files, and handle errors without the program crashing.","n":["Scope: variables made inside a function are local. Use the global keyword only when truly needed.","Open files with open('data.txt', 'r'). Modes: 'r' read, 'w' write (erases old content), 'a' append. Using with closes the file automatically.","Text files store lines; binary files use pickle to save Python objects; CSV files use the csv module for tables.","try / except catches errors such as ZeroDivisionError or FileNotFoundError. finally runs no matter what.","Default arguments: def greet(name='Friend'): lets you call greet() without passing a value."],"ex":"try: x = int(input()); print(100 / x) / except ZeroDivisionError: print('Cannot divide by zero') / except ValueError: print('Enter a number'). Input 4 prints 25.0; input 0 prints the message instead of crashing.","q":"class 12 python file handling exception handling cbse hindi","kw":["file handling","exceptions","CSV","pickle"]},{"id":"stack","t":"Stack Data Structure","s":"A stack is a pile where you add and remove only from the top, like plates. Last In, First Out.","n":["Stack follows LIFO: Last In, First Out. Push adds on top; Pop removes from the top.","In Python, a list works as a stack: append() is push, pop() is pop.","Peek (or top) looks at the top item without removing it. Check for underflow: popping from an empty stack.","Uses: undo in editors, the back button in browsers, checking matching brackets, and function calls.","Postfix expressions like 2 3 + 4 * are evaluated easily using a stack."],"ex":"Evaluate postfix 2 3 + 4 *. Push 2, push 3. See +: pop 3 and 2, push 5. Push 4. See *: pop 4 and 5, push 20. Answer: 20, same as (2 + 3) x 4.","q":"class 12 stack data structure python cbse hindi","kw":["stack","LIFO","push pop","postfix"]},{"id":"database-sql","t":"Databases and SQL","s":"A database stores organised data in tables. SQL is the language to create, query and change that data.","n":["A relation (table) has rows (tuples) and columns (attributes). A primary key uniquely identifies each row. A foreign key links to another table.","DDL commands define structure: CREATE, ALTER, DROP. DML commands change data: INSERT, UPDATE, DELETE.","SELECT name FROM student WHERE marks > 80 ORDER BY marks DESC; fetches matching rows in order.","Aggregate functions: COUNT, SUM, AVG, MAX, MIN. GROUP BY groups rows; HAVING filters groups.","Joins combine tables: an equi-join matches rows where a common column has equal values."],"ex":"Table student(roll, name, class, marks). Average marks per class: SELECT class, AVG(marks) FROM student GROUP BY class; If class 12 has marks 80, 90, 70, its row shows 80.","q":"class 12 sql mysql queries cbse computer science hindi","kw":["SQL","primary key","GROUP BY","join"]},{"id":"python-mysql","t":"Connecting Python with MySQL","s":"Python programs can talk to a MySQL database to save and fetch records, like a school marks system.","n":["Install the connector (mysql-connector-python) and import mysql.connector.","Connect with mysql.connector.connect(host, user, password, database). Then create a cursor with con.cursor().","Run SQL using cursor.execute(query). Use fetchall() or fetchone() to read results.","After INSERT, UPDATE or DELETE, call con.commit() to save changes.","Use placeholders (%s) for values instead of joining strings. This prevents SQL injection attacks."],"ex":"cur.execute('INSERT INTO student VALUES (%s, %s, %s)', (5, 'Neha', 88)); con.commit(). Then cur.execute('SELECT * FROM student WHERE roll = %s', (5,)); print(cur.fetchone()) shows (5, 'Neha', 88).","q":"class 12 python mysql connectivity cbse hindi","kw":["MySQL","cursor","commit","SQL injection"]},{"id":"computer-networks-school","t":"Computer Networks","s":"A network connects computers to share data. The internet is the biggest network, joining networks across the world.","n":["Types by size: PAN (personal), LAN (building), MAN (city), WAN (country or world).","Topologies: bus, star, ring, tree, mesh. Star is common: all devices connect to a central switch.","Devices: modem, switch (connects devices in a LAN), router (connects different networks), and access point for Wi-Fi.","Protocols are rules: HTTP/HTTPS for web, SMTP for sending mail, FTP for files, TCP/IP for the internet.","An IP address identifies a device. DNS turns names like ncert.nic.in into IP addresses."],"ex":"When you open a website: DNS finds its IP address, your browser connects using HTTPS, the router forwards packets across networks, and the server sends the page back in small packets that are rejoined in your browser.","q":"class 12 computer networks cbse computer science hindi","kw":["LAN WAN","topology","router","DNS"]},{"id":"society-ethics","t":"Society, Law and Ethics in Computing","s":"Using technology responsibly: privacy, cyber crime, intellectual property, open source and safe digital habits.","n":["Digital footprint is the trail of data you leave online. Think before you post; it can stay for years.","Intellectual property includes copyright, patents and trademarks. Plagiarism is presenting others' work as your own.","Open source software like Linux and Python can be studied, changed and shared under licences like GPL or MIT.","Cyber crimes include phishing, hacking, identity theft and cyberbullying. India's IT Act, 2000 deals with such crimes.","E-waste should go to authorised recyclers, not ordinary garbage, because it contains harmful metals."],"ex":"You get an SMS: 'Your bank KYC expires today, click this link.' This is phishing. Do not click. Check with the bank's official app, and report fraud at the national cyber crime helpline 1930 or cybercrime.gov.in.","q":"class 12 society law ethics cyber safety cbse hindi","kw":["cyber crime","IT Act","open source","digital footprint"]}],"ug":[{"id":"data-structures","t":"Data Structures","s":"Data structures are ways to organise data so programs can store, search and update it efficiently.","n":["Arrays give O(1) access by index. Linked lists allow easy insert and delete but O(n) search.","Stacks (LIFO) and queues (FIFO) control order. Hash tables give average O(1) search using a hash function.","Trees store hierarchy. A binary search tree keeps smaller keys left and larger right; balanced trees like AVL keep search O(log n).","Heaps give the minimum or maximum quickly and are used in priority queues and heap sort.","Graphs model networks with vertices and edges. Store them using an adjacency list or adjacency matrix."],"ex":"Insert 50, 30, 70, 20, 40 into a BST. 50 is root; 30 goes left; 70 right; 20 left of 30; 40 right of 30. Searching 40: 50 -> left to 30 -> right to 40. Found in 3 comparisons.","q":"data structures full course hindi btech","kw":["array","linked list","binary search tree","hash table"]},{"id":"algorithms","t":"Design and Analysis of Algorithms","s":"Algorithms are step-by-step methods. We study how to design them and measure how fast they run as input grows.","n":["Big-O notation describes growth: O(1) constant, O(log n), O(n), O(n log n), O(n^2). Smaller growth is better for large inputs.","Divide and conquer splits a problem: merge sort runs in O(n log n). Binary search runs in O(log n) on sorted data.","Greedy algorithms pick the best local choice, as in Dijkstra's shortest path and Kruskal's minimum spanning tree.","Dynamic programming stores answers to overlapping subproblems, as in 0/1 knapsack and longest common subsequence.","P is problems solvable in polynomial time; NP-complete problems like SAT have no known polynomial algorithm."],"ex":"Binary search for 23 in [3, 8, 15, 23, 42, 57, 91]. Middle (index 3) is 23. Found in 1 step. For 57: middle 23 \u003c 57, search right half [42, 57, 91], middle is 57. Found in 2 steps. Time O(log n).","q":"design and analysis of algorithms full course hindi","kw":["Big-O","divide and conquer","dynamic programming","greedy"]},{"id":"operating-systems","t":"Operating Systems","s":"The operating system manages the CPU, memory, files and devices, and lets many programs run safely together.","n":["A process is a program in execution. Threads are lighter units inside a process that share its memory.","CPU scheduling decides who runs next: FCFS, Shortest Job First, Round Robin, and priority scheduling.","Synchronisation tools like mutexes and semaphores prevent race conditions on shared data.","Deadlock needs four conditions together: mutual exclusion, hold and wait, no preemption and circular wait. The Banker's algorithm avoids it.","Virtual memory uses paging so programs can use more memory than physical RAM. Page replacement policies include FIFO and LRU."],"ex":"FCFS with burst times P1 = 24, P2 = 3, P3 = 3 (arriving in that order). Waiting times: 0, 24, 27. Average = 51/3 = 17 ms. Running in order P2, P3, P1 gives 0, 3, 6, average 3 ms. Order matters.","q":"operating system full course gate hindi","kw":["process","CPU scheduling","deadlock","paging"]},{"id":"dbms","t":"Database Management Systems","s":"A DBMS stores large data safely, lets many users query it with SQL, and keeps it correct even after crashes.","n":["The relational model stores data in tables. ER diagrams design the database using entities, attributes and relationships.","Keys: super key, candidate key, primary key, foreign key. Functional dependency X -> Y means X decides Y.","Normalisation removes redundancy: 1NF (atomic values), 2NF (no partial dependency), 3NF and BCNF (no unwanted transitive dependency).","A transaction follows ACID: Atomicity, Consistency, Isolation, Durability. Concurrency control uses locks or timestamps.","Indexes such as B+ trees speed up search. Relational algebra (select, project, join) is the theory behind SQL."],"ex":"Table (roll, name, course_id, course_name) repeats course_name for every student. Since course_id -> course_name, split into Student(roll, name, course_id) and Course(course_id, course_name). Now each course name is stored once (3NF).","q":"dbms full course normalization transactions gate hindi","kw":["relational model","normalization","ACID","SQL"]},{"id":"computer-networks","t":"Computer Networks","s":"How data travels between computers: layers, addressing, routing, reliability and the protocols that run the internet.","n":["The TCP/IP model has layers: application, transport, network (internet) and link. The OSI model has 7 layers.","IPv4 addresses are 32 bits, written like 192.168.1.10. Subnetting divides networks; /24 means the first 24 bits are the network part.","TCP is reliable and connection-oriented (three-way handshake, retransmission). UDP is faster but does not guarantee delivery.","Routing algorithms: distance vector (like RIP) and link state (like OSPF). BGP routes between large networks.","Application protocols: HTTP, DNS, SMTP, DHCP. TLS encrypts traffic for HTTPS."],"ex":"Network 192.168.1.0/26: host bits = 32 - 26 = 6, so 2^6 = 64 addresses per subnet. Usable hosts = 64 - 2 = 62 (network and broadcast addresses excluded). First subnet: 192.168.1.0 to 192.168.1.63.","q":"computer networks full course subnetting gate hindi","kw":["TCP/IP","subnetting","routing","TCP vs UDP"]},{"id":"theory-of-computation","t":"Theory of Computation","s":"This subject asks what computers can and cannot do, using simple mathematical machines and languages.","n":["A finite automaton (DFA or NFA) recognises regular languages, described by regular expressions like (0|1)*1.","Pumping lemma proves some languages are not regular, for example {a^n b^n : n >= 0}.","Context-free grammars and pushdown automata (with a stack) recognise context-free languages, used for programming language syntax.","A Turing machine has an infinite tape and is the standard model of any computer.","Some problems are undecidable: no algorithm solves the Halting Problem for all programs."],"ex":"DFA for binary strings with an even number of 1s: states E (start, accepting) and O. On 1, switch E \u003c-> O; on 0, stay. Input 1011: E->O->O->E->O. Ends in O, so rejected (three 1s).","q":"theory of computation full course gate hindi","kw":["DFA","regular expression","context-free grammar","Turing machine"]},{"id":"compiler-design","t":"Compiler Design","s":"A compiler translates a high-level program into machine code in phases, checking for errors along the way.","n":["Lexical analysis breaks code into tokens (keywords, identifiers, numbers) using regular expressions.","Syntax analysis (parsing) checks grammar and builds a parse tree. Parsers include LL(1) (top-down) and LR (bottom-up).","Semantic analysis checks meaning, like type rules. A symbol table stores information about names.","Intermediate code such as three-address code is then optimised, for example by removing common subexpressions.","Code generation produces machine or assembly code, choosing registers carefully."],"ex":"Statement a = b * c + b * c. Three-address code: t1 = b * c; t2 = b * c; t3 = t1 + t2; a = t3. Optimisation spots the common subexpression: t1 = b * c; a = t1 + t1. One multiplication saved.","q":"compiler design full course gate hindi","kw":["lexical analysis","parsing","three-address code","optimization"]},{"id":"computer-architecture","t":"Computer Organisation and Architecture","s":"How a processor is built: instructions, data paths, pipelines and memory systems that make programs run fast.","n":["An instruction set architecture (ISA) defines the instructions a CPU understands, such as x86, ARM or RISC-V.","Pipelining overlaps instruction stages (fetch, decode, execute, memory, write-back) to finish more instructions per unit time.","Hazards (data, control, structural) stall a pipeline. Forwarding and branch prediction reduce them.","Cache memory uses locality. Average memory access time = hit time + miss rate x miss penalty.","Numbers are stored in two's complement for integers and IEEE 754 format for floating point."],"ex":"Cache hit time 1 ns, miss rate 5%, miss penalty 100 ns. AMAT = 1 + 0.05 x 100 = 1 + 5 = 6 ns. Reducing miss rate to 2% gives 1 + 2 = 3 ns, twice as fast.","q":"computer organization and architecture full course gate hindi","kw":["ISA","pipelining","cache","two's complement"]}],"pg":[{"id":"advanced-algorithms","t":"Advanced Algorithms","s":"Advanced algorithm design: randomisation, approximation, network flows and handling problems believed to be hard.","n":["Randomised algorithms use random choices. Randomised quicksort has expected O(n log n) time on every input.","Approximation algorithms give near-best answers for NP-hard problems with a proven ratio, like 2-approximation for vertex cover.","Max-flow min-cut theorem: the maximum flow from source to sink equals the capacity of the smallest cut.","Amortised analysis averages cost over a sequence of operations, as in dynamic arrays where append is O(1) amortised.","Reductions show NP-hardness; parameterised and online algorithms are other ways to cope with hard problems."],"ex":"Vertex cover 2-approximation: pick any uncovered edge (u, v), add both u and v, and remove all edges touching them. Repeat. Any optimal cover must include at least one endpoint of each picked edge, so our cover is at most 2 times optimal.","q":"advanced algorithms approximation randomized network flow lecture","kw":["randomized algorithms","approximation","max flow","amortized analysis"]},{"id":"distributed-systems","t":"Distributed Systems","s":"Many computers working together as one system: how they agree, stay consistent and survive failures.","n":["Distributed systems have no shared clock. Lamport clocks and vector clocks order events logically.","CAP theorem: during a network partition, a system must choose between consistency and availability.","Consensus protocols like Paxos and Raft let nodes agree on one value even if some nodes crash.","Replication improves availability; consistency models range from strong (linearizable) to eventual.","MapReduce and Spark split big computations across many machines."],"ex":"Raft with 5 servers: a leader needs votes from a majority, so at least 3. The cluster keeps working if up to 2 servers fail, because 3 can still form a majority. In general, 2f + 1 servers tolerate f crash failures.","q":"distributed systems lecture raft paxos cap theorem","kw":["consensus","CAP theorem","Raft","replication"]},{"id":"machine-learning","t":"Machine Learning","s":"Machine learning lets computers learn patterns from data to make predictions, instead of following hand-written rules.","n":["Supervised learning uses labelled data (regression, classification). Unsupervised learning finds structure (clustering, PCA).","Linear regression minimises mean squared error. Logistic regression predicts probabilities for classes.","Overfitting means doing well on training data but poorly on new data. Use validation sets, cross-validation and regularisation.","Bias-variance trade-off: simple models underfit (high bias), very complex models overfit (high variance).","Evaluate classifiers with accuracy, precision, recall and F1, especially when classes are imbalanced."],"ex":"A spam filter finds 90 emails as spam; 80 really are spam. There are 100 spam emails in total. Precision = 80/90 = 0.89. Recall = 80/100 = 0.80. F1 = 2 x 0.89 x 0.80 / (0.89 + 0.80), about 0.84.","q":"machine learning full course hindi","kw":["supervised learning","overfitting","regression","precision recall"]},{"id":"deep-learning","t":"Deep Learning","s":"Deep learning uses neural networks with many layers. It powers speech recognition, image recognition and large language models.","n":["A neuron computes a weighted sum plus bias, then applies an activation like ReLU(x) = max(0, x).","Training uses backpropagation (chain rule) to compute gradients and gradient descent to update weights.","CNNs use convolution for images. RNNs and LSTMs handled sequences; transformers with attention now dominate text.","Regularisation methods: dropout, weight decay and data augmentation reduce overfitting.","Large language models are transformers trained on huge text data to predict the next token."],"ex":"One neuron: inputs x = (2, 3), weights w = (0.5, -1), bias b = 1. z = 2 x 0.5 + 3 x (-1) + 1 = 1 - 3 + 1 = -1. ReLU(-1) = 0, so the output is 0.","q":"deep learning neural networks transformers lecture hindi","kw":["neural network","backpropagation","CNN","transformer"]},{"id":"security-cryptography","t":"Cryptography and Network Security","s":"Security protects data and systems from attackers, using cryptography, secure protocols and careful design.","n":["Goals: confidentiality, integrity and availability (CIA), plus authentication and non-repudiation.","Symmetric encryption (AES) uses one shared key. Public-key encryption (RSA, elliptic curves) uses a public and private key pair.","Hash functions like SHA-256 give a fixed-size fingerprint; digital signatures prove who signed and that data was not changed.","TLS combines these to secure HTTPS. Certificates bind a public key to a domain.","Common attacks: SQL injection, cross-site scripting, buffer overflow and phishing. Defences include input validation and least privilege."],"ex":"Toy RSA: p = 3, q = 11, n = 33, phi = 2 x 10 = 20. Choose e = 3; d = 7 since 3 x 7 = 21 = 1 mod 20. Encrypt m = 4: 4^3 = 64 = 31 mod 33. Decrypt: 31^7 mod 33 = 4. Message recovered.","q":"cryptography and network security full course hindi","kw":["RSA","AES","hash function","TLS"]},{"id":"big-data-systems","t":"Advanced Databases and Big Data","s":"Systems for storing and processing data too large for one machine: distributed storage, NoSQL and stream processing.","n":["NoSQL databases include key-value, document, column-family and graph stores. They trade some features for scale.","HDFS splits files into large blocks and keeps replicas (3 by default) on different machines.","Spark keeps data in memory across steps, making repeated computations much faster than disk-based MapReduce.","Stream processing (like Kafka with Flink or Spark Streaming) handles data continuously as it arrives.","Data warehouses support analytics; data lakes store raw data in many formats."],"ex":"Word count with MapReduce on 'to be or not to be'. Map emits (to,1), (be,1), (or,1), (not,1), (to,1), (be,1). Shuffle groups by word. Reduce sums: to = 2, be = 2, or = 1, not = 1.","q":"big data hadoop spark nosql lecture hindi","kw":["NoSQL","HDFS","Spark","MapReduce"]}],"phd":[{"id":"cs-research-methods","t":"Research Methods in Computer Science","s":"How to choose a research problem, design experiments or proofs, and produce results others can trust and reuse.","n":["CS research can be theoretical (proofs), systems (building and measuring), empirical (experiments and data), or human-centred (user studies).","Find gaps by reading recent papers from top venues and their 'future work' sections. Talk to your guide often.","State a clear hypothesis and baseline. Measure with proper metrics, repeat runs, and report variance, not just the best number.","Reproducibility: share code, data and exact settings. Use version control (Git) and record random seeds.","Research ethics: get approval for human studies, protect privacy, and never fabricate or cherry-pick results."],"ex":"Hypothesis: 'our caching method lowers page load time'. Plan: pick 3 baselines, run each 10 times on the same hardware, report mean and standard deviation, test significance, and publish the scripts so others can repeat it.","q":"how to do research in computer science phd","kw":["research methodology","reproducibility","baseline","hypothesis"]},{"id":"cs-publishing","t":"Reading, Writing and Publishing CS Papers","s":"Computer science publishes mainly at peer-reviewed conferences and journals. Learning to read and write papers is core PhD work.","n":["Read in three passes: first title, abstract and figures; then the main ideas; then the full details if needed.","Many CS fields value conferences (like NeurIPS, ICML, SIGCOMM, STOC). Some fields prefer journals. Ask your guide which fit your area.","Use LaTeX and a reference manager. Structure: abstract, introduction, related work, method, evaluation, conclusion.","Preprints on arXiv share work early. Avoid predatory venues; check indexing and reputation.","Respond to reviews politely and point by point. Rejection is normal; improve and resubmit."],"ex":"Introduction template: problem (why it matters), gap (what existing methods miss), idea (your key insight in one sentence), results (main numbers), contributions (3 bullet points). Write this first; the rest of the paper follows it.","q":"how to read and write research paper computer science","kw":["peer review","conference","arXiv","LaTeX"]},{"id":"ai-frontiers","t":"Frontiers: Foundation Models and AI Safety","s":"Large AI models raise open research questions about how they work, how to evaluate them, and how to make them safe.","n":["Foundation models are large neural networks trained on broad data and adapted to many tasks.","Scaling studies examine how performance changes with model size, data and compute.","Interpretability research tries to understand what is happening inside networks, not just inputs and outputs.","Alignment and safety research aim for systems that are helpful, honest and avoid harm, and that resist misuse.","Evaluation is hard: benchmarks can leak into training data, so researchers design fresh and robust tests."],"ex":"Research question example: 'Does a model's answer change when the same maths question is reworded?' Build 500 pairs of reworded questions, measure accuracy on both, and report the drop. A large drop suggests memorisation instead of reasoning.","q":"large language models research ai safety interpretability lecture","kw":["foundation models","interpretability","AI alignment","evaluation"]},{"id":"quantum-computing","t":"Frontiers: Quantum Computing","s":"Quantum computers use qubits, which follow quantum physics, to solve certain problems faster than classical computers.","n":["A qubit can be in a superposition a|0> + b|1> with |a|^2 + |b|^2 = 1. Measuring gives 0 with probability |a|^2.","Quantum gates (like Hadamard and CNOT) transform qubits. Entanglement links qubits so they cannot be described separately.","Shor's algorithm factors integers in polynomial time on a large quantum computer, threatening RSA.","Grover's algorithm searches an unsorted list of N items in about sqrt(N) steps.","Current machines are noisy. Quantum error correction and post-quantum cryptography are active research areas."],"ex":"Hadamard on |0> gives (|0> + |1>)/sqrt2. Here a = b = 1/sqrt2, so P(0) = 1/2 and P(1) = 1/2. Grover on N = 1,000,000 items needs about sqrt(N) = 1000 steps instead of up to a million checks.","q":"quantum computing introduction lecture qubits","kw":["qubit","superposition","Shor algorithm","post-quantum"]},{"id":"formal-methods","t":"Frontiers: Formal Verification","s":"Formal methods use mathematics to prove that software and hardware behave correctly, which matters for safety-critical systems.","n":["Model checking explores every state of a system to check properties written in temporal logic.","Proof assistants like Coq (Rocq), Isabelle and Lean allow fully checked proofs about programs.","Verified systems include the CompCert C compiler and the seL4 microkernel.","SMT solvers like Z3 automatically check logical formulas and are used in testing and verification tools.","Research challenges: scaling to large code, verifying ML systems, and making tools easier to use."],"ex":"Property for a traffic light controller: 'the north and east lights are never green together'. A model checker tries all reachable states. If any state breaks the rule, it returns a counterexample trace showing exactly how it happens.","q":"formal verification model checking introduction lecture","kw":["model checking","proof assistant","SMT solver"]}]},"order":5},{"id":"it","name":"Information Technology","nameHi":"सूचना प्रौद्योगिकी","group":"tech","blurb":"Information Technology is about using computers, the internet and software safely and well to solve real problems at home and work.","levels":{"6-8":[{"id":"using-computer","t":"Using a Computer and Mobile Safely","s":"Learn to switch on, use the mouse and keyboard, open apps and shut down a computer or phone properly.","n":["Start the computer with the power button. Shut down from the Start menu; do not just pull the plug.","Mouse: single click selects, double click opens, right click shows more options. On a phone, tap and long-press do the same.","Keyboard tips: Shift for capital letters, Backspace to delete left, Enter for a new line, Ctrl + Z to undo.","The desktop shows icons. The taskbar shows open apps. You can switch apps with Alt + Tab.","Sit straight, keep the screen at eye level and rest your eyes every 20 minutes by looking far away."],"ex":"To write a leave letter: click Start, open Notepad, type the letter, press Ctrl + S to save, name it 'leave.txt' and click Save. Made a mistake? Press Ctrl + Z to undo.","q":"computer basics for beginners hindi mouse keyboard","kw":["mouse","keyboard","shortcut keys","desktop"]},{"id":"files-folders-it","t":"Managing Files and Folders","s":"Keep your digital work tidy by naming files well and putting them in folders, just like a school bag.","n":["Create a folder by right-clicking > New > Folder. Give clear names like 'Class7_Science'.","Copy (Ctrl + C) makes a duplicate; Cut (Ctrl + X) moves; Paste (Ctrl + V) puts it in the new place.","Deleted files usually go to the Recycle Bin first, so you can restore them if needed.","Search the File Explorer box to find a file by name quickly.","Back up important files to a pen drive or a cloud service like Google Drive or OneDrive."],"ex":"Amit's photos are scattered on the desktop. He makes a folder 'Photos', then subfolders '2025_Diwali' and '2025_School_Trip'. He selects trip photos, presses Ctrl + X, opens the trip folder and presses Ctrl + V. Desktop is clean.","q":"how to create folder copy paste files computer hindi","kw":["file","folder","copy paste","backup"]},{"id":"internet-browsing","t":"Internet and Web Browsing","s":"The internet connects computers worldwide. A browser lets you visit websites and search for information.","n":["The internet is a network of networks. The World Wide Web is the set of web pages you see in a browser.","Browsers include Chrome, Firefox and Edge. Type a web address (URL), like ncert.nic.in, in the address bar.","Search engines find pages. Use clear keywords, like 'class 7 science chapter 2 notes'.","Check the lock symbol and 'https' before entering any details. It means the connection is encrypted.","Not everything online is true. Check facts on official sites, such as those ending in .gov.in or .nic.in."],"ex":"Rohan needs NCERT books. He opens a browser and searches 'NCERT textbooks pdf official'. He picks the result from ncert.nic.in, checks the lock symbol, then downloads the free chapter. He avoids unknown sites asking for login details.","q":"internet basics browser search engine for students hindi","kw":["internet","browser","search engine","URL"]},{"id":"email-basics","t":"Email Basics","s":"Email lets you send letters, files and photos over the internet in seconds, for free.","n":["An email address looks like name@gmail.com. The part after @ is the email provider.","To: is the main receiver. CC sends a copy that others can see. BCC sends a hidden copy.","Write a clear subject line, a greeting, short message and your name at the end.","Attachments add files. Check the size; many services limit attachments to about 20-25 MB.","Never open attachments or links from unknown senders. They may contain viruses."],"ex":"Email to a teacher: To: teacher's address. Subject: 'Science project submission - Priya, Class 8B'. Body: 'Respected Ma'am, please find my project attached. Thank you, Priya.' Attach project.pdf, check spelling, then click Send.","q":"how to send email gmail for beginners hindi","kw":["email","attachment","CC BCC","subject line"]},{"id":"word-processor","t":"Word Processing","s":"A word processor like MS Word, Google Docs or LibreOffice Writer helps you type, format and print documents.","n":["Type text, then select it to format: Bold (Ctrl + B), Italic (Ctrl + I), Underline (Ctrl + U).","Change font, size and colour from the toolbar. Use alignment: left, centre, right, justify.","Insert pictures, tables and page numbers from the Insert menu.","Spell check underlines mistakes in red. Right-click to see suggestions.","Use Print Preview to check the page before printing, or save as PDF to share."],"ex":"Making a class timetable: Insert > Table > 6 columns x 7 rows. Type days in the first row and periods in the first column. Select the top row, press Ctrl + B to bold it, then save as 'timetable.pdf'.","q":"ms word basics for beginners hindi","kw":["word processor","formatting","table","PDF"]},{"id":"presentations","t":"Making Presentations","s":"Presentation software like PowerPoint, Google Slides or LibreOffice Impress helps you share ideas using slides.","n":["Each slide should have one main idea, a short title and only a few bullet points.","Use large fonts (at least 24 point) and high contrast, like dark text on a light background.","Add pictures and simple charts. Always credit images you did not make.","Animations and transitions should be simple. Too many distract the audience.","Practise speaking with the slides. Slides support you; do not read them word by word."],"ex":"A 5-slide talk on water saving: 1. Title. 2. Why water matters. 3. How we waste water at home. 4. Three easy saving tips with pictures. 5. Thank you and one question for the class.","q":"powerpoint presentation for beginners hindi","kw":["slides","presentation","PowerPoint","Google Slides"]},{"id":"online-safety","t":"Online Safety and Good Digital Habits","s":"Stay safe online: protect passwords, spot fake messages, and treat others kindly on the internet.","n":["Make strong passwords: long, mixing letters, numbers and symbols. Do not use your name or birth date.","Never share an OTP, PIN or password with anyone, even if they say they are from a bank or the police.","Phishing messages create fear or greed, like 'You won a prize' or 'Account will be blocked'. Do not click their links.","Do not share your address, school or photos with strangers online. Keep social media accounts private.","If someone bullies or scares you online, tell a parent or teacher. Fraud can be reported at helpline 1930 or cybercrime.gov.in."],"ex":"Sunita gets a message: 'Congrats! You won Rs 10,000. Share the OTP to claim.' Red flags: prize she never entered for, and a request for OTP. She does not reply, blocks the number, and tells her parents.","q":"cyber safety for students hindi online safety tips","kw":["password","OTP","phishing","cyberbullying"]}],"9-10":[{"id":"digital-documentation","t":"Digital Documentation (Advanced)","s":"Use styles, templates, tables of contents and mail merge to make professional documents quickly.","n":["Styles (Heading 1, Heading 2, Body) keep formatting the same everywhere. Change a style once and all matching text updates.","A table of contents can be made automatically from headings and updated with one click.","Templates are ready-made layouts for letters, resumes and reports.","Mail merge joins a letter with a list of names and addresses to make many personalised letters.","Track changes shows edits made by others, so you can accept or reject them."],"ex":"School needs 200 invitations. Make one letter with fields \u003c\u003cName>> and \u003c\u003cClass>>, and a spreadsheet of 200 students. Run mail merge. The software creates 200 letters, each with the right name and class.","q":"mail merge and styles libreoffice writer class 10 it 402 hindi","kw":["styles","mail merge","template","table of contents"]},{"id":"spreadsheets","t":"Electronic Spreadsheets","s":"Spreadsheets like Excel, Google Sheets or LibreOffice Calc organise numbers in rows and columns and calculate automatically.","n":["Cells are named by column letter and row number, like B3. A range is written as A1:A10.","Formulas start with =. Example: =B2+C2. Functions: SUM, AVERAGE, MAX, MIN, COUNT, IF.","Relative references (A1) change when copied. Absolute references ($A$1) stay fixed.","Sort and filter help find data. Charts turn numbers into pictures.","Conditional formatting colours cells automatically, for example marks below 33 in red."],"ex":"Marks in B2:B6 are 78, 92, 45, 60, 30. =SUM(B2:B6) gives 305. =AVERAGE(B2:B6) gives 61. In C2, =IF(B2>=33,\"Pass\",\"Fail\"), copied down, shows Fail only for 30.","q":"excel formulas for beginners hindi sum average if","kw":["spreadsheet","formula","cell reference","IF function"]},{"id":"database-basics","t":"Database Basics","s":"A database stores data in organised tables so you can search, sort and report on it quickly.","n":["A table has records (rows) and fields (columns). Each field has a data type, like text, number or date.","A primary key uniquely identifies each record, such as admission number.","Queries ask questions of the data, like 'show students of Class 10 with marks above 80'.","Forms make data entry easy; reports present data neatly for printing.","Tools: LibreOffice Base, MS Access and online tools. Larger systems use MySQL or PostgreSQL."],"ex":"Library table: BookID (primary key), Title, Author, Issued (Yes/No). Query: show books where Issued = Yes. If 3 of 50 books are issued, the query returns those 3 records with titles and authors.","q":"database management system class 10 it 402 libreoffice base hindi","kw":["database","table","primary key","query"]},{"id":"html-basics","t":"Web Pages with HTML","s":"HTML is the language of web pages. Tags tell the browser what is a heading, paragraph, link or picture.","n":["Tags come in pairs like \u003cp> ... \u003c/p>. The page structure is \u003chtml>, \u003chead> and \u003cbody>.","Headings go from \u003ch1> (biggest) to \u003ch6>. Paragraphs use \u003cp>. Line break is \u003cbr>.","Links: \u003ca href=\"page.html\">Click\u003c/a>. Images: \u003cimg src=\"photo.jpg\" alt=\"description\">.","Lists: \u003cul> for bullets and \u003col> for numbers, each item in \u003cli>.","Save the file as .html and open it in a browser. You only need a free text editor."],"ex":"\u003chtml>\u003cbody>\u003ch1>My Village\u003c/h1>\u003cp>Rampur is near the Ganga.\u003c/p>\u003cul>\u003cli>School\u003c/li>\u003cli>Post office\u003c/li>\u003c/ul>\u003c/body>\u003c/html>. Saved as village.html and opened in a browser, it shows a big heading, a paragraph and a two-item bullet list.","q":"html tutorial for beginners hindi","kw":["HTML","tags","hyperlink","web page"]},{"id":"cyber-safety-advanced","t":"Cyber Safety and Security","s":"Protect your devices and data from viruses, hackers and fraud with simple, regular habits.","n":["Malware includes viruses, worms, trojans and ransomware. Install apps only from official stores.","Keep your phone and computer updated. Updates fix security holes.","Turn on two-factor authentication (2FA) for email and social media. Even if the password leaks, the account stays safer.","Public Wi-Fi can be unsafe. Avoid banking on it.","India's IT Act, 2000 covers cyber crimes. Report cyber fraud quickly at 1930 or cybercrime.gov.in; quick reporting improves chances of stopping money."],"ex":"Ravi's friend sends 'Is this you in this video?' with a link. It asks for his Instagram password. This is a phishing trick. Ravi does not enter it, warns his friend whose account may be hacked, and turns on 2FA.","q":"cyber security awareness for students hindi","kw":["malware","two-factor authentication","IT Act","phishing"]},{"id":"digital-payments","t":"Digital Payments and UPI Safety","s":"UPI and other digital payments make sending money easy. Learn how they work and how to avoid common frauds.","n":["UPI (Unified Payments Interface) links your bank account to apps like BHIM, PhonePe or Google Pay.","A UPI ID looks like name@bank. You can pay by UPI ID, mobile number or by scanning a QR code.","You need your UPI PIN only to send money, never to receive it. Anyone asking for a PIN to 'receive' money is a fraud.","Scanning a QR code is also for paying, not receiving. Check the name shown before entering the PIN.","Keep your phone locked, do not install screen-sharing apps on a caller's request, and check SMS alerts for every transaction."],"ex":"A buyer for your old cycle says, 'I am sending Rs 3,000, scan this QR and enter PIN to receive.' This is fraud: entering a PIN always sends money. Ask the buyer to pay to your UPI ID instead.","q":"upi fraud awareness safe digital payment hindi","kw":["UPI","QR code","UPI PIN","digital payment"]},{"id":"cloud-tools","t":"Cloud Tools and Online Collaboration","s":"Cloud tools let you store files online and work together on the same document from different places.","n":["Cloud storage like Google Drive or OneDrive saves files on internet servers, so you can open them from any device.","Online documents (Google Docs, Sheets, Slides) let many people edit at once and save automatically.","Sharing settings control access: 'Viewer' can only see, 'Commenter' can comment, 'Editor' can change.","Version history lets you see and restore older versions if someone makes a mistake.","Video meeting tools like Google Meet or Jitsi help with online classes and group projects."],"ex":"Four friends make a group project in one Google Slides file. Each edits their own slides from home. The leader shares it with the teacher as 'Commenter' so she can give feedback without changing the work.","q":"google drive google docs tutorial for students hindi","kw":["cloud storage","Google Drive","collaboration","version history"]}],"11-12":[{"id":"web-design-css","t":"Web Design with HTML and CSS","s":"HTML builds the structure of a web page; CSS makes it look good with colours, layout and fonts.","n":["CSS rules have a selector and declarations: h1 { color: navy; font-size: 32px; }.","Selectors: element (p), class (.note), id (#header). Classes can repeat; an id should be unique on a page.","Box model: every element has content, padding, border and margin.","Flexbox and Grid arrange items in rows and columns. Media queries make pages work on phones (responsive design).","HTML forms collect input using \u003cform>, \u003cinput>, \u003cselect> and \u003cbutton>."],"ex":"A box has width 200px, padding 10px, border 2px. In the default box model, total width = 200 + 2 x 10 + 2 x 2 = 224px. With box-sizing: border-box, the total stays 200px.","q":"html css tutorial for beginners hindi responsive","kw":["CSS","box model","flexbox","responsive design"]},{"id":"javascript-basics","t":"JavaScript Basics","s":"JavaScript makes web pages interactive: it reacts to clicks, checks forms and changes content without reloading.","n":["Declare variables with let and const: let count = 0; const name = 'Asha';","Functions: function add(a, b) { return a + b; }. Use if/else and for loops like other languages.","The DOM lets JavaScript find and change page elements: document.getElementById('msg').textContent = 'Hi';","Events: button.addEventListener('click', handler) runs code when the user clicks.","Validate forms in the browser for convenience, but always validate again on the server for security."],"ex":"Counter: let c = 0; btn.addEventListener('click', () => { c = c + 1; out.textContent = c; }); After three clicks, the page shows 3. Note: '5' + 1 gives '51' in JavaScript, but 5 + 1 gives 6.","q":"javascript tutorial for beginners hindi dom events","kw":["JavaScript","DOM","events","variables"]},{"id":"rdbms-mysql","t":"RDBMS and MySQL","s":"Relational databases store data in linked tables. MySQL is a free, popular database used by many websites.","n":["Create a table: CREATE TABLE emp (id INT PRIMARY KEY, name VARCHAR(40), salary INT);","Insert and query: INSERT INTO emp VALUES (1, 'Ravi', 30000); SELECT * FROM emp WHERE salary > 25000;","UPDATE changes rows and DELETE removes rows. Always use a WHERE clause or all rows change.","Constraints keep data clean: NOT NULL, UNIQUE, PRIMARY KEY, FOREIGN KEY, DEFAULT.","Aggregate with COUNT, SUM, AVG and group with GROUP BY."],"ex":"emp has salaries 30000, 45000, 25000. SELECT AVG(salary) FROM emp; returns 33333.33. SELECT COUNT(*) FROM emp WHERE salary > 28000; returns 2.","q":"mysql tutorial for beginners hindi class 12","kw":["MySQL","RDBMS","constraints","SQL queries"]},{"id":"networking-internet","t":"Networking and How the Internet Works","s":"Understand IP addresses, DNS, routers and Wi-Fi so you can set up and troubleshoot a small network.","n":["Every device on a network has an IP address. IPv4 looks like 192.168.1.5; IPv6 is longer and gives many more addresses.","DHCP gives IP addresses automatically. DNS converts names like india.gov.in to IP addresses.","A router connects your home network to the internet. A switch connects many wired devices in one network.","Speed is measured in Mbps (megabits per second). Divide by 8 to get megabytes per second.","Troubleshoot with ping (is it reachable?) and ipconfig/ifconfig (what is my IP?)."],"ex":"A 100 MB video on a 40 Mbps connection. 40 Mbps = 40 / 8 = 5 MB per second. Time = 100 / 5 = 20 seconds (ideal conditions).","q":"computer networking basics hindi ip address dns router","kw":["IP address","DNS","router","bandwidth"]},{"id":"cloud-computing-intro","t":"Introduction to Cloud Computing","s":"Cloud computing means renting computing power and storage over the internet instead of buying your own servers.","n":["Service models: IaaS gives virtual machines; PaaS gives a platform to run code; SaaS gives ready software like Gmail.","Deployment models: public cloud, private cloud, hybrid cloud.","Benefits: pay for what you use, scale up quickly, and access from anywhere.","Big providers include AWS, Microsoft Azure and Google Cloud. Many offer free tiers for learning.","Risks: data privacy, internet dependence and unexpected bills. Set budget alerts."],"ex":"A school results website gets heavy traffic only on result day. With cloud, it runs 1 small server normally and scales to 10 on result day, then back to 1. It pays for 10 servers only for those hours.","q":"cloud computing basics iaas paas saas hindi","kw":["cloud computing","IaaS PaaS SaaS","scalability"]},{"id":"cybersecurity-basics","t":"Cybersecurity Fundamentals","s":"Cybersecurity protects systems, networks and data from attacks. Learn the main threats and defences.","n":["CIA triad: Confidentiality (only the right people see data), Integrity (data is not changed wrongly), Availability (systems stay up).","Threats: malware, phishing, ransomware, denial of service (DoS) and weak passwords.","Defences: firewalls, antivirus, regular updates, strong passwords with a password manager, and 2FA.","Encrypt
